name: Persian Keyboard Android v1.38 Active-session Caret Rebase APK

on:
  push:
    branches:
      - persian-keyboard-v19-temp-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore persistent signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: persian-keyboard-public-test-signing-v1

      - name: Fail rather than rotate signing identity
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          echo 'Expected persistent signing cache was not restored.' >&2
          exit 1

      - name: Apply v1.8 through v1.38 behavior
        working-directory: android/persian-keyboard-v19
        run: |
          set -euo pipefail
          python3 tools/apply_v18_keyboard_patch.py
          python3 tools/apply_v19_layout_floating_patch.py
          python3 tools/apply_v110_true_floating_patch.py
          python3 tools/apply_v111_movable_full_keyboard_patch.py
          python3 tools/apply_v112_vertical_drag_compact_floating_patch.py
          python3 tools/apply_v113_narrow_floating_patch.py
          python3 tools/apply_v114_preserve_floating_on_manual_key_patch.py
          python3 tools/apply_v115_clear_field_button_patch.py
          python3 tools/apply_v116_copy_button_patch.py
          python3 tools/apply_v117_copy_icon_mic_emoji_patch.py
          python3 tools/apply_v118_caps_lock_patch.py
          python3 tools/apply_v119_persistent_speech_recovery_patch.py
          python3 tools/apply_v1191_recovery_retry_race_patch.py
          python3 tools/apply_v120_long_press_mic_send_patch.py
          python3 tools/apply_v121_raw_enter_send_hotfix_patch.py
          python3 tools/apply_v122_accessibility_send_button_patch.py
          python3 tools/apply_v123_accessibility_diag_geo_send_patch.py
          python3 tools/apply_v124_composer_scoped_send_patch.py
          python3 tools/apply_v125_recovery_cursor_stability_patch.py
          python3 tools/apply_v126_live_partial_tail_patch.py
          python3 tools/apply_v127_manual_stop_semantics_patch.py
          python3 tools/apply_v128_restart_tolerant_lifecycle_patch.py
          python3 tools/apply_v129_selection_callback_ownership_patch.py
          python3 tools/apply_v130_confirmed_external_selection_patch.py
          python3 tools/apply_v131_user_interaction_attribution_patch.py
          python3 tools/apply_v132_correlated_user_touch_patch.py
          python3 tools/apply_v133_live_sync_and_fast_keys_patch.py
          python3 tools/apply_v134_boundary_owned_voice_patch.py
          python3 tools/apply_v1350_selection_decoupling_prepatch.py
          python3 tools/apply_v135_stability_architecture_patch.py
          python3 tools/apply_v1351_socket_epoch_hardening.py
          python3 tools/apply_v1352_preserve_clear_toolbar.py
          python3 tools/apply_v136_follow_voice_viewport_patch.py
          python3 tools/apply_v137_ime_hide_zwnj_caret_rebase_patch.py
          python3 tools/apply_v138_active_session_touch_order_rebase_patch.py

      - name: Verify v1.38 invariants
        working-directory: android/persian-keyboard-v19
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text='\n'.join([
            Path('app/src/main/java/com/najme/perplexityprobe/PersianKeyboardService.java').read_text(),
            Path('app/src/main/java/com/najme/perplexityprobe/SendAccessibilityService.java').read_text(),
            Path('app/build.gradle').read_text()
          ])
          for x in [
            'private long voiceCaretRebaseSelectionUptime;',
            'private boolean confirmVoiceCaretRebaseCandidate(',
            'long correlation=Math.abs(candidateTime-touchEventTime);',
            'if(voiceCaretRebaseTouchGeneration<=0L)return true;',
            'if(voiceCaretRebasePending&&voiceCaretRebaseTouchGeneration<=0L)',
            'confirmVoiceCaretRebaseCandidate(ic,window,runId);',
            'private void stopVoiceForImeHidden(){',
            'Button zwnj=actionKey("−", v -> commitText("\\u200C"));',
            'versionCode 48',
            "versionName '1.38'",
          ]:
            assert x in text, x
          for x in [
            'scheduleInternalSelectionReanchor();',
            'scheduleExternalSelectionConfirmation(newSelStart,newSelEnd);',
            'Voice stopped — live text sync lost',
          ]:
            assert x not in text, x
          print('v1.38 invariants OK')
          PY

      - name: Build Android v1.38 APK
        run: gradle -p android/persian-keyboard-v19 --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android/persian-keyboard-v19/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.najme.perplexityprobe'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "versionCode='48' versionName='1.38'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -i 'Signer #1 certificate SHA-256 digest: c557bdc60de4100720d6f122789b51c2889661ef0b76886d5b08c1f44cf023cf'
          sha256sum "$APK"
          cp "$APK" Persian-keyboard-Android-v1.38.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Persian-keyboard-Android-v1.38
          path: Persian-keyboard-Android-v1.38.apk
          retention-days: 30
