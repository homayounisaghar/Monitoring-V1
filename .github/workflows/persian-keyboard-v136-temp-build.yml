name: Persian Keyboard Android v1.41 Diagnostic Event Trace APK

on:
  push:
    branches:
      - persian-keyboard-v19-temp-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore persistent signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: persian-keyboard-public-test-signing-v1

      - name: Fail rather than rotate signing identity
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          echo 'Expected persistent signing cache was not restored.' >&2
          exit 1

      - name: Apply v1.8 through v1.41 behavior
        working-directory: android/persian-keyboard-v19
        run: |
          set -euo pipefail
          python3 tools/apply_v18_keyboard_patch.py
          python3 tools/apply_v19_layout_floating_patch.py
          python3 tools/apply_v110_true_floating_patch.py
          python3 tools/apply_v111_movable_full_keyboard_patch.py
          python3 tools/apply_v112_vertical_drag_compact_floating_patch.py
          python3 tools/apply_v113_narrow_floating_patch.py
          python3 tools/apply_v114_preserve_floating_on_manual_key_patch.py
          python3 tools/apply_v115_clear_field_button_patch.py
          python3 tools/apply_v116_copy_button_patch.py
          python3 tools/apply_v117_copy_icon_mic_emoji_patch.py
          python3 tools/apply_v118_caps_lock_patch.py
          python3 tools/apply_v119_persistent_speech_recovery_patch.py
          python3 tools/apply_v1191_recovery_retry_race_patch.py
          python3 tools/apply_v120_long_press_mic_send_patch.py
          python3 tools/apply_v121_raw_enter_send_hotfix_patch.py
          python3 tools/apply_v122_accessibility_send_button_patch.py
          python3 tools/apply_v123_accessibility_diag_geo_send_patch.py
          python3 tools/apply_v124_composer_scoped_send_patch.py
          python3 tools/apply_v125_recovery_cursor_stability_patch.py
          python3 tools/apply_v126_live_partial_tail_patch.py
          python3 tools/apply_v127_manual_stop_semantics_patch.py
          python3 tools/apply_v128_restart_tolerant_lifecycle_patch.py
          python3 tools/apply_v129_selection_callback_ownership_patch.py
          python3 tools/apply_v130_confirmed_external_selection_patch.py
          python3 tools/apply_v131_user_interaction_attribution_patch.py
          python3 tools/apply_v132_correlated_user_touch_patch.py
          python3 tools/apply_v133_live_sync_and_fast_keys_patch.py
          python3 tools/apply_v134_boundary_owned_voice_patch.py
          python3 tools/apply_v1350_selection_decoupling_prepatch.py
          python3 tools/apply_v135_stability_architecture_patch.py
          python3 tools/apply_v1351_socket_epoch_hardening.py
          python3 tools/apply_v1352_preserve_clear_toolbar.py
          python3 tools/apply_v136_follow_voice_viewport_patch.py
          python3 tools/apply_v137_ime_hide_zwnj_caret_rebase_patch.py
          python3 tools/apply_v138_active_session_touch_order_rebase_patch.py
          python3 tools/apply_v139_direct_selection_and_host_send_stop_patch.py
          python3 tools/apply_v140_true_caret_cutover_and_composer_clear_stop_patch.py
          python3 tools/apply_v141_diagnostic_event_trace_patch.py
          python3 tools/apply_v1411_accessibility_event_subscription_fix.py

      - name: Verify v1.41 invariants
        working-directory: android/persian-keyboard-v19
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          service=Path('app/src/main/java/com/najme/perplexityprobe/PersianKeyboardService.java').read_text()
          helper=Path('app/src/main/java/com/najme/perplexityprobe/SendAccessibilityService.java').read_text()
          xml=Path('app/src/main/res/xml/send_accessibility_service.xml').read_text()
          gradle=Path('app/build.gradle').read_text()
          text='\n'.join([service,helper,xml,gradle])
          for x in [
            'DIAG_MAX_CHARS=60000',
            'private void diag(String event)',
            'private void diagCurrentEditor(String tag)',
            'private void copyDiagnosticsToClipboard()',
            'copy.setOnLongClickListener',
            'public static void notifyAccessibilityProbe(',
            'SEL callback old=',
            'SEL settle current=',
            'EXTRACT token=',
            'CLEAR_CHECK enter',
            'CUTOVER enter target=',
            'HOST_SEND callback',
            'HOST_CONTENT callback',
            'A11Y type=',
            'typeViewTextChanged',
            'typeViewTextSelectionChanged',
            'private int voiceExtractMonitorToken;',
            'InputConnection.GET_EXTRACTED_TEXT_MONITOR',
            'private void beginVoiceCaretCutover(',
            'private boolean stopVoiceIfExternalComposerCleared(',
            'AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED',
            'private void stopVoiceForImeHidden(){',
            'Button zwnj=actionKey("−", v -> commitText("\\u200C"));',
            'versionCode 51',
            "versionName '1.41'",
          ]:
            assert x in text, x
          for x in [
            'rebaseVoiceProjectionIfPending(',
            'scheduleInternalSelectionReanchor();',
            'scheduleExternalSelectionConfirmation(newSelStart,newSelEnd);',
            'Voice stopped — live text sync lost',
          ]:
            assert x not in text, x
          sel_start=service.index('    @Override public void onUpdateSelection(')
          sel_end=service.index('    private long selectionKey(',sel_start)
          selection_block=service[sel_start:sel_end]
          assert 'setSelection(' not in selection_block
          cut_start=service.index('    private void beginVoiceCaretCutover(')
          cut_end=service.index('    private void restartSpeechTransportForCaretCutover(',cut_start)
          cutover_block=service[cut_start:cut_end]
          for forbidden in ['setSelection(','commitText(','deleteSurroundingText(']:
            assert forbidden not in cutover_block, forbidden
          assert 'event.getText()' not in helper
          print('v1.41 invariants OK')
          PY

      - name: Build Android v1.41 APK
        run: gradle -p android/persian-keyboard-v19 --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android/persian-keyboard-v19/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.najme.perplexityprobe'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "versionCode='51' versionName='1.41'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -i 'Signer #1 certificate SHA-256 digest: c557bdc60de4100720d6f122789b51c2889661ef0b76886d5b08c1f44cf023cf'
          sha256sum "$APK"
          cp "$APK" Persian-keyboard-Android-v1.41.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Persian-keyboard-Android-v1.41
          path: Persian-keyboard-Android-v1.41.apk
          retention-days: 30
