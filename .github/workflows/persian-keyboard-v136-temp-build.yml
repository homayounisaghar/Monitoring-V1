name: Persian Keyboard Android v1.44 Unsigned Signing Kit

on:
  push:
    branches:
      - persian-keyboard-v19-temp-build
  workflow_dispatch:
    inputs:
      extract_signer:
        description: 'CD-KEYBOARD-SIGNER extraction: export the encrypted signing keystore instead of building (needs repository secret CF_SIGNER_EXPORT_PASSPHRASE)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.extract_signer != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail

      - name: Install Android API 35
        shell: bash
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Apply v1.8 through v1.44 behavior
        working-directory: android/persian-keyboard-v19
        run: |
          set -euo pipefail
          python3 tools/apply_v18_keyboard_patch.py
          python3 tools/apply_v19_layout_floating_patch.py
          python3 tools/apply_v110_true_floating_patch.py
          python3 tools/apply_v111_movable_full_keyboard_patch.py
          python3 tools/apply_v112_vertical_drag_compact_floating_patch.py
          python3 tools/apply_v113_narrow_floating_patch.py
          python3 tools/apply_v114_preserve_floating_on_manual_key_patch.py
          python3 tools/apply_v115_clear_field_button_patch.py
          python3 tools/apply_v116_copy_button_patch.py
          python3 tools/apply_v117_copy_icon_mic_emoji_patch.py
          python3 tools/apply_v118_caps_lock_patch.py
          python3 tools/apply_v119_persistent_speech_recovery_patch.py
          python3 tools/apply_v1191_recovery_retry_race_patch.py
          python3 tools/apply_v120_long_press_mic_send_patch.py
          python3 tools/apply_v121_raw_enter_send_hotfix_patch.py
          python3 tools/apply_v122_accessibility_send_button_patch.py
          python3 tools/apply_v123_accessibility_diag_geo_send_patch.py
          python3 tools/apply_v124_composer_scoped_send_patch.py
          python3 tools/apply_v125_recovery_cursor_stability_patch.py
          python3 tools/apply_v126_live_partial_tail_patch.py
          python3 tools/apply_v127_manual_stop_semantics_patch.py
          python3 tools/apply_v128_restart_tolerant_lifecycle_patch.py
          python3 tools/apply_v129_selection_callback_ownership_patch.py
          python3 tools/apply_v130_confirmed_external_selection_patch.py
          python3 tools/apply_v131_user_interaction_attribution_patch.py
          python3 tools/apply_v132_correlated_user_touch_patch.py
          python3 tools/apply_v133_live_sync_and_fast_keys_patch.py
          python3 tools/apply_v134_boundary_owned_voice_patch.py
          python3 tools/apply_v1350_selection_decoupling_prepatch.py
          python3 tools/apply_v135_stability_architecture_patch.py
          python3 tools/apply_v1351_socket_epoch_hardening.py
          python3 tools/apply_v1352_preserve_clear_toolbar.py
          python3 tools/apply_v136_follow_voice_viewport_patch.py
          python3 tools/apply_v137_ime_hide_zwnj_caret_rebase_patch.py
          python3 tools/apply_v138_active_session_touch_order_rebase_patch.py
          python3 tools/apply_v139_direct_selection_and_host_send_stop_patch.py
          python3 tools/apply_v140_true_caret_cutover_and_composer_clear_stop_patch.py
          python3 tools/apply_v141_diagnostic_event_trace_patch.py
          python3 tools/apply_v1411_accessibility_event_subscription_fix.py
          python3 tools/apply_v1412_accessibility_probe_package_fix.py
          python3 tools/apply_v1420_auth_view_compatibility_prepatch.py
          python3 tools/apply_v142_resilient_broker_mic_preemption_base_layer_patch.py
          python3 tools/apply_v1421_restore_broker_helpers_patch.py
          python3 tools/apply_v143_numpad_shortcuts_patch.py
          python3 tools/apply_v144_cursor_newline_touch_hardening_patch.py

      - name: Verify v1.44 invariants
        working-directory: android/persian-keyboard-v19
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          service=Path('app/src/main/java/com/najme/perplexityprobe/PersianKeyboardService.java').read_text()
          setup=Path('app/src/main/java/com/najme/perplexityprobe/KeyboardSetupActivity.java').read_text()
          helper=Path('app/src/main/java/com/najme/perplexityprobe/SendAccessibilityService.java').read_text()
          xml=Path('app/src/main/res/xml/send_accessibility_service.xml').read_text()
          gradle=Path('app/build.gradle').read_text()
          text='\n'.join([service,setup,helper,xml,gradle])
          for x in [
            'DIAG_MAX_CHARS=60000',
            'private void ensureCredentialWebView(){',
            'private void prefetchWarmCredential(){',
            'private boolean warmCredentialUsable(){',
            'private void recreateCredentialWebView(String reason){',
            'private void armCredentialWatchdog(){',
            'private long bridgeLong(String value){',
            'parseCredentialExpiry(expiresAt)',
            'public static void notifyPerplexitySessionChanged(){',
            'onRenderProcessGone(WebView view,android.webkit.RenderProcessGoneDetail detail)',
            'private void handleMicrophoneSilenced(boolean silenced){',
            'private void checkMicrophoneRecovery(long runId,int epoch){',
            'registerAudioRecordingCallback(getMainExecutor(),audioRecordingCallback)',
            'getActiveRecordingConfiguration()',
            'config.isClientSilenced()',
            'if(microphoneSilenced)return true;',
            'layer=Layer.ALPHA;shift=false;',
            'String warm=consumeWarmCredential();',
            'private long voiceProgrammaticCaretLeaseUntilUptime;',
            'private boolean healTransientVoiceEndMinusOne(',
            'current.selectionStart!=expected-1',
            'if(healTransientVoiceEndMinusOne(ic,current,runId))return;',
            'private String withVoiceProjectionPrefix(String segment){',
            'voiceProjectionPrefix=" ";',
            'boolean multiline=(inputType&InputType.TYPE_TEXT_FLAG_MULTI_LINE)!=0;',
            'if(ic.commitText("\\n",1))return;',
            'ViewGroup.LayoutParams.MATCH_PARENT, weight',
            'b.setBackground(keyStateBackground(action));',
            'private int voiceExtractMonitorToken;',
            'InputConnection.GET_EXTRACTED_TEXT_MONITOR',
            'private void beginVoiceCaretCutover(',
            'private boolean stopVoiceIfExternalComposerCleared(',
            'AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED',
            'private void stopVoiceForImeHidden(){',
            'Button zwnj=actionKey("−", v -> commitText("\\u200C"));',
            'private static final String SHORTCUT_PREFS="numpad_shortcuts";',
            'private static final String[] SHORTCUT_DEFAULT_LABELS={"UN","PW","PN","S4"};',
            'private Button shortcutKey(int slot){',
            'new String[]{"+","−","×","*","÷","%","="}',
            'versionCode 54',
            "versionName '1.44'",
          ]:
            assert x in text, x
          for x in [
            'root.addView(auth,new LinearLayout.LayoutParams(1,1));',
            'root.addView(auth, new LinearLayout.LayoutParams(1, 1));',
            'if(!pageReady){setStatus("Perplexity session not ready',
            'rebaseVoiceProjectionIfPending(',
            'scheduleInternalSelectionReanchor();',
            'scheduleExternalSelectionConfirmation(newSelStart,newSelEnd);',
            'Voice stopped — live text sync lost',
            'SHORTCUT_DEFAULT_VALUES',
            'new LinearLayout.LayoutParams(0, keyHeightPx(), weight);',
            'lp.setMargins(dp(2),dp(1),dp(2),dp(1));',
          ]:
            assert x not in text, x
          sel_start=service.index('    @Override public void onUpdateSelection(')
          sel_end=service.index('    private long selectionKey(',sel_start)
          assert 'setSelection(' not in service[sel_start:sel_end]
          cut_start=service.index('    private void beginVoiceCaretCutover(')
          cut_end=service.index('    private void restartSpeechTransportForCaretCutover(',cut_start)
          for forbidden in ['setSelection(','commitText(','deleteSurroundingText(']:
            assert forbidden not in service[cut_start:cut_end], forbidden
          restart_start=service.index('    private void restartSpeechTransportForCaretCutover(')
          restart_end=service.index('    private void noteVoicePublicationPaused(',restart_start)
          assert 'consumeWarmCredential()' in service[restart_start:restart_end]
          assert 'ensureCredentialWebView()' in service[restart_start:restart_end]
          assert 'event.getText()' not in helper
          print('v1.44 invariants OK')
          PY

      - name: Build Android v1.44 unsigned release APK
        run: gradle -p android/persian-keyboard-v19 --no-daemon assembleRelease --stacktrace

      - name: Prepare and verify v1.44 signing kit
        shell: bash
        run: |
          set -euo pipefail
          RAW='android/persian-keyboard-v19/app/build/outputs/apk/release/app-release-unsigned.apk'
          ALIGNED='Persian-keyboard-Android-v1.44-unsigned-aligned.apk'
          test -f "$RAW"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$RAW" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$ALIGNED" | grep "package: name='com.najme.perplexityprobe'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$ALIGNED" | grep "versionCode='54' versionName='1.44'"
          java -jar "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" --version
          mkdir -p signing-kit
          cp "$ALIGNED" signing-kit/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-kit/
          sha256sum "$ALIGNED" > signing-kit/SHA256SUMS.txt
          printf '%s\n' 'package=com.najme.perplexityprobe' 'versionCode=54' 'versionName=1.44' 'signer=external-private-v2' > signing-kit/BUILD-METADATA.txt

      - name: Upload v1.44 signing kit
        uses: actions/upload-artifact@v4
        with:
          name: Persian-keyboard-Android-v1.44-signing-kit
          path: signing-kit/
          retention-days: 30
          if-no-files-found: error

  # CD-KEYBOARD-SIGNER extraction (one-time, operator-dispatched). Decision record:
  # homayounisaghar/capability-fabric governance/PHASE2_ENTRY_CONTRACT.md Part D, D1-exec.
  # Reads the cached signer without saving it back; never generates a key; uploads only
  # an encrypted copy (operator-held passphrase) as a 1-day artifact.
  extract-signer:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.extract_signer == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_SIGNER_EXPORT_PASSPHRASE: ${{ secrets.CF_SIGNER_EXPORT_PASSPHRASE }}
    steps:
      - name: Require export passphrase secret
        run: |
          if [ -z "$CF_SIGNER_EXPORT_PASSPHRASE" ]; then
            echo 'MISSING SECRET CF_SIGNER_EXPORT_PASSPHRASE' >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore persistent signing key (read-only)
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: persian-keyboard-public-test-signing-v1

      - name: Fail loudly if the signer cache is gone
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          echo 'CACHE MISS - SIGNER MAY ALREADY BE LOST' >&2
          exit 1

      - name: Verify certificate fingerprint against pinned value (public data)
        run: |
          set -euo pipefail
          test -f ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -i 'SHA256:' | tr -d ':' | tr 'A-F' 'a-f' | tee fingerprint.txt
          grep -q 'c557bdc60de4100720d6f122789b51c2889661ef0b76886d5b08c1f44cf023cf' fingerprint.txt

      - name: Encrypt keystore with the operator passphrase
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in ~/.android/debug.keystore -out persian-keyboard-signer.keystore.enc -pass env:CF_SIGNER_EXPORT_PASSPHRASE
          sha256sum persian-keyboard-signer.keystore.enc

      - name: Upload encrypted signer (1-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: persian-keyboard-signer-encrypted
          path: persian-keyboard-signer.keystore.enc
          retention-days: 1
          if-no-files-found: error
