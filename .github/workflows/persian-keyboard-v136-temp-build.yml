name: Persian Keyboard Android v1.36 Viewport Test APK

on:
  push:
    branches:
      - persian-keyboard-v19-temp-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore persistent signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: persian-keyboard-public-test-signing-v1

      - name: Fail rather than rotate signing identity
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          echo 'Expected persistent v1.9+ signing cache was not restored.' >&2
          exit 1

      - name: Apply v1.8 through v1.36 viewport behavior
        working-directory: android/persian-keyboard-v19
        run: |
          set -euo pipefail
          python3 tools/apply_v18_keyboard_patch.py
          python3 tools/apply_v19_layout_floating_patch.py
          python3 tools/apply_v110_true_floating_patch.py
          python3 tools/apply_v111_movable_full_keyboard_patch.py
          python3 tools/apply_v112_vertical_drag_compact_floating_patch.py
          python3 tools/apply_v113_narrow_floating_patch.py
          python3 tools/apply_v114_preserve_floating_on_manual_key_patch.py
          python3 tools/apply_v115_clear_field_button_patch.py
          python3 tools/apply_v116_copy_button_patch.py
          python3 tools/apply_v117_copy_icon_mic_emoji_patch.py
          python3 tools/apply_v118_caps_lock_patch.py
          python3 tools/apply_v119_persistent_speech_recovery_patch.py
          python3 tools/apply_v1191_recovery_retry_race_patch.py
          python3 tools/apply_v120_long_press_mic_send_patch.py
          python3 tools/apply_v121_raw_enter_send_hotfix_patch.py
          python3 tools/apply_v122_accessibility_send_button_patch.py
          python3 tools/apply_v123_accessibility_diag_geo_send_patch.py
          python3 tools/apply_v124_composer_scoped_send_patch.py
          python3 tools/apply_v125_recovery_cursor_stability_patch.py
          python3 tools/apply_v126_live_partial_tail_patch.py
          python3 tools/apply_v127_manual_stop_semantics_patch.py
          python3 tools/apply_v128_restart_tolerant_lifecycle_patch.py
          python3 tools/apply_v129_selection_callback_ownership_patch.py
          python3 tools/apply_v130_confirmed_external_selection_patch.py
          python3 tools/apply_v131_user_interaction_attribution_patch.py
          python3 tools/apply_v132_correlated_user_touch_patch.py
          python3 tools/apply_v133_live_sync_and_fast_keys_patch.py
          python3 tools/apply_v134_boundary_owned_voice_patch.py
          python3 tools/apply_v1350_selection_decoupling_prepatch.py
          python3 tools/apply_v135_stability_architecture_patch.py
          python3 tools/apply_v1351_socket_epoch_hardening.py
          python3 tools/apply_v1352_preserve_clear_toolbar.py
          python3 tools/apply_v136_follow_voice_viewport_patch.py

      - name: Verify v1.36 architecture and viewport invariants
        working-directory: android/persian-keyboard-v19
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('app/src/main/java/com/najme/perplexityprobe/PersianKeyboardService.java').read_text()
          helper = Path('app/src/main/java/com/najme/perplexityprobe/SendAccessibilityService.java').read_text()
          axml = Path('app/src/main/res/xml/send_accessibility_service.xml').read_text()
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          gradle = Path('app/build.gradle').read_text()
          text = src + '\n' + helper + '\n' + axml + '\n' + manifest + '\n' + gradle

          required = [
              'private volatile long activeVoiceRunId;',
              'private volatile long activeCredentialRequestId;',
              'private volatile int finishAckEpoch;',
              'private volatile int speechSocketEpoch;',
              'private String voicePublishedText = "";',
              'private int voiceOwnedStart = -1;',
              'private int voiceOwnedEnd = -1;',
              'private boolean voiceSelectionFollowsOwnedRange;',
              'private int voiceExpectedSelectionStart = -1;',
              'private int voiceExpectedSelectionEnd = -1;',
              'boolean followVoiceEnd=voiceSelectionFollowsOwnedRange',
              'oldSelStart==voiceExpectedSelectionStart&&oldSelEnd==voiceExpectedSelectionEnd',
              'if(voiceSelectionFollowsOwnedRange&&!followVoiceEnd)voiceSelectionFollowsOwnedRange=false;',
              'restoreStart=newOwnedEnd;restoreEnd=newOwnedEnd;',
              'voiceExpectedSelectionStart=newOwnedEnd;',
              'voiceExpectedSelectionEnd=newOwnedEnd;',
              'private int[] locatePublishedVoiceRegion(VoiceEditorWindow window){',
              'private void publish(boolean finish,long runId){',
              'Recording — live text sync paused',
              'Intentionally informational only',
              'deliberately disabled. Same-editor selection never forces',
              'private void clearCurrentTextField(){',
              'if(action==MotionEvent.ACTION_DOWN)',
              'android.R.attr.state_pressed',
              'SendAccessibilityService.requestSend(targetPackage)',
              'versionCode 46',
              "versionName '1.36'",
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'Missing v1.36 invariant: {needle}')

          forbidden = [
              'Voice stopped — live text sync lost',
              'Voice stopped — selection changed',
              'Voice stopped — selection confirmed off voice tail',
              'Voice stopped — selection after user interaction',
              'Voice stopped — selection after fresh touch+editor click',
              'scheduleInternalSelectionReanchor();',
              'scheduleExternalSelectionConfirmation(newSelStart,newSelEnd);',
              'recoverOwnedVoiceCursor()',
              'regionLooksVoiceOwned(',
              'MAX_CAPTURE_MS',
              'boundConnection.setComposingText(partial,1);',
              'final WebSocket[] holder=',
              'versionCode 45',
              "versionName '1.35'",
          ]
          for needle in forbidden:
              if needle in text:
                  raise SystemExit(f'Forbidden unstable behavior remains: {needle}')
          print('v1.36 architecture and viewport invariants OK')
          PY

      - name: Build Android v1.36 debug APK
        run: gradle -p android/persian-keyboard-v19 --no-daemon assembleDebug --stacktrace

      - name: Verify APK, signer continuity, and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='android/persian-keyboard-v19/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          grep -q 'Signer #1 certificate SHA-256 digest: c557bdc60de4100720d6f122789b51c2889661ef0b76886d5b08c1f44cf023cf' apk-signing.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 30 | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > apk-manifest.txt
          grep -q "package: name='com.najme.perplexityprobe' versionCode='46' versionName='1.36'" apk-badging.txt
          grep -q 'PersianKeyboardService' apk-manifest.txt
          grep -q 'SendAccessibilityService' apk-manifest.txt
          grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' apk-manifest.txt
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" Persian-keyboard-Android-v1.36.apk

      - name: Upload verified APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: Persian-keyboard-Android-v1.36-viewport-follow-signed
          path: |
            Persian-keyboard-Android-v1.36.apk
            apk-signing.txt
            apk-badging.txt
            apk-manifest.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
