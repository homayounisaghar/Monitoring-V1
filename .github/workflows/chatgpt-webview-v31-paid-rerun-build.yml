name: ChatGPT WebView v0.31 Paid Account Rerun Build

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/chatgpt-webview-v31-paid-rerun-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Inject fresh collector and rerun metadata
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          CFG="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV31.java"
          GRADLE="$ROOT/app/build.gradle"
          ACT="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorCapabilityPickerV31Activity.java"
          test -f "$ACT"
          ! grep -Fq 'fallbackMatch' "$ACT"
          token_json="$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}')"
          token_id="$(TOKEN_JSON="$token_json" python3 - <<'PY'
          import json,os
          x=json.loads(os.environ['TOKEN_JSON']).get('uuid')
          if not x: raise SystemExit('missing token')
          print(x)
          PY
          )"
          endpoint="https://webhook.site/$token_id"
          read_url="https://webhook.site/token/$token_id/requests?sorting=oldest"
          python3 - "$CFG" "$endpoint" "$GITHUB_SHA" "$token_id" "$GRADLE" <<'PY'
          from pathlib import Path
          import re,sys
          cfg,endpoint,sha,cid,gradle=sys.argv[1:]
          p=Path(cfg); s=p.read_text()
          s=re.sub(r'static final String WEBHOOK_URL = ".*?";',f'static final String WEBHOOK_URL = "{endpoint}";',s)
          s=re.sub(r'static final String SOURCE_REF = ".*?";',f'static final String SOURCE_REF = "{sha}";',s)
          s=re.sub(r'static final String COLLECTOR_ID = ".*?";',f'static final String COLLECTOR_ID = "{cid}";',s)
          s=s.replace('static final boolean CONFIGURED = false;','static final boolean CONFIGURED = true;')
          p.write_text(s)
          g=Path(gradle); t=g.read_text()
          t=re.sub(r'versionCode\s+\d+','versionCode 32',t)
          t=re.sub(r"versionName\s+'[^']+'","versionName '0.31-stable-capability-picker-r2'",t)
          g.write_text(t)
          PY
          mkdir -p ci/v31-paid-rerun-telemetry
          printf '%s\n' "$token_id" > ci/v31-paid-rerun-telemetry/collector-id.txt
          printf '%s\n' "$read_url" > ci/v31-paid-rerun-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v31-paid-rerun-telemetry/source-ref.txt
          printf '%s\n' 'single-real-device-run-only; paid-account rerun; same v0.31 semantics' > ci/v31-paid-rerun-telemetry/usage.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v31-capability-picker-v1","scenario_id":"model-tool-enumeration-guarded-model-roundtrip","source_ref":"%s"}\n' "$GITHUB_SHA" > ci/v31-paid-rerun-telemetry/build-smoke.json
          curl -fsS -X POST "$endpoint" -H 'Content-Type: application/json' --data-binary @ci/v31-paid-rerun-telemetry/build-smoke.json >/dev/null
          sleep 2
          curl -fsS "$read_url" | python3 -c 'import json,sys;o=json.load(sys.stdin);assert len(o.get("data",[]))>=1'
          grep -Fq 'versionCode 32' "$GRADLE"
          grep -Fq "versionName '0.31-stable-capability-picker-r2'" "$GRADLE"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build and verify
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..
          mkdir -p ci/out/signing-tools/lib ci/out/signing-tools/lib64
          cp runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk ci/out/chatgpt-webview-v31-paid-rerun-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" ci/out/signing-tools/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" ci/out/signing-tools/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" ci/out/signing-tools/zipalign
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" ci/out/signing-tools/aapt
          LIBCPP=$(find "$ANDROID_SDK_ROOT/build-tools/35.0.0" -type f -name 'libc++.so' | head -n 1)
          cp "$LIBCPP" ci/out/signing-tools/lib64/libc++.so
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging ci/out/chatgpt-webview-v31-paid-rerun-unsigned.apk > ci/out/badging.txt
          "$AAPT" dump permissions ci/out/chatgpt-webview-v31-paid-rerun-unsigned.apk > ci/out/permissions.txt
          grep -Fq "versionCode='32' versionName='0.31-stable-capability-picker-r2'" ci/out/badging.txt
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorCapabilityPickerV31Activity'" ci/out/badging.txt
          test "$(grep -c '^uses-permission:' ci/out/permissions.txt)" -eq 3
          unzip -p ci/out/chatgpt-webview-v31-paid-rerun-unsigned.apk classes.dex | strings > ci/out/classes-strings.txt
          grep -Fq 'PASS_MODEL_TOOL_ENUMERATION_AND_GUARDED_MODEL_ROUNDTRIP' ci/out/classes-strings.txt
          grep -Fq 'ENUMERATION_ONLY_NO_SAFE_ROUNDTRIP' ci/out/classes-strings.txt
          sha256sum ci/out/chatgpt-webview-v31-paid-rerun-unsigned.apk > ci/out/UNSIGNED_SHA256.txt
          printf '%s\n' "$GITHUB_SHA" > ci/out/SOURCE_REF.txt

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v31-paid-rerun-signing-kit
          path: ci/out
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v31-paid-rerun-telemetry-collector
          path: ci/v31-paid-rerun-telemetry
          if-no-files-found: error
          retention-days: 30
