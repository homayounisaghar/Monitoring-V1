name: ChatGPT WebView Stable v0.29 Voice Post-Start Census Release Kit

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/chatgpt-webview-stable-v29-build.yml'
      - 'runtime_probes/chatgpt-webview-stable-probe/app/src/main/AndroidManifest.xml'
      - 'runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorVoicePostStartCensusV29Activity.java'
      - 'runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV29.java'
      - 'runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorAutonomousV28Activity.java'
      - 'runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorFoundationV18Activity.java'
      - 'runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorFoundationV16Activity.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create fresh single-run collector and inject v0.29 config
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          CFG="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV29.java"
          mkdir -p ci/v29-telemetry
          token_json="$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}')"
          token_id="$(TOKEN_JSON="$token_json" python3 - <<'PY'
          import json, os
          obj=json.loads(os.environ['TOKEN_JSON'])
          token=obj.get('uuid')
          if not token: raise SystemExit('collector uuid missing')
          print(token)
          PY
          )"
          endpoint="https://webhook.site/$token_id"
          read_url="https://webhook.site/token/$token_id/requests?sorting=oldest"
          python3 - "$CFG" "$endpoint" "$GITHUB_SHA" "$token_id" <<'PY'
          from pathlib import Path
          import re,sys
          name,endpoint,sha,cid=sys.argv[1:]
          p=Path(name); s=p.read_text()
          s=re.sub(r'static final String WEBHOOK_URL = ".*?";',f'static final String WEBHOOK_URL = "{endpoint}";',s)
          s=re.sub(r'static final String SOURCE_REF = ".*?";',f'static final String SOURCE_REF = "{sha}";',s)
          s=re.sub(r'static final String COLLECTOR_ID = ".*?";',f'static final String COLLECTOR_ID = "{cid}";',s)
          s=s.replace('static final boolean CONFIGURED = false;','static final boolean CONFIGURED = true;')
          p.write_text(s)
          PY
          grep -Fq "static final String WEBHOOK_URL = \"$endpoint\";" "$CFG"
          grep -Fq "static final String SOURCE_REF = \"$GITHUB_SHA\";" "$CFG"
          grep -Fq 'static final boolean CONFIGURED = true;' "$CFG"
          printf '%s\n' "$token_id" > ci/v29-telemetry/collector-id.txt
          printf '%s\n' "$read_url" > ci/v29-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v29-telemetry/source-ref.txt
          printf '%s\n' 'single-real-device-run-only' > ci/v29-telemetry/usage.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v29-voice-post-start-census-v1","scenario_id":"voice-post-start-bounded-census","source_ref":"%s"}\n' "$GITHUB_SHA" > ci/v29-telemetry/build-smoke.json
          curl -fsS -X POST "$endpoint" -H 'Content-Type: application/json' --data-binary @ci/v29-telemetry/build-smoke.json >/dev/null
          ok=0
          for i in 1 2 3 4 5; do
            sleep 1
            if curl -fsS "$read_url" | python3 -c 'import json,sys;o=json.load(sys.stdin);d=o.get("data",[]);raise SystemExit(0 if len(d)>=1 else 1)'; then ok=1; break; fi
          done
          test "$ok" -eq 1
          echo 'v0.29 fresh collector smoke confirmed'

      - name: Prepare v0.29 metadata and contract prechecks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          ACT="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorVoicePostStartCensusV29Activity.java"
          CFG="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV29.java"
          GRADLE="$ROOT/app/build.gradle"
          MAN="$ROOT/app/src/main/AndroidManifest.xml"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('runtime_probes/chatgpt-webview-stable-probe/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+','versionCode 29',s)
          s=re.sub(r"versionName\s+'[^']+'","versionName '0.29-stable-voice-post-start-census'",s)
          p.write_text(s)
          PY
          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe'" "$GRADLE"
          grep -Fq 'versionCode 29' "$GRADLE"
          grep -Fq "versionName '0.29-stable-voice-post-start-census'" "$GRADLE"
          grep -Fq 'OrchestratorVoicePostStartCensusV29Activity' "$MAN"
          grep -Fq 'android.permission.INTERNET' "$MAN"
          grep -Fq 'android.permission.RECORD_AUDIO' "$MAN"
          grep -Fq 'android.permission.MODIFY_AUDIO_SETTINGS' "$MAN"
          test "$(grep -c '<uses-permission' "$MAN")" -eq 3
          grep -Fq 'RUN VOICE CENSUS' "$ACT"
          grep -Fq 'PASS_POST_START_CENSUS_CAPTURED_RECOVERED' "$ACT"
          grep -Fq 'DISPATCHED_UNIQUE_SEMANTIC_CLICK' "$ACT"
          grep -Fq 'OBSERVED_POST_START_CENSUS_NO_REPLAY' "$ACT"
          grep -Fq 'MAX_MS=180' "$ACT"
          grep -Fq 'MAX_NODES=7000' "$ACT"
          grep -Fq 'MAX_ROOTS=32' "$ACT"
          grep -Fq 'candidate_set_hash' "$ACT"
          grep -Fq 'active_audio_tracks' "$ACT"
          grep -Fq 'raw_chat_text_uploaded' "$ACT"
          grep -Fq 'raw_html_uploaded' "$ACT"
          grep -Fq 'cookies_tokens_accessed' "$ACT"
          grep -Fq 'static final boolean CONFIGURED = true;' "$CFG"
          ! grep -R -n -E 'api\.openai\.com|Authorization: Bearer|access_token|refresh_token|Cookie:' "$ACT" "$CFG"
          echo 'stable v0.29 contract prechecks OK'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p ../../ci/out/signing-tools/lib ../../ci/out/signing-tools/lib64
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../../ci/out/chatgpt-webview-stable-v29-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" ../../ci/out/signing-tools/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" ../../ci/out/signing-tools/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" ../../ci/out/signing-tools/zipalign
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" ../../ci/out/signing-tools/aapt
          LIBCPP=$(find "$ANDROID_SDK_ROOT/build-tools/35.0.0" -type f -name 'libc++.so' | head -n 1)
          test -n "$LIBCPP"
          cp "$LIBCPP" ../../ci/out/signing-tools/lib64/libc++.so

      - name: Verify unsigned v0.29 artifact contracts
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          APK=ci/out/chatgpt-webview-stable-v29-unsigned.apk
          "$AAPT" dump badging "$APK" | tee ci/out/badging.txt
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe' versionCode='29' versionName='0.29-stable-voice-post-start-census'" ci/out/badging.txt
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorVoicePostStartCensusV29Activity'" ci/out/badging.txt
          "$AAPT" dump permissions "$APK" | tee ci/out/permissions.txt
          grep -Fq 'android.permission.INTERNET' ci/out/permissions.txt
          grep -Fq 'android.permission.RECORD_AUDIO' ci/out/permissions.txt
          grep -Fq 'android.permission.MODIFY_AUDIO_SETTINGS' ci/out/permissions.txt
          test "$(grep -c '^uses-permission:' ci/out/permissions.txt)" -eq 3
          unzip -p "$APK" classes.dex | strings > ci/out/classes-strings.txt
          grep -Fq 'RUN VOICE CENSUS' ci/out/classes-strings.txt
          grep -Fq 'PASS_POST_START_CENSUS_CAPTURED_RECOVERED' ci/out/classes-strings.txt
          grep -Fq 'OBSERVED_POST_START_CENSUS_NO_REPLAY' ci/out/classes-strings.txt
          grep -Fq 'candidate_set_hash' ci/out/classes-strings.txt
          grep -Fq 'https://webhook.site/' ci/out/classes-strings.txt
          sha256sum "$APK" | tee ci/out/UNSIGNED_SHA256.txt
          printf '%s\n' "$GITHUB_SHA" > ci/out/SOURCE_REF.txt

      - name: Upload release signing kit
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-stable-v29-signing-kit
          path: |
            ci/out/chatgpt-webview-stable-v29-unsigned.apk
            ci/out/UNSIGNED_SHA256.txt
            ci/out/badging.txt
            ci/out/permissions.txt
            ci/out/SOURCE_REF.txt
            ci/out/signing-tools/apksigner
            ci/out/signing-tools/lib/apksigner.jar
            ci/out/signing-tools/zipalign
            ci/out/signing-tools/aapt
            ci/out/signing-tools/lib64/libc++.so
          if-no-files-found: error
          retention-days: 30

      - name: Upload fresh single-run telemetry collector provenance
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-stable-v29-telemetry-collector
          path: ci/v29-telemetry
          if-no-files-found: error
          retention-days: 30
