name: TEMP ChatGPT WebView v0.48 telemetry readback

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-v50-readback-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read v0.48 collector
        shell: bash
        run: |
          set -euo pipefail
          URL='https://webhook.site/token/af1a30f5-a16b-435a-a0b4-50f8d9f889e7/requests?sorting=oldest&per_page=100'
          curl -fsSL "$URL" -o /tmp/readback.json
          python3 - <<'PY'
          import json
          p='/tmp/readback.json'
          d=json.load(open(p))
          data=d.get('data', d if isinstance(d,list) else [])
          print('COUNT', len(data))
          for i,r in enumerate(data):
              content=r.get('content') or r.get('request',{}).get('content') or ''
              print(f'--- REQUEST {i} ---')
              print(content)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.48-readback-temp
          path: /tmp/readback.json
          if-no-files-found: error
          retention-days: 1
