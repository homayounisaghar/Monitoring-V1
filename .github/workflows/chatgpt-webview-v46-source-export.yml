name: ChatGPT WebView v46 source export

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/chatgpt-webview-v46-source-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate v46 source
        run: |
          set -euo pipefail
          python3 ci/generate_chatgpt_webview_v46_slider_write_restore.py
      - name: Collect source
        run: |
          set -euo pipefail
          mkdir -p out
          cp runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorPaidModelEffortSliderArrowLeftRestoreV46Activity.java out/
          cp runtime_probes/chatgpt-webview-stable-probe/app/src/main/AndroidManifest.xml out/
          cp runtime_probes/chatgpt-webview-stable-probe/app/build.gradle out/
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v46-generated-source
          path: out
          if-no-files-found: error
          retention-days: 1
