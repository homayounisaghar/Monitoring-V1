name: Apply Capability Lab v0.10 Exact Menu

on:
  push:
    branches:
      - build/pebble-chat-bridge-v019
    paths:
      - '.github/workflows/apply-capability-lab-v10.yml'
      - 'build_tools/apply_capability_lab_v10_exact_menu.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.10 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 build_tools/apply_capability_lab_v10_exact_menu.py
          git diff --check
          grep -Fq "versionCode 10" runtime_probes/native-capability-lab/app/build.gradle
          grep -Fq "conversation_search_binding_v5_exact_menu" runtime_probes/native-capability-lab/plans/default.json
          grep -Fq "collectExactSemanticNodes" runtime_probes/native-capability-lab/app/src/main/java/com/openai/controlplane/capabilitylab/LabAccessibilityService.java
          grep -Fq "GLOBAL_SEARCH_MENU_EXACT_MATCHES" runtime_probes/native-capability-lab/app/src/main/java/com/openai/controlplane/capabilitylab/LabAccessibilityService.java

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime_probes/native-capability-lab
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "Match ChatGPT Menu semantic exactly in Capability Lab"
          git push origin HEAD:build/pebble-chat-bridge-v019
