name: Read v0.33 Census Once
on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths: ['.github/workflows/read-v35-census-once.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read and summarize v0.33 census telemetry
        shell: bash
        env:
          READ_URL: 'https://webhook.site/token/62004e07-0444-40d2-987b-0e9ecb2efa7b/requests?sorting=oldest&per_page=100'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, collections
          with urllib.request.urlopen(os.environ['READ_URL'], timeout=20) as r:
              o=json.load(r)
          data=o.get('data',[])
          def parse(x):
              for k in ('content','body'):
                  v=x.get(k)
                  if isinstance(v,dict): return v
                  if isinstance(v,str):
                      try: return json.loads(v)
                      except Exception: pass
              return None
          parsed=[p for x in data if isinstance((p:=parse(x)),dict)]
          print('API_ROWS',len(data),'TOTAL',o.get('total',o.get('total_count','?')),'PARSED',len(parsed))
          tests=collections.defaultdict(list)
          for p in parsed:
              tid=p.get('test_id') or p.get('scenario_id') or p.get('kind') or 'NO_ID'
              tests[tid].append(p)
          for tid,rows in tests.items():
              print('TEST',tid,'ROWS',len(rows))
              rows=sorted(rows,key=lambda p:(p.get('timestamp_epoch_ms',0),p.get('seq',-1)))
              for p in rows:
                  phase=p.get('phase') or p.get('kind') or '-'
                  cls=p.get('classification') or '-'
                  st=p.get('state') if isinstance(p.get('state'),dict) else {}
                  if phase=='MODEL_TRIGGER_SNAPSHOT':
                      cands=st.get('candidates') or []
                      slim=[]
                      for c in cands:
                          if not isinstance(c,dict): continue
                          slim.append({k:c.get(k) for k in (
                              'fp','tag','role','top_band','headerish','has_popup','popup_hash','has_expanded','expanded_true','has_controls','has_data_state','data_state_open','disabled','has_svg','text_len_bucket','aria_len_bucket','title_len_bucket','sem_model','sem_gpt','sem_chatgpt','sem_auto','sem_instant','sem_thinking','sem_pro','sem_o_series','acc_hash','testid_hash','x_bucket','y_bucket','w_bucket','h_bucket')})
                      print(json.dumps({'seq':p.get('seq'),'phase':phase,'classification':cls,'snapshot_index':st.get('snapshot_index'),'complete':st.get('complete'),'visited_nodes':st.get('visited_nodes'),'visible_control_count':st.get('visible_control_count'),'candidate_count':st.get('candidate_count'),'top_band_control_count':st.get('top_band_control_count'),'popup_control_count':st.get('popup_control_count'),'semantic_modelish_count':st.get('semantic_modelish_count'),'candidate_set_hash':st.get('candidate_set_hash'),'candidates':slim},sort_keys=True))
                  elif phase=='FINAL':
                      keep={k:st.get(k) for k in ('snapshots_ok','snapshots_complete','max_candidate_count','max_visible_control_count','runtime_ms','dom_clicks','capability_dispatches','raw_text_uploaded','raw_html_uploaded','cookies_tokens_accessed')}
                      print(json.dumps({'seq':p.get('seq'),'phase':phase,'classification':cls,'state':keep},sort_keys=True))
                  else:
                      print(json.dumps({'seq':p.get('seq'),'phase':phase,'classification':cls},sort_keys=True))
          PY
