name: Read v0.33 Census Once
on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths: ['.github/workflows/read-v35-census-once.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cross-check current census and old free trigger telemetry
        shell: bash
        env:
          CUR_URL: 'https://webhook.site/token/62004e07-0444-40d2-987b-0e9ecb2efa7b/requests?sorting=oldest&per_page=100'
          OLD_URL: 'https://webhook.site/token/bd863081-6608-44f8-a60f-a043b8463faa/requests?sorting=oldest&per_page=100'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          def load(url):
              with urllib.request.urlopen(url,timeout=20) as r:return json.load(r)
          def parse(x):
              for k in ('content','body'):
                  v=x.get(k)
                  if isinstance(v,dict):return v
                  if isinstance(v,str):
                      try:return json.loads(v)
                      except:pass
          for label,url in [('CUR',os.environ['CUR_URL']),('OLD',os.environ['OLD_URL'])]:
              o=load(url); ps=[p for x in o.get('data',[]) if isinstance((p:=parse(x)),dict)]
              print('===',label,'ROWS',len(ps),'TOTAL',o.get('total',o.get('total_count','?')),'===')
              for p in sorted(ps,key=lambda q:(q.get('timestamp_epoch_ms',0),q.get('seq',-1))):
                  ph=p.get('phase') or p.get('kind') or '-'; st=p.get('state') if isinstance(p.get('state'),dict) else {}
                  if label=='OLD' and ph in ('MODEL_TRIGGER_CENSUS','MODEL_OPTIONS_CENSUS','FINAL'):
                      keep={k:st.get(k) for k in ('model_trigger_count','model_trigger_hash','model_option_count','model_enabled_count','model_selected_count','model_set_hash','selection_clicks') if k in st}
                      print(json.dumps({'phase':ph,'classification':p.get('classification'),'state':keep},sort_keys=True))
                  if label=='CUR' and ph=='MODEL_TRIGGER_SNAPSHOT':
                      cs=st.get('candidates') or []
                      model=[{k:c.get(k) for k in ('fp','acc_hash','testid_hash','has_data_state','has_expanded','has_popup','role','tag','sem_model','sem_gpt','sem_chatgpt','sem_auto','sem_instant','sem_thinking','sem_pro','sem_o_series','text_len_bucket','aria_len_bucket','title_len_bucket','headerish','top_band')} for c in cs if isinstance(c,dict) and c.get('sem_model')]
                      print(json.dumps({'phase':ph,'snapshot_index':st.get('snapshot_index'),'candidate_set_hash':st.get('candidate_set_hash'),'semantic_model_candidates':model},sort_keys=True))
                  if label=='CUR' and ph=='FINAL':
                      print(json.dumps({'phase':ph,'classification':p.get('classification'),'state':{k:st.get(k) for k in ('snapshots_ok','snapshots_complete','dom_clicks','capability_dispatches')}},sort_keys=True))
          PY
