name: ChatGPT WebView Stable v0.76 Final Bounded Wrapped Resource Unsigned

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-stable-v78-resource-final-bounded-wrapped-unsigned.yml'
      - 'ci/generate_chatgpt_webview_v78_resource_final_bounded_wrapped.py'
      - 'ci/generate_chatgpt_webview_v77_resource_provenance_hardened.py'
      - 'ci/generate_chatgpt_webview_v77_resource_provenance_hardened_fix1.py'
      - 'ci/generate_chatgpt_webview_v76_resource_tools_consolidated.py'
      - 'ci/generate_chatgpt_webview_v76_resource_tools_consolidated_fix1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Generate v0.76 source
        run: python3 ci/generate_chatgpt_webview_v78_resource_final_bounded_wrapped.py

      - name: Create fresh telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          CFG=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV78.java
          TOKEN=$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid");assert x;print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"
          READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(); ep,sha,cid=sys.argv[2:]
          s=re.sub(r'WEBHOOK_URL=".*?"',f'WEBHOOK_URL="{ep}"',s)
          s=re.sub(r'SOURCE_REF=".*?"',f'SOURCE_REF="{sha}"',s)
          s=re.sub(r'COLLECTOR_ID=".*?"',f'COLLECTOR_ID="{cid}"',s)
          s=s.replace('CONFIGURED=false','CONFIGURED=true')
          p.write_text(s)
          PY
          mkdir -p ci/v78-resource-final-bounded-telemetry
          printf '%s\n' "$TOKEN" > ci/v78-resource-final-bounded-telemetry/collector-id.txt
          printf '%s\n' "$READ" > ci/v78-resource-final-bounded-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v78-resource-final-bounded-telemetry/source-ref.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v78-resource-final-bounded-wrapped-v1","scenario_id":"resource-final-bounded-wrapped-navigation-receipt","control_sync":"EVENT_DRIVEN_NO_FIXED_DELAY_POLL_TIMEOUT","audit":"FINAL_BOUNDED_WRAPPED_NAVIGATION_RECEIPT"}\n' | curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @- >/dev/null

      - name: End-to-end static audit
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          PKG=$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe
          ACT=$PKG/OrchestratorResourceToolsV78Activity.java
          MAN=$ROOT/app/src/main/AndroidManifest.xml
          GRADLE=$ROOT/app/build.gradle
          test -f "$ACT"
          test -f "$PKG/TelemetryConfigV78.java"
          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe.diag'" "$GRADLE"
          grep -Fq 'versionCode 79' "$GRADLE"
          grep -Fq "versionName '0.76-stable-diag-resource-final-bounded-wrapped'" "$GRADLE"
          grep -Fq 'OrchestratorResourceToolsV78Activity' "$MAN"
          grep -Fq 'ControlPlaneAccessibilityServiceV51' "$MAN"
          grep -Fq '@xml/cp_accessibility_service_v51' "$MAN"
          python3 - "$ACT" <<'PY'
          import pathlib,sys
          s=pathlib.Path(sys.argv[1]).read_text()
          required=[
            'RESOURCE TEST','TEST ACTION','TOOLS TEST','RESOURCE_RESOLVER_V4','CORRELATED_FINAL_BOUNDED','composerBoundary',
            'SAME_ORIGIN_WRAPPED_LINK','STRONG_WRAPPED_URL','RESOURCE_ACTION_ATTEMPTED','RESOURCE_ACTION_BLOCKED_NO_ACTIONABLE_PREFERRED',
            'PASS_RESOURCE_WRAPPED_EXACT_SINGLE_CLICK_DISPATCHED_WAITING_NAVIGATION_RECEIPT','PASS_RESOURCE_WRAPPED_EXTERNAL_RESOLVED_OPEN_INTENT_DISPATCHED',
            'RESOURCE_ACTION_UNCERTAIN_WRAPPED_SAME_ORIGIN_TERMINAL_NO_REPLAY','RESOURCE_ACTION_BLOCKED_SEMANTIC_RECERTIFICATION_FAILED',
            'RESOURCE_ACTION_MISDISPATCHED_NONRESOURCE_UI','CLAIMED_BEFORE_RESOURCE_ACTION','PASS_RESOURCE_DOWNLOAD_CALLBACK_RECEIPT',
            'PASS_RESOURCE_EXTERNAL_OPEN_INTENT_DISPATCHED','PASS_TOOLS_HIDDEN_MENU_CENSUS_COMPLETE','TelemetryConfigV78',
            'data-cp-resource-locator-v78','shouldOverrideUrlLoading','resourceNavigationPending','final_bounded_correlated_count'
          ]
          for x in required: assert x in s,x
          assert "(!next||" not in s
          assert s.count('.click();')==5,s.count('.click();')
          for bad in ['Thread.sleep','setTimeout(','setInterval(','ScheduledExecutorService','TimerTask','elementFromPoint','document.evaluate','dispatchTouchEvent(','performClick(','ACTION_SET_PROGRESS','CookieManager','getCookie(','addJavascriptInterface','XPathResult']:
            assert bad not in s,bad
          assert 'raw_url_remote",false' in s and 'raw_text_remote",false' in s
          print('PASS v0.76 final-bounded wrapped-resource static audit')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build and prove exact artifact identity
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..
          OUT=ci/v78-resource-final-bounded-out
          mkdir -p "$OUT"
          UNSIGNED=runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$OUT/chatgpt-webview-v0.76-resource-final-bounded-wrapped-exact-source-aligned-unsigned.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$ALIGNED" > "$OUT/badging.txt"
          "$BT/aapt" dump permissions "$ALIGNED" > "$OUT/permissions.txt"
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe.diag' versionCode='79' versionName='0.76-stable-diag-resource-final-bounded-wrapped'" "$OUT/badging.txt"
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorResourceToolsV78Activity'" "$OUT/badging.txt"
          test "$(grep -c '^uses-permission:' "$OUT/permissions.txt")" -eq 3
          grep -Fq 'android.permission.INTERNET' "$OUT/permissions.txt"
          grep -Fq 'android.permission.RECORD_AUDIO' "$OUT/permissions.txt"
          grep -Fq 'android.permission.MODIFY_AUDIO_SETTINGS' "$OUT/permissions.txt"
          cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
          java -jar "$OUT/apksigner.jar" --version > "$OUT/APKSIGNER_VERSION.txt"
          sha256sum "$OUT/apksigner.jar" > "$OUT/APKSIGNER_JAR_SHA256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"
          printf '%s\n' 'RESOURCE_RESOLVER_V4_FINAL_BOUNDED_PLUS_WRAPPED_NAVIGATION_RECEIPTS_PLUS_ACTION_OBSERVABILITY' > "$OUT/FRONTIER_MODE.txt"
          printf '%s\n' 'EVENT_DRIVEN_NO_FIXED_DELAY_POLL_TIMEOUT' > "$OUT/CONTROL_SYNC.txt"
          printf '%s\n' 'b7aea08158252dcad79345608ce2e76e970e4cf613414db299579f46d9924c48' > "$OUT/EXPECTED_SIGNER_CERT_SHA256.txt"
          sha256sum "$ALIGNED" > "$OUT/ALIGNED_UNSIGNED_SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.76-resource-final-bounded-wrapped-${{ github.run_id }}-unsigned
          path: ci/v78-resource-final-bounded-out
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.76-resource-final-bounded-wrapped-${{ github.run_id }}-telemetry
          path: ci/v78-resource-final-bounded-telemetry
          if-no-files-found: error
          retention-days: 30
