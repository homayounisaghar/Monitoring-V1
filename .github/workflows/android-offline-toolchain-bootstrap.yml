name: Android Offline Toolchain Bootstrap

on:
  push:
    paths:
      - '.github/workflows/android-offline-toolchain-bootstrap.yml'
      - '.ci/android-offline-toolchain-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Download Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cf-toolchain"
          curl -fL --retry 5 --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip \
            -o "$RUNNER_TEMP/cf-toolchain/gradle-8.10.2-bin.zip"
          unzip -q "$RUNNER_TEMP/cf-toolchain/gradle-8.10.2-bin.zip" -d "$RUNNER_TEMP/cf-toolchain"

      - name: Hydrate AGP and app dependencies
        shell: bash
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/hydrate"
          mkdir -p "$P/app/src/main/java/bootstrap" "$P/app/src/test/java/bootstrap"
          cat > "$P/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AndroidOfflineBootstrap"
          include(":app")
          EOF
          cat > "$P/build.gradle.kts" <<'EOF'
          plugins { id("com.android.application") version "8.8.2" apply false }
          EOF
          cat > "$P/app/build.gradle.kts" <<'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "bootstrap.toolchain"
              compileSdk = 35
              defaultConfig { applicationId = "bootstrap.toolchain"; minSdk = 26; targetSdk = 35; versionCode = 1; versionName = "1" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              testImplementation("junit:junit:4.13.2")
              testImplementation("org.json:json:20240303")
          }
          EOF
          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.Light.NoActionBar" /></manifest>
          EOF
          cat > "$P/app/src/main/java/bootstrap/Dummy.java" <<'EOF'
          package bootstrap; public final class Dummy { public static int ok() { return 1; } }
          EOF
          cat > "$P/app/src/test/java/bootstrap/DummyTest.java" <<'EOF'
          package bootstrap; import org.junit.Test; import static org.junit.Assert.*; public class DummyTest { @Test public void ok(){ assertEquals(1, Dummy.ok()); } }
          EOF
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$P/local.properties"
          "$RUNNER_TEMP/cf-toolchain/gradle-8.10.2/bin/gradle" -p "$P" --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Package source-agnostic offline toolchain
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          ROOT="$OUT/android-offline-toolchain"
          mkdir -p "$ROOT/gradle" "$ROOT/android-sdk/platforms" "$ROOT/android-sdk/build-tools" "$ROOT/android-sdk/licenses" "$ROOT/gradle-user-home"
          cp "$RUNNER_TEMP/cf-toolchain/gradle-8.10.2-bin.zip" "$ROOT/gradle/"
          cp -a "$ANDROID_SDK_ROOT/platforms/android-35" "$ROOT/android-sdk/platforms/"
          cp -a "$ANDROID_SDK_ROOT/build-tools/35.0.0" "$ROOT/android-sdk/build-tools/"
          if [ -d "$ANDROID_SDK_ROOT/licenses" ]; then cp -a "$ANDROID_SDK_ROOT/licenses/." "$ROOT/android-sdk/licenses/"; fi
          cp -a "$HOME/.gradle/caches" "$ROOT/gradle-user-home/"
          if [ -d "$HOME/.gradle/native" ]; then cp -a "$HOME/.gradle/native" "$ROOT/gradle-user-home/"; fi
          cat > "$ROOT/TOOLCHAIN.json" <<'EOF'
          {"schema":"capability-fabric.android-offline-toolchain.v1","gradle":"8.10.2","agp":"8.8.2","compileSdk":35,"buildTools":"35.0.0","dependencies":["com.squareup.okhttp3:okhttp:4.12.0","junit:junit:4.13.2","org.json:json:20240303"],"containsPrivateAppSource":false,"containsSigningSecrets":false}
          EOF
          tar -C "$OUT" -czf "$OUT/android-offline-toolchain-linux.tar.gz" android-offline-toolchain
          sha256sum "$OUT/android-offline-toolchain-linux.tar.gz" > "$OUT/android-offline-toolchain-linux.tar.gz.sha256"
          du -h "$OUT/android-offline-toolchain-linux.tar.gz"

      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: android-offline-toolchain-linux-agp882
          path: |
            ${{ runner.temp }}/out/android-offline-toolchain-linux.tar.gz
            ${{ runner.temp }}/out/android-offline-toolchain-linux.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error
