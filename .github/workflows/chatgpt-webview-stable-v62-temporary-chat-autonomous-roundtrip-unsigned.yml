name: ChatGPT WebView Stable v0.60 Temporary Chat Autonomous Roundtrip Unsigned

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-stable-v62-temporary-chat-autonomous-roundtrip-unsigned.yml'
      - 'ci/generate_chatgpt_webview_v62_temporary_chat_autonomous_roundtrip.py'
      - 'ci/generate_chatgpt_webview_v62_temporary_chat_autonomous_roundtrip_fixed.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Generate v0.60 source
        run: python3 ci/generate_chatgpt_webview_v62_temporary_chat_autonomous_roundtrip_fixed.py

      - name: Create fresh telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          CFG=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV62.java
          TOKEN=$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid");assert x;print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"
          READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(); ep,sha,cid=sys.argv[2:]
          s=re.sub(r'WEBHOOK_URL=".*?"',f'WEBHOOK_URL="{ep}"',s)
          s=re.sub(r'SOURCE_REF=".*?"',f'SOURCE_REF="{sha}"',s)
          s=re.sub(r'COLLECTOR_ID=".*?"',f'COLLECTOR_ID="{cid}"',s)
          s=s.replace('CONFIGURED=false','CONFIGURED=true')
          p.write_text(s)
          PY
          mkdir -p ci/v62-temp-chat-telemetry
          printf '%s\n' "$TOKEN" > ci/v62-temp-chat-telemetry/collector-id.txt
          printf '%s\n' "$READ" > ci/v62-temp-chat-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v62-temp-chat-telemetry/source-ref.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v62-temporary-chat-autonomous-roundtrip-v1","scenario_id":"temporary-chat-autonomous-roundtrip","source_ref":"%s"}\n' "$GITHUB_SHA" | curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @- >/dev/null

      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          PKG=$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe
          ACT=$PKG/OrchestratorTemporaryChatAutonomousRoundtripV62Activity.java
          MAN=$ROOT/app/src/main/AndroidManifest.xml
          GRADLE=$ROOT/app/build.gradle

          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe.diag'" "$GRADLE"
          grep -Fq 'versionCode 63' "$GRADLE"
          grep -Fq "versionName '0.60-stable-diag-temporary-chat-autonomous-roundtrip'" "$GRADLE"
          grep -Fq 'OrchestratorTemporaryChatAutonomousRoundtripV62Activity' "$MAN"
          grep -Fq 'ControlPlaneAccessibilityServiceV51' "$MAN"
          grep -Fq '@xml/cp_accessibility_service_v51' "$MAN"
          ! grep -Fq 'ControlPlaneAccessibilityServiceV62' "$MAN"
          ! grep -Fq 'REQUEST_INSTALL_PACKAGES' "$MAN"
          ! grep -Fq 'UPDATE_PACKAGES_WITHOUT_USER_ACTION' "$MAN"

          grep -Fq 'NORMAL_LABEL_HASH="1a957a52"' "$ACT"
          grep -Fq 'NORMAL_STRUCT_HASH="b9c97d1e"' "$ACT"
          grep -Fq 'NORMAL_SEMANTIC_SET_HASH="566ee132"' "$ACT"
          grep -Fq 'TEMP_LABEL_HASH="ae0e16e6"' "$ACT"
          grep -Fq 'TEMP_STRUCT_HASH="34d052a8"' "$ACT"
          grep -Fq 'TEMP_SEMANTIC_SET_HASH="2f8aeb2c"' "$ACT"
          grep -Fq 'PASS_STABLE_TEMP_TARGET_RECEIPT' "$ACT"
          grep -Fq 'PASS_STABLE_NORMAL_RESTORE_RECEIPT' "$ACT"
          grep -Fq 'TEMP_EXIT_NOT_ALLOWED_WITHOUT_TARGET_RECEIPT' "$ACT"
          grep -Fq 'TEMP_TARGET_RECEIPT_UNRESOLVED_NO_REPLAY_NO_EXIT' "$ACT"
          grep -Fq 'TEMP_START_NOT_EXACT_NORMAL_ZERO_WRITE' "$ACT"
          grep -Fq 'PASS_AUTONOMOUS_TEMPORARY_CHAT_ROUNDTRIP' "$ACT"
          grep -Fq 'click_observed' "$ACT"
          grep -Fq 'ELEMENT_CLICK' "$ACT"
          test "$(grep -o '\.click();' "$ACT" | wc -l)" -eq 1

          ! grep -Fq 'elementFromPoint' "$ACT"
          ! grep -Fq 'document.evaluate' "$ACT"
          ! grep -Fq 'dispatchTouchEvent' "$ACT"
          ! grep -Fq 'performClick(' "$ACT"
          ! grep -Fq 'ACTION_SET_PROGRESS' "$ACT"
          ! grep -Fq 'CookieManager' "$ACT"
          ! grep -Fq 'addJavascriptInterface' "$ACT"
          ! grep -Fq 'setAttribute("aria-value' "$ACT"
          grep -Fq 'put(o,"model_option_writes",0)' "$ACT"
          grep -Fq 'put(o,"effort_writes",0)' "$ACT"
          grep -Fq 'put(o,"chat_work_writes",0)' "$ACT"
          test "$(grep -c '<uses-permission' "$MAN")" -eq 3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build and prove exact artifact identity
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..
          OUT=ci/v62-temp-chat-out
          mkdir -p "$OUT"
          UNSIGNED=runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$OUT/chatgpt-webview-v0.60-temporary-chat-autonomous-roundtrip-exact-source-aligned-unsigned.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$ALIGNED" > "$OUT/badging.txt"
          "$BT/aapt" dump permissions "$ALIGNED" > "$OUT/permissions.txt"
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe.diag' versionCode='63' versionName='0.60-stable-diag-temporary-chat-autonomous-roundtrip'" "$OUT/badging.txt"
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorTemporaryChatAutonomousRoundtripV62Activity'" "$OUT/badging.txt"
          test "$(grep -c '^uses-permission:' "$OUT/permissions.txt")" -eq 3
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"
          sha256sum "$ALIGNED" > "$OUT/ALIGNED_UNSIGNED_SHA256.txt"
          cp "$OUT/badging.txt" "$OUT/IDENTITY_PROOF.txt"
          printf 'SOURCE_REF=%s\nRUN_ID=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" >> "$OUT/IDENTITY_PROOF.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.60-temporary-chat-autonomous-roundtrip-${{ github.run_id }}-unsigned
          path: ci/v62-temp-chat-out
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.60-temporary-chat-autonomous-roundtrip-${{ github.run_id }}-telemetry
          path: ci/v62-temp-chat-telemetry
          if-no-files-found: error
          retention-days: 30
