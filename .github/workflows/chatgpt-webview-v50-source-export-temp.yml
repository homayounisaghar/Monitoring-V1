name: TEMP v0.48 generated source export

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-v50-source-export-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate current v0.48 source
        run: python3 ci/generate_chatgpt_webview_v50_current_ui_roundtrip.py
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v50-generated-source-temp
          path: |
            runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorPaidCurrentUiControlRoundtripV50Activity.java
            runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/ControlPlaneAccessibilityServiceV50.java
            runtime_probes/chatgpt-webview-stable-probe/app/src/main/AndroidManifest.xml
            runtime_probes/chatgpt-webview-stable-probe/app/build.gradle
          if-no-files-found: error
          retention-days: 1
