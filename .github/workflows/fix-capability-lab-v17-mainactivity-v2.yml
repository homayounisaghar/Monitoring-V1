name: Fix Capability Lab v0.17 MainActivity v2

on:
  push:
    branches: [build/pebble-chat-bridge-v019]
    paths:
      - '.github/workflows/fix-capability-lab-v17-mainactivity-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/pebble-chat-bridge-v019
          fetch-depth: 0
      - name: Repair Java description block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('runtime_probes/native-capability-lab/app/src/main/java/com/openai/controlplane/capabilitylab/MainActivity.java')
          s=p.read_text()
          start=s.index('    private static final String SCREEN_DESCRIPTION =')
          end=s.index('    private final Handler handler', start)
          block='''    private static final String SCREEN_DESCRIPTION =\n            "Stable v0.17 tests a fresh History binding that does not depend on Global Search indexing. "\n          + "It creates one synthetic marker chat, sends exactly once with the proven CLAIM/no-replay Send contract, "\n          + "opens official History, deliberately switches away through the exact New chat control, reopens History, "\n          + "selects only the first semantic conversation row, harvests that row metadata, and requires the exact marker on the reopened thread. "\n          + "The full report file remains authoritative and captures the relevant ChatGPT Accessibility surfaces. "\n          + "DOWNLOAD FULL REPORT saves it directly to Android Downloads with one tap and no share sheet. "\n          + "No private ChatGPT API is called, no credentials are extracted, and no coordinate writes, gestures, or global actions are used.";\n\n'''
          p.write_text(s[:start]+block+s[end:])
          PY
          git diff --check
          sed -n '30,46p' runtime_probes/native-capability-lab/app/src/main/java/com/openai/controlplane/capabilitylab/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          s=Path('runtime_probes/native-capability-lab/app/src/main/java/com/openai/controlplane/capabilitylab/MainActivity.java').read_text()
          assert 'thread. "\n          + "The full report' in s
          assert 'thread.\n' not in s
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime_probes/native-capability-lab/app/src/main/java/com/openai/controlplane/capabilitylab/MainActivity.java
          git commit -m 'Repair v0.17 MainActivity description block'
          git push origin HEAD:build/pebble-chat-bridge-v019
