name: ChatGPT WebView v0.90.1 current telemetry readback

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-v95-current-readback.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN_ID: '34317593889'
      TARGET_ARTIFACT_NAME: 'chatgpt-webview-v0.90.1-dashboard-planner-correlation-readback-repair-34317593889-telemetry'
    steps:
      - name: Download telemetry metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p telemetry out
          gh run download "$TARGET_RUN_ID" --repo "${GITHUB_REPOSITORY}" --name "$TARGET_ARTIFACT_NAME" --dir telemetry
          test -s telemetry/read-url.txt
          test -s telemetry/source-ref.txt
          printf 'SOURCE_REF=%s\n' "$(cat telemetry/source-ref.txt)"
      - name: Fetch collector payloads
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat telemetry/read-url.txt)"
          curl -fsS --retry 3 --retry-delay 2 "$URL" -o out/requests.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('out/requests.json').read_text())
          data=obj.get('data',[])
          print(f'READBACK_COUNT={len(data)}')
          for i,r in enumerate(data):
              content=r.get('content','')
              try:
                  payload=json.loads(content) if isinstance(content,str) and content else content
              except Exception:
                  payload={'unparsed':True}
              print(json.dumps({'index':i,'created_at':r.get('created_at'),'payload':payload},ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.90.1-current-readback-${{ github.run_id }}
          path: out/requests.json
          if-no-files-found: error
          retention-days: 7
