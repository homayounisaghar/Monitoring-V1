name: ChatGPT WebView Stable v0.88 Resource Post-Effect Telemetry Repair Unsigned

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/chatgpt-webview-stable-v90-resource-posteffect-telemetry-repair-unsigned.yml'
      - 'ci/generate_chatgpt_webview_v90_resource_posteffect_telemetry_repair.py'
      - 'ci/generate_chatgpt_webview_v89_resource_posteffect_repair.py'
      - 'ci/generate_chatgpt_webview_v88_resource_webmessage_bridge_acceptance_fix1.py'
      - 'ci/generate_chatgpt_webview_v88_resource_webmessage_bridge_acceptance.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Generate v0.88 post-effect telemetry repair
        run: python3 ci/generate_chatgpt_webview_v90_resource_posteffect_telemetry_repair.py

      - name: Create fresh telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          CFG=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV90.java
          test -s "$CFG"
          TOKEN=$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid");assert x;print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"
          READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(); ep,sha,cid=sys.argv[2:]
          s,n1=re.subn(r'WEBHOOK_URL=".*?"',f'WEBHOOK_URL="{ep}"',s,count=1)
          s,n2=re.subn(r'SOURCE_REF=".*?"',f'SOURCE_REF="{sha}"',s,count=1)
          s,n3=re.subn(r'COLLECTOR_ID=".*?"',f'COLLECTOR_ID="{cid}"',s,count=1)
          assert (n1,n2,n3)==(1,1,1),(n1,n2,n3)
          assert s.count('CONFIGURED=false')==1
          s=s.replace('CONFIGURED=false','CONFIGURED=true',1)
          assert 'CONFIGURED=true' in s and '__V' not in re.search(r'WEBHOOK_URL="(.*?)"',s).group(1)
          p.write_text(s)
          PY
          D=ci/v90-resource-posteffect-telemetry-repair-telemetry
          mkdir -p "$D"
          printf '%s\n' "$TOKEN" > "$D/collector-id.txt"
          printf '%s\n' "$READ" > "$D/read-url.txt"
          printf '%s\n' "$GITHUB_SHA" > "$D/source-ref.txt"
          printf '%s\n' 'V0_87_BEHAVIOR_PRESERVED_TELEMETRY_REENABLED' > "$D/INSTRUMENTATION_POLICY.txt"
          printf '%s\n' 'SUCCESS_ONLY_BY_INDEPENDENT_NAVIGATION_NEW_WINDOW_DOWNLOAD_OR_ACTION_VIEW_RECEIPT' > "$D/SUCCESS_POLICY.txt"
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v90-resource-posteffect-telemetry-repair-v1","scenario_id":"resource-posteffect-provenance-continuation-telemetry-repair","audit":"V087_BEHAVIOR_PRESERVED_FRESH_COLLECTOR"}\n' | curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @- >/dev/null

      - name: Static behavior and telemetry audit
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          PKG=$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe
          ACT=$PKG/OrchestratorResourceToolsV90Activity.java
          CFG=$PKG/TelemetryConfigV90.java
          MAN=$ROOT/app/src/main/AndroidManifest.xml
          GRADLE=$ROOT/app/build.gradle
          test -f "$ACT" && test -f "$CFG"
          grep -Fq 'CONFIGURED=true' "$CFG"
          grep -Fq 'https://webhook.site/' "$CFG"
          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe.diag'" "$GRADLE"
          grep -Fq 'versionCode 91' "$GRADLE"
          grep -Fq "versionName '0.88-stable-diag-resource-posteffect-telemetry-repair'" "$GRADLE"
          grep -Fq 'OrchestratorResourceToolsV90Activity' "$MAN"
          python3 - "$ACT" <<'PY'
          import pathlib,re,sys
          s=pathlib.Path(sys.argv[1]).read_text()
          required=[
            'cp-v90-resource-posteffect-telemetry-repair-v1','resource-posteffect-provenance-continuation-telemetry-repair',
            'CP_RESOURCE_CERT_V88','CP_RESOURCE_EFFECT_V88','createWebMessageChannel','window.__cpEventPort',
            'RESOURCE_TOOLS_MISDISPATCH_GUARD_V89_JS','trigger_certified','trigger_expanded','surface_owned',
            'RESOURCE_POST_EFFECT_GENERIC_UI_NOT_TOOLS_AUTHORITY','RESOURCE_ACTION_MISDISPATCHED_NONRESOURCE_UI',
            'RESOURCE_CONTINUATION_CERT_V89_JS','RESOURCE_CONTINUATION_EFFECT_V89_TEMPLATE',
            'RESOURCE_CONTINUATION_SUBCLAIM_COMMITTED','EFFECT_ATTEMPTED_NO_REPLAY',
            'RESOURCE_INTERSTITIAL_CONTINUATION_DISPATCHED_WAITING_INDEPENDENT_RECEIPT',
            'android.content.Intent.ACTION_VIEW','PASS_RESOURCE_DOWNLOAD_CALLBACK_RECEIPT',
            'armResourceReceiptDeadlineV88(resourceV82Actuator)','raw_text_remote",false','raw_url_remote",false'
          ]
          for x in required: assert x in s,x
          m=re.search(r'    private void driveResourcePendingOnEventV79\([^\n]*\)\{.*?\n    \}\n\n',s,re.S); assert m
          assert 'toolsMenuCensusV79Js()' not in m.group(0)
          assert 'resourceToolsMisdispatchGuardV89Js()' in m.group(0)
          assert all(x in m.group(0) for x in ['trigger_certified','trigger_expanded','surface_owned'])
          em=re.search(r'private static final String RESOURCE_CONTINUATION_EFFECT_V89_TEMPLATE=.*?;\n',s,re.S)
          assert em and em.group(0).count('.click();')==1
          assert s.count('resourceV89ContinuationEffectAttempted=true;')==1
          assert s.count('dispatchTouchEvent(')==2,s.count('dispatchTouchEvent(')
          for bad in ['elementFromPoint','document.evaluate','XPathResult','getCookie(','CookieManager','addJavascriptInterface','Thread.sleep','ScheduledExecutorService','TimerTask']:
              assert bad not in s,bad
          print('PASS v0.88 behavior-preservation and telemetry audit')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build and prove exact artifact identity
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..
          OUT=ci/v90-resource-posteffect-telemetry-repair-out
          mkdir -p "$OUT"
          UNSIGNED=runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$OUT/chatgpt-webview-v0.88-resource-posteffect-telemetry-repair-exact-source-aligned-unsigned.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$ALIGNED" > "$OUT/badging.txt"
          "$BT/aapt" dump permissions "$ALIGNED" > "$OUT/permissions.txt"
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe.diag' versionCode='91' versionName='0.88-stable-diag-resource-posteffect-telemetry-repair'" "$OUT/badging.txt"
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorResourceToolsV90Activity'" "$OUT/badging.txt"
          test "$(grep -c '^uses-permission:' "$OUT/permissions.txt")" -eq 3
          grep -Fq 'android.permission.INTERNET' "$OUT/permissions.txt"
          grep -Fq 'android.permission.RECORD_AUDIO' "$OUT/permissions.txt"
          grep -Fq 'android.permission.MODIFY_AUDIO_SETTINGS' "$OUT/permissions.txt"
          cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
          java -jar "$OUT/apksigner.jar" --version > "$OUT/APKSIGNER_VERSION.txt"
          sha256sum "$OUT/apksigner.jar" > "$OUT/APKSIGNER_JAR_SHA256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"
          printf '%s\n' 'b7aea08158252dcad79345608ce2e76e970e4cf613414db299579f46d9924c48' > "$OUT/EXPECTED_SIGNER_CERT_SHA256.txt"
          printf '%s\n' 'V087_RESOURCE_BEHAVIOR_PRESERVED_TELEMETRY_ONLY_REPAIR' > "$OUT/BEHAVIOR_POLICY.txt"
          printf '%s\n' 'FRESH_WEBHOOK_COLLECTOR_EMBEDDED_AT_BUILD' > "$OUT/TELEMETRY_POLICY.txt"
          sha256sum "$ALIGNED" > "$OUT/ALIGNED_UNSIGNED_SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.88-resource-posteffect-telemetry-repair-${{ github.run_id }}-unsigned
          path: ci/v90-resource-posteffect-telemetry-repair-out
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.88-resource-posteffect-telemetry-repair-${{ github.run_id }}-telemetry
          path: ci/v90-resource-posteffect-telemetry-repair-telemetry
          if-no-files-found: error
          retention-days: 30
