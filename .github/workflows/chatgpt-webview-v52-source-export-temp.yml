name: TEMP v0.50 generated source export

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-v52-source-export-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate current v0.50 source
        run: python3 ci/generate_chatgpt_webview_v52_effort_popup_human_model_bridge.py
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v52-generated-source-temp
          path: |
            runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorPaidEffortPopupHumanModelBridgeV52Activity.java
            runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/ControlPlaneAccessibilityServiceV51.java
            runtime_probes/chatgpt-webview-stable-probe/app/src/main/AndroidManifest.xml
            runtime_probes/chatgpt-webview-stable-probe/app/build.gradle
          if-no-files-found: error
          retention-days: 1
