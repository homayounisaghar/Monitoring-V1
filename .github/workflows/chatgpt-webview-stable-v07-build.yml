name: ChatGPT WebView Stable v0.7 Native Attachment Release Kit

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/chatgpt-webview-stable-v07-build.yml'
      - 'runtime_probes/chatgpt-webview-stable-probe/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare v0.7 metadata and contract prechecks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          ATTACH="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/AttachmentSendActivity.java"
          V06="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/CapabilitySuiteActivity.java"
          LEGACY="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/MainActivity.java"
          GRADLE="$ROOT/app/build.gradle"
          MAN="$ROOT/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('runtime_probes/chatgpt-webview-stable-probe/app/build.gradle')
          s = p.read_text()
          s = re.sub(r'versionCode\s+\d+', 'versionCode 7', s)
          s = re.sub(r"versionName\s+'[^']+'", "versionName '0.7-stable-native-attachment-send'", s)
          p.write_text(s)
          PY

          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe'" "$GRADLE"
          grep -Fq 'versionCode 7' "$GRADLE"
          grep -Fq "versionName '0.7-stable-native-attachment-send'" "$GRADLE"
          grep -Fq 'android:name=".AttachmentSendActivity" android:exported="true"' "$MAN"
          grep -Fq 'android:name=".CapabilitySuiteActivity" android:exported="false"' "$MAN"
          grep -Fq 'button("ATTACH FILE"' "$ATTACH"
          grep -Fq "label(e).toLowerCase()==='files'" "$ATTACH"
          grep -Fq 'onShowFileChooser' "$ATTACH"
          grep -Fq 'NATIVE_ATTACH_STATUS=' "$ATTACH"
          grep -Fq 'FILE_CHOOSER_ORIGIN=' "$ATTACH"
          grep -Fq 'NATIVE_ATTACH_DOM_CONFIRMED' "$ATTACH"
          grep -Fq 'button("SEND ATTACH ONCE"' "$ATTACH"
          grep -Fq 'putString("state", state)' "$ATTACH"
          grep -Fq '.commit();' "$ATTACH"
          grep -Fq 'ATTACH_SEND_SINGLE_CLICK_DISPATCHED' "$ATTACH"
          grep -Fq 'UNCERTAIN' "$ATTACH"
          grep -Fq 'ATTACH_SEND_CONFIRMED' "$ATTACH"
          grep -Fq 'SEND_SAW_ATTACHMENT_CLEARED=' "$ATTACH"
          grep -Fq 'RAW_DRAFT_OR_MESSAGE_TEXT_RETAINED=false' "$ATTACH"
          grep -Fq 'FILE_NAMES_OR_URIS_RETAINED=false' "$ATTACH"
          grep -Fq 'MessageDigest.getInstance("SHA-256")' "$ATTACH"
          grep -Fq 'MediaStore.Downloads.getContentUri' "$ATTACH"
          grep -Fq 'SANITIZED; NO QUERY/FRAGMENT' "$ATTACH"
          grep -Fq 'root.setFitsSystemWindows(true)' "$ATTACH"
          grep -Fq 'UUID_PATTERN' "$ATTACH"
          test -f "$V06"
          test -f "$LEGACY"
          grep -Fq 'android:usesCleartextTraffic="false"' "$MAN"
          ! grep -R -n -F 'ClipboardManager' "$ROOT/app/src/main/java"
          ! grep -R -n -F 'ACTION_SEND' "$ROOT/app/src/main/java"
          ! grep -R -n -F 'Intent.createChooser' "$ROOT/app/src/main/java"
          ! grep -R -n -F 'addJavascriptInterface' "$ROOT/app/src/main/java"
          ! grep -R -n -E 'api\.openai\.com|Authorization: Bearer|access_token|refresh_token' "$ROOT"
          test "$(grep -c '<uses-permission' "$MAN")" -eq 1
          grep -Fq 'android.permission.INTERNET' "$MAN"
          echo 'stable v0.7 native-attachment contract prechecks OK'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p ../../ci/out/signing-tools/lib ../../ci/out/signing-tools/lib64
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../../ci/out/chatgpt-webview-stable-v07-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" ../../ci/out/signing-tools/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" ../../ci/out/signing-tools/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" ../../ci/out/signing-tools/zipalign
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" ../../ci/out/signing-tools/aapt
          LIBCPP=$(find "$ANDROID_SDK_ROOT/build-tools/35.0.0" -type f -name 'libc++.so' | head -n 1)
          test -n "$LIBCPP"
          cp "$LIBCPP" ../../ci/out/signing-tools/lib64/libc++.so

      - name: Verify unsigned package metadata
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging ci/out/chatgpt-webview-stable-v07-unsigned.apk | tee ci/out/badging.txt
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe' versionCode='7' versionName='0.7-stable-native-attachment-send'" ci/out/badging.txt
          sha256sum ci/out/chatgpt-webview-stable-v07-unsigned.apk | tee ci/out/UNSIGNED_SHA256.txt
          printf '%s\n' "$GITHUB_SHA" > ci/out/SOURCE_REF.txt

      - name: Upload release signing kit
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-stable-v07-signing-kit
          path: |
            ci/out/chatgpt-webview-stable-v07-unsigned.apk
            ci/out/UNSIGNED_SHA256.txt
            ci/out/badging.txt
            ci/out/SOURCE_REF.txt
            ci/out/signing-tools/apksigner
            ci/out/signing-tools/lib/apksigner.jar
            ci/out/signing-tools/zipalign
            ci/out/signing-tools/aapt
            ci/out/signing-tools/lib64/libc++.so
          if-no-files-found: error
          retention-days: 30
