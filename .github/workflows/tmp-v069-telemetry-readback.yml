name: Temporary v0.69 telemetry readback
on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths: ['.github/workflows/tmp-v069-telemetry-readback.yml']
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    steps:
      - name: Read sanitized collector telemetry
        shell: bash
        env:
          COLLECTOR_ID: 94663f22-b211-46ca-a1eb-eb06d56f6c50
        run: |
          set -euo pipefail
          curl -fsS "https://webhook.site/token/${COLLECTOR_ID}/requests?sorting=oldest&per_page=100" -o telemetry.json
          python3 - <<'PY'
          import json
          x=json.load(open('telemetry.json'))
          print('count', len(x.get('data', [])))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v069-telemetry-readback
          path: telemetry.json
          if-no-files-found: error
          retention-days: 1
