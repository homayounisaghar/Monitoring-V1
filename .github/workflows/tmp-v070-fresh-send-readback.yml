name: Temporary v0.70 fresh-send telemetry readback
on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths: ['.github/workflows/tmp-v070-fresh-send-readback.yml']
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    steps:
      - name: Read sanitized collector telemetry
        shell: bash
        env:
          COLLECTOR_ID: 2a2679cb-c530-46cb-87c6-291ec6b09826
        run: |
          set -euo pipefail
          curl -fsS "https://webhook.site/token/${COLLECTOR_ID}/requests?sorting=oldest&per_page=100" -o telemetry.json
          python3 - <<'PY'
          import json
          x=json.load(open('telemetry.json'))
          print('count', len(x.get('data', [])))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v070-fresh-send-telemetry-readback
          path: telemetry.json
          if-no-files-found: error
          retention-days: 1
# second readback after operator completion report
