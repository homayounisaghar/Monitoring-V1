name: Read v0.91.0 device telemetry
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/read-v0910-device-telemetry.yml'
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and summarize telemetry
        shell: bash
        run: |
          set -euo pipefail
          URL='https://webhook.site/token/4ec1ffa5-4917-448b-8c6c-9746856a74b0/requests?sorting=newest&per_page=100'
          curl -fsS -H 'Accept: application/json' "$URL" > /tmp/telemetry.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/telemetry.json'))
          rows=x.get('data',x if isinstance(x,list) else [])
          print('COUNT',len(rows))
          for r in reversed(rows):
              c=r.get('content') or r.get('request',{}).get('content') or ''
              if isinstance(c,dict): obj=c
              else:
                  try: obj=json.loads(c)
                  except Exception: obj={'raw':str(c)[:200]}
              keys=['event','phase','state','result','classification','error','error_name','receipt','semantic_temp_state','temp_state','normal_stable_hits','planner_phase','source_ref','request_id','target_ref','detail','temp_candidate_count','composer_candidate_count','stop_candidate_count','route_class','temporary_hint','state_fingerprint']
              out={k:obj.get(k) for k in keys if k in obj}
              print(r.get('created_at','?'),json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
