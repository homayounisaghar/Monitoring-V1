name: ChatGPT WebView Stable v0.73 Unified Breadth Frontier Unsigned

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-stable-v75-unified-breadth-frontier-unsigned.yml'
      - 'ci/generate_chatgpt_webview_v75_unified_breadth_frontier.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Generate v0.73 source
        run: python3 ci/generate_chatgpt_webview_v75_unified_breadth_frontier.py

      - name: Create fresh telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          CFG=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV75.java
          TOKEN=$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid");assert x;print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"
          READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(); ep,sha,cid=sys.argv[2:]
          s=re.sub(r'WEBHOOK_URL=".*?"',f'WEBHOOK_URL="{ep}"',s)
          s=re.sub(r'SOURCE_REF=".*?"',f'SOURCE_REF="{sha}"',s)
          s=re.sub(r'COLLECTOR_ID=".*?"',f'COLLECTOR_ID="{cid}"',s)
          s=s.replace('CONFIGURED=false','CONFIGURED=true')
          p.write_text(s)
          PY
          mkdir -p ci/v75-unified-breadth-telemetry
          printf '%s\n' "$TOKEN" > ci/v75-unified-breadth-telemetry/collector-id.txt
          printf '%s\n' "$READ" > ci/v75-unified-breadth-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v75-unified-breadth-telemetry/source-ref.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v75-unified-breadth-frontier-v1","scenario_id":"unified-current-ui-resource-tool-breadth-frontier","read_only":true,"control_sync":"EVENT_DRIVEN_NO_FIXED_DELAY_POLL_TIMEOUT","audit":"UNIFIED_BREADTH_FRONTIER"}\n' | curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @- >/dev/null

      - name: End-to-end breadth and inherited execution audit
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          PKG=$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe
          ACT=$PKG/OrchestratorUnifiedBreadthV75Activity.java
          MAN=$ROOT/app/src/main/AndroidManifest.xml
          GRADLE=$ROOT/app/build.gradle
          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe.diag'" "$GRADLE"
          grep -Fq 'versionCode 76' "$GRADLE"
          grep -Fq "versionName '0.73-stable-diag-unified-breadth-frontier'" "$GRADLE"
          grep -Fq 'OrchestratorUnifiedBreadthV75Activity' "$MAN"
          grep -Fq 'ControlPlaneAccessibilityServiceV51' "$MAN"
          grep -Fq '@xml/cp_accessibility_service_v51' "$MAN"
          grep -Fq 'RUN FULL BREADTH' "$ACT"
          grep -Fq 'PASS_READ_ONLY_CURRENT_UI_RESOURCE_TOOL_CENSUS' "$ACT"
          grep -Fq 'PASS_UNIFIED_BREADTH_FRONTIER_CENSUS_COMPLETE' "$ACT"
          grep -Fq 'resource_alias_group_count' "$ACT"
          grep -Fq 'resource_alias_max_occurrence' "$ACT"
          grep -Fq 'deep_research_trigger_count' "$ACT"
          grep -Fq 'apps_plugins_trigger_count' "$ACT"
          grep -Fq 'plannerFormatRepairAttempts<1' "$ACT"
          grep -Fq 'PLANNER_RESPONSE_FORMAT_REPAIR_REQUESTED' "$ACT"
          grep -Fq 'executePlannerAction(action,o);' "$ACT"
          grep -Fq 'pageFinishedEpoch==documentEpoch' "$ACT"
          test "$(grep -o '\.click();' "$ACT" | wc -l)" -eq 2
          for bad in Thread.sleep 'setTimeout(' 'setInterval(' ScheduledExecutorService TimerTask elementFromPoint document.evaluate dispatchTouchEvent 'performClick(' ACTION_SET_PROGRESS CookieManager 'getCookie(' addJavascriptInterface; do
            ! grep -Fq "$bad" "$ACT"
          done
          python3 - "$ACT" <<'PY'
          import pathlib,sys
          s=pathlib.Path(sys.argv[1]).read_text()
          a=s.index('private String breadthCensusJs()')
          b=s.index('private void clearLocal()',a)
          breadth=s[a:b]
          assert '.click();' not in breadth
          assert 'web.loadUrl(' not in breadth
          assert 'CookieManager' not in breadth
          assert 'getCookie(' not in breadth
          assert 'raw_text_remote",false' in s
          assert 'page_ui_writes_delta",0' in s
          print('PASS v0.73 breadth read-only isolation + inherited Planner execution audit')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build and prove exact artifact identity
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..
          OUT=ci/v75-unified-breadth-out
          mkdir -p "$OUT"
          UNSIGNED=runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$OUT/chatgpt-webview-v0.73-unified-breadth-frontier-exact-source-aligned-unsigned.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$ALIGNED" > "$OUT/badging.txt"
          "$BT/aapt" dump permissions "$ALIGNED" > "$OUT/permissions.txt"
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe.diag' versionCode='76' versionName='0.73-stable-diag-unified-breadth-frontier'" "$OUT/badging.txt"
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorUnifiedBreadthV75Activity'" "$OUT/badging.txt"
          test "$(grep -c '^uses-permission:' "$OUT/permissions.txt")" -eq 3
          grep -Fq "android.permission.INTERNET" "$OUT/permissions.txt"
          grep -Fq "android.permission.RECORD_AUDIO" "$OUT/permissions.txt"
          grep -Fq "android.permission.MODIFY_AUDIO_SETTINGS" "$OUT/permissions.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"
          printf '%s\n' 'READ_ONLY_BREADTH_PLUS_PROVEN_PLANNER' > "$OUT/FRONTIER_MODE.txt"
          printf '%s\n' 'EVENT_DRIVEN_NO_FIXED_DELAY_POLL_TIMEOUT' > "$OUT/CONTROL_SYNC.txt"
          printf '%s\n' 'b7aea08158252dcad79345608ce2e76e970e4cf613414db299579f46d9924c48' > "$OUT/EXPECTED_SIGNER_CERT_SHA256.txt"
          sha256sum "$ALIGNED" > "$OUT/ALIGNED_UNSIGNED_SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.73-unified-breadth-frontier-${{ github.run_id }}-unsigned
          path: ci/v75-unified-breadth-out
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.73-unified-breadth-frontier-${{ github.run_id }}-telemetry
          path: ci/v75-unified-breadth-telemetry
          if-no-files-found: error
          retention-days: 30
