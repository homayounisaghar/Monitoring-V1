name: Mouse Button Toggle Test APK

on:
  push:
    branches:
      - mouse-button-toggle-temp-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Restore persistent signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mouse-button-toggle-public-test-signing-v1

      - name: Create persistent signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          PASS='andro''id'
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass "$PASS" \
            -alias androiddebugkey \
            -keypass "$PASS" \
            -dname "CN=Mouse Button Toggle Test,O=Mouse Button Toggle,C=DE" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Build signed release APK
        run: gradle -p android/mouse-button-toggle :app:assembleRelease --stacktrace

      - name: Verify APK and capture metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='android/mouse-button-toggle/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          grep -q 'CN=Mouse Button Toggle Test' apk-signing.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 20 | tee apk-badging.txt
          grep -q "versionCode='7'" apk-badging.txt
          grep -q "versionName='1.0.6'" apk-badging.txt
          if grep -q 'application-debuggable' apk-badging.txt; then
            echo 'Release APK must not be debuggable' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > apk-manifest.txt
          grep -q 'MouseToggleTileService' apk-manifest.txt
          grep -q 'SamsungMouseAccessibilityService' apk-manifest.txt
          grep -q 'BIND_QUICK_SETTINGS_TILE' apk-manifest.txt
          grep -q 'BIND_ACCESSIBILITY_SERVICE' apk-manifest.txt
          grep -q 'android.permission.WRITE_SETTINGS' apk-manifest.txt
          if grep -q 'ShizukuProvider' apk-manifest.txt; then
            echo 'v1.0.6 must not contain ShizukuProvider' >&2
            exit 1
          fi
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" MouseButtonToggle-v1.0.6.apk

      - name: Upload verified APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: MouseButtonToggle-v1.0.6-stable-signed-release
          path: |
            MouseButtonToggle-v1.0.6.apk
            apk-signing.txt
            apk-badging.txt
            apk-manifest.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
