name: TEMP v0.46 generated source export

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-v48-source-export-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate current v0.46 source
        run: python3 ci/generate_chatgpt_webview_v48_transactional_receipt_fixed.py
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v48-generated-source-temp
          path: runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorPaidModelEffortTransactionalReceiptV48Activity.java
          if-no-files-found: error
          retention-days: 1
