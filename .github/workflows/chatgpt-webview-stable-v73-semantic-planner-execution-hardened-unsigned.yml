name: ChatGPT WebView Stable v0.71 Semantic Planner Execution Hardened Unsigned

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-stable-v73-semantic-planner-execution-hardened-unsigned.yml'
      - 'ci/generate_chatgpt_webview_v73_planner_execution_hardening.py'
      - 'ci/generate_chatgpt_webview_v73_planner_execution_hardening_final.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Generate v0.71 source
        run: python3 ci/generate_chatgpt_webview_v73_planner_execution_hardening_final.py

      - name: Create fresh telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          CFG=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV73.java
          TOKEN=$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid");assert x;print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"
          READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(); ep,sha,cid=sys.argv[2:]
          s=re.sub(r'WEBHOOK_URL=".*?"',f'WEBHOOK_URL="{ep}"',s)
          s=re.sub(r'SOURCE_REF=".*?"',f'SOURCE_REF="{sha}"',s)
          s=re.sub(r'COLLECTOR_ID=".*?"',f'COLLECTOR_ID="{cid}"',s)
          s=s.replace('CONFIGURED=false','CONFIGURED=true')
          p.write_text(s)
          PY
          mkdir -p ci/v73-planner-execution-hardened-telemetry
          printf '%s\n' "$TOKEN" > ci/v73-planner-execution-hardened-telemetry/collector-id.txt
          printf '%s\n' "$READ" > ci/v73-planner-execution-hardened-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v73-planner-execution-hardened-telemetry/source-ref.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v73-planner-core-execution-hardened-v1","scenario_id":"same-apk-semantic-planner-core-execution-hardened","blind_build_marker":"PUZZLE_UNKNOWN_AT_BUILD_TIME","control_sync":"EVENT_DRIVEN_NO_FIXED_DELAY_POLL_TIMEOUT","audit":"POST_PLAN_EXECUTION_HARDENED"}\n' | curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @- >/dev/null

      - name: End-to-end execution contract audit
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          PKG=$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe
          ACT=$PKG/OrchestratorPlannerCoreV73Activity.java
          MAN=$ROOT/app/src/main/AndroidManifest.xml
          GRADLE=$ROOT/app/build.gradle
          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe.diag'" "$GRADLE"
          grep -Fq 'versionCode 74' "$GRADLE"
          grep -Fq "versionName '0.71-stable-diag-semantic-planner-execution-hardened'" "$GRADLE"
          grep -Fq 'OrchestratorPlannerCoreV73Activity' "$MAN"
          grep -Fq 'ControlPlaneAccessibilityServiceV51' "$MAN"
          grep -Fq '@xml/cp_accessibility_service_v51' "$MAN"
          grep -Fq 'documentEpoch' "$ACT"
          grep -Fq 'pageFinishedEpoch' "$ACT"
          grep -Fq 'activeReadSerial' "$ACT"
          grep -Fq 'PLANNER_ACTION_SOURCE_NOT_PROVEN_FRESH_TEMP' "$ACT"
          grep -Fq 'PLANNER_ACTION_EXECUTION' "$ACT"
          grep -Fq 'PASS_PLANNER_ACTION_NAVIGATION_CLAIMED' "$ACT"
          grep -Fq 'PLANNER_ACTION_NAV_BUSY_UNEXPECTED' "$ACT"
          grep -Fq 'AUTO_SEND_TRANSITION_BUSY_UNEXPECTED' "$ACT"
          grep -Fq 'diagnosticRing.clear()' "$ACT"
          grep -Fq 'remoteTelemetryPosts=0' "$ACT"
          grep -Fq 'PASS_TARGET_RESPONSE_COMPLETE_BY_ACTION_RECEIPT' "$ACT"
          ! grep -Fq 'eval(readJs(),o->{\n            boolean already=path.equals' "$ACT"
          ! grep -Fq 'navigatePlannerRef(String ref,String after,String text)' "$ACT"
          ! grep -Fq '[contenteditable=true]' "$ACT"
          test "$(grep -o '\.click();' "$ACT" | wc -l)" -eq 2
          for bad in postDelayed Thread.sleep 'setTimeout(' 'setInterval(' SAMPLE_MS SEND_POLL_MS RESPONSE_TIMEOUT_MS ScheduledExecutorService TimerTask pollPlannerNormalHome pollPlannerTempReceipt pollAutoComposerReceipt pollAutoSendReceipt pollAutoResponse pollPlannerNavReceipt pollSendReceipt confirmAutoSendReceipt elementFromPoint document.evaluate dispatchTouchEvent 'performClick(' ACTION_SET_PROGRESS CookieManager 'getCookie(' addJavascriptInterface; do
            ! grep -Fq "$bad" "$ACT"
          done
          python3 - "$ACT" <<'PY'
          import pathlib,sys
          s=pathlib.Path(sys.argv[1]).read_text()
          assert 'executePlannerAction(action,o);' in s
          assert 'private void navigatePlannerRef(String ref,String after,String text,JSONObject sourceState)' in s
          assert 'pageFinishedReady&&pageFinishedEpoch==documentEpoch' in s
          assert 'if(serial!=activeReadSerial||epoch!=documentEpoch)return;' in s
          assert 'plannerPhase="WAIT_PLANNER_NAV_RECEIPT";web.loadUrl("https://chatgpt.com"+path);plannerActionInFlight=false;' in s
          assert 'if(!recordPlannerObservation(o,"TARGET_RESPONSE_COMPLETE"))' in s
          print('PASS v0.71 execution-family static audit')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build and prove exact artifact identity
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..
          OUT=ci/v73-planner-execution-hardened-out
          mkdir -p "$OUT"
          UNSIGNED=runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$OUT/chatgpt-webview-v0.71-semantic-planner-execution-hardened-exact-source-aligned-unsigned.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$ALIGNED" > "$OUT/badging.txt"
          "$BT/aapt" dump permissions "$ALIGNED" > "$OUT/permissions.txt"
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe.diag' versionCode='74' versionName='0.71-stable-diag-semantic-planner-execution-hardened'" "$OUT/badging.txt"
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorPlannerCoreV73Activity'" "$OUT/badging.txt"
          test "$(grep -c '^uses-permission:' "$OUT/permissions.txt")" -eq 3
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"
          printf '%s\n' 'PUZZLE_UNKNOWN_AT_BUILD_TIME' > "$OUT/BLIND_BUILD_MARKER.txt"
          printf '%s\n' 'EVENT_DRIVEN_NO_FIXED_DELAY_POLL_TIMEOUT' > "$OUT/CONTROL_SYNC.txt"
          sha256sum "$ALIGNED" > "$OUT/ALIGNED_UNSIGNED_SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.71-semantic-planner-execution-hardened-${{ github.run_id }}-unsigned
          path: ci/v73-planner-execution-hardened-out
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.71-semantic-planner-execution-hardened-${{ github.run_id }}-telemetry
          path: ci/v73-planner-execution-hardened-telemetry
          if-no-files-found: error
          retention-days: 30
