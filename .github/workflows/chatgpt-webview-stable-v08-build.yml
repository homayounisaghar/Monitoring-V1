name: ChatGPT WebView Stable v0.8 Direct Attachment Release Kit

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/chatgpt-webview-stable-v08-build.yml'
      - 'runtime_probes/chatgpt-webview-stable-probe/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare v0.8 metadata and contract prechecks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          ACT="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/DirectAttachmentActivity.java"
          GRADLE="$ROOT/app/build.gradle"
          MAN="$ROOT/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('runtime_probes/chatgpt-webview-stable-probe/app/build.gradle')
          s = p.read_text()
          s = re.sub(r'versionCode\s+\d+', 'versionCode 8', s)
          s = re.sub(r"versionName\s+'[^']+'", "versionName '0.8-stable-direct-native-attachment'", s)
          p.write_text(s)
          PY

          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe'" "$GRADLE"
          grep -Fq 'versionCode 8' "$GRADLE"
          grep -Fq "versionName '0.8-stable-direct-native-attachment'" "$GRADLE"
          grep -Fq 'DirectAttachmentActivity' "$MAN"
          grep -Fq 'android:name=".AttachmentSendActivity" android:exported="false"' "$MAN"
          grep -Fq 'Intent.ACTION_OPEN_DOCUMENT' "$ACT"
          grep -Fq 'DIRECT_NATIVE_PICKER' "$ACT"
          grep -Fq 'input[type=\\\"file\\\"]' "$ACT"
          grep -Fq 'new DataTransfer()' "$ACT"
          grep -Fq 'new File(chunks' "$ACT"
          grep -Fq 'Base64.encodeToString' "$ACT"
          grep -Fq 'CHUNK_BYTES' "$ACT"
          grep -Fq 'MAX_DIRECT_BYTES' "$ACT"
          grep -Fq 'BLOCKED_NO_FILE_INPUT' "$ACT"
          grep -Fq 'DIRECT_ATTACH_DOM_CONFIRMED' "$ACT"
          grep -Fq 'DRAFT_STATUS=' "$ACT"
          grep -Fq 'SEND ATTACH ONCE' "$ACT"
          grep -Fq 'putString("state", "DISPATCHED")' "$ACT"
          grep -Fq 'DIRECT_ATTACH_SEND_SINGLE_CLICK_DISPATCHED' "$ACT"
          grep -Fq 'UNCERTAIN' "$ACT"
          grep -Fq 'FILE_NAMES_OR_URIS_RETAINED=false' "$ACT"
          grep -Fq 'RAW_DRAFT_OR_MESSAGE_TEXT_RETAINED=false' "$ACT"
          grep -Fq 'SANITIZED; NO QUERY/FRAGMENT' "$ACT"
          ! grep -R -n -F 'addJavascriptInterface' "$ROOT/app/src/main/java"
          ! grep -R -n -E 'api\.openai\.com|Authorization: Bearer|access_token|refresh_token' "$ROOT"
          test "$(grep -c '<uses-permission' "$MAN")" -eq 1
          grep -Fq 'android.permission.INTERNET' "$MAN"
          echo 'stable v0.8 direct-attachment contract prechecks OK'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p ../../ci/out/signing-tools/lib ../../ci/out/signing-tools/lib64
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../../ci/out/chatgpt-webview-stable-v08-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" ../../ci/out/signing-tools/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" ../../ci/out/signing-tools/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" ../../ci/out/signing-tools/zipalign
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" ../../ci/out/signing-tools/aapt
          LIBCPP=$(find "$ANDROID_SDK_ROOT/build-tools/35.0.0" -type f -name 'libc++.so' | head -n 1)
          test -n "$LIBCPP"
          cp "$LIBCPP" ../../ci/out/signing-tools/lib64/libc++.so

      - name: Verify unsigned package metadata
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging ci/out/chatgpt-webview-stable-v08-unsigned.apk | tee ci/out/badging.txt
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe' versionCode='8' versionName='0.8-stable-direct-native-attachment'" ci/out/badging.txt
          sha256sum ci/out/chatgpt-webview-stable-v08-unsigned.apk | tee ci/out/UNSIGNED_SHA256.txt
          printf '%s\n' "$GITHUB_SHA" > ci/out/SOURCE_REF.txt

      - name: Upload release signing kit
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-stable-v08-signing-kit
          path: |
            ci/out/chatgpt-webview-stable-v08-unsigned.apk
            ci/out/UNSIGNED_SHA256.txt
            ci/out/badging.txt
            ci/out/SOURCE_REF.txt
            ci/out/signing-tools/apksigner
            ci/out/signing-tools/lib/apksigner.jar
            ci/out/signing-tools/zipalign
            ci/out/signing-tools/aapt
            ci/out/signing-tools/lib64/libc++.so
          if-no-files-found: error
          retention-days: 30
