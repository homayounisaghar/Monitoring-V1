name: ChatGPT WebView Stable v0.52 Autonomous Effort Model Roundtrip Unsigned

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-stable-v54-autonomous-effort-model-roundtrip-unsigned.yml'
      - 'ci/generate_chatgpt_webview_v54_autonomous_effort_model_roundtrip.py'
      - 'ci/v54_combined/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Generate v0.52 source
        run: python3 ci/generate_chatgpt_webview_v54_autonomous_effort_model_roundtrip.py

      - name: Create fresh telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          CFG=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV54.java
          TOKEN=$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid");assert x;print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"
          READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(); ep,sha,cid=sys.argv[2:]
          s=re.sub(r'WEBHOOK_URL=".*?"',f'WEBHOOK_URL="{ep}"',s)
          s=re.sub(r'SOURCE_REF=".*?"',f'SOURCE_REF="{sha}"',s)
          s=re.sub(r'COLLECTOR_ID=".*?"',f'COLLECTOR_ID="{cid}"',s)
          s=s.replace('CONFIGURED=false','CONFIGURED=true')
          p.write_text(s)
          PY
          mkdir -p ci/v54-combined-telemetry
          printf '%s\n' "$TOKEN" > ci/v54-combined-telemetry/collector-id.txt
          printf '%s\n' "$READ" > ci/v54-combined-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v54-combined-telemetry/source-ref.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v54-paid-current-ui-effort-model-bridge-roundtrip-v1","scenario_id":"paid-current-ui-effort-model-bridge-roundtrip","source_ref":"%s"}\n' "$GITHUB_SHA" | curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @- >/dev/null

      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          PKG=$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe
          ACT=$PKG/OrchestratorPaidCurrentUiEffortModelBridgeRoundtripV54Activity.java
          SVC=$PKG/ControlPlaneAccessibilityServiceV50.java
          MAN=$ROOT/app/src/main/AndroidManifest.xml
          GRADLE=$ROOT/app/build.gradle

          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe.diag'" "$GRADLE"
          grep -Fq 'versionCode 55' "$GRADLE"
          grep -Fq "versionName '0.52-stable-diag-autonomous-effort-model-roundtrip'" "$GRADLE"
          grep -Fq 'OrchestratorPaidCurrentUiEffortModelBridgeRoundtripV54Activity' "$MAN"

          # Accessibility authorization continuity must remain on the existing V51 component.
          grep -Fq 'ControlPlaneAccessibilityServiceV51' "$MAN"
          grep -Fq '@xml/cp_accessibility_service_v51' "$MAN"
          ! grep -Fq 'ControlPlaneAccessibilityServiceV52' "$MAN"
          ! grep -Fq 'ControlPlaneAccessibilityServiceV53' "$MAN"
          ! grep -Fq 'ControlPlaneAccessibilityServiceV54' "$MAN"

          # Combined proof contract.
          grep -Fq 'RUN AUTONOMOUS EFFORT + MODEL ROUNDTRIP' "$ACT"
          grep -Fq 'PASS_AUTONOMOUS_EFFORT_0_1_2_3_AND_MODEL_ROUNDTRIP_RESTORED' "$ACT"
          grep -Fq 'PASS_INSTANT_MEDIUM_HIGH_EXTRA_HIGH_PRO_BLOCKED_AND_MEDIUM_RESTORED' "$ACT"
          grep -Fq 'EFFORT_SEM50 = {"INSTANT","MEDIUM","HIGH","EXTRA_HIGH","HIGH","MEDIUM"}' "$ACT"
          grep -Fq 'if (!effortGatePass49)' "$ACT"
          grep -Fq 'prepareModelBridge54' "$ACT"
          grep -Fq 'MODEL_TARGET_CLAIM' "$ACT"
          grep -Fq 'MODEL_RESTORE_CLAIM' "$ACT"
          grep -Fq 'MODEL_RESTORED_CONFIRMED' "$ACT"
          grep -Fq 'captureEffortUpperBridgeCandidate' "$ACT"
          grep -Fq 'captureModelNavigationCandidate' "$ACT"
          grep -Fq 'clickModelOption' "$ACT"
          grep -Fq 'captureEffortUpperBridgeCandidate' "$SVC"
          grep -Fq 'clickEffortUpperBridgeCandidate' "$SVC"
          grep -Fq 'captureModelNavigationCandidate' "$SVC"
          grep -Fq 'clickModelNavigationCandidate' "$SVC"

          # Pro/value4 is observation-only and has no authorized effort write step.
          grep -Fq 'Pro is blocked' "$ACT"
          grep -Fq 'pro_write_attempted' "$ACT"
          ! grep -Fq 'EFFORT_EXPECT50 = {0,1,2,3,4' "$ACT"

          # No geometry/XPath/direct ARIA value mutation.
          ! grep -Fq 'elementFromPoint' "$ACT"
          ! grep -Fq 'document.evaluate' "$ACT"
          ! grep -Fq 'setAttribute("aria-value' "$ACT"

          test "$(grep -c '<uses-permission' "$MAN")" -eq 3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build and verify aligned unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..
          OUT=ci/v54-combined-out
          mkdir -p "$OUT"
          UNSIGNED=runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$OUT/chatgpt-webview-v0.52-autonomous-effort-model-roundtrip-stable-diag-aligned-unsigned.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$ALIGNED" > "$OUT/badging.txt"
          "$BT/aapt" dump permissions "$ALIGNED" > "$OUT/permissions.txt"
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe.diag' versionCode='55' versionName='0.52-stable-diag-autonomous-effort-model-roundtrip'" "$OUT/badging.txt"
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorPaidCurrentUiEffortModelBridgeRoundtripV54Activity'" "$OUT/badging.txt"
          test "$(grep -c '^uses-permission:' "$OUT/permissions.txt")" -eq 3
          sha256sum "$ALIGNED" > "$OUT/ALIGNED_UNSIGNED_SHA256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.52-autonomous-effort-model-roundtrip-stable-diag-unsigned
          path: ci/v54-combined-out
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.52-autonomous-effort-model-roundtrip-stable-diag-telemetry
          path: ci/v54-combined-telemetry
          if-no-files-found: error
          retention-days: 30
