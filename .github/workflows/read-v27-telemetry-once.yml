name: Read Stable v0.27 Telemetry Once

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/read-v27-telemetry-once.yml'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and sanitize v0.27 correlated telemetry
        env:
          READ_URL: https://webhook.site/token/9c9162c0-1826-4f61-a47c-eb621549e421/requests?sorting=oldest
        run: |
          python - <<'PY'
          import json, os, urllib.request
          SOURCE='ca31a80d93a347f09cbc56aab080ce223b3ba6b3'
          schemas={'cp-v27-speech-cue-v1','cp-v26-ready-start-gate-v1','cp-autonomous-runtime-v2','cp-v24-script-diagnostic-v1'}
          req=urllib.request.Request(os.environ['READ_URL'],headers={'Accept':'application/json','User-Agent':'cp27-correlated-readback'})
          with urllib.request.urlopen(req,timeout=20) as r: root=json.load(r)
          rows=root.get('data',root if isinstance(root,list) else [])
          parsed=[]
          for row in rows:
            raw=row.get('content','') if isinstance(row,dict) else ''
            try: p=json.loads(raw)
            except: continue
            if p.get('schema_version') not in schemas: continue
            if p.get('source_ref')!=SOURCE: continue
            parsed.append(p)
          # latest real-device parent test id by timestamp among runtime rows
          runtime=[p for p in parsed if p.get('schema_version')=='cp-autonomous-runtime-v2' and str(p.get('test_id','')).startswith('cp23-')]
          runtime.sort(key=lambda p:p.get('timestamp_epoch_ms',0))
          latest=runtime[-1].get('test_id') if runtime else None
          print('LATEST_TEST',latest)
          allow={
            'session_state','mic_lease','mic_lease_mode','composer_len','composer_hash','user_turn_count','assistant_turn_count','snapshot_ok','snap_ok','dictation_count','voice_count',
            'last_action','last_action_status','parent_last_action','parent_last_status','wrapper_last_status','adapter_action','adapter_status','adapter_matches','adapter_clicked','adapter_submit_count','adapter_cancel_count','adapter_ready_count','adapter_user_turns',
            'matches','enabled','aria_label','root_found','prompt_visible','root_tag','reason','consecutive_exact_ready','dom_clicked_by_v26','dispatch_basis',
            'click','lifecycle','cancel_classification','stop_classification','transcript_classification','send_classification','no_message_side_effect','draft_unchanged',
            'speak_window_ms','transcript_len','transcript_hash','requires_empty_composer','preflight','final_classification','recovered',
            'user_turn_advanced','composer_cleared','v18_receipt_confirmed','v18_status_class','send_replayed','receipt_basis',
            'script_class','language_hint','arabic_persian_letters','latin_letters','persian_markers','arabic_markers','total_letters','text_length','raw_text_returned','raw_text_uploaded',
            'assistant_baseline_count','assistant_baseline_len','assistant_count','assistant_len','baseline_count','baseline_len','assistant_baseline_script_class',
            'visual_status_banner','visual_button_banner','haptic_result','accessibility_announce_attempted','media_tone_attempted','media_stream','notification_stream_dependency_removed','user_volume_changed','speech_window_ms','cue_visible_ms','next_parent_phase',
            'raw_audio_uploaded','raw_speech_uploaded','raw_transcript_uploaded','raw_chat_text_uploaded'
          }
          def scrub(v,depth=0):
            if depth>4: return None
            if isinstance(v,dict): return {k:scrub(x,depth+1) for k,x in v.items() if k in allow}
            if isinstance(v,list): return [scrub(x,depth+1) for x in v[:20]]
            return v
          out=[]
          for p in parsed:
            tid=p.get('test_id')
            # v26 run gate may have its own cp26 id before parent test id; keep it.
            if latest and str(tid).startswith('cp23-') and tid!=latest: continue
            q={k:p.get(k) for k in ['kind','schema_version','scenario_id','test_id','seq','phase','classification','app_version','source_ref','elapsed_ms','timestamp_epoch_ms'] if k in p}
            q['state']=scrub(p.get('state') if isinstance(p.get('state'),dict) else {})
            out.append(q)
          out.sort(key=lambda p:(p.get('timestamp_epoch_ms',0), p.get('schema_version',''), p.get('seq',0)))
          print('MATCHING',len(out))
          for x in out: print('ROW',json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(',',':')))
          PY
