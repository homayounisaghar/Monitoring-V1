name: Temporary v0.62 Conversation Runtime Tail

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/tmp-v062-conversation-runtime-tail.yml'

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read sanitized v0.62 telemetry tail
        shell: bash
        run: |
          set -euo pipefail
          URL='https://webhook.site/token/7bdac925-6ce3-4e13-a5a4-a0b0cc90053f/requests?sorting=newest&per_page=50'
          curl -fsS "$URL" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d,ensure_ascii=False,indent=2))'
