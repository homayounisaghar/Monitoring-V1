name: TEMP v0.52 generated source export

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-v54-source-export-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate current v0.52 source
        run: python3 ci/generate_chatgpt_webview_v54_autonomous_effort_model_roundtrip.py
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v54-generated-source-temp
          path: |
            runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorPaidCurrentUiEffortModelBridgeRoundtripV54Activity.java
            runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/ControlPlaneAccessibilityServiceV50.java
            runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/ControlPlaneAccessibilityServiceV51.java
            runtime_probes/chatgpt-webview-stable-probe/app/src/main/AndroidManifest.xml
            runtime_probes/chatgpt-webview-stable-probe/app/build.gradle
          if-no-files-found: error
          retention-days: 1

