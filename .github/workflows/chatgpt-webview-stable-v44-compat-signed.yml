name: ChatGPT WebView Stable v0.42.1 Compatibility Sidecar Signed

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/chatgpt-webview-stable-v44-compat-signed.yml'
      - 'ci/generate_chatgpt_webview_v44_compat.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Generate v0.42.1 compatibility source
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/generate_chatgpt_webview_v44_compat.py

      - name: Create fresh telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          CFG=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV44.java
          TOKEN=$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid");assert x;print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"
          READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(); ep,sha,cid=sys.argv[2:]
          s=re.sub(r'WEBHOOK_URL=".*?"',f'WEBHOOK_URL="{ep}"',s)
          s=re.sub(r'SOURCE_REF=".*?"',f'SOURCE_REF="{sha}"',s)
          s=re.sub(r'COLLECTOR_ID=".*?"',f'COLLECTOR_ID="{cid}"',s)
          s=s.replace('CONFIGURED=false','CONFIGURED=true')
          p.write_text(s)
          PY
          mkdir -p ci/v44-compat-telemetry
          printf '%s\n' "$TOKEN" > ci/v44-compat-telemetry/collector-id.txt
          printf '%s\n' "$READ" > ci/v44-compat-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v44-compat-telemetry/source-ref.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v44-paid-model-effort-aria-controls-target-census-v1","scenario_id":"paid-model-effort-aria-controls-target-census","source_ref":"%s"}\n' "$GITHUB_SHA" | curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @- >/dev/null

      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          SRC="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorPaidModelEffortAriaControlsCensusV44Activity.java"
          GRADLE="$ROOT/app/build.gradle"
          MAN="$ROOT/app/src/main/AndroidManifest.xml"
          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe.v44compat'" "$GRADLE"
          grep -Fq 'minSdk 23' "$GRADLE"
          grep -Fq 'versionCode 46' "$GRADLE"
          grep -Fq "versionName '0.42.1-compat-paid-model-effort-aria-controls-target-census'" "$GRADLE"
          grep -Fq 'NEGATIVE_ARIA_CONTROLS_TARGET_RESOLVED_NO_LIGHT_HEAVY' "$SRC"
          grep -Fq 'PASS_ARIA_CONTROLS_TARGET_EXPOSES_LIGHT_HEAVY' "$SRC"
          test "$(grep -c '<uses-permission' "$MAN")" -eq 3
          python3 - "$SRC" <<'PY'
          from pathlib import Path
          import re,sys
          s=Path(sys.argv[1]).read_text()
          body=re.sub(r'/\*.*?\*/','',s,flags=re.S)
          body=re.sub(r'//.*','',body)
          assert '.click()' not in body
          assert 'elementFromPoint' not in body
          assert body.count("new PointerEvent('pointerdown'") == 1
          assert 'secondary_ui_dispatches",0' in body
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build, compatibility-sign, and verify APK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..
          OUT=ci/v44-compat-out
          mkdir -p "$OUT"
          UNSIGNED=runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$OUT/chatgpt-webview-v0.42.1-compat-aria-controls-target-census-aligned.apk"
          SIGNED="$OUT/chatgpt-webview-v0.42.1-compat-aria-controls-target-census-signed.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          PASS=$(openssl rand -hex 24)
          KEYSTORE="$RUNNER_TEMP/v44compat-signing.jks"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" -alias v44compat -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=ChatGPT WebView V44 Compatibility Diagnostic,OU=Personal Android Signing,O=Homayoun,C=DE'
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-key-alias v44compat --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$SIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$SIGNED" > "$OUT/zipalign-verify.txt"
          "$BT/apksigner" verify --verbose --print-certs --min-sdk-version 23 "$SIGNED" > "$OUT/apksigner-verify.txt"
          "$BT/aapt" dump badging "$SIGNED" > "$OUT/badging.txt"
          "$BT/aapt" dump permissions "$SIGNED" > "$OUT/permissions.txt"
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe.v44compat' versionCode='46' versionName='0.42.1-compat-paid-model-effort-aria-controls-target-census'" "$OUT/badging.txt"
          grep -Fq "sdkVersion:'23'" "$OUT/badging.txt"
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorPaidModelEffortAriaControlsCensusV44Activity'" "$OUT/badging.txt"
          grep -Fq 'Verified using v1 scheme (JAR signing): true' "$OUT/apksigner-verify.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$OUT/apksigner-verify.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$OUT/apksigner-verify.txt"
          test "$(grep -c '^uses-permission:' "$OUT/permissions.txt")" -eq 3
          sha256sum "$SIGNED" > "$OUT/SIGNED_SHA256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"
          rm -f "$KEYSTORE"

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.42.1-compat-aria-controls-target-census-signed
          path: ci/v44-compat-out
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.42.1-compat-aria-controls-target-census-telemetry
          path: ci/v44-compat-telemetry
          if-no-files-found: error
          retention-days: 30
