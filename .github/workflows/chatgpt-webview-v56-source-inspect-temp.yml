name: TEMP inspect generated v0.54 post-write source

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-v56-source-inspect-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate source and print bounded post-write excerpts
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/generate_chatgpt_webview_v56_model_dom_click_roundtrip.py
          ACT=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorPaidCurrentUiModelDomClickRoundtripV56Activity.java
          python3 - "$ACT" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          lines=p.read_text().splitlines()
          needles=[
            'clickModelOption', 'captureModelMenu', 'MODEL_DOM_BRIDGE_CLOSED_MEDIUM_UNRESOLVED',
            'modelTargetReceipt', 'modelRestoreReceipt', 'targetReceipt', 'restoreReceipt',
            'restore', 'CLOSED_MEDIUM', 'modelOptionClicks'
          ]
          hits=[]
          for i,line in enumerate(lines):
              if any(n in line for n in needles):
                  hits.append(i)
          ranges=[]
          for i in hits:
              a=max(0,i-28); b=min(len(lines),i+55)
              if ranges and a <= ranges[-1][1]+5:
                  ranges[-1]=(ranges[-1][0], max(ranges[-1][1],b))
              else:
                  ranges.append((a,b))
          for a,b in ranges:
              print(f'--- SOURCE LINES {a+1}-{b} ---')
              for j in range(a,b):
                  print(f'{j+1:05d}: {lines[j]}')
          PY
