name: Android A2 Toolchain Bootstrap

on:
  push:
    branches:
      - ci/android-toolchain-bootstrap-a2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hydrate-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Hydrate exact source-agnostic Android dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

          B=/tmp/cf-android-bootstrap
          rm -rf "$B"
          mkdir -p "$B/app/src/main/java/bootstrap/generic" "$B/app/src/main" "$B/app/src/test/java/bootstrap/generic" "$B/app/src/androidTest/java/bootstrap/generic"
          cat > "$B/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "CfAndroidBootstrap"
          include(":app")
          EOF
          cat > "$B/build.gradle.kts" <<'EOF'
          plugins { id("com.android.application") version "8.8.2" apply false }
          EOF
          cat > "$B/gradle.properties" <<'EOF'
          android.useAndroidX=true
          EOF
          cat > "$B/app/build.gradle.kts" <<'EOF'
          plugins { id("com.android.application") }
          android {
            namespace = "bootstrap.generic"
            compileSdk = 35
            defaultConfig {
              applicationId = "bootstrap.generic"
              minSdk = 26
              targetSdk = 35
              versionCode = 1
              versionName = "1"
              testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
            }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          dependencies {
            implementation("com.fasterxml.jackson.core:jackson-core:2.21.5")
            testImplementation("junit:junit:4.13.2")
            testImplementation("org.json:json:20240303")
            androidTestImplementation("androidx.test:runner:1.7.0")
            androidTestImplementation("androidx.test.ext:junit:1.3.0")
          }
          EOF
          cat > "$B/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > "$B/app/src/main/java/bootstrap/generic/MainActivity.java" <<'EOF'
          package bootstrap.generic; public final class MainActivity extends android.app.Activity { }
          EOF
          cat > "$B/app/src/test/java/bootstrap/generic/SmokeTest.java" <<'EOF'
          package bootstrap.generic; public final class SmokeTest { @org.junit.Test public void ok(){ org.junit.Assert.assertTrue(true); } }
          EOF
          cat > "$B/app/src/androidTest/java/bootstrap/generic/DeviceSmoke.java" <<'EOF'
          package bootstrap.generic; @org.junit.runner.RunWith(androidx.test.ext.junit.runners.AndroidJUnit4.class) public final class DeviceSmoke { @org.junit.Test public void ok(){ org.junit.Assert.assertTrue(true); } }
          EOF
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$B/local.properties"
          cd "$B"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Package offline toolchain bundle
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cf-a2-toolchain"
          ROOT="$OUT/root"
          rm -rf "$OUT"
          mkdir -p "$ROOT/android-sdk/platforms" "$ROOT/android-sdk/build-tools" "$ROOT/android-sdk/platform-tools" "$ROOT/android-sdk/licenses" "$ROOT/gradle"

          cp -a "$ANDROID_SDK_ROOT/platforms/android-35" "$ROOT/android-sdk/platforms/"
          cp -a "$ANDROID_SDK_ROOT/build-tools/35.0.0" "$ROOT/android-sdk/build-tools/"
          cp -a "$ANDROID_SDK_ROOT/platform-tools/." "$ROOT/android-sdk/platform-tools/"
          if [ -d "$ANDROID_SDK_ROOT/licenses" ]; then cp -a "$ANDROID_SDK_ROOT/licenses/." "$ROOT/android-sdk/licenses/"; fi

          GRADLE_BIN=$(command -v gradle)
          GRADLE_REAL=$(readlink -f "$GRADLE_BIN")
          GRADLE_HOME=$(cd "$(dirname "$GRADLE_REAL")/.." && pwd)
          cp -a "$GRADLE_HOME" "$ROOT/gradle/gradle-8.10.2"

          mkdir -p "$ROOT/gradle-user-home"
          cp -a "$HOME/.gradle/caches" "$ROOT/gradle-user-home/"
          if [ -d "$HOME/.gradle/native" ]; then cp -a "$HOME/.gradle/native" "$ROOT/gradle-user-home/"; fi
          find "$ROOT/gradle-user-home" -type f \( -name '*.lock' -o -name 'gc.properties' \) -delete || true

          cat > "$ROOT/TOOLCHAIN_MANIFEST.txt" <<EOF
          schema=capability-fabric.android-a2-toolchain.v1
          java=17
          gradle=8.10.2
          agp=8.8.2
          compileSdk=35
          buildTools=35.0.0
          jackson-core=2.21.5
          junit=4.13.2
          org.json=20240303
          androidx.test.runner=1.7.0
          androidx.test.ext.junit=1.3.0
          contains_private_source=false
          contains_signing_secrets=false
          EOF

          cd "$ROOT"
          tar -I 'zstd -T0 -10' -cf "$OUT/android-a2-toolchain.tar.zst" .
          sha256sum "$OUT/android-a2-toolchain.tar.zst" > "$OUT/android-a2-toolchain.tar.zst.sha256"
          du -h "$OUT/android-a2-toolchain.tar.zst"

      - name: Upload source-agnostic toolchain
        uses: actions/upload-artifact@v4
        with:
          name: android-a2-toolchain-agp8.8.2-sdk35
          path: |
            ${{ runner.temp }}/cf-a2-toolchain/android-a2-toolchain.tar.zst
            ${{ runner.temp }}/cf-a2-toolchain/android-a2-toolchain.tar.zst.sha256
          if-no-files-found: error
          retention-days: 2
