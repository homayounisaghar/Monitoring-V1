name: Apply Capability Lab v0.8 Window Semantics UI

on:
  push:
    branches:
      - build/pebble-chat-bridge-v019
    paths:
      - '.github/workflows/apply-capability-lab-v08.yml'
      - 'build_tools/apply_capability_lab_v08_window_semantics_ui.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.8 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 build_tools/apply_capability_lab_v08_window_semantics_ui.py
          git diff --check
          grep -Fq "versionCode 8" runtime_probes/native-capability-lab/app/build.gradle
          grep -Fq "conversation_search_binding_v3_window_semantics" runtime_probes/native-capability-lab/plans/default.json
          grep -Fq "GLOBAL_SEARCH_ENTRY_CONTROL_CENSUS" runtime_probes/native-capability-lab/app/src/main/java/com/openai/controlplane/capabilitylab/LabAccessibilityService.java
          grep -Fq "READY TO RUN — press the BLUE RUN button" runtime_probes/native-capability-lab/app/src/main/java/com/openai/controlplane/capabilitylab/MainActivity.java

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime_probes/native-capability-lab
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "Expand Capability Lab Search across windows and color UI"
          git push origin HEAD:build/pebble-chat-bridge-v019
