name: TEMP ChatGPT WebView v0.52 generic telemetry readback

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-v54-readback-generic-temp.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.52 telemetry metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/meta
          gh run download 33970631498 -R homayounisaghar/Monitoring-V1 -n chatgpt-webview-v0.52-autonomous-effort-model-roundtrip-stable-diag-telemetry -D /tmp/meta
          test -s /tmp/meta/read-url.txt
      - name: Read collector
        shell: bash
        run: |
          set -euo pipefail
          URL=$(cat /tmp/meta/read-url.txt)
          curl -fsSL "$URL" -o /tmp/readback.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/readback.json'))
          data=d.get('data', d if isinstance(d,list) else [])
          print('COUNT',len(data))
          for i,r in enumerate(data):
              content=r.get('content') or r.get('request',{}).get('content') or ''
              print(f'--- REQUEST {i} ---')
              print(content)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.52-readback-temp
          path: /tmp/readback.json
          if-no-files-found: error
          retention-days: 1
