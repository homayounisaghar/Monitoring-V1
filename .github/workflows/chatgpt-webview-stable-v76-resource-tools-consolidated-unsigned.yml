name: ChatGPT WebView Stable v0.74 Resource Tools Consolidated Unsigned

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-stable-v76-resource-tools-consolidated-unsigned.yml'
      - 'ci/generate_chatgpt_webview_v76_resource_tools_consolidated.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Generate v0.74 source
        run: python3 ci/generate_chatgpt_webview_v76_resource_tools_consolidated.py

      - name: Create fresh telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          CFG=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV76.java
          TOKEN=$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid");assert x;print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"
          READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(); ep,sha,cid=sys.argv[2:]
          s=re.sub(r'WEBHOOK_URL=".*?"',f'WEBHOOK_URL="{ep}"',s)
          s=re.sub(r'SOURCE_REF=".*?"',f'SOURCE_REF="{sha}"',s)
          s=re.sub(r'COLLECTOR_ID=".*?"',f'COLLECTOR_ID="{cid}"',s)
          s=s.replace('CONFIGURED=false','CONFIGURED=true')
          p.write_text(s)
          PY
          mkdir -p ci/v76-resource-tools-telemetry
          printf '%s\n' "$TOKEN" > ci/v76-resource-tools-telemetry/collector-id.txt
          printf '%s\n' "$READ" > ci/v76-resource-tools-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v76-resource-tools-telemetry/source-ref.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v76-resource-tools-consolidated-v1","scenario_id":"resource-resolver-tools-consolidated","control_sync":"EVENT_DRIVEN_NO_FIXED_DELAY_POLL_TIMEOUT","audit":"RESOURCE_RESOLVER_TOOLS_CONSOLIDATED"}\n' | curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @- >/dev/null

      - name: End-to-end resource tools and inherited execution audit
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          PKG=$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe
          ACT=$PKG/OrchestratorResourceToolsV76Activity.java
          MAN=$ROOT/app/src/main/AndroidManifest.xml
          GRADLE=$ROOT/app/build.gradle

          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe.diag'" "$GRADLE"
          grep -Fq 'versionCode 77' "$GRADLE"
          grep -Fq "versionName '0.74-stable-diag-resource-tools-consolidated'" "$GRADLE"
          grep -Fq 'OrchestratorResourceToolsV76Activity' "$MAN"
          grep -Fq 'ControlPlaneAccessibilityServiceV51' "$MAN"
          grep -Fq '@xml/cp_accessibility_service_v51' "$MAN"

          for required in \
            'RESOURCE TEST' 'TEST ACTION' 'TOOLS TEST' \
            'PASS_RESOURCE_RESOLVER_V2_CENSUS_COMPLETE' \
            'owned_direct_count' 'owned_correlated_count' 'unowned_candidate_count' 'ambiguous_owner_count' \
            'alias_resource_count' 'alias_locator_max' 'data-cp-resource-locator-v76' \
            'RESOURCE_ACTION_BLOCKED_STALE_EPOCH' 'CLAIMED_BEFORE_RESOURCE_ACTION' \
            'PASS_RESOURCE_DOWNLOAD_CALLBACK_RECEIPT' 'PASS_RESOURCE_EXTERNAL_OPEN_INTENT_DISPATCHED' \
            'PASS_TOOLS_HIDDEN_MENU_MATERIALIZED_AND_ENUMERATED' 'PASS_TOOLS_MENU_RESTORED_CLOSED' \
            'PASS_TOOLS_HIDDEN_MENU_CENSUS_COMPLETE' 'WAIT_MENU_RECEIPT' 'WAIT_CLOSE_RECEIPT' \
            'plannerFormatRepairAttempts<1' 'PLANNER_RESPONSE_FORMAT_REPAIR_REQUESTED' \
            'executePlannerAction(action,o);' 'pageFinishedEpoch==documentEpoch' \
            'PLANNER_ACTION_SOURCE_NOT_PROVEN_FRESH_TEMP' 'TelemetryConfigV76'; do
            grep -Fq "$required" "$ACT"
          done

          test "$(grep -o '\.click();' "$ACT" | wc -l)" -eq 5
          for bad in Thread.sleep 'setTimeout(' 'setInterval(' ScheduledExecutorService TimerTask elementFromPoint document.evaluate dispatchTouchEvent 'performClick(' ACTION_SET_PROGRESS CookieManager 'getCookie(' addJavascriptInterface XPathResult; do
            ! grep -Fq "$bad" "$ACT"
          done

          python3 - "$ACT" <<'PY'
          import pathlib,sys
          s=pathlib.Path(sys.argv[1]).read_text()
          # New actions remain semantically bounded and event/state driven.
          assert 'document.querySelectorAll(\'a[href],[role=link],[download]\')' in s
          assert 'compareDocumentPosition' in s
          assert 'getBoundingClientRect' in s  # visibility only; never selection/ownership by coordinates
          assert 'elementFromPoint' not in s
          assert 'document.evaluate' not in s
          assert 'setTimeout(' not in s and 'setInterval(' not in s
          assert 'requestEventRead("TOOLS_TRIGGER_CLICK")' in s
          assert 'requestEventRead("TOOLS_CLOSE_CLICK")' in s
          assert 'raw_url_remote",false' in s
          assert 'raw_text_remote",false' in s
          assert 'resourceScanDocumentEpoch!=documentEpoch' in s
          assert 'resourceSelectedLocatorCount!=1' in s
          print('PASS v0.74 consolidated static audit')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build and prove exact artifact identity
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..

          OUT=ci/v76-resource-tools-out
          mkdir -p "$OUT"
          UNSIGNED=runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$OUT/chatgpt-webview-v0.74-resource-tools-consolidated-exact-source-aligned-unsigned.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$ALIGNED" > "$OUT/badging.txt"
          "$BT/aapt" dump permissions "$ALIGNED" > "$OUT/permissions.txt"
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe.diag' versionCode='77' versionName='0.74-stable-diag-resource-tools-consolidated'" "$OUT/badging.txt"
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorResourceToolsV76Activity'" "$OUT/badging.txt"
          test "$(grep -c '^uses-permission:' "$OUT/permissions.txt")" -eq 3
          grep -Fq 'android.permission.INTERNET' "$OUT/permissions.txt"
          grep -Fq 'android.permission.RECORD_AUDIO' "$OUT/permissions.txt"
          grep -Fq 'android.permission.MODIFY_AUDIO_SETTINGS' "$OUT/permissions.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"
          printf '%s\n' 'RESOURCE_RESOLVER_V2_GUARDED_ACTION_PLUS_EVENT_DRIVEN_TOOLS' > "$OUT/FRONTIER_MODE.txt"
          printf '%s\n' 'EVENT_DRIVEN_NO_FIXED_DELAY_POLL_TIMEOUT' > "$OUT/CONTROL_SYNC.txt"
          printf '%s\n' 'b7aea08158252dcad79345608ce2e76e970e4cf613414db299579f46d9924c48' > "$OUT/EXPECTED_SIGNER_CERT_SHA256.txt"
          sha256sum "$ALIGNED" > "$OUT/ALIGNED_UNSIGNED_SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.74-resource-tools-consolidated-${{ github.run_id }}-unsigned
          path: ci/v76-resource-tools-out
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.74-resource-tools-consolidated-${{ github.run_id }}-telemetry
          path: ci/v76-resource-tools-telemetry
          if-no-files-found: error
          retention-days: 30
