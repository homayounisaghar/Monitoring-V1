name: Probe Backflip login

on:
  push:
    branches: ['imagecad-backflip-xpea110']
    paths:
      - '.github/workflows/probe-backflip-login.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch HoLa point-cloud format evidence
        run: |
          set -euo pipefail
          mkdir -p hola_probe
          curl -fL --retry 3 'https://huggingface.co/spaces/YuXingyao/HoLa-BRep/resolve/main/app/DataProcessor/PointCloudProcessor.py' -o hola_probe/PointCloudProcessor.py
          curl -fL --retry 3 'https://huggingface.co/spaces/YuXingyao/HoLa-BRep/resolve/main/app/AppLayout.py' -o hola_probe/AppLayout.py
          curl -fL --retry 3 'https://huggingface.co/spaces/YuXingyao/HoLa-BRep/resolve/main/app/examples/pc_examples/00052336/pc.ply' -o hola_probe/example.ply
          echo '--- PointCloudProcessor.py ---'
          cat hola_probe/PointCloudProcessor.py
          echo '--- PCLayout excerpts ---'
          grep -n -A30 -B5 'class PCLayout' hola_probe/AppLayout.py || true
          echo '--- PLY header ---'
          head -n 25 hola_probe/example.ply || true
          echo '--- sizes ---'
          wc -c hola_probe/*
      - uses: actions/upload-artifact@v4
        with:
          name: hola-pc-format-probe
          path: hola_probe/
          retention-days: 7
