name: Probe Backflip login

on:
  push:
    branches: ['imagecad-backflip-xpea110']
    paths:
      - '.github/workflows/probe-backflip-login.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe direct TraceParts preview asset access
        shell: bash
        run: |
          set -u
          mkdir -p probe
          URL='https://traceparts-previews-production.s3.eu-west-1.amazonaws.com/PREVIEW/SCHNEIDER_ELECTRIC/10-31032006-112260/foot_switch_xpea110.zip'
          echo "URL=$URL" | tee probe/result.txt
          echo '--- unsigned HEAD ---' | tee -a probe/result.txt
          curl -sS -D probe/headers.txt -o probe/body.bin "$URL"; RC=$?
          echo "curl_rc=$RC" | tee -a probe/result.txt
          cat probe/headers.txt | tee -a probe/result.txt
          echo "bytes=$(wc -c < probe/body.bin)" | tee -a probe/result.txt
          echo '--- body prefix ---' | tee -a probe/result.txt
          head -c 500 probe/body.bin | strings | tee -a probe/result.txt || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: traceparts-direct-asset-probe
          path: probe/
          retention-days: 7
