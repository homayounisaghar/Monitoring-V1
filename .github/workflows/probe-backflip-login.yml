name: XPEA110 HoLa STEP conversion

on:
  push:
    branches: ['imagecad-backflip-xpea110']
    paths:
      - '.github/workflows/probe-backflip-login.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install client and geometry libraries
        run: python -m pip install --quiet gradio_client trimesh numpy
      - name: Recover private-input blob and run HoLa-BRep
        env:
          INPUT_BLOB_SHA: '7515628742522d95021c6f402237cdf94a7987f4'
        run: |
          cat > /tmp/run.py <<'PY'
          from __future__ import annotations
          import base64, gzip, json, shutil, time, traceback, urllib.request
          from pathlib import Path
          import numpy as np
          import trimesh
          from gradio_client import Client, handle_file

          OUT = Path('result')
          OUT.mkdir(exist_ok=True)
          GZ = OUT / 'XPEA110_TraceParts_Preview.glb.gz'
          GLB = OUT / 'XPEA110_TraceParts_Preview.glb'
          PLY = OUT / 'XPEA110_HoLa_pointcloud_4096.ply'
          BLOB = __import__('os').environ['INPUT_BLOB_SHA']
          SPACE = 'YuXingyao/HoLa-BRep'

          def fetch_blob():
              url=f'https://api.github.com/repos/homayounisaghar/Monitoring-V1/git/blobs/{BLOB}'
              req=urllib.request.Request(url, headers={'Accept':'application/vnd.github+json','User-Agent':'imagecad-hola-runner'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  obj=json.load(r)
              GZ.write_bytes(base64.b64decode(obj['content']))
              with gzip.open(GZ,'rb') as src, GLB.open('wb') as dst:
                  shutil.copyfileobj(src,dst)

          def make_pc():
              loaded=trimesh.load(GLB, force='scene')
              mesh=loaded.dump(concatenate=True) if isinstance(loaded,trimesh.Scene) else loaded
              if not isinstance(mesh,trimesh.Trimesh):
                  raise TypeError(f'Expected Trimesh, got {type(mesh)}')
              np.random.seed(20260905)
              points, face_idx = trimesh.sample.sample_surface(mesh,4096)
              normals=mesh.face_normals[np.asarray(face_idx,dtype=np.int64)]
              normals=normals/np.maximum(np.linalg.norm(normals,axis=1)[:,None],1e-12)
              header=('ply\nformat binary_little_endian 1.0\n'
                      'comment XPEA110 TraceParts Preview surface sample for HoLa-BRep\n'
                      'element vertex 4096\n'
                      'property double x\nproperty double y\nproperty double z\n'
                      'property double nx\nproperty double ny\nproperty double nz\nend_header\n')
              with PLY.open('wb') as f:
                  f.write(header.encode('ascii'))
                  f.write(np.hstack([points,normals]).astype('<f8',copy=False).tobytes(order='C'))
              return {
                  'vertices':int(len(mesh.vertices)), 'faces':int(len(mesh.faces)),
                  'watertight':bool(mesh.is_watertight),
                  'bounds':np.asarray(mesh.bounds).tolist(), 'point_count':4096,
                  'point_bounds':[points.min(axis=0).tolist(),points.max(axis=0).tolist()]
              }

          def copy_returned(value,prefix,copied):
              if value is None: return
              if isinstance(value,(str,Path)):
                  p=Path(str(value))
                  if p.exists() and p.is_file():
                      suffix=p.suffix or '.bin'
                      dst=OUT/f'{prefix}_{len(copied):02d}{suffix}'
                      shutil.copy2(p,dst)
                      copied.append({'source':str(p),'dest':dst.name,'size':dst.stat().st_size})
                  return
              if isinstance(value,dict):
                  if value.get('path'): copy_returned(value['path'],prefix,copied)
                  for k,v in value.items():
                      if k!='path': copy_returned(v,prefix,copied)
                  return
              if isinstance(value,(list,tuple)):
                  for v in value: copy_returned(v,prefix,copied)

          report={'schema':'image-to-cad.xpea110-hola-pc.v1','service':'HoLa-BRep','space':SPACE,'mode':'Point Cloud','endpoint':'/generating_method','status':'started'}
          try:
              fetch_blob()
              report['mesh']=make_pc()
              client=Client(SPACE,verbose=False)
              state={'user_id':None,'user_output_dir':None}
              result=None; attempts=[]; t0=time.time()
              for variant,arg in [('single',handle_file(str(PLY))),('list',[handle_file(str(PLY))])]:
                  try:
                      result=client.predict(state,arg,api_name='/generating_method')
                      report['input_variant']=variant
                      break
                  except Exception as e:
                      attempts.append({'variant':variant,'error':f'{type(e).__name__}: {e}'})
              report['input_attempt_errors']=attempts
              if result is None: raise RuntimeError('Both HoLa point-cloud input encodings failed')
              report['initial_generation_seconds']=time.time()-t0
              report['raw_result']=json.loads(json.dumps(result,default=str))
              copied=[]
              if isinstance(result,(list,tuple)):
                  new_state=result[0] if result else None
                  for i,v in enumerate(result[1:],start=1): copy_returned(v,f'hypothesis_1_return_{i}',copied)
              else:
                  new_state=None; copy_returned(result,'hypothesis_1',copied)
              report['initial_copied_files']=copied
              report['returned_state']=json.loads(json.dumps(new_state,default=str)) if new_state is not None else None

              switches=[]; model_index=0
              if new_state is not None:
                  for step in range(3):
                      try:
                          time.sleep(1)
                          sw=client.predict(new_state,'Point Cloud',model_index,1,api_name='/switch_model_1')
                          scopy=[]
                          if isinstance(sw,(list,tuple)):
                              if sw:
                                  try: model_index=int(float(sw[0]))
                                  except Exception: pass
                              for j,v in enumerate(sw[1:],start=1): copy_returned(v,f'hypothesis_{step+2}_return_{j}',scopy)
                          switches.append({'step':step+1,'model_index_after':model_index,'files':scopy,'raw':json.loads(json.dumps(sw,default=str))})
                      except Exception as e:
                          switches.append({'step':step+1,'error':f'{type(e).__name__}: {e}','traceback':traceback.format_exc()})
                          break
              report['switch_results']=switches
              report['step_files']=[{'name':p.name,'size':p.stat().st_size} for p in sorted(OUT.iterdir()) if p.suffix.lower() in ('.step','.stp')]
              report['status']='success' if report['step_files'] else 'no-step-file'
          except Exception as e:
              report['status']='error'; report['error']=f'{type(e).__name__}: {e}'; report['traceback']=traceback.format_exc()
          finally:
              (OUT/'run_report.json').write_text(json.dumps(report,indent=2,default=str),encoding='utf-8')
              print(json.dumps(report,indent=2,default=str))
          if report['status']=='error': raise SystemExit(2)
          PY
          python /tmp/run.py
      - name: List outputs
        if: always()
        run: find result -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XPEA110-HoLa-STEP-results
          path: result/
          if-no-files-found: error
          retention-days: 14
