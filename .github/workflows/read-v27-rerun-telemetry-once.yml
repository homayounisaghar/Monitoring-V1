name: Read Stable v0.27 Rerun Telemetry Once

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/read-v27-rerun-telemetry-once.yml'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recheck newest v0.27 rerun telemetry
        env:
          READ_URL: https://webhook.site/token/9c9162c0-1826-4f61-a47c-eb621549e421/requests?sorting=newest&per_page=100
        run: |
          python - <<'PY'
          import json, os, urllib.request, collections
          SOURCE='ca31a80d93a347f09cbc56aab080ce223b3ba6b3'
          schemas={'cp-v27-speech-cue-v1','cp-v26-ready-start-gate-v1','cp-autonomous-runtime-v2','cp-v24-script-diagnostic-v1'}
          req=urllib.request.Request(os.environ['READ_URL'],headers={'Accept':'application/json','User-Agent':'cp27-rerun-recheck'})
          with urllib.request.urlopen(req,timeout=20) as r: root=json.load(r)
          rows=root.get('data',root if isinstance(root,list) else [])
          parsed=[]
          for row in rows:
            raw=row.get('content','') if isinstance(row,dict) else ''
            try: p=json.loads(raw)
            except: continue
            if p.get('schema_version') in schemas and p.get('source_ref')==SOURCE: parsed.append(p)
          print('API_ROWS',len(rows),'PARSED_MATCH',len(parsed),'TOTAL',root.get('total'))
          by=collections.defaultdict(list)
          for p in parsed:
            tid=str(p.get('test_id','-'))
            if tid.startswith('cp23-'): by[tid].append(p)
          def rank(ps): return max((p.get('timestamp_epoch_ms') or 0) for p in ps)
          for tid,ps in sorted(by.items(),key=lambda kv:rank(kv[1]),reverse=True):
            phases=sorted(ps,key=lambda p:(p.get('timestamp_epoch_ms') or 0,p.get('seq') or 0))
            finals=[p for p in ps if p.get('phase')=='FINAL']
            trans=[p for p in ps if p.get('phase')=='TRANSCRIPT_SCRIPT_CLASS']
            assistants=[p for p in ps if p.get('phase')=='ASSISTANT_SCRIPT_CLASS']
            print('TEST',tid,'ROWS',len(ps),'MAXSEQ',max((p.get('seq') or 0) for p in ps),'LAST',phases[-1].get('phase'),phases[-1].get('classification'))
            print('FINAL',[(x.get('classification')) for x in finals])
            print('TRANS',[(x.get('classification'),(x.get('state') or {}).get('language_hint'),(x.get('state') or {}).get('text_length'),(x.get('state') or {}).get('arabic_persian_letters'),(x.get('state') or {}).get('persian_markers'),(x.get('state') or {}).get('latin_letters')) for x in trans])
            print('ASSIST',[(x.get('classification'),(x.get('state') or {}).get('language_hint')) for x in assistants])
            print('PHASES',[(p.get('seq'),p.get('schema_version'),p.get('phase'),p.get('classification')) for p in phases])
          PY
