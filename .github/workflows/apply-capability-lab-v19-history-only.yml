name: Apply Capability Lab v0.19 History-only Boundary

on:
  push:
    branches: [build/pebble-chat-bridge-v019]
    paths:
      - '.github/workflows/apply-capability-lab-v19-history-only.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/pebble-chat-bridge-v019
          fetch-depth: 0
      - name: Apply v0.19 History-only patch
        run: |
          set -euo pipefail
          python3 build_tools/apply_capability_lab_v19_history_only.py
      - name: Verify v0.19 contract
        run: |
          set -euo pipefail
          ROOT=runtime_probes/native-capability-lab
          git diff --check
          grep -Fq 'versionCode 19' "$ROOT/app/build.gradle"
          grep -Fq '0.19-native-capability-lab-stable-history-only-boundary' "$ROOT/app/build.gradle"
          grep -Fq 'conversation_history_accessibility_binding_v14_history_only' "$ROOT/plans/default.json"
          ! grep -Fq 'global_search_binding' "$ROOT/plans/default.json"
          grep -Fq '"op": "resume_chatgpt"' "$ROOT/plans/default.json"
          grep -Fq '"op": "history_boundary_calibration"' "$ROOT/plans/default.json"
          grep -Fq '"op": "history_recent_binding"' "$ROOT/plans/default.json"
          grep -Fq 'Stable v0.19' "$ROOT/app/src/main/java/com/openai/controlplane/capabilitylab/MainActivity.java"
          git status --short
      - name: Commit runtime v0.19
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime_probes/native-capability-lab
          git commit -m 'Remove Search from History boundary critical path v0.19'
          git push origin HEAD:build/pebble-chat-bridge-v019
