name: Temporary Onshape A2 Android Toolchain Bootstrap
on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths: ['.github/workflows/tmp-onshape-a2-toolchain-bootstrap.yml']
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install public Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Hydrate exact public Gradle dependencies
        shell: bash
        run: |
          set -euo pipefail
          D=/tmp/bootstrap-app
          mkdir -p "$D/app/src/main/java/bootstrap" "$D/app/src/main"
          cat > "$D/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "A2Bootstrap"
          include(":app")
          EOF
          cat > "$D/build.gradle.kts" <<'EOF'
          plugins { id("com.android.application") version "8.8.2" apply false }
          EOF
          cat > "$D/app/build.gradle.kts" <<'EOF'
          plugins { id("com.android.application") }
          android {
            namespace = "bootstrap.a2"
            compileSdk = 35
            defaultConfig { applicationId = "bootstrap.a2"; minSdk = 26; targetSdk = 35; versionCode = 1; versionName = "1" }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          dependencies {
            implementation("com.squareup.okhttp3:okhttp:4.12.0")
            testImplementation("junit:junit:4.13.2")
            testImplementation("org.json:json:20240303")
          }
          EOF
          cat > "$D/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > "$D/app/src/main/java/bootstrap/MainActivity.java" <<'EOF'
          package bootstrap; public class MainActivity extends android.app.Activity {}
          EOF
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$D/local.properties"
          cd "$D"
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Package source-agnostic offline toolchain
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/a2-toolchain
          mkdir -p "$OUT/android-sdk/platforms" "$OUT/android-sdk/build-tools" "$OUT/android-sdk/platform-tools" "$OUT/gradle-home"
          cp -a "$ANDROID_SDK_ROOT/platforms/android-35" "$OUT/android-sdk/platforms/"
          cp -a "$ANDROID_SDK_ROOT/build-tools/35.0.0" "$OUT/android-sdk/build-tools/"
          cp -a "$ANDROID_SDK_ROOT/platform-tools/." "$OUT/android-sdk/platform-tools/"
          cp -a /tmp/gradle-8.10.2 "$OUT/"
          cp -a "$HOME/.gradle/caches" "$OUT/gradle-home/"
          cp -a "$HOME/.gradle/native" "$OUT/gradle-home/" 2>/dev/null || true
          cp -a "$HOME/.gradle/notifications" "$OUT/gradle-home/" 2>/dev/null || true
          printf '%s\n' 'AGP=8.8.2' 'GRADLE=8.10.2' 'COMPILE_SDK=35' 'BUILD_TOOLS=35.0.0' 'OKHTTP=4.12.0' 'JUNIT=4.13.2' 'ORG_JSON=20240303' > "$OUT/TOOLCHAIN_CONTRACT.txt"
          tar -C /tmp -czf /tmp/onshape-a2-android-toolchain.tar.gz a2-toolchain
          sha256sum /tmp/onshape-a2-android-toolchain.tar.gz > /tmp/onshape-a2-android-toolchain.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: onshape-a2-android-toolchain
          path: |
            /tmp/onshape-a2-android-toolchain.tar.gz
            /tmp/onshape-a2-android-toolchain.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
