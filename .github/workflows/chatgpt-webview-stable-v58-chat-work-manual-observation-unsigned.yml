name: ChatGPT WebView Stable v0.56 Chat Work Manual Observation Unsigned

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-stable-v58-chat-work-manual-observation-unsigned.yml'
      - 'ci/generate_chatgpt_webview_v58_chat_work_manual_observation.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Generate v0.56 source
        run: python3 ci/generate_chatgpt_webview_v58_chat_work_manual_observation.py

      - name: Create fresh telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          CFG=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV58.java
          TOKEN=$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid");assert x;print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"
          READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(); ep,sha,cid=sys.argv[2:]
          s=re.sub(r'WEBHOOK_URL=".*?"',f'WEBHOOK_URL="{ep}"',s)
          s=re.sub(r'SOURCE_REF=".*?"',f'SOURCE_REF="{sha}"',s)
          s=re.sub(r'COLLECTOR_ID=".*?"',f'COLLECTOR_ID="{cid}"',s)
          s=s.replace('CONFIGURED=false','CONFIGURED=true')
          p.write_text(s)
          PY
          mkdir -p ci/v58-chat-work-observation-telemetry
          printf '%s\n' "$TOKEN" > ci/v58-chat-work-observation-telemetry/collector-id.txt
          printf '%s\n' "$READ" > ci/v58-chat-work-observation-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v58-chat-work-observation-telemetry/source-ref.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v58-chat-work-manual-observation-v1","scenario_id":"chat-work-manual-observation","source_ref":"%s"}\n' "$GITHUB_SHA" | curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @- >/dev/null

      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          PKG=$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe
          ACT=$PKG/OrchestratorChatWorkManualObservationV58Activity.java
          MAN=$ROOT/app/src/main/AndroidManifest.xml
          GRADLE=$ROOT/app/build.gradle

          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe.diag'" "$GRADLE"
          grep -Fq 'versionCode 59' "$GRADLE"
          grep -Fq "versionName '0.56-stable-diag-chat-work-manual-observation'" "$GRADLE"
          grep -Fq 'OrchestratorChatWorkManualObservationV58Activity' "$MAN"
          grep -Fq 'ControlPlaneAccessibilityServiceV51' "$MAN"
          grep -Fq '@xml/cp_accessibility_service_v51' "$MAN"
          ! grep -Fq 'ControlPlaneAccessibilityServiceV58' "$MAN"
          ! grep -Fq 'REQUEST_INSTALL_PACKAGES' "$MAN"
          ! grep -Fq 'UPDATE_PACKAGES_WITHOUT_USER_ACTION' "$MAN"
          test "$(grep -c '<uses-permission' "$MAN")" -eq 3

          grep -Fq 'cp-v58-chat-work-manual-observation-v1' "$ACT"
          grep -Fq 'chat-work-manual-observation' "$ACT"
          grep -Fq 'START OBSERVATION' "$ACT"
          grep -Fq 'OBSERVATION_COMPLETE_NO_PAGE_WRITES' "$ACT"
          grep -Fq 'evaluateJavascript(scanJs()' "$ACT"
          grep -Fq 'page_ui_dispatches",0' "$ACT"
          grep -Fq 'page_ui_writes",0' "$ACT"
          grep -Fq 'model_option_writes",0' "$ACT"
          grep -Fq 'effort_writes",0' "$ACT"
          grep -Fq 'cookies_tokens_accessed",false' "$ACT"
          grep -Fq 'raw_html_uploaded",false' "$ACT"
          grep -Fq 'raw_text_uploaded",false' "$ACT"
          grep -Fq "if(x==='chat')return 'CHAT'" "$ACT"
          grep -Fq "if(x==='work')return 'WORK'" "$ACT"
          grep -Fq 'candidate_set_hash' "$ACT"
          grep -Fq 'state_fingerprint' "$ACT"

          test "$(grep -c 'evaluateJavascript' "$ACT")" -eq 1
          ! grep -Fq 'performClick(' "$ACT"
          ! grep -Fq 'dispatchTouchEvent(' "$ACT"
          ! grep -Fq 'ACTION_CLICK' "$ACT"
          ! grep -Fq 'ACTION_SET_PROGRESS' "$ACT"
          ! grep -Fq 'clickModelOption' "$ACT"
          ! grep -Fq 'startDynamicEffortProof' "$ACT"
          ! grep -Fq 'elementFromPoint' "$ACT"
          ! grep -Fq 'document.evaluate' "$ACT"
          ! grep -Fq 'setAttribute("aria-' "$ACT"
          ! grep -Fq 'CookieManager' "$ACT"
          ! grep -Fq 'getCookie(' "$ACT"
          ! grep -Fq 'addJavascriptInterface' "$ACT"
          ! grep -Fq 'conversation_id' "$ACT"
          ! grep -Fq 'CONVERSATION_ID' "$ACT"
          ! grep -Fq 'document.title' "$ACT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build and prove exact artifact identity
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..
          OUT=ci/v58-chat-work-observation-out
          mkdir -p "$OUT"
          UNSIGNED=runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$OUT/chatgpt-webview-v0.56-chat-work-manual-observation-exact-source-aligned-unsigned.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$ALIGNED" > "$OUT/badging.txt"
          "$BT/aapt" dump permissions "$ALIGNED" > "$OUT/permissions.txt"
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe.diag' versionCode='59' versionName='0.56-stable-diag-chat-work-manual-observation'" "$OUT/badging.txt"
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorChatWorkManualObservationV58Activity'" "$OUT/badging.txt"
          test "$(grep -c '^uses-permission:' "$OUT/permissions.txt")" -eq 3
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"
          test "$(cat "$OUT/SOURCE_REF.txt")" = "$GITHUB_SHA"
          sha256sum "$ALIGNED" > "$OUT/ALIGNED_UNSIGNED_SHA256.txt"
          cp "$OUT/badging.txt" "$OUT/IDENTITY_PROOF.txt"
          printf 'SOURCE_REF=%s\nRUN_ID=%s\nOBSERVATION_ONLY=true\nPAGE_UI_WRITES=0\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" >> "$OUT/IDENTITY_PROOF.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.56-chat-work-manual-observation-${{ github.run_id }}-unsigned
          path: ci/v58-chat-work-observation-out
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.56-chat-work-manual-observation-${{ github.run_id }}-telemetry
          path: ci/v58-chat-work-observation-telemetry
          if-no-files-found: error
          retention-days: 30
