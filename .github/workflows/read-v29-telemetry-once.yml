name: Read Stable v0.29 Telemetry Once

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/read-v29-telemetry-once.yml'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read nested v0.29 census
        env:
          READ_URL: https://webhook.site/token/1bd16553-d888-4ced-8476-0d15b3e88375/requests?sorting=oldest&per_page=100
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          SOURCE='56312bf61c152d29d4ba7e3be9612cd30a49c222'; SCHEMA='cp-v29-voice-post-start-census-v1'
          req=urllib.request.Request(os.environ['READ_URL'],headers={'Accept':'application/json','User-Agent':'cp29-nested'})
          with urllib.request.urlopen(req,timeout=20) as r: root=json.load(r)
          rows=root.get('data',root if isinstance(root,list) else [])
          ps=[]
          for row in rows:
              try: p=json.loads(row.get('content',''))
              except Exception: continue
              if p.get('schema_version')==SCHEMA and p.get('source_ref')==SOURCE and str(p.get('test_id','')).startswith('cp29-'): ps.append(p)
          if not ps: raise SystemExit('NO_CP29_ROWS')
          tid=max({str(p.get('test_id')) for p in ps},key=lambda t:max((x.get('timestamp_epoch_ms') or 0) for x in ps if str(x.get('test_id'))==t))
          ps=sorted([p for p in ps if str(p.get('test_id'))==tid],key=lambda p:((p.get('timestamp_epoch_ms') or 0),(p.get('seq') or 0)))
          print('LATEST_TEST',tid,'ROWS',len(ps))
          for p in ps:
              if not str(p.get('phase','')).startswith('POST_START_CENSUS_'): continue
              scan=(p.get('state') or {}).get('scan') or {}
              out={k:scan.get(k) for k in ['success','complete','budget_exceeded','truncated','nodes','roots','visible_controls','dialog_control_count','voice_start_count','voice_end_count','mute_count','unmute_count','semantic_set_hash','relevant_count','candidate_overflow','candidate_set_hash','target_matches','clicked'] if k in scan}
              out['candidates']=[{k:v for k,v in c.items() if k in ['c','h','tag','is_button','role_button','state','meta_len','aria_len','aria_present','features']} for c in (scan.get('candidates') or [])[:12] if isinstance(c,dict)]
              print('SNAP',p.get('phase'),p.get('classification'),json.dumps(out,sort_keys=True,separators=(',',':')))
          PY
