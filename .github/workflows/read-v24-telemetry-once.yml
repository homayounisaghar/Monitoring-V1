name: Read v0.24 Telemetry Once

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/read-v24-telemetry-once.yml'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sanitized v0.24 telemetry
        env:
          READ_URL: https://webhook.site/token/da112488-179d-4e94-a9e8-5724ac4b1e4b/requests?sorting=oldest
        run: |
          python - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request(os.environ['READ_URL'],headers={'Accept':'application/json','User-Agent':'cp24-sanitized-readback'})
          with urllib.request.urlopen(req,timeout=20) as r: root=json.load(r)
          rows=root.get('data',root if isinstance(root,list) else [])
          allowed_state={
            'phase','session_state','mic_lease_mode','snapshot_ok','dictation_count','composer_len','user_turn_count',
            'parent_last_action','parent_last_status','wrapper_last_status','forced_session_end_count','adapter_action',
            'adapter_status','adapter_pending','adapter_matches','adapter_clicked','adapter_submit_count','adapter_cancel_count',
            'adapter_ready_count','adapter_user_turns','cancel_classification','stop_classification','transcript_classification',
            'send_classification','final_classification','webview_present','telemetry_preflight_ok','requires_empty_composer',
            'no_message_side_effect','draft_unchanged','recovered','user_turn_advanced','composer_cleared','v18_receipt_confirmed',
            'v18_status_class','send_replayed','receipt_basis','script_class','language_hint','arabic_persian_letters','latin_letters',
            'persian_markers','arabic_markers','total_letters','text_length','raw_text_uploaded','assistant_baseline_count',
            'assistant_baseline_len','assistant_baseline_script_class','assistant_count','assistant_len','baseline_count','baseline_len',
            'send_receipt_fix','script_diagnostic','reason'
          }
          out=[]
          for row in rows:
            raw=row.get('content','') if isinstance(row,dict) else ''
            try:p=json.loads(raw)
            except:continue
            schema=p.get('schema_version','')
            scenario=p.get('scenario_id','')
            if not ((schema=='cp-autonomous-runtime-v2' and scenario=='dictation-one-tap-bounded-e2e') or (schema=='cp-v24-script-diagnostic-v1' and scenario=='dictation-send-script-diagnostic-v24')): continue
            if p.get('source_ref')!='68935ab65e7fd7f4cf05e04b6e088d8530ecfa9f': continue
            s=p.get('state') if isinstance(p.get('state'),dict) else {}
            q={k:p.get(k) for k in ['schema_version','scenario_id','test_id','seq','phase','classification','elapsed_ms','app_version','source_ref'] if k in p}
            q['state']={k:v for k,v in s.items() if k in allowed_state}
            out.append(q)
          print('MATCHING',len(out))
          for x in out: print('ROW',json.dumps(x,sort_keys=True,separators=(',',':')))
          PY
