name: Apply Capability Lab v0.9 Menu Calibration

on:
  push:
    branches:
      - build/pebble-chat-bridge-v019
    paths:
      - '.github/workflows/apply-capability-lab-v09.yml'
      - 'build_tools/apply_capability_lab_v09_menu_calibration.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.9 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 build_tools/apply_capability_lab_v09_menu_calibration.py
          git diff --check
          grep -Fq "versionCode 9" runtime_probes/native-capability-lab/app/build.gradle
          grep -Fq "conversation_search_binding_v4_menu_calibration" runtime_probes/native-capability-lab/plans/default.json
          grep -Fq '"Menu"' runtime_probes/native-capability-lab/app/src/main/java/com/openai/controlplane/capabilitylab/LabAccessibilityService.java
          grep -Fq "findHistorySearchFieldAcrossRoots" runtime_probes/native-capability-lab/app/src/main/java/com/openai/controlplane/capabilitylab/LabAccessibilityService.java

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime_probes/native-capability-lab .github/workflows/native-capability-lab.yml
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "Calibrate Capability Lab to real-device Menu semantic"
          git push origin HEAD:build/pebble-chat-bridge-v019
