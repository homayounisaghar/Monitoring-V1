name: ChatGPT WebView Stable v0.41 Nested Effort Surface Census

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/chatgpt-webview-stable-v43-nested-census-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Generate v0.41 bounded nested-surface diagnostic
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          PKG="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe"
          SRC42="$PKG/OrchestratorPaidModelEffortPointerCensusV42Activity.java"
          SRC43="$PKG/OrchestratorPaidModelEffortNestedCensusV43Activity.java"
          CFG43="$PKG/TelemetryConfigV43.java"
          MAN="$ROOT/app/src/main/AndroidManifest.xml"
          GRADLE="$ROOT/app/build.gradle"
          cp "$SRC42" "$SRC43"
          python3 - "$SRC43" "$MAN" "$GRADLE" <<'PY'
          from pathlib import Path
          import re,sys
          src,man,gradle=map(Path,sys.argv[1:])
          s=src.read_text()
          s=s.replace('OrchestratorPaidModelEffortPointerCensusV42Activity','OrchestratorPaidModelEffortNestedCensusV43Activity')
          s=s.replace('TelemetryConfigV42','TelemetryConfigV43')
          s=re.sub(r'42', '43', s)
          s=s.replace('Stable v0.40 — guarded semantic pointer-down popup census.','Stable v0.41 — guarded semantic pointer-down plus nested effort-surface census.')
          s=s.replace('cp-v43-paid-model-effort-pointer-census-v1','cp-v43-paid-model-effort-nested-surface-census-v1')
          s=s.replace('paid-model-effort-semantic-pointer-popup-census','paid-model-effort-open-popup-nested-structure-census')
          s=s.replace('v0.40 semantic pointer popup census ready — no model option click','v0.41 nested effort surface census ready — zero model option clicks')
          s=s.replace('RUN SEMANTIC POINTER POPUP CENSUS','RUN NESTED EFFORT SURFACE CENSUS')
          s=s.replace('POINTER CENSUS RUNNING...','NESTED CENSUS RUNNING...')
          s=s.replace('Popup snapshot ', 'Nested snapshot ')
          s=s.replace('POPUP_SURFACE_SNAPSHOT','NESTED_SURFACE_SNAPSHOT')
          s=s.replace('PASS_SEMANTIC_POINTER_POPUP_CENSUS_CAPTURED','PASS_NESTED_EFFORT_STRUCTURE_CENSUS_CAPTURED')
          s=s.replace('PARTIAL_SEMANTIC_POINTER_POPUP_CENSUS_CAPTURED','PARTIAL_NESTED_EFFORT_STRUCTURE_CENSUS_CAPTURED')
          s=s.replace('SEMANTIC_POINTER_POPUP_UNCERTAIN_NO_REPLAY','NESTED_EFFORT_STRUCTURE_UNCERTAIN_NO_REPLAY')
          method = r'''    private String scanOpenSurfaceJs43(int index, String baselineHash) {
        return "(function(){try{const IDX=" + index + ",BH='" + js43(baselineHash) + "',T0=performance.now(),MAXN=20000,MAXMS=320,MAXC=64;const N=x=>(x||'').replace(/\\\\s+/g,' ').trim(),L=x=>N(x).toLowerCase(),TOK=s=>L(s).split(/[^a-z0-9.]+/).filter(Boolean),H=s=>{let x=2166136261>>>0;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)>>>0;}return('00000000'+x.toString(16)).slice(-8);},V=e=>{try{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>0&&r.height>0&&r.bottom>0&&r.right>0&&r.top<innerHeight&&r.left<innerWidth&&s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0';}catch(_){return false;}},WORDS=[['LIGHT','light'],['MEDIUM','medium'],['HEAVY','heavy'],['AUTO','auto'],['THINKING','thinking'],['INSTANT','instant'],['STANDARD','standard'],['EXTENDED','extended'],['DEEP','deep'],['FAST','fast'],['PRO','pro'],['LOW','low'],['HIGH','high']],SEM=s=>{const t=TOK(s),h=WORDS.filter(w=>t.includes(w[1]));return h.length===1?h[0][0]:'NONE';},OPEN=e=>{const ds=L(e.getAttribute('data-state')),ex=L(e.getAttribute('aria-expanded'));return ex==='true'||ds==='open'||ds==='expanded';},ROLE=e=>L(e.getAttribute('role'))||((e.tagName||'').toLowerCase()),IDREF=e=>N((e.getAttribute('aria-controls')||'')+' '+(e.getAttribute('aria-owns')||'')).split(' ').filter(Boolean).slice(0,8);let input=null;for(const e of document.querySelectorAll('textarea,[contenteditable=true],[role=textbox]'))if(V(e)){input=e;break;}let composer=null;if(input){let p=input.parentElement;for(let d=0;p&&d<10;d++,p=p.parentElement){if(p.querySelectorAll('button,[role=button]').length>=3){composer=p;break;}}}let visited=0,complete=true,lc=0,mc=0,hc=0,ac=0,tc=0,ic=0,sc=0,hiddenSem=0,triggerFound=false,triggerExpanded=false,triggerOpen=false,popupRoles=0,portalish=0,menuRoots=0,listboxRoots=0,radioRoots=0,submenuTriggers=0,relationTargets=0,hiddenRelationTargets=0,interactive=0;const out=[],fps=[],afps=[],seenTargets=new Set();const SEL='button,[role],[aria-haspopup],[aria-expanded],[aria-controls],[aria-owns],[data-state],[data-slot],[data-radix-collection-item],[tabindex]';for(const e of document.querySelectorAll(SEL)){if(++visited>MAXN||performance.now()-T0>MAXMS){complete=false;break;}const vis=V(e),role=ROLE(e),txt=N(e.innerText||e.textContent||''),aria=N(e.getAttribute('aria-label')),title=N(e.getAttribute('title')),acc=N(aria||title||txt),sem=SEM(acc+' '+txt),ah=acc?H(L(acc)):'-',ds=L(e.getAttribute('data-state')),expanded=L(e.getAttribute('aria-expanded')),selected=L(e.getAttribute('aria-checked'))==='true'||L(e.getAttribute('aria-selected'))==='true'||['checked','selected','on','active'].includes(ds),popup=N(e.getAttribute('aria-haspopup')),open=OPEN(e),refs=IDREF(e);if(['button','menuitem','menuitemradio','option','radio'].includes(role)||e.tagName==='BUTTON')interactive++;if(sem==='LIGHT')lc++;if(sem==='MEDIUM')mc++;if(sem==='HEAVY')hc++;if(sem==='AUTO')ac++;if(sem==='THINKING')tc++;if(sem==='INSTANT')ic++;if(sem!=='NONE'&&!vis)hiddenSem++;if(selected)sc++;if(role==='menu'){menuRoots++;if(vis)popupRoles++;}if(role==='listbox'){listboxRoots++;if(vis)popupRoles++;}if(role==='radiogroup'){radioRoots++;if(vis)popupRoles++;}if(popup!==''&&L(popup)!=='false')submenuTriggers++;const trig=ah===BH;if(trig){triggerFound=true;if(expanded==='true')triggerExpanded=true;if(['open','expanded'].includes(ds))triggerOpen=true;}let p=e.parentElement,chain=[],menuAnc=false,portalAnc=false,depthMenu=-1;for(let d=0;p&&d<8;d++,p=p.parentElement){const pr=ROLE(p),slot=L(p.getAttribute('data-slot')),tid=L(p.getAttribute('data-testid')),rad=N(p.getAttribute('data-radix-popper-content-wrapper'));if(['menu','listbox','radiogroup'].includes(pr)){menuAnc=true;if(depthMenu<0)depthMenu=d+1;}if(slot.includes('menu')||slot.includes('popover')||slot.includes('dropdown')||rad!=='')portalAnc=true;chain.push(H([pr,slot,tid,rad,L(p.getAttribute('data-state')),(p.tagName||'').toLowerCase()].join('|')));}if(vis&&portalAnc)portalish++;let relExists=false,relVisible=false,relOpen=false,relRole='-',relFp='-',rl=0,rm=0,rh=0,ra=0,rt=0,ri=0;for(const id of refs){let t=null;try{t=document.getElementById(id);}catch(_){}if(!t)continue;relExists=true;if(!seenTargets.has(t)){seenTargets.add(t);relationTargets++;if(!V(t))hiddenRelationTargets++;}if(V(t))relVisible=true;if(OPEN(t))relOpen=true;relRole=ROLE(t);const rf=[];for(const q of t.querySelectorAll('button,[role],[aria-selected],[aria-checked],[data-state]')){const qa=N(q.getAttribute('aria-label')||q.getAttribute('title')||q.innerText||q.textContent||''),qs=SEM(qa);if(qs==='LIGHT')rl++;if(qs==='MEDIUM')rm++;if(qs==='HEAVY')rh++;if(qs==='AUTO')ra++;if(qs==='THINKING')rt++;if(qs==='INSTANT')ri++;rf.push(H([ROLE(q),qs,V(q),OPEN(q),L(q.getAttribute('data-state'))].join('|')));if(rf.length>=80)break;}rf.sort();relFp=H([relRole,V(t),OPEN(t),rf.join(',')].join('|'));}const structural=['menu','listbox','radiogroup','group','menuitem','menuitemradio','option','radio','button'].includes(role)||popup!==''||expanded!==''||refs.length>0||open||sem!=='NONE'||portalAnc;if(!structural)continue;const afp=H(chain.join('>')),q={semantic:sem,acc_hash:ah,role:role,visible:vis,enabled:!(e.disabled||L(e.getAttribute('aria-disabled'))==='true'),selected:selected,is_trigger:trig,in_composer:!!(composer&&composer.contains(e)),has_popup:popup!==''&&L(popup)!=='false',popup_type_hash:popup?H(L(popup)):'-',expanded_true:expanded==='true',data_state_open:['open','expanded'].includes(ds),has_menu_ancestor:menuAnc,has_portalish_ancestor:portalAnc,depth_to_menu:depthMenu,ancestor_fp:afp,testid_hash:N(e.getAttribute('data-testid'))?H(L(e.getAttribute('data-testid'))):'-',slot_hash:N(e.getAttribute('data-slot'))?H(L(e.getAttribute('data-slot'))):'-',relation_ref_count:refs.length,relation_target_exists:relExists,relation_target_visible:relVisible,relation_target_open:relOpen,relation_target_role:relRole,relation_target_fp:relFp,relation_light:rl,relation_medium:rm,relation_heavy:rh,relation_auto:ra,relation_thinking:rt,relation_instant:ri};q.fp=H([q.semantic,q.acc_hash,q.role,q.visible,q.enabled,q.selected,q.is_trigger,q.in_composer,q.has_popup,q.expanded_true,q.data_state_open,q.has_menu_ancestor,q.has_portalish_ancestor,q.depth_to_menu,q.ancestor_fp,q.testid_hash,q.slot_hash,q.relation_ref_count,q.relation_target_fp].join('|'));if(out.length<MAXC)out.push(q);fps.push(q.fp);afps.push(afp);}out.sort((a,b)=>(a.role+'|'+a.semantic+'|'+a.acc_hash+'|'+a.ancestor_fp).localeCompare(b.role+'|'+b.semantic+'|'+b.acc_hash+'|'+b.ancestor_fp));fps.sort();afps.sort();const semanticCount=lc+mc+hc+ac+tc+ic;const popupEvidence=triggerExpanded||triggerOpen||popupRoles>0||portalish>0||semanticCount>=2;return JSON.stringify({success:true,complete:complete,snapshot_index:IDX,visited_nodes:visited,semantic_candidate_count:semanticCount,light_count:lc,medium_count:mc,heavy_count:hc,auto_count:ac,thinking_count:tc,instant_count:ic,selected_count:sc,hidden_semantic_count:hiddenSem,trigger_found:triggerFound,trigger_expanded_true:triggerExpanded,trigger_data_state_open:triggerOpen,popup_role_candidate_count:popupRoles,portalish_candidate_count:portalish,menu_root_count:menuRoots,listbox_root_count:listboxRoots,radiogroup_root_count:radioRoots,submenu_trigger_count:submenuTriggers,relation_target_count:relationTargets,hidden_relation_target_count:hiddenRelationTargets,interactive_count:interactive,popup_evidence:popupEvidence,candidate_set_hash:H(fps.join(',')),ancestor_set_hash:H(afps.join(',')),candidates:out});}catch(e){return JSON.stringify({success:false,complete:false,error_class:'NESTED_SURFACE_SCAN_EXCEPTION'});}})();";
    }'''
          s=re.sub(r'    private String scanOpenSurfaceJs43\(.*?\n    }\n\n    private void eval43', method+'\n\n    private void eval43', s, flags=re.S)
          old='copy43(st, o, "success","complete","snapshot_index","visited_nodes","semantic_candidate_count","light_count","medium_count","heavy_count","auto_count","thinking_count","instant_count","selected_count","trigger_found","trigger_expanded_true","trigger_data_state_open","popup_role_candidate_count","portalish_candidate_count","popup_evidence","candidate_set_hash","ancestor_set_hash");'
          new='copy43(st, o, "success","complete","snapshot_index","visited_nodes","semantic_candidate_count","light_count","medium_count","heavy_count","auto_count","thinking_count","instant_count","selected_count","hidden_semantic_count","trigger_found","trigger_expanded_true","trigger_data_state_open","popup_role_candidate_count","portalish_candidate_count","menu_root_count","listbox_root_count","radiogroup_root_count","submenu_trigger_count","relation_target_count","hidden_relation_target_count","interactive_count","popup_evidence","candidate_set_hash","ancestor_set_hash");'
          assert old in s
          s=s.replace(old,new)
          s=s.replace('put43(st,"ui_dispatches",uiDispatches43);','put43(st,"ui_dispatches",uiDispatches43);\n        put43(st,"secondary_ui_dispatches",0);')
          src.write_text(s)

          m=man.read_text()
          oldblock='''        <activity android:name=".OrchestratorPaidModelEffortPointerCensusV42Activity" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>'''
          newblock='''        <activity android:name=".OrchestratorPaidModelEffortPointerCensusV42Activity" android:exported="false" />\n        <activity android:name=".OrchestratorPaidModelEffortNestedCensusV43Activity" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>'''
          assert oldblock in m
          man.write_text(m.replace(oldblock,newblock))

          g=gradle.read_text()
          g=re.sub(r'versionCode\s+\d+','versionCode 44',g)
          g=re.sub(r"versionName\s+'[^']+'","versionName '0.41-paid-model-effort-nested-surface-census'",g)
          gradle.write_text(g)
          PY

          cat > "$CFG43" <<'JAVA'
          package com.homayounisaghar.chatgptwebviewprobe;

          final class TelemetryConfigV43 {
              static final String WEBHOOK_URL = "https://webhook.site/__V43_UNCONFIGURED__";
              static final String SOURCE_REF = "__SOURCE_REF__";
              static final String COLLECTOR_ID = "__COLLECTOR_ID__";
              static final int COLLECTOR_CAPACITY_HINT = 50;
              static final boolean CONFIGURED = false;
              private TelemetryConfigV43() {}
              static boolean isConfigured() {
                  return CONFIGURED && WEBHOOK_URL.startsWith("https://webhook.site/")
                          && !WEBHOOK_URL.contains("__V43_UNCONFIGURED__");
              }
          }
          JAVA

      - name: Create fresh v0.41 telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          CFG="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV43.java"
          TOKEN=$(curl -fsS -X POST https://webhook.site/token \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' \
            | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid"); assert x; print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"
          READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); ep,sha,cid=sys.argv[2:]
          s=p.read_text()
          s=re.sub(r'static final String WEBHOOK_URL = ".*?";',f'static final String WEBHOOK_URL = "{ep}";',s)
          s=re.sub(r'static final String SOURCE_REF = ".*?";',f'static final String SOURCE_REF = "{sha}";',s)
          s=re.sub(r'static final String COLLECTOR_ID = ".*?";',f'static final String COLLECTOR_ID = "{cid}";',s)
          s=s.replace('static final boolean CONFIGURED = false;','static final boolean CONFIGURED = true;')
          p.write_text(s)
          PY
          mkdir -p ci/v43-telemetry
          printf '%s\n' "$TOKEN" > ci/v43-telemetry/collector-id.txt
          printf '%s\n' "$READ" > ci/v43-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v43-telemetry/source-ref.txt
          printf '%s\n' 'one claimed semantic pointerdown opener; nested/hidden structural census only; zero model-option clicks; zero secondary UI dispatches' > ci/v43-telemetry/usage.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v43-paid-model-effort-nested-surface-census-v1","scenario_id":"paid-model-effort-open-popup-nested-structure-census","source_ref":"%s"}\n' "$GITHUB_SHA" > ci/v43-telemetry/smoke.json
          curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @ci/v43-telemetry/smoke.json >/dev/null
          sleep 2
          curl -fsS "$READ" | python3 -c 'import json,sys;o=json.load(sys.stdin);assert len(o.get("data",[]))>=1'

      - name: Verify v0.41 read-only nested-census contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          SRC="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorPaidModelEffortNestedCensusV43Activity.java"
          MAN="$ROOT/app/src/main/AndroidManifest.xml"
          GRADLE="$ROOT/app/build.gradle"
          grep -Fq 'OrchestratorPaidModelEffortNestedCensusV43Activity' "$MAN"
          grep -Fq 'extends OrchestratorAuthModeV34Activity' "$SRC"
          grep -Fq "versionCode 44" "$GRADLE"
          grep -Fq "versionName '0.41-paid-model-effort-nested-surface-census'" "$GRADLE"
          test "$(grep -c '<uses-permission' "$MAN")" -eq 3
          grep -Fq 'CLAIMED_BEFORE_SEMANTIC_POINTERDOWN' "$SRC"
          grep -Fq "new PointerEvent('pointerdown'" "$SRC"
          grep -Fq 'dispatchEvent(ev)' "$SRC"
          grep -Fq 'model_option_clicks",0' "$SRC"
          grep -Fq 'secondary_ui_dispatches",0' "$SRC"
          grep -Fq 'geometry_click_used",false' "$SRC"
          grep -Fq 'NESTED_SURFACE_SNAPSHOT' "$SRC"
          grep -Fq 'relation_target_count' "$SRC"
          grep -Fq 'hidden_relation_target_count' "$SRC"
          grep -Fq 'submenu_trigger_count' "$SRC"
          grep -Fq 'aria-controls' "$SRC"
          grep -Fq 'aria-owns' "$SRC"
          grep -Fq 'PASS_NESTED_EFFORT_STRUCTURE_CENSUS_CAPTURED' "$SRC"
          python3 - "$SRC" <<'PY'
          from pathlib import Path
          import re,sys
          s=Path(sys.argv[1]).read_text()
          s=re.sub(r'/\*.*?\*/','',s,flags=re.S)
          s=re.sub(r'//.*','',s)
          assert '.click()' not in s
          assert "new PointerEvent('pointerover'" not in s
          assert "new MouseEvent('mouseover'" not in s
          assert 'MODEL_EFFORT_SELECT_LIGHT' not in s
          assert 'MODEL_EFFORT_RESTORE_MEDIUM' not in s
          PY
          ! grep -Fq 'elementFromPoint' "$SRC"
          ! grep -Fq 'getCookie(' "$SRC"
          echo 'v0.41 nested structural census contract OK'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build and verify unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..
          mkdir -p ci/out/signing-tools/lib ci/out/signing-tools/lib64
          cp runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk ci/out/chatgpt-webview-stable-v43-nested-census-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" ci/out/signing-tools/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" ci/out/signing-tools/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" ci/out/signing-tools/zipalign
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" ci/out/signing-tools/aapt
          LIBCPP=$(find "$ANDROID_SDK_ROOT/build-tools/35.0.0" -type f -name 'libc++.so' | head -n 1)
          cp "$LIBCPP" ci/out/signing-tools/lib64/libc++.so
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging ci/out/chatgpt-webview-stable-v43-nested-census-unsigned.apk > ci/out/badging.txt
          "$AAPT" dump permissions ci/out/chatgpt-webview-stable-v43-nested-census-unsigned.apk > ci/out/permissions.txt
          grep -Fq "versionCode='44' versionName='0.41-paid-model-effort-nested-surface-census'" ci/out/badging.txt
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorPaidModelEffortNestedCensusV43Activity'" ci/out/badging.txt
          test "$(grep -c '^uses-permission:' ci/out/permissions.txt)" -eq 3
          unzip -p ci/out/chatgpt-webview-stable-v43-nested-census-unsigned.apk classes.dex | strings > ci/out/classes-strings.txt
          grep -Fq 'RUN NESTED EFFORT SURFACE CENSUS' ci/out/classes-strings.txt
          grep -Fq 'PASS_NESTED_EFFORT_STRUCTURE_CENSUS_CAPTURED' ci/out/classes-strings.txt
          grep -Fq 'relation_target_count' ci/out/classes-strings.txt
          sha256sum ci/out/chatgpt-webview-stable-v43-nested-census-unsigned.apk > ci/out/UNSIGNED_SHA256.txt
          printf '%s\n' "$GITHUB_SHA" > ci/out/SOURCE_REF.txt

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-stable-v43-nested-census-signing-kit
          path: ci/out
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-stable-v43-nested-census-telemetry
          path: ci/v43-telemetry
          if-no-files-found: error
          retention-days: 30
