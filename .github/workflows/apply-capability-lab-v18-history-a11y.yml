name: Apply Capability Lab v0.18 History Accessibility Boundary

on:
  push:
    branches: [build/pebble-chat-bridge-v019]
    paths:
      - '.github/workflows/apply-capability-lab-v18-history-a11y.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/pebble-chat-bridge-v019
          fetch-depth: 0
      - name: Apply v0.18 static-first patch
        run: |
          python3 build_tools/apply_capability_lab_v18_history_a11y_boundary.py
      - name: Verify patch invariants
        run: |
          git diff --check
          grep -Fq 'HISTORY_A11Y_BOUNDARY' runtime_probes/native-capability-lab/app/src/main/java/com/openai/controlplane/capabilitylab/LabAccessibilityService.java
          grep -Fq 'versionCode 18' runtime_probes/native-capability-lab/app/build.gradle
          git status --short
      - name: Commit runtime v0.18
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime_probes/native-capability-lab .github/workflows/native-capability-lab.yml
          git commit -m 'Add static-first History accessibility boundary proof v0.18'
          git push origin HEAD:build/pebble-chat-bridge-v019
