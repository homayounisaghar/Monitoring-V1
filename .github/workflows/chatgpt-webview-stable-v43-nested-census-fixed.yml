name: ChatGPT WebView Stable v0.41 Nested Effort Surface Census Fixed

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/chatgpt-webview-stable-v43-nested-census-fixed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Generate bounded v0.41 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          PKG="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe"
          SRC="$PKG/OrchestratorPaidModelEffortNestedCensusV43Activity.java"
          cp "$PKG/OrchestratorPaidModelEffortPointerCensusV42Activity.java" "$SRC"
          python3 - "$SRC" "$ROOT/app/src/main/AndroidManifest.xml" "$ROOT/app/build.gradle" <<'PY'
          from pathlib import Path
          import re,sys
          src,man,gradle=map(Path,sys.argv[1:])
          s=src.read_text()
          s=s.replace('OrchestratorPaidModelEffortPointerCensusV42Activity','OrchestratorPaidModelEffortNestedCensusV43Activity').replace('TelemetryConfigV42','TelemetryConfigV43')
          s=re.sub(r'42','43',s)
          s=s.replace('cp-v43-paid-model-effort-pointer-census-v1','cp-v43-paid-model-effort-nested-surface-census-v1')
          s=s.replace('paid-model-effort-semantic-pointer-popup-census','paid-model-effort-open-popup-nested-structure-census')
          s=s.replace('RUN SEMANTIC POINTER POPUP CENSUS','RUN NESTED EFFORT SURFACE CENSUS').replace('POINTER CENSUS RUNNING...','NESTED CENSUS RUNNING...')
          s=s.replace('Popup snapshot ','Nested snapshot ').replace('POPUP_SURFACE_SNAPSHOT','NESTED_SURFACE_SNAPSHOT')
          s=s.replace('PASS_SEMANTIC_POINTER_POPUP_CENSUS_CAPTURED','PASS_NESTED_EFFORT_STRUCTURE_CENSUS_CAPTURED').replace('PARTIAL_SEMANTIC_POINTER_POPUP_CENSUS_CAPTURED','PARTIAL_NESTED_EFFORT_STRUCTURE_CENSUS_CAPTURED').replace('SEMANTIC_POINTER_POPUP_UNCERTAIN_NO_REPLAY','NESTED_EFFORT_STRUCTURE_UNCERTAIN_NO_REPLAY')
          m=re.search(r'    private String scanOpenSurfaceJs43\(.*?\n    }\n\n    private void eval43',s,re.S)
          assert m
          b=m.group(0)
          b=b.replace('MAXN=12000,MAXMS=260,MAXC=48','MAXN=20000,MAXMS=320,MAXC=64')
          b=b.replace('const sel=\'button,[role=\\\"button\\\"],[role=\\\"menuitem\\\"],[role=\\\"menuitemradio\\\"],[role=\\\"option\\\"],[role=\\\"radio\\\"],[data-radix-collection-item],[aria-checked],[aria-selected]\';','const sel=\'button,[role],[aria-haspopup],[aria-expanded],[aria-controls],[aria-owns],[data-state],[data-slot],[data-radix-collection-item],[aria-checked],[aria-selected]\';')
          b=b.replace('portalish=0;const out=[]','portalish=0,hiddenSem=0,relationRefs=0;const out=[]')
          b=b.replace('if(!V(e))continue;const txt=','const vis=V(e);const txt=')
          b=b.replace("const sem=sl?'LIGHT':sm?'MEDIUM':sh?'HEAVY':sa?'AUTO':st?'THINKING':'INSTANT';", "const sem=sl?'LIGHT':sm?'MEDIUM':sh?'HEAVY':sa?'AUTO':st?'THINKING':'INSTANT';if(!vis)hiddenSem++;")
          b=b.replace("const afp=H(chain.join('>')),q={semantic:sem,", "const controls=N(e.getAttribute('aria-controls')),owns=N(e.getAttribute('aria-owns'));if(controls!==''||owns!=='')relationRefs++;const afp=H(chain.join('>')),q={semantic:sem,visible:vis,has_controls:controls!=='',has_owns:owns!=='',controls_hash:controls?H(controls):'-',owns_hash:owns?H(owns):'-',")
          b=b.replace('selected_count:sc,trigger_found:', 'selected_count:sc,hidden_semantic_count:hiddenSem,relation_ref_node_count:relationRefs,trigger_found:')
          s=s[:m.start()]+b+s[m.end():]
          old='copy43(st, o, "success","complete","snapshot_index","visited_nodes","semantic_candidate_count","light_count","medium_count","heavy_count","auto_count","thinking_count","instant_count","selected_count","trigger_found","trigger_expanded_true","trigger_data_state_open","popup_role_candidate_count","portalish_candidate_count","popup_evidence","candidate_set_hash","ancestor_set_hash");'
          new='copy43(st, o, "success","complete","snapshot_index","visited_nodes","semantic_candidate_count","light_count","medium_count","heavy_count","auto_count","thinking_count","instant_count","selected_count","hidden_semantic_count","relation_ref_node_count","trigger_found","trigger_expanded_true","trigger_data_state_open","popup_role_candidate_count","portalish_candidate_count","popup_evidence","candidate_set_hash","ancestor_set_hash");'
          assert old in s
          s=s.replace(old,new).replace('put43(st,"ui_dispatches",uiDispatches43);','put43(st,"ui_dispatches",uiDispatches43);\n        put43(st,"secondary_ui_dispatches",0);')
          src.write_text(s)
          x=man.read_text()
          old='<activity android:name=".OrchestratorPaidModelEffortPointerCensusV42Activity" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>'
          new='<activity android:name=".OrchestratorPaidModelEffortPointerCensusV42Activity" android:exported="false" />\n        <activity android:name=".OrchestratorPaidModelEffortNestedCensusV43Activity" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>'
          assert old in x
          man.write_text(x.replace(old,new))
          g=gradle.read_text(); g=re.sub(r'versionCode\s+\d+','versionCode 44',g); g=re.sub(r"versionName\s+'[^']+'","versionName '0.41-paid-model-effort-nested-surface-census'",g); gradle.write_text(g)
          PY
          cat > "$PKG/TelemetryConfigV43.java" <<'JAVA'
          package com.homayounisaghar.chatgptwebviewprobe;
          final class TelemetryConfigV43 {
              static final String WEBHOOK_URL="https://webhook.site/__V43_UNCONFIGURED__";
              static final String SOURCE_REF="__SOURCE_REF__";
              static final String COLLECTOR_ID="__COLLECTOR_ID__";
              static final boolean CONFIGURED=false;
              private TelemetryConfigV43(){}
              static boolean isConfigured(){return CONFIGURED&&WEBHOOK_URL.startsWith("https://webhook.site/")&&!WEBHOOK_URL.contains("__V43_UNCONFIGURED__");}
          }
          JAVA

      - name: Create telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          CFG=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV43.java
          TOKEN=$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid");assert x;print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"; READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(); ep,sha,cid=sys.argv[2:]
          s=re.sub(r'WEBHOOK_URL=".*?"',f'WEBHOOK_URL="{ep}"',s); s=re.sub(r'SOURCE_REF=".*?"',f'SOURCE_REF="{sha}"',s); s=re.sub(r'COLLECTOR_ID=".*?"',f'COLLECTOR_ID="{cid}"',s); s=s.replace('CONFIGURED=false','CONFIGURED=true'); p.write_text(s)
          PY
          mkdir -p ci/v43-telemetry
          printf '%s\n' "$TOKEN" > ci/v43-telemetry/collector-id.txt; printf '%s\n' "$READ" > ci/v43-telemetry/read-url.txt; printf '%s\n' "$GITHUB_SHA" > ci/v43-telemetry/source-ref.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v43-paid-model-effort-nested-surface-census-v1","source_ref":"%s"}\n' "$GITHUB_SHA" | curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @- >/dev/null

      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe; SRC="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorPaidModelEffortNestedCensusV43Activity.java"
          grep -Fq 'CLAIMED_BEFORE_SEMANTIC_POINTERDOWN' "$SRC"; grep -Fq "new PointerEvent('pointerdown'" "$SRC"; grep -Fq 'secondary_ui_dispatches",0' "$SRC"; grep -Fq 'hidden_semantic_count' "$SRC"; grep -Fq 'relation_ref_node_count' "$SRC"; grep -Fq 'PASS_NESTED_EFFORT_STRUCTURE_CENSUS_CAPTURED' "$SRC"
          python3 - "$SRC" <<'PY'
          from pathlib import Path
          import re,sys
          s=Path(sys.argv[1]).read_text(); s=re.sub(r'/\*.*?\*/','',s,flags=re.S); s=re.sub(r'//.*','',s)
          assert '.click()' not in s and "pointerover" not in s and "mouseover" not in s and 'MODEL_EFFORT_SELECT_LIGHT' not in s and 'elementFromPoint' not in s
          PY

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Build unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"; echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip; unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe; /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace; cd ../..
          mkdir -p ci/out/signing-tools/lib ci/out/signing-tools/lib64
          cp runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk ci/out/chatgpt-webview-stable-v43-nested-census-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" ci/out/signing-tools/apksigner; cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" ci/out/signing-tools/lib/apksigner.jar; cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" ci/out/signing-tools/zipalign; cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" ci/out/signing-tools/aapt
          LIBCPP=$(find "$ANDROID_SDK_ROOT/build-tools/35.0.0" -type f -name 'libc++.so' | head -n1); cp "$LIBCPP" ci/out/signing-tools/lib64/libc++.so
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"; "$AAPT" dump badging ci/out/chatgpt-webview-stable-v43-nested-census-unsigned.apk > ci/out/badging.txt; "$AAPT" dump permissions ci/out/chatgpt-webview-stable-v43-nested-census-unsigned.apk > ci/out/permissions.txt
          grep -Fq "versionCode='44' versionName='0.41-paid-model-effort-nested-surface-census'" ci/out/badging.txt; grep -Fq "OrchestratorPaidModelEffortNestedCensusV43Activity" ci/out/badging.txt; test "$(grep -c '^uses-permission:' ci/out/permissions.txt)" -eq 3
          sha256sum ci/out/chatgpt-webview-stable-v43-nested-census-unsigned.apk > ci/out/UNSIGNED_SHA256.txt; printf '%s\n' "$GITHUB_SHA" > ci/out/SOURCE_REF.txt
      - uses: actions/upload-artifact@v4
        with: {name: chatgpt-webview-stable-v43-nested-census-signing-kit, path: ci/out, retention-days: 30}
      - uses: actions/upload-artifact@v4
        with: {name: chatgpt-webview-stable-v43-nested-census-telemetry, path: ci/v43-telemetry, retention-days: 30}
