name: Apply Capability Lab v0.11 Exact Drawer Search

on:
  push:
    branches:
      - build/pebble-chat-bridge-v019
    paths:
      - '.github/workflows/apply-capability-lab-v11.yml'
      - 'build_tools/apply_capability_lab_v11_exact_drawer_search.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.11 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 build_tools/apply_capability_lab_v11_exact_drawer_search.py
          git diff --check
          grep -Fq "versionCode 11" runtime_probes/native-capability-lab/app/build.gradle
          grep -Fq "conversation_search_binding_v6_exact_drawer_search" runtime_probes/native-capability-lab/plans/default.json
          grep -Fq "GLOBAL_SEARCH_DRAWER_SEARCH_EXACT_MATCHES" runtime_probes/native-capability-lab/app/src/main/java/com/openai/controlplane/capabilitylab/LabAccessibilityService.java
          grep -Fq "GLOBAL_SEARCH_POST_SEARCH_CLICK_CONTROL_CENSUS" runtime_probes/native-capability-lab/app/src/main/java/com/openai/controlplane/capabilitylab/LabAccessibilityService.java
          grep -Fq "findUniqueExactSemanticAcrossRoots" runtime_probes/native-capability-lab/app/src/main/java/com/openai/controlplane/capabilitylab/LabAccessibilityService.java

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime_probes/native-capability-lab .github/workflows/native-capability-lab.yml
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "Calibrate exact post-Menu Search in Capability Lab v0.11"
          git push origin HEAD:build/pebble-chat-bridge-v019
