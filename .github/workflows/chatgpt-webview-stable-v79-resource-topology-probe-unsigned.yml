name: ChatGPT WebView Stable v0.77 Resource Topology Probe Unsigned

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-stable-v79-resource-topology-probe-unsigned.yml'
      - 'ci/generate_chatgpt_webview_v79_resource_topology_probe.py'
      - 'ci/generate_chatgpt_webview_v78_resource_final_bounded_wrapped.py'
      - 'ci/generate_chatgpt_webview_v77_resource_provenance_hardened.py'
      - 'ci/generate_chatgpt_webview_v77_resource_provenance_hardened_fix1.py'
      - 'ci/generate_chatgpt_webview_v76_resource_tools_consolidated.py'
      - 'ci/generate_chatgpt_webview_v76_resource_tools_consolidated_fix1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Generate v0.77 diagnostic source
        run: python3 ci/generate_chatgpt_webview_v79_resource_topology_probe.py

      - name: Create fresh telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          CFG=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV79.java
          TOKEN=$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid");assert x;print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"
          READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(); ep,sha,cid=sys.argv[2:]
          s=re.sub(r'WEBHOOK_URL=".*?"',f'WEBHOOK_URL="{ep}"',s)
          s=re.sub(r'SOURCE_REF=".*?"',f'SOURCE_REF="{sha}"',s)
          s=re.sub(r'COLLECTOR_ID=".*?"',f'COLLECTOR_ID="{cid}"',s)
          s=s.replace('CONFIGURED=false','CONFIGURED=true')
          p.write_text(s)
          PY
          mkdir -p ci/v79-resource-topology-telemetry
          printf '%s\n' "$TOKEN" > ci/v79-resource-topology-telemetry/collector-id.txt
          printf '%s\n' "$READ" > ci/v79-resource-topology-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v79-resource-topology-telemetry/source-ref.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v79-resource-topology-probe-v1","scenario_id":"resource-topology-read-only","control_sync":"EVENT_DRIVEN_NO_FIXED_DELAY_POLL_TIMEOUT","audit":"READ_ONLY_SANITIZED_RESOURCE_TOPOLOGY"}\n' | curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @- >/dev/null

      - name: End-to-end diagnostic static audit
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          PKG=$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe
          ACT=$PKG/OrchestratorResourceToolsV79Activity.java
          MAN=$ROOT/app/src/main/AndroidManifest.xml
          GRADLE=$ROOT/app/build.gradle
          test -f "$ACT"
          test -f "$PKG/TelemetryConfigV79.java"
          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe.diag'" "$GRADLE"
          grep -Fq 'versionCode 80' "$GRADLE"
          grep -Fq "versionName '0.77-stable-diag-resource-topology-probe'" "$GRADLE"
          grep -Fq 'OrchestratorResourceToolsV79Activity' "$MAN"
          grep -Fq 'ControlPlaneAccessibilityServiceV51' "$MAN"
          grep -Fq '@xml/cp_accessibility_service_v51' "$MAN"
          python3 - "$ACT" <<'PY'
          import pathlib,sys,re
          s=pathlib.Path(sys.argv[1]).read_text()
          required=[
            'TOPOLOGY PROBE','ACTION DISABLED','RESOURCE_TOPOLOGY_PROBE_STARTED_READ_ONLY','RESOURCE_TOPOLOGY_CANDIDATE',
            'PASS_RESOURCE_TOPOLOGY_PROBE_COMPLETE','RESOURCE_ACTION_DISABLED_DIAGNOSTIC_BUILD','resourceTopologyProbeV79Js',
            'relation_last_assistant','relation_composer','prev_is_last_assistant','resource_wrapper_present',
            'nearest_landmark_sig_hash','lca_last_assistant_sig_hash','lca_composer_sig_hash','strong_wrapped_evidence',
            'PASS_TOOLS_HIDDEN_MENU_CENSUS_COMPLETE','TelemetryConfigV79'
          ]
          for x in required: assert x in s,x
          probe=s[s.index('private String resourceTopologyProbeV79Js'):s.index('private String resourceResolverV4Js')]
          action=s[s.index('private void runResourceActionV79'):s.index('private String resourceResolverV4Js')]
          for bad in ['getBoundingClientRect','elementFromPoint','document.evaluate','XPathResult','innerText','textContent','setTimeout(','setInterval(']: assert bad not in probe,bad
          for bad in ['startActivity(','.click();','resourceNavigationPending=true','resourceDownloadPending=true']: assert bad not in action,bad
          for bad in ['Thread.sleep','ScheduledExecutorService','TimerTask','dispatchTouchEvent(','performClick(','ACTION_SET_PROGRESS','CookieManager','getCookie(','addJavascriptInterface']:
            assert bad not in s,bad
          assert 'raw_url_remote",false' in s and 'raw_text_remote",false' in s and 'raw_html_remote",false' in s
          print('PASS v0.77 read-only Resource topology diagnostic static audit')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build and prove exact artifact identity
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..
          OUT=ci/v79-resource-topology-out
          mkdir -p "$OUT"
          UNSIGNED=runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$OUT/chatgpt-webview-v0.77-resource-topology-probe-exact-source-aligned-unsigned.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$ALIGNED" > "$OUT/badging.txt"
          "$BT/aapt" dump permissions "$ALIGNED" > "$OUT/permissions.txt"
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe.diag' versionCode='80' versionName='0.77-stable-diag-resource-topology-probe'" "$OUT/badging.txt"
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorResourceToolsV79Activity'" "$OUT/badging.txt"
          test "$(grep -c '^uses-permission:' "$OUT/permissions.txt")" -eq 3
          grep -Fq 'android.permission.INTERNET' "$OUT/permissions.txt"
          grep -Fq 'android.permission.RECORD_AUDIO' "$OUT/permissions.txt"
          grep -Fq 'android.permission.MODIFY_AUDIO_SETTINGS' "$OUT/permissions.txt"
          cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
          java -jar "$OUT/apksigner.jar" --version > "$OUT/APKSIGNER_VERSION.txt"
          sha256sum "$OUT/apksigner.jar" > "$OUT/APKSIGNER_JAR_SHA256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"
          printf '%s\n' 'RESOURCE_TOPOLOGY_PROBE_READ_ONLY_ZERO_CLICK_ACTION_DISABLED' > "$OUT/FRONTIER_MODE.txt"
          printf '%s\n' 'EVENT_DRIVEN_NO_FIXED_DELAY_POLL_TIMEOUT' > "$OUT/CONTROL_SYNC.txt"
          printf '%s\n' 'b7aea08158252dcad79345608ce2e76e970e4cf613414db299579f46d9924c48' > "$OUT/EXPECTED_SIGNER_CERT_SHA256.txt"
          sha256sum "$ALIGNED" > "$OUT/ALIGNED_UNSIGNED_SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.77-resource-topology-probe-${{ github.run_id }}-unsigned
          path: ci/v79-resource-topology-out
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.77-resource-topology-probe-${{ github.run_id }}-telemetry
          path: ci/v79-resource-topology-telemetry
          if-no-files-found: error
          retention-days: 30
