name: Read v0.38 Effort Popup Once
on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths: ['.github/workflows/read-v40-effort-popup-once.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read and summarize v0.38 effort popup telemetry
        shell: bash
        env:
          READ_URL: 'https://webhook.site/token/1125e21e-3990-40d7-96f4-b09e17a52864/requests?sorting=oldest&per_page=100'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, collections
          with urllib.request.urlopen(os.environ['READ_URL'], timeout=20) as r:
              o=json.load(r)
          def parse(x):
              for k in ('content','body'):
                  v=x.get(k)
                  if isinstance(v,dict): return v
                  if isinstance(v,str):
                      try:return json.loads(v)
                      except Exception: pass
              return None
          ps=[p for x in o.get('data',[]) if isinstance((p:=parse(x)),dict)]
          print('API_ROWS',len(o.get('data',[])),'TOTAL',o.get('total',o.get('total_count','?')),'PARSED',len(ps))
          tests=collections.defaultdict(list)
          for p in ps:
              tid=p.get('test_id') or p.get('scenario_id') or p.get('kind') or 'NO_ID'
              tests[tid].append(p)
          keys=('success','complete','effort_control_count','effort_semantic','effort_control_hash','effort_has_popup','effort_expanded_true','popup_count','group_count','light_count','medium_count','heavy_count','auto_count','enabled_light_count','enabled_medium_count','option_count','group_hash','baseline_hash','current_control_hash','target_option_hash','restore_option_hash','popup_group_hash','claim_action','claim_status','ui_clicks','model_clicks','selection_clicks','dom_clicks','capability_dispatches','matches','clicked')
          for tid,rows in tests.items():
              print('TEST',tid,'ROWS',len(rows))
              for p in sorted(rows,key=lambda q:(q.get('timestamp_epoch_ms',0),q.get('seq',-1))):
                  ph=p.get('phase') or p.get('kind') or '-'
                  cls=p.get('classification') or '-'
                  st=p.get('state') if isinstance(p.get('state'),dict) else {}
                  slim={k:st.get(k) for k in keys if k in st}
                  if 'options' in st: slim['options']=st['options']
                  print(json.dumps({'seq':p.get('seq'),'phase':ph,'classification':cls,'state':slim},sort_keys=True))
          PY
