name: Build TraceParts Preview Extractor v1.1 APK

on:
  push:
    branches: ['traceparts-preview-extractor-build']
    paths:
      - 'traceparts-preview-extractor/android/app/src/main/java/com/capabilityfabric/tracepartsgrabber/MainActivityV11.java'
      - 'traceparts-preview-extractor/android/app/src/main/assets/tpx_hook.js'
      - 'traceparts-preview-extractor/android/app/src/main/AndroidManifest.xml'
      - '.github/workflows/build-traceparts-preview-extractor-v11.yml'
  workflow_dispatch:

concurrency:
  group: traceparts-preview-extractor-v11-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore existing update-compatible signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: traceparts-preview-extractor-public-signing-v1

      - name: Require prior signing lineage
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"

      - name: Stamp v1.1 version for supporting build workspace
        shell: bash
        run: |
          set -euo pipefail
          FILE='traceparts-preview-extractor/android/app/build.gradle'
          sed -i 's/versionCode 1/versionCode 2/' "$FILE"
          sed -i "s/versionName '1.0.0'/versionName '1.1.0'/" "$FILE"
          grep -q 'versionCode 2' "$FILE"
          grep -q "versionName '1.1.0'" "$FILE"

      - name: Build signed release APK
        run: gradle -p traceparts-preview-extractor/android :app:assembleRelease --stacktrace

      - name: Verify APK and update compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK='traceparts-preview-extractor/android/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'assets/tpx_hook.js'
          unzip -p "$APK" classes.dex | strings | grep -Fq 'com/capabilityfabric/tracepartsgrabber/MainActivityV11'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          grep -qi '2cb0f1c41295d02494e6ae540e59cb9f398a9847fc9702d92b6ee2bba7f63050' apk-signing.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.capabilityfabric.tracepartsgrabber'" apk-badging.txt
          grep -q "versionCode='2'" apk-badging.txt
          grep -q "versionName='1.1.0'" apk-badging.txt
          grep -q "launchable-activity: name='com.capabilityfabric.tracepartsgrabber.MainActivityV11'" apk-badging.txt
          if grep -q 'application-debuggable' apk-badging.txt; then
            echo 'Release APK must not be debuggable' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > apk-manifest.txt
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" TracePartsPreviewExtractor-v1.1.0.apk

      - name: Upload verified APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: TracePartsPreviewExtractor-v1.1.0-update-compatible-signed-release
          path: |
            TracePartsPreviewExtractor-v1.1.0.apk
            apk-signing.txt
            apk-badging.txt
            apk-manifest.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
