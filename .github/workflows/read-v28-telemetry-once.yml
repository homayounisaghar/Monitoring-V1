name: Read Stable v0.28 Telemetry Once

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/read-v28-telemetry-once.yml'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read and classify latest v0.28 telemetry
        env:
          READ_URL: https://webhook.site/token/fd863520-e30f-4c74-b28a-1989a9059e1d/requests?sorting=oldest&per_page=100
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, collections
          SOURCE='903d175b85dd3b075f7dd87f5b6e63763b833f54'
          SCHEMA='cp-v28-voice-supervisor-v1'
          req=urllib.request.Request(os.environ['READ_URL'],headers={'Accept':'application/json','User-Agent':'cp28-readback'})
          with urllib.request.urlopen(req,timeout=20) as r:
              root=json.load(r)
          rows=root.get('data',root if isinstance(root,list) else [])
          parsed=[]
          for row in rows:
              raw=row.get('content','') if isinstance(row,dict) else ''
              try: p=json.loads(raw)
              except Exception: continue
              if p.get('schema_version')==SCHEMA and p.get('source_ref')==SOURCE:
                  parsed.append(p)
          print('API_ROWS',len(rows),'PARSED_MATCH',len(parsed),'TOTAL',root.get('total'))
          tests=collections.defaultdict(list)
          build=[]
          for p in parsed:
              tid=str(p.get('test_id','-'))
              if tid.startswith('cp28-'): tests[tid].append(p)
              else: build.append(p)
          print('BUILD_ROWS',[(p.get('kind'),p.get('phase'),p.get('classification')) for p in build])
          if not tests:
              raise SystemExit('NO_CP28_TEST_FOUND')
          def rank(ps):
              return max((p.get('timestamp_epoch_ms') or 0) for p in ps)
          tid,ps=max(tests.items(),key=lambda kv:rank(kv[1]))
          ps=sorted(ps,key=lambda p:((p.get('timestamp_epoch_ms') or 0),(p.get('seq') or 0)))
          print('LATEST_TEST',tid,'ROWS',len(ps),'MAXSEQ',max((p.get('seq') or 0) for p in ps))
          for p in ps:
              s=p.get('state') or {}
              keep={k:s.get(k) for k in [
                  'session_state','mic_lease_mode','voice_start_count','voice_end_count','mute_count','unmute_count',
                  'start_count','end_count','dispatched_side_effects','scan_complete','scan_budget_exceeded','scan_truncated',
                  'matches','action','claim_status','receipt','ready_count','active_end_count','active_mute_count','active_unmute_count'
              ] if k in s}
              print('ROW',p.get('seq'),p.get('phase'),p.get('classification'),json.dumps(keep,sort_keys=True,separators=(',',':')))
          finals=[p for p in ps if p.get('phase')=='FINAL']
          print('FINALS',[(p.get('classification'),p.get('state')) for p in finals])
          bad=[p for p in ps if 'UNCERTAIN' in str(p.get('classification','')) or 'FAIL' in str(p.get('classification','')) or 'BLOCK' in str(p.get('classification',''))]
          print('BAD_ROWS',[(p.get('seq'),p.get('phase'),p.get('classification')) for p in bad])
          PY
