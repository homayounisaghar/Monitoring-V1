name: Unified ChatGPT Capability Lab APK

on:
  push:
    branches:
      - build/pebble-chat-bridge-v019
    paths:
      - '.github/workflows/native-capability-lab.yml'
      - 'runtime_probes/native-capability-lab/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capability Lab safety prechecks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/native-capability-lab
          SVC="$ROOT/app/src/main/java/com/openai/controlplane/capabilitylab/LabAccessibilityService.java"
          STORE="$ROOT/app/src/main/java/com/openai/controlplane/capabilitylab/LabStore.java"
          MAIN="$ROOT/app/src/main/java/com/openai/controlplane/capabilitylab/MainActivity.java"
          SHORTCUT="$ROOT/app/src/main/java/com/openai/controlplane/capabilitylab/LabShortcutReadSide.java"
          MAN="$ROOT/app/src/main/AndroidManifest.xml"
          PLAN="$ROOT/plans/default.json"
          grep -Fq 'com.openai.chatgpt' "$ROOT/app/src/main/java/com/openai/controlplane/capabilitylab/ProfileGuard.java"
          grep -Fq 'ACTION_CLICK' "$SVC"
          grep -Fq 'WRITE_CLAIM' "$STORE"
          grep -Fq 'advanceStepIfCurrent' "$STORE"
          grep -Fq 'ACCESSIBILITY_METADATA' "$SVC"
          grep -Fq 'SHORTCUT_HOST_PERMISSION' "$SHORTCUT"
          grep -Fq 'TEST COMPLETE' "$MAIN"
          grep -Fq 'android:canTakeScreenshot="true"' "$ROOT/app/src/main/res/xml/accessibility_service_config.xml"
          grep -Fq 'android.permission.INTERNET' "$MAN"
          grep -Fq 'targetSignerSha256' "$PLAN"
          grep -Fq 'conversation_id_readside_v2' "$PLAN"
          ! grep -R -n -E 'api\.openai\.com|Authorization: Bearer|access_token|refresh_token' "$ROOT"
          ! grep -Fq 'dispatchGesture' "$SVC"
          ! grep -Fq 'getBoundsInScreen' "$SVC"
          ! grep -Fq 'GLOBAL_ACTION_' "$SVC"
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('runtime_probes/native-capability-lab')
          s = (root / 'app/src/main/java/com/openai/controlplane/capabilitylab/LabAccessibilityService.java').read_text()
          # The suite has exactly one mutating primitive: the bounded semantic Send click.
          if s.count('performAction(AccessibilityNodeInfo.ACTION_CLICK)') != 1:
              raise SystemExit('Capability Lab must contain exactly one ACTION_CLICK write site')
          if 'completeStep();' in s:
              raise SystemExit('unguarded bare completeStep() found; step-token hardening regressed')
          p = (root / 'plans/default.json').read_text()
          data = json.loads(p)
          assert data['schema'] == 1
          assert data['targetVersion'] == '1.2026.237'
          assert data['suite'] == 'conversation_id_readside_v2'
          ops = [x['op'] for x in data['steps']]
          assert ops == [
              'launch_prompt', 'semantic_send', 'return_lab', 'wait',
              'notification_snapshot', 'channel_snapshot', 'resume_chatgpt',
              'capture_tree', 'return_lab', 'verify_candidates', 'finish'
          ]
          assert data['steps'][3]['ms'] == 30000
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/native-capability-lab/local.properties

      - name: Build Capability Lab
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/native-capability-lab
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleDebug --stacktrace
          mkdir -p ../../ci/out
          cp app/build/outputs/apk/debug/app-debug.apk ../../ci/out/chatgpt-capability-lab.apk

      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort | tail -n 1)
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs ci/out/chatgpt-capability-lab.apk | tee ci/out/apksigner.txt
          "$AAPT" dump badging ci/out/chatgpt-capability-lab.apk | tee ci/out/badging.txt
          grep -Fq "package: name='com.openai.controlplane.capabilitylab' versionCode='2' versionName='0.2-native-capability-lab'" ci/out/badging.txt
          sha256sum ci/out/chatgpt-capability-lab.apk | tee ci/out/SHA256.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-capability-lab
          path: |
            ci/out/chatgpt-capability-lab.apk
            ci/out/SHA256.txt
            ci/out/apksigner.txt
            ci/out/badging.txt

      - name: Publish prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT=$(printf '%s' "$GITHUB_SHA" | cut -c1-12)
          TAG="chatgpt-capability-lab-gha-$SHORT"
          gh release create "$TAG" \
            ci/out/chatgpt-capability-lab.apk#chatgpt-capability-lab.apk \
            ci/out/SHA256.txt#SHA256.txt \
            --target "$GITHUB_SHA" \
            --title "ChatGPT Capability Lab $SHORT" \
            --notes "Capability Lab v0.2: serialized/idempotent step transitions after the v0.1 race observed on-device; explicit TEST COMPLETE UI; deeper privacy-redacted Accessibility metadata harvesting; read-only ChatGPT shortcut-host metadata attempt; exact ChatGPT 1.2026.237 + pinned signer fail-closed; one bounded semantic Send write site; candidate /c/<id> reopen verification. INTERNET remains test-plan transport only; no ChatGPT credentials/private APIs and no coordinate writes." \
            --prerelease
