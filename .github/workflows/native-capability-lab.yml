name: Unified ChatGPT Capability Lab CI

on:
  push:
    branches:
      - build/pebble-chat-bridge-v019
    paths:
      - '.github/workflows/native-capability-lab.yml'
      - 'runtime_probes/native-capability-lab/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capability Lab safety prechecks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/native-capability-lab
          SVC="$ROOT/app/src/main/java/com/openai/controlplane/capabilitylab/LabAccessibilityService.java"
          STORE="$ROOT/app/src/main/java/com/openai/controlplane/capabilitylab/LabStore.java"
          MAIN="$ROOT/app/src/main/java/com/openai/controlplane/capabilitylab/MainActivity.java"
          SHORTCUT="$ROOT/app/src/main/java/com/openai/controlplane/capabilitylab/LabShortcutReadSide.java"
          OBSERVER="$ROOT/app/src/main/java/com/openai/controlplane/capabilitylab/LabShizukuObserver.java"
          MAN="$ROOT/app/src/main/AndroidManifest.xml"
          PLAN="$ROOT/plans/default.json"
          grep -Fq 'com.openai.chatgpt' "$ROOT/app/src/main/java/com/openai/controlplane/capabilitylab/ProfileGuard.java"
          grep -Fq 'WRITE_CLAIM' "$STORE"
          grep -Fq 'advanceStepIfCurrent' "$STORE"
          grep -Fq 'markSearchBindingVerified' "$STORE"
          grep -Fq 'GLOBAL_SEARCH_ENTRY_CONTROL_CENSUS' "$SVC"
          grep -Fq 'chatGptRoots()' "$SVC"
          grep -Fq 'getWindows()' "$SVC"
          grep -Fq 'performBoundedNavigation' "$SVC"
          grep -Fq 'Open conversation history' "$SVC"
          grep -Fq 'Open sidebar' "$SVC"
          grep -Fq '"Menu"' "$SVC"
          grep -Fq 'findHistorySearchFieldAcrossRoots' "$SVC"
          grep -Fq 'findUniqueHistorySearchEntryAcrossRoots' "$SVC"
          grep -Fq 'chatgpt.history-search' "$SVC"
          grep -Fq 'GLOBAL_SEARCH_QUERY ACTION_SET_TEXT' "$SVC"
          grep -Fq 'GLOBAL_SEARCH_REOPEN_VERIFIED' "$SVC"
          grep -Fq 'GLOBAL_SEARCH_TIMEOUT_DIAGNOSTIC' "$SVC"
          grep -Fq 'styleButton(accessibilityButton' "$MAIN"
          grep -Fq 'READY TO RUN — press the BLUE RUN button' "$MAIN"
          grep -Fq 'ColorStateList' "$MAIN"
          grep -Fq 'TEST COMPLETE' "$MAIN"
          grep -Fq 'SHORTCUT_HOST_PERMISSION' "$SHORTCUT"
          grep -Fq 'classification=LAB_ONLY_DISCOVERY' "$OBSERVER"
          grep -Fq "dev.rikka.shizuku:api:13.1.5" "$ROOT/app/build.gradle"
          grep -Fq "dev.rikka.shizuku:provider:13.1.5" "$ROOT/app/build.gradle"
          grep -Fq 'rikka.shizuku.ShizukuProvider' "$MAN"
          grep -Fq '${applicationId}.shizuku' "$MAN"
          grep -Fq 'android.permission.INTERACT_ACROSS_USERS_FULL' "$MAN"
          grep -Fq 'flagRetrieveInteractiveWindows' "$ROOT/app/src/main/res/xml/accessibility_service_config.xml"
          grep -Fq 'android.permission.INTERNET' "$MAN"
          grep -Fq 'ChatGPT Capability Lab Stable' "$MAN"
          grep -Fq 'targetSignerSha256' "$PLAN"
          grep -Fq 'conversation_search_binding_v4_menu_calibration' "$PLAN"
          grep -Fq 'global_search_binding' "$PLAN"
          ! grep -R -n -E 'api\.openai\.com|Authorization: Bearer|access_token|refresh_token' "$ROOT"
          ! grep -Fq 'dispatchGesture' "$SVC"
          ! grep -Fq 'getBoundsInScreen' "$SVC"
          ! grep -Fq 'GLOBAL_ACTION_' "$SVC"
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('runtime_probes/native-capability-lab')
          s = (root / 'app/src/main/java/com/openai/controlplane/capabilitylab/LabAccessibilityService.java').read_text()
          # Two code sites only: proven Send click plus generic bounded navigation click.
          # The latter is called only after exact semantic/unique-result selection.
          if s.count('performAction(AccessibilityNodeInfo.ACTION_CLICK)') != 2:
              raise SystemExit('Capability Lab v0.9 must contain exactly two ACTION_CLICK code sites')
          if s.count('performAction(AccessibilityNodeInfo.ACTION_SET_TEXT') != 1:
              raise SystemExit('Capability Lab v0.9 must contain exactly one Search ACTION_SET_TEXT site')
          if 'completeStep();' in s:
              raise SystemExit('unguarded bare completeStep() found; step-token hardening regressed')
          gradle = (root / 'app/build.gradle').read_text()
          assert "applicationId 'com.openai.controlplane.capabilitylab.stable'" in gradle
          assert 'versionCode 9' in gradle
          assert "versionName '0.9-native-capability-lab-stable-menu-calibration'" in gradle
          data = json.loads((root / 'plans/default.json').read_text())
          assert data['schema'] == 1
          assert data['targetVersion'] == '1.2026.237'
          assert data['suite'] == 'conversation_search_binding_v4_menu_calibration'
          ops = [x['op'] for x in data['steps']]
          assert ops == [
              'launch_prompt', 'capture_tree', 'semantic_send', 'capture_tree',
              'wait', 'global_search_binding', 'return_lab', 'verify_candidates', 'finish'
          ]
          assert data['steps'][4]['ms'] == 8000
          assert data['steps'][5]['timeoutMs'] == 35000
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/native-capability-lab/local.properties

      - name: Build verification APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/native-capability-lab
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleDebug --stacktrace
          mkdir -p ../../ci/out
          cp app/build/outputs/apk/debug/app-debug.apk ../../ci/out/chatgpt-capability-lab-ci-only.apk

      - name: Verify package metadata
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort | tail -n 1)
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs ci/out/chatgpt-capability-lab-ci-only.apk | tee ci/out/apksigner.txt
          "$AAPT" dump badging ci/out/chatgpt-capability-lab-ci-only.apk | tee ci/out/badging.txt
          grep -Fq "package: name='com.openai.controlplane.capabilitylab.stable' versionCode='9' versionName='0.9-native-capability-lab-stable-menu-calibration'" ci/out/badging.txt
          sha256sum ci/out/chatgpt-capability-lab-ci-only.apk | tee ci/out/SHA256.txt

      - name: Upload CI-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-capability-lab-ci-only
          path: |
            ci/out/chatgpt-capability-lab-ci-only.apk
            ci/out/SHA256.txt
            ci/out/apksigner.txt
            ci/out/badging.txt
