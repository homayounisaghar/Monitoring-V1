name: Read v0.36 Direct Radio Once
on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths: ['.github/workflows/read-v38-direct-radio-once.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read and summarize v0.36 direct-radio telemetry
        shell: bash
        env:
          READ_URL: 'https://webhook.site/token/19a5b8f0-ddfc-4046-b044-c974b5591c1f/requests?sorting=oldest&per_page=100'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, collections
          with urllib.request.urlopen(os.environ['READ_URL'], timeout=20) as r:
              o=json.load(r)
          def parse(x):
              for k in ('content','body'):
                  v=x.get(k)
                  if isinstance(v,dict): return v
                  if isinstance(v,str):
                      try:return json.loads(v)
                      except Exception: pass
              return None
          ps=[p for x in o.get('data',[]) if isinstance((p:=parse(x)),dict)]
          print('API_ROWS',len(o.get('data',[])),'TOTAL',o.get('total',o.get('total_count','?')),'PARSED',len(ps))
          tests=collections.defaultdict(list)
          for p in ps:
              tid=p.get('test_id') or p.get('scenario_id') or p.get('kind') or 'NO_ID'
              tests[tid].append(p)
          keep_keys=('radio_count','selected_count','enabled_count','header_radio_count','light_count','medium_count','light_selected_count','medium_selected_count','same_group_light_medium','baseline_hash','target_hash','baseline_semantic','target_semantic','claim_action','claim_status','click_count','target_receipt','restore_receipt','group_hash','radio_set_hash','selected_set_hash','dom_clicks','capability_dispatches','mapping_ok','complete','success')
          for tid,rows in tests.items():
              print('TEST',tid,'ROWS',len(rows))
              for p in sorted(rows,key=lambda q:(q.get('timestamp_epoch_ms',0),q.get('seq',-1))):
                  ph=p.get('phase') or p.get('kind') or '-'
                  cls=p.get('classification') or '-'
                  st=p.get('state') if isinstance(p.get('state'),dict) else {}
                  slim={k:st.get(k) for k in keep_keys if k in st}
                  if 'radios' in st: slim['radios']=st['radios']
                  print(json.dumps({'seq':p.get('seq'),'phase':ph,'classification':cls,'state':slim},sort_keys=True))
          PY
