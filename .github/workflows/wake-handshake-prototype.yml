name: Wake Handshake Prototype Android

on:
  push:
    branches:
      - project/wake-handshake-prototype
    paths:
      - 'android/wake-handshake-prototype/**'
      - '.github/workflows/wake-handshake-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROOT: android/wake-handshake-prototype
      PACKAGE: com.homayounisaghar.wakehandshakeprobe
      VERSION_CODE: '5'
      VERSION_NAME: 0.1.4
      V012_BASE: 087f8e84ee96835a17b8edcc5cdb9d9b0b2f2cf8
      EXPECTED_SIGNER_SHA256: b8bfbfb9d7962afd739c990d661e94c457dfb37cb6ab8516cdb54c3f95b9d2ec
    steps:
      - name: Checkout exact commit with baseline history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify v0.1.2 auth-session baseline plus v0.1.4 technical patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          root=Path('android/wake-handshake-prototype')
          java=root/'app/src/main/java/com/homayounisaghar/wakehandshakeprobe'
          s=(java/'MainActivity.java').read_text()
          setup=(java/'SetupActivity.java').read_text()
          svc=(java/'LockedListeningService.java').read_text()
          g=(root/'app/build.gradle').read_text()
          m=(root/'app/src/main/AndroidManifest.xml').read_text()
          base='087f8e84ee96835a17b8edcc5cdb9d9b0b2f2cf8'

          def git_show(rel):
              return subprocess.check_output(
                  ['git','show',f'{base}:{rel}'],
                  text=True
              )

          # Auth/session-supporting files are exact v0.1.2 bytes.
          assert setup == git_show(str(java/'SetupActivity.java'))
          assert svc == git_show(str(java/'LockedListeningService.java'))
          assert m == git_show(str(root/'app/src/main/AndroidManifest.xml'))

          # MainActivity must equal v0.1.2 after removing only the v0.1.4
          # punctuation-only command guard.
          inserted='''            if (!hasCommandContent(chunk)) {
                          setStatus("Ignoring punctuation — waiting for command…");
                          return;
                      }
          '''
          # Preserve exact indentation/newlines used by source.
          inserted = inserted.replace('              setStatus', '                setStatus') \
                             .replace('              return', '                return') \
                             .replace('          }\n', '            }\n')
          assert inserted in s
          stripped=s.replace(inserted,'',1)
          assert stripped == git_show(str(java/'MainActivity.java'))

          checks=[
              ("package", "applicationId 'com.homayounisaghar.wakehandshakeprobe'" in g),
              ("version code", "versionCode 5" in g),
              ("version name", "versionName '0.1.4'" in g),
              ("punctuation-only command ignored", 'if (!hasCommandContent(chunk))' in s and 'Ignoring punctuation — waiting for command…' in s),
              ("two delays preserved", 'Wake delay' in s and 'Command delay' in s),
              ("locked screen preserved", 'Keep listening when screen is locked' in s),
              ("safe insets preserved", 'WindowInsets.Type.systemBars() | WindowInsets.Type.displayCutout()' in s),
          ]
          bad=[name for name,ok in checks if not ok]
          if bad:
              raise SystemExit('contract failure: '+', '.join(bad))
          print('PASS v0.1.4: exact v0.1.2 auth/session baseline + punctuation-only command guard')
          PY

      - name: Build unsigned release
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$ROOT" --no-daemon assembleRelease --stacktrace

      - name: Build unsigned aligned signing kit
        shell: bash
        run: |
          set -euo pipefail
          U="$ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT="$ROOT/out"
          A="$OUT/Wake-Handshake-Prototype-v0.1.4-aligned-unsigned.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$OUT"
          test -f "$U"
          "$BT/zipalign" -f -p 4 "$U" "$A"
          "$BT/zipalign" -c -v 4 "$A" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$A" > "$OUT/badging.txt"
          grep -Fq "package: name='$PACKAGE' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" "$OUT/badging.txt"
          sha256sum "$A" | tee "$OUT/UNSIGNED_SHA256.txt"
          printf '%s\n' "$EXPECTED_SIGNER_SHA256" > "$OUT/EXPECTED_SIGNER_CERT_SHA256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"
          printf 'package=%s\nversion_code=%s\nversion_name=%s\nexpected_signer_sha256=%s\nsource_ref=%s\nauth_baseline=%s\nstage=unsigned_aligned_release\n' \
            "$PACKAGE" "$VERSION_CODE" "$VERSION_NAME" "$EXPECTED_SIGNER_SHA256" "$GITHUB_SHA" "$V012_BASE" \
            > "$OUT/BUILD_METADATA.txt"

      - name: Upload signing kit
        uses: actions/upload-artifact@v4
        with:
          name: wake-handshake-prototype-v0.1.4-signing-kit
          path: |
            android/wake-handshake-prototype/out/Wake-Handshake-Prototype-v0.1.4-aligned-unsigned.apk
            android/wake-handshake-prototype/out/UNSIGNED_SHA256.txt
            android/wake-handshake-prototype/out/EXPECTED_SIGNER_CERT_SHA256.txt
            android/wake-handshake-prototype/out/SOURCE_REF.txt
            android/wake-handshake-prototype/out/BUILD_METADATA.txt
            android/wake-handshake-prototype/out/badging.txt
            android/wake-handshake-prototype/out/zipalign-verify.txt
          if-no-files-found: error
          retention-days: 30
