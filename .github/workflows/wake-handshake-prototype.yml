name: Wake Handshake Prototype Android

on:
  push:
    branches:
      - project/wake-handshake-prototype
    paths:
      - 'android/wake-handshake-prototype/**'
      - '.github/workflows/wake-handshake-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROOT: android/wake-handshake-prototype
      PACKAGE: com.homayounisaghar.wakehandshakeprobe
      VERSION_CODE: '4'
      VERSION_NAME: 0.1.3
      EXPECTED_SIGNER_SHA256: b8bfbfb9d7962afd739c990d661e94c457dfb37cb6ab8516cdb54c3f95b9d2ec
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Static v0.1.3 contract checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('android/wake-handshake-prototype')
          s=(root/'app/src/main/java/com/homayounisaghar/wakehandshakeprobe/MainActivity.java').read_text()
          svc=(root/'app/src/main/java/com/homayounisaghar/wakehandshakeprobe/LockedListeningService.java').read_text()
          g=(root/'app/build.gradle').read_text()
          m=(root/'app/src/main/AndroidManifest.xml').read_text()
          checks=[
              ("package", "applicationId 'com.homayounisaghar.wakehandshakeprobe'" in g),
              ("version code", "versionCode 4" in g),
              ("version name", "versionName '0.1.3'" in g),
              ("delay values", 'private static final int[] DELAYS_MS = {0, 800, 1200, 1500, 2000, 2500};' in s),
              ("separate wake pref", 'PREF_WAKE_DELAY = "wake_silence_delay_ms"' in s),
              ("separate command pref", 'PREF_COMMAND_DELAY = "command_silence_delay_ms"' in s),
              ("wake delay UI", 'label("Wake delay")' in s and 'wakeDelaySpinner' in s),
              ("command delay UI", 'label("Command delay")' in s and 'commandDelaySpinner' in s),
              ("phase enum", 'private enum ListeningPhase { WAKE, COMMAND }' in s),
              ("phase-selected delay", 'return listeningPhase == ListeningPhase.COMMAND ? commandDelayMs : wakeDelayMs;' in s),
              ("wake only enters command", 'listeningPhase = ListeningPhase.COMMAND;' in s),
              ("command next chunk double ding", 'if (listeningPhase == ListeningPhase.COMMAND)' in s and 'playDings(2);' in s),
              ("punctuation-only command ignored", 'if (!hasCommandContent(chunk))' in s and 'Ignoring punctuation — waiting for command…' in s),
              ("command returns wake", 'Command received — listening for wake phrase…' in s),
              ("direct wake command", 'match == WakeMatch.WAKE_WITH_COMMAND' in s),
              ("punctuation-only wake", 'Character.isLetterOrDigit(cp)' in s),
              ("double ding spacing", 'main.postDelayed(this::playDing, 260L);' in s),
              ("locked checkbox", 'Keep listening when screen is locked' in s),
              ("locked lifecycle gate", 'keepListeningLocked() && isDeviceLockedOrScreenOff()' in s),
              ("foreground service", 'LockedListeningService' in m and 'foregroundServiceType="microphone"' in m),
              ("fgs mic permission", 'android.permission.FOREGROUND_SERVICE_MICROPHONE' in m),
              ("wake lock", 'PowerManager.PARTIAL_WAKE_LOCK' in svc),
              ("safe insets", 'WindowInsets.Type.systemBars() | WindowInsets.Type.displayCutout()' in s),
              ("latest chunk", 'lastChunk.setText(chunk);' in s),
          ]
          bad=[name for name,ok in checks if not ok]
          if bad:
              raise SystemExit('contract failure: '+', '.join(bad))
          print('PASS v0.1.3 punctuation-filtered wake-command contract')
          PY

      - name: Build unsigned release
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$ROOT" --no-daemon assembleRelease --stacktrace

      - name: Build unsigned aligned signing kit
        shell: bash
        run: |
          set -euo pipefail
          U="$ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT="$ROOT/out"
          A="$OUT/Wake-Handshake-Prototype-v0.1.3-aligned-unsigned.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$OUT"
          test -f "$U"
          "$BT/zipalign" -f -p 4 "$U" "$A"
          "$BT/zipalign" -c -v 4 "$A" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$A" > "$OUT/badging.txt"
          grep -Fq "package: name='$PACKAGE' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" "$OUT/badging.txt"
          sha256sum "$A" | tee "$OUT/UNSIGNED_SHA256.txt"
          printf '%s\n' "$EXPECTED_SIGNER_SHA256" > "$OUT/EXPECTED_SIGNER_CERT_SHA256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"
          printf 'package=%s\nversion_code=%s\nversion_name=%s\nexpected_signer_sha256=%s\nsource_ref=%s\nstage=unsigned_aligned_release\n' \
            "$PACKAGE" "$VERSION_CODE" "$VERSION_NAME" "$EXPECTED_SIGNER_SHA256" "$GITHUB_SHA" \
            > "$OUT/BUILD_METADATA.txt"

      - name: Upload signing kit
        uses: actions/upload-artifact@v4
        with:
          name: wake-handshake-prototype-v0.1.3-signing-kit
          path: |
            android/wake-handshake-prototype/out/Wake-Handshake-Prototype-v0.1.3-aligned-unsigned.apk
            android/wake-handshake-prototype/out/UNSIGNED_SHA256.txt
            android/wake-handshake-prototype/out/EXPECTED_SIGNER_CERT_SHA256.txt
            android/wake-handshake-prototype/out/SOURCE_REF.txt
            android/wake-handshake-prototype/out/BUILD_METADATA.txt
            android/wake-handshake-prototype/out/badging.txt
            android/wake-handshake-prototype/out/zipalign-verify.txt
          if-no-files-found: error
          retention-days: 30
