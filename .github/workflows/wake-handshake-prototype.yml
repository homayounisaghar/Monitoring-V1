name: Wake Handshake Prototype Android

on:
  push:
    branches:
      - project/wake-handshake-prototype
    paths:
      - 'android/wake-handshake-prototype/**'
      - '.github/workflows/wake-handshake-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROOT: android/wake-handshake-prototype
      PACKAGE: com.homayounisaghar.wakehandshakeprobe
      VERSION_CODE: '6'
      VERSION_NAME: 0.1.5
      EXPECTED_SIGNER_SHA256: b8bfbfb9d7962afd739c990d661e94c457dfb37cb6ab8516cdb54c3f95b9d2ec
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Static v0.1.5 contract checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('android/wake-handshake-prototype')
          java=root/'app/src/main/java/com/homayounisaghar/wakehandshakeprobe'
          main=(java/'MainActivity.java').read_text()
          setup=(java/'SetupActivity.java').read_text()
          compat=(java/'PerplexitySessionCompat.java').read_text()
          svc=(java/'LockedListeningService.java').read_text()
          gradle=(root/'app/build.gradle').read_text()
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text()
          checks=[
              ("package", "applicationId 'com.homayounisaghar.wakehandshakeprobe'" in gradle),
              ("version code", "versionCode 6" in gradle),
              ("version name", "versionName '0.1.5'" in gradle),
              ("no spoofed UA main", "SamsungBrowser/30.0" not in main and "setUserAgentString" not in main),
              ("no spoofed UA setup", "SamsungBrowser/30.0" not in setup and "setUserAgentString" not in setup),
              ("default UA helper", "Deliberately keep Android WebView's default, unmodified User-Agent." in compat),
              ("one-time reset", "resetLegacyProfileOnce" in compat and "removeAllCookies" in compat and "deleteAllData" in compat),
              ("manual reset", "Reset Perplexity session" in setup and "resetPerplexitySession()" in setup),
              ("two delays", 'label("Wake delay")' in main and 'label("Command delay")' in main),
              ("punctuation filter", 'if (!hasCommandContent(chunk))' in main),
              ("locked screen", 'Keep listening when screen is locked' in main and 'PowerManager.PARTIAL_WAKE_LOCK' in svc),
              ("safe insets", 'WindowInsets.Type.systemBars() | WindowInsets.Type.displayCutout()' in main),
              ("fgs", 'foregroundServiceType="microphone"' in manifest),
          ]
          bad=[name for name,ok in checks if not ok]
          if bad:
              raise SystemExit('contract failure: '+', '.join(bad))
          print('PASS v0.1.5 standard-WebView session compatibility contract')
          PY

      - name: Build unsigned release
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$ROOT" --no-daemon assembleRelease --stacktrace

      - name: Build unsigned aligned signing kit
        shell: bash
        run: |
          set -euo pipefail
          U="$ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT="$ROOT/out"
          A="$OUT/Wake-Handshake-Prototype-v0.1.5-aligned-unsigned.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$OUT"
          test -f "$U"
          "$BT/zipalign" -f -p 4 "$U" "$A"
          "$BT/zipalign" -c -v 4 "$A" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$A" > "$OUT/badging.txt"
          grep -Fq "package: name='$PACKAGE' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" "$OUT/badging.txt"
          sha256sum "$A" | tee "$OUT/UNSIGNED_SHA256.txt"
          printf '%s\n' "$EXPECTED_SIGNER_SHA256" > "$OUT/EXPECTED_SIGNER_CERT_SHA256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"
          printf 'package=%s\nversion_code=%s\nversion_name=%s\nexpected_signer_sha256=%s\nsource_ref=%s\nstage=unsigned_aligned_release\n' \
            "$PACKAGE" "$VERSION_CODE" "$VERSION_NAME" "$EXPECTED_SIGNER_SHA256" "$GITHUB_SHA"             > "$OUT/BUILD_METADATA.txt"

      - name: Upload signing kit
        uses: actions/upload-artifact@v4
        with:
          name: wake-handshake-prototype-v0.1.5-signing-kit
          path: |
            android/wake-handshake-prototype/out/Wake-Handshake-Prototype-v0.1.5-aligned-unsigned.apk
            android/wake-handshake-prototype/out/UNSIGNED_SHA256.txt
            android/wake-handshake-prototype/out/EXPECTED_SIGNER_CERT_SHA256.txt
            android/wake-handshake-prototype/out/SOURCE_REF.txt
            android/wake-handshake-prototype/out/BUILD_METADATA.txt
            android/wake-handshake-prototype/out/badging.txt
            android/wake-handshake-prototype/out/zipalign-verify.txt
          if-no-files-found: error
          retention-days: 30
