name: ChatGPT WebView v0.90.6 Dashboard voice manual-stop atomic unsigned

on:
  workflow_dispatch:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-stable-v100-dashboard-voice-manual-stop-atomic-unsigned.yml'
      - 'ci/generate_chatgpt_webview_v100_dashboard_voice_manual_stop_atomic.py'
      - 'ci/generate_chatgpt_webview_v99_dashboard_voice_to_text.py'
      - 'ci/generate_chatgpt_webview_v98_dashboard_planner_target_confirmation.py'
      - 'ci/generate_chatgpt_webview_v97_dashboard_planner_single_send.py'
      - 'ci/generate_chatgpt_webview_v96_dashboard_planner_contract_self_description.py'
      - 'ci/generate_chatgpt_webview_v95_dashboard_planner_correlation_readback_repair.py'
      - 'ci/generate_chatgpt_webview_v94_dashboard_stateless_planner_recipe_only_fixed.py'
      - 'ci/generate_chatgpt_webview_v94_dashboard_stateless_planner_recipe_only.py'
      - 'ci/v94_planner_dom_primitives.java.inc'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROOT: runtime_probes/chatgpt-webview-stable-probe
      EXPECTED_PACKAGE: com.homayounisaghar.chatgptwebviewprobe.diag
      EXPECTED_VERSION: 0.90.6-stable-dashboard-voice-manual-stop-atomic
      EXPECTED_VERSION_CODE: '101'
      EXPECTED_LAUNCHER: com.homayounisaghar.chatgptwebviewprobe.OrchestratorDashboardV100VoiceManualStopAtomicActivity
      EXPECTED_SIGNER_SHA256: b7aea08158252dcad79345608ce2e76e970e4cf613414db299579f46d9924c48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Generate v0.90.6 manual-stop atomic voice source
        run: python3 ci/generate_chatgpt_webview_v100_dashboard_voice_manual_stop_atomic.py
      - name: Inject fresh telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          CFG="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV100.java"
          TOKEN=$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid");assert x;print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"; READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text();ep,sha,cid=sys.argv[2:]
          for old in ['CONFIGURED=false','COLLECTOR_ID=""','ENDPOINT=""','SOURCE_REF=""']: assert s.count(old)==1,old
          p.write_text(s.replace('CONFIGURED=false','CONFIGURED=true',1).replace('COLLECTOR_ID=""',f'COLLECTOR_ID="{cid}"',1).replace('ENDPOINT=""',f'ENDPOINT="{ep}"',1).replace('SOURCE_REF=""',f'SOURCE_REF="{sha}"',1))
          PY
          mkdir -p ci/v100-dashboard-telemetry
          printf '%s\n' "$TOKEN" > ci/v100-dashboard-telemetry/collector-id.txt
          printf '%s\n' "$READ" > ci/v100-dashboard-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v100-dashboard-telemetry/source-ref.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v100-dashboard-voice-manual-stop-atomic-v1","scenario_id":"dashboard-voice-manual-stop-atomic","source_ref":"%s","raw_text_remote":false,"raw_path_remote":false,"planner_chat_effect_dispatches":0,"target_chat_effect_dispatches":0}\n' "$GITHUB_SHA" | curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @- >/dev/null
      - name: Static manual-stop atomic voice and execution safety audit
        shell: bash
        run: |
          set -euo pipefail
          SRC="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorDashboardV100VoiceManualStopAtomicActivity.java"
          ADAPTER="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/DashboardSpeechTranscriberV100.java"
          CFG="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV100.java"
          GRADLE="$ROOT/app/build.gradle"
          MAN="$ROOT/app/src/main/AndroidManifest.xml"
          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe.diag'" "$GRADLE"
          grep -Eq 'versionCode[[:space:]]+101([^0-9]|$)' "$GRADLE"
          grep -Fq "versionName '0.90.6-stable-dashboard-voice-manual-stop-atomic'" "$GRADLE"
          grep -Fq 'OrchestratorDashboardV100VoiceManualStopAtomicActivity' "$MAN"
          grep -Fq 'android.permission.RECORD_AUDIO' "$MAN"
          grep -Fq 'android.speech.RecognitionService' "$MAN"
          grep -Fq 'CONFIGURED=true' "$CFG"
          test "$(grep -c '<uses-permission' "$MAN")" -eq 3
          python3 - "$SRC" "$ADAPTER" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text();a=Path(sys.argv[2]).read_text()
          for x in ['🎤 VOICE FA','■ STOP VOICE','PREVIEW — NOT COMMITTED','commitVoiceFinal(text)','plannerInput.setEnabled(false)','stays active until you press STOP','VOICE_INPUT_STARTED','VOICE_INPUT_READY','VOICE_INPUT_FINAL','VOICE_INPUT_FAILED','CF_PLANNER_REQUEST v1','cf-planner-recipe.v1','TARGET: "+pendingTargetAlias','ACTION: Send message','MESSAGE: "+preview','TARGET FROZEN: YES','TARGET_EXECUTION_STARTED','TARGET_COMPOSER_WRITE','TARGET_SEND_DISPATCH','TARGET_SEND_RECEIPT','EXACT_LAST_USER_HASH_AND_TURN_INCREMENT','No blind replay']:
              assert x in s,x
          assert 'applyVoiceTranscript' not in s
          for x in ['interface DashboardSpeechTranscriberV100','class PlatformSpeechTranscriberV100','sessionActive','stopRequested','scheduleRestart(','recognizer.stopListening()','finishSession(','listener.onPartial(currentCommitted())','listener.onFinal(out)','SpeechRecognizer.ERROR_SPEECH_TIMEOUT']:
              assert x in a,x
          assert a.count('listener.onFinal')==1
          assert 'onResults(Bundle results)' in a and 'scheduleRestart(120L)' in a
          for bad in ['elementFromPoint','document.evaluate','XPathResult','dispatchTouchEvent','addJavascriptInterface','sendCurrentDraft']:
              assert bad not in s,bad
          assert s.count('.click()')==1
          assert s.count('worker.loadUrl(')==1
          assert s.count('targetChatEffectDispatches++')==1
          assert 'raw_text_remote",false' in s and 'raw_path_remote",false' in s
          print('PASS v0.90.6 preview-only partials + manual-stop session + auto-restart + preserved one-shot target-send audit')
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Build unsigned release
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$ROOT/local.properties"
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd "$ROOT"
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Build Stage-A kit
        shell: bash
        run: |
          set -euo pipefail
          SRC="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorDashboardV100VoiceManualStopAtomicActivity.java"
          ADAPTER="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/DashboardSpeechTranscriberV100.java"
          CFG="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV100.java"
          GRADLE="$ROOT/app/build.gradle"
          MAN="$ROOT/app/src/main/AndroidManifest.xml"
          OUT=ci/v100-dashboard-stage-a
          mkdir -p "$OUT"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          U="$ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          A="$OUT/app-release-aligned-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$U" "$A"
          "$BT/zipalign" -c -v 4 "$A" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$A" > "$OUT/badging.txt"
          "$BT/aapt" dump permissions "$A" > "$OUT/permissions.txt"
          grep -Fq "package: name='$EXPECTED_PACKAGE' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION'" "$OUT/badging.txt"
          grep -Fq "launchable-activity: name='$EXPECTED_LAUNCHER'" "$OUT/badging.txt"
          test "$(grep -c '^uses-permission:' "$OUT/permissions.txt")" -eq 3
          sha256sum "$A" | tee "$OUT/UNSIGNED_SHA256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"
          printf '%s\n' "$EXPECTED_SIGNER_SHA256" > "$OUT/EXPECTED_SIGNER_CERT_SHA256.txt"
          printf 'source_ref=%s\npackage=%s\nversion_code=%s\nversion_name=%s\nlauncher=%s\nexpected_signer_sha256=%s\nstage=unsigned_aligned_release\nbehavior=voice_partials_preview_only_session_auto_restarts_until_manual_stop_then_one_atomic_command_commit_preserving_existing_planner_and_explicit_one_shot_target_send\n' "$GITHUB_SHA" "$EXPECTED_PACKAGE" "$EXPECTED_VERSION_CODE" "$EXPECTED_VERSION" "$EXPECTED_LAUNCHER" "$EXPECTED_SIGNER_SHA256" > "$OUT/BUILD_METADATA.txt"
          cp "$SRC" "$OUT/"
          cp "$ADAPTER" "$OUT/"
          cp "$CFG" "$OUT/"
          cp "$MAN" "$OUT/"
          cp "$GRADLE" "$OUT/"
      - uses: actions/upload-artifact@v4
        with:
          name: 'chatgpt-webview-v0.90.6-dashboard-voice-manual-stop-atomic-${{ github.run_id }}-unsigned'
          path: ci/v100-dashboard-stage-a
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: 'chatgpt-webview-v0.90.6-dashboard-voice-manual-stop-atomic-${{ github.run_id }}-telemetry'
          path: ci/v100-dashboard-telemetry
          if-no-files-found: error
          retention-days: 30
