name: ChatGPT WebView v47 telemetry readback

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/chatgpt-webview-v47-readback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and normalize collector
        shell: bash
        run: |
          set -euo pipefail
          URL='https://webhook.site/token/7e0cb4df-74e5-473f-8f76-12acbabd3164/requests?sorting=oldest&per_page=100'
          curl -fsS "$URL" -o /tmp/raw.json
          python3 - <<'PY'
          import json
          raw=json.load(open('/tmp/raw.json'))
          out=[]
          for r in raw.get('data',[]):
              c=r.get('content','')
              if not isinstance(c,str):
                  continue
              try:
                  o=json.loads(c)
              except Exception:
                  continue
              if o.get('schema_version')=='cp-v47-paid-model-effort-cross-surface-apply-receipt-v1':
                  out.append(o)
          print('MATCH_COUNT',len(out))
          print(json.dumps(out,sort_keys=True,separators=(',',':')))
          open('/tmp/v47-readback.json','w').write(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v47-readback
          path: /tmp/v47-readback.json
          if-no-files-found: error
          retention-days: 1
