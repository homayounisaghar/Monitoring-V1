name: v0.89.1 telemetry readback pass3

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - .github/workflows/v0891-telemetry-readback-pass3.yml

permissions:
  contents: read
  actions: read

jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch collector metadata artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10084794085/zip" \
            -o telemetry.zip
          mkdir telemetry
          unzip -q telemetry.zip -d telemetry
      - name: Fetch collector requests
        run: |
          set -euo pipefail
          READ_URL="$(cat telemetry/read-url.txt)"
          curl -fsS "$READ_URL" -o v0891-readback.json
          python3 - <<'PY'
          import json
          d=json.load(open('v0891-readback.json'))
          items=d.get('data', d if isinstance(d,list) else [])
          print('request_count=', len(items))
          PY
      - name: Upload readback
        uses: actions/upload-artifact@v4
        with:
          name: v0891-telemetry-readback-${{ github.run_id }}
          path: v0891-readback.json
          if-no-files-found: error
          retention-days: 7

# second readback after user-confirmed Refresh all completion
