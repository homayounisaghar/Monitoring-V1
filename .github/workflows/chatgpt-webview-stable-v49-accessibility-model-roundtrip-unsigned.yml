name: ChatGPT WebView Stable v0.47 Accessibility Light Model Roundtrip Unsigned

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-stable-v49-accessibility-model-roundtrip-unsigned.yml'
      - 'ci/generate_chatgpt_webview_v49_accessibility_model_roundtrip.py'
      - 'ci/v49_accessibility_blobs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate v0.47 source
        run: python3 ci/generate_chatgpt_webview_v49_accessibility_model_roundtrip.py

      - name: Create fresh telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          CFG=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV49.java
          TOKEN=$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid");assert x;print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"
          READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(); ep,sha,cid=sys.argv[2:]
          s=re.sub(r'WEBHOOK_URL=".*?"',f'WEBHOOK_URL="{ep}"',s)
          s=re.sub(r'SOURCE_REF=".*?"',f'SOURCE_REF="{sha}"',s)
          s=re.sub(r'COLLECTOR_ID=".*?"',f'COLLECTOR_ID="{cid}"',s)
          s=s.replace('CONFIGURED=false','CONFIGURED=true')
          p.write_text(s)
          PY
          mkdir -p ci/v49-accessibility-telemetry
          printf '%s\n' "$TOKEN" > ci/v49-accessibility-telemetry/collector-id.txt
          printf '%s\n' "$READ" > ci/v49-accessibility-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v49-accessibility-telemetry/source-ref.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v49-paid-effort-accessibility-model-roundtrip-v1","scenario_id":"paid-effort-accessibility-model-roundtrip","source_ref":"%s"}\n' "$GITHUB_SHA" | curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @- >/dev/null

      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          PKG=$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe
          ACT=$PKG/OrchestratorPaidEffortAccessibilityModelRoundtripV49Activity.java
          SVC=$PKG/ControlPlaneAccessibilityServiceV49.java
          MAN=$ROOT/app/src/main/AndroidManifest.xml
          CFG=$ROOT/app/src/main/res/xml/cp_accessibility_service_v49.xml
          GRADLE=$ROOT/app/build.gradle
          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe.diag'" "$GRADLE"
          grep -Fq 'versionCode 50' "$GRADLE"
          grep -Fq "versionName '0.47-stable-diag-accessibility-light-model-roundtrip'" "$GRADLE"
          grep -Fq 'PASS_ANDROID_ACCESSIBILITY_LIGHT_AT_SLIDER_0' "$ACT"
          grep -Fq 'PASS_ANDROID_ACCESSIBILITY_MEDIUM_AT_SLIDER_1' "$ACT"
          grep -Fq 'PASS_ACCESSIBILITY_LIGHT_AND_MODEL_ROUNDTRIP_RESTORED' "$ACT"
          grep -Fq 'captureEffortReceipt(0f)' "$ACT"
          grep -Fq 'captureEffortReceipt(1f)' "$ACT"
          grep -Fq 'claimRestore47();' "$ACT"
          grep -Fq 'clickClosedModelTrigger' "$ACT"
          grep -Fq 'clickModelOption' "$ACT"
          grep -Fq 'AccessibilityNodeInfo.ACTION_CLICK' "$SVC"
          grep -Fq 'r.inWeb' "$SVC"
          grep -Fq 'android:packageNames="com.homayounisaghar.chatgptwebviewprobe.diag"' "$CFG"
          grep -Fq 'android.permission.BIND_ACCESSIBILITY_SERVICE' "$MAN"
          grep -Fq 'ControlPlaneAccessibilityServiceV49' "$MAN"
          test "$(grep -c '<uses-permission' "$MAN")" -eq 3
          python3 - "$ACT" "$SVC" <<'PY'
          from pathlib import Path
          import re,sys
          a=Path(sys.argv[1]).read_text(); s=Path(sys.argv[2]).read_text()
          body=re.sub(r'/\*.*?\*/','',a,flags=re.S); body=re.sub(r'//.*','',body)
          assert '.click()' not in body
          assert 'pointerover' not in body and 'mouseover' not in body and 'elementFromPoint' not in body
          assert 'MODEL_EFFORT_SELECT_LIGHT' not in body
          assert body.count("new PointerEvent('pointerdown'") == 1
          assert body.count("new KeyboardEvent('keydown'") == 1
          assert 'setAttribute("aria-value' not in body
          assert 'ArrowLeft' in body and 'ArrowRight' in body
          # New evidence class must be Android accessibility, not another DOM Light census.
          x=a[a.index('private void scanIndependentLightReceipt47()'):a.index('private String crossSurfaceSemanticWitnessJs47()')]
          assert 'captureEffortReceipt(0f)' in x and 'claimRestore47();' in x
          # Accessibility service must never return raw labels; only hashes/counts/state.
          assert 'put(o,"label"' not in s and 'put(o,"text"' not in s and 'put(o,"content_description"' not in s
          assert 'getRootInActiveWindow()' in s and 'r.inWeb' in s
          # Explicitly reject old false model hypotheses.
          assert 'Chat / Work' not in a
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build and verify aligned unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..
          OUT=ci/v49-accessibility-out
          mkdir -p "$OUT"
          UNSIGNED=runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$OUT/chatgpt-webview-v0.47-accessibility-light-model-roundtrip-stable-diag-aligned-unsigned.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$ALIGNED" > "$OUT/badging.txt"
          "$BT/aapt" dump permissions "$ALIGNED" > "$OUT/permissions.txt"
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe.diag' versionCode='50' versionName='0.47-stable-diag-accessibility-light-model-roundtrip'" "$OUT/badging.txt"
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorPaidEffortAccessibilityModelRoundtripV49Activity'" "$OUT/badging.txt"
          test "$(grep -c '^uses-permission:' "$OUT/permissions.txt")" -eq 3
          sha256sum "$ALIGNED" > "$OUT/ALIGNED_UNSIGNED_SHA256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.47-accessibility-light-model-roundtrip-stable-diag-unsigned
          path: ci/v49-accessibility-out
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.47-accessibility-light-model-roundtrip-stable-diag-telemetry
          path: ci/v49-accessibility-telemetry
          if-no-files-found: error
          retention-days: 30
