name: Read Stable v0.30 Telemetry Once

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/read-v30-telemetry-once.yml'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read and classify latest v0.30 telemetry
        env:
          READ_URL: https://webhook.site/token/38635af7-48f6-4e0c-8c0a-9720db5cf429/requests?sorting=oldest&per_page=100
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, collections
          SOURCE='23297029d4a5b949d35bda6a2a61a5d47c047a26'
          SCHEMA='cp-v30-voice-supervisor-contextual-v1'
          req=urllib.request.Request(os.environ['READ_URL'],headers={'Accept':'application/json','User-Agent':'cp30-readback'})
          with urllib.request.urlopen(req,timeout=20) as r:
              root=json.load(r)
          rows=root.get('data',root if isinstance(root,list) else [])
          parsed=[]
          for row in rows:
              raw=row.get('content','') if isinstance(row,dict) else ''
              try: p=json.loads(raw)
              except Exception: continue
              if p.get('schema_version')==SCHEMA and p.get('source_ref')==SOURCE:
                  parsed.append(p)
          print('API_ROWS',len(rows),'PARSED_MATCH',len(parsed),'TOTAL',root.get('total'))
          tests=collections.defaultdict(list); build=[]
          for p in parsed:
              tid=str(p.get('test_id','-'))
              (tests[tid] if tid.startswith('cp30-') else build).append(p)
          print('BUILD_ROWS',[(p.get('kind'),p.get('phase'),p.get('classification')) for p in build])
          if not tests: raise SystemExit('NO_CP30_TEST_FOUND')
          def rank(ps): return max((p.get('timestamp_epoch_ms') or 0) for p in ps)
          tid,ps=max(tests.items(),key=lambda kv:rank(kv[1]))
          ps=sorted(ps,key=lambda p:((p.get('timestamp_epoch_ms') or 0),(p.get('seq') or 0)))
          print('LATEST_TEST',tid,'ROWS',len(ps),'MAXSEQ',max((p.get('seq') or 0) for p in ps))
          keys=['session_state','mic_lease_mode','claim_action','claim_status','dispatched_side_effects','baseline_mic_fingerprint','baseline_mic_state','muted_mic_fingerprint','muted_mic_state','unmuted_mic_fingerprint','returned_to_baseline','active_audio_tracks','permission_grants','permission_denials','parent_last_action','parent_last_status','raw_audio_uploaded','raw_speech_uploaded','raw_transcript_uploaded','raw_chat_text_uploaded','raw_html_uploaded','cookies_tokens_accessed']
          skeys=['success','complete','budget_exceeded','truncated','voice_start_count','voice_end_count','mic_toggle_count','mic_toggle_fingerprint','mic_toggle_state','target_matches','clicked','visible_controls','relevant_count']
          for p in ps:
              s=p.get('state') or {}
              keep={k:s.get(k) for k in keys if k in s}
              scan=s.get('scan') or {}
              scan_keep={k:scan.get(k) for k in skeys if k in scan}
              if scan_keep: keep['scan']=scan_keep
              print('ROW',p.get('seq'),p.get('phase'),p.get('classification'),json.dumps(keep,sort_keys=True,separators=(',',':')))
          finals=[(p.get('classification'),p.get('state')) for p in ps if p.get('phase')=='FINAL']
          print('FINALS',json.dumps(finals,sort_keys=True,separators=(',',':')))
          PY
