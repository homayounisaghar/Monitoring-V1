name: Persian Keyboard Android v1.27 Test APK

on:
  push:
    branches:
      - persian-keyboard-v127-build-work
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore persistent signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: persian-keyboard-public-test-signing-v1

      - name: Fail rather than rotate signing identity
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          echo 'Expected persistent v1.9+ signing cache was not restored.' >&2
          exit 1

      - name: Apply v1.8 through v1.27 patches
        working-directory: android/persian-keyboard-v19
        run: |
          set -euo pipefail
          python3 tools/apply_v18_keyboard_patch.py
          python3 tools/apply_v19_layout_floating_patch.py
          python3 tools/apply_v110_true_floating_patch.py
          python3 tools/apply_v111_movable_full_keyboard_patch.py
          python3 tools/apply_v112_vertical_drag_compact_floating_patch.py
          python3 tools/apply_v113_narrow_floating_patch.py
          python3 tools/apply_v114_preserve_floating_on_manual_key_patch.py
          python3 tools/apply_v115_clear_field_button_patch.py
          python3 tools/apply_v116_copy_button_patch.py
          python3 tools/apply_v117_copy_icon_mic_emoji_patch.py
          python3 tools/apply_v118_caps_lock_patch.py
          python3 tools/apply_v119_persistent_speech_recovery_patch.py
          python3 tools/apply_v1191_recovery_retry_race_patch.py
          python3 tools/apply_v120_long_press_mic_send_patch.py
          python3 tools/apply_v121_raw_enter_send_hotfix_patch.py
          python3 tools/apply_v122_accessibility_send_button_patch.py
          python3 tools/apply_v123_accessibility_diag_geo_send_patch.py
          python3 tools/apply_v124_composer_scoped_send_patch.py
          python3 tools/apply_v125_recovery_cursor_stability_patch.py
          python3 tools/apply_v126_live_partial_tail_patch.py
          python3 tools/apply_v127_manual_stop_semantics_patch.py

      - name: Verify v1.27 source invariants
        working-directory: android/persian-keyboard-v19
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('app/src/main/java/com/najme/perplexityprobe/PersianKeyboardService.java').read_text()
          helper = Path('app/src/main/java/com/najme/perplexityprobe/SendAccessibilityService.java').read_text()
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          gradle = Path('app/build.gradle').read_text()
          text = src + '\n' + helper + '\n' + manifest + '\n' + gradle
          required = [
              'private volatile boolean speechRecovering;',
              'private void recoverSpeechTransport(String reason){',
              'private volatile int credentialWatchdogEpoch;',
              'private void recreateCredentialWebView(String reason){',
              'private void armCredentialWatchdog(){',
              'private String livePartialTail = "";',
              'private int commonPrefixChars(String a,String b){',
              'private boolean editorEndsWithLiveTail(){',
              'if(start>=0)start+=et.startOffset;',
              'private boolean selectionCallbackMatchesEditorNow(int start,int end){',
              'if(!selectionCallbackMatchesEditorNow(newSelStart,newSelEnd))return;',
              'it must not stop',
              'boundConnection.deleteSurroundingText(remove,0);',
              'livePartialTail=partial;',
              'private boolean sendAfterVoiceStop;',
              'SendAccessibilityService.requestSend(targetPackage)',
              'class SendAccessibilityService extends AccessibilityService',
              'private EditorTarget findEditor(',
              'private boolean nearComposer(',
              'android.permission.BIND_ACCESSIBILITY_SERVICE',
              'versionCode 37',
              "versionName '1.27'",
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'Missing v1.27 invariant: {needle}')
          forbidden = [
              'MAX_CAPTURE_MS',
              'boundConnection.setComposingText(partial,1);',
              'Never stream partial text into the editor',
              'long key=selectionKey(et.selectionStart,et.selectionEnd);',
              'private int geometryScore(AccessibilityNodeInfo node, Rect b, Rect focus)',
              'versionCode 36',
              "versionName '1.26'",
          ]
          for needle in forbidden:
              if needle in text:
                  raise SystemExit(f'Forbidden old behavior remains: {needle}')
          print('v1.27 source invariants OK')
          PY

      - name: Build Android v1.27 debug APK
        run: gradle -p android/persian-keyboard-v19 --no-daemon assembleDebug --stacktrace

      - name: Verify APK, signer continuity, and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='android/persian-keyboard-v19/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          grep -q 'Signer #1 certificate SHA-256 digest: c557bdc60de4100720d6f122789b51c2889661ef0b76886d5b08c1f44cf023cf' apk-signing.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 30 | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > apk-manifest.txt
          grep -q "package: name='com.najme.perplexityprobe' versionCode='37' versionName='1.27'" apk-badging.txt
          grep -q 'PersianKeyboardService' apk-manifest.txt
          grep -q 'SendAccessibilityService' apk-manifest.txt
          grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' apk-manifest.txt
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" Persian-keyboard-Android-v1.27.apk

      - name: Upload verified APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: Persian-keyboard-Android-v1.27-manual-stop-fix-signed
          path: |
            Persian-keyboard-Android-v1.27.apk
            apk-signing.txt
            apk-badging.txt
            apk-manifest.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
