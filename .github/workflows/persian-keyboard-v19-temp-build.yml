name: Persian Keyboard Android v1.23 Test APK

on:
  push:
    branches:
      - persian-keyboard-v19-temp-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore persistent signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: persian-keyboard-public-test-signing-v1

      - name: Fail rather than rotate signing identity
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          echo 'Expected persistent v1.9+ signing cache was not restored.' >&2
          exit 1

      - name: Apply v1.8 through v1.23 patches
        working-directory: android/persian-keyboard-v19
        run: |
          set -euo pipefail
          python3 tools/apply_v18_keyboard_patch.py
          python3 tools/apply_v19_layout_floating_patch.py
          python3 tools/apply_v110_true_floating_patch.py
          python3 tools/apply_v111_movable_full_keyboard_patch.py
          python3 tools/apply_v112_vertical_drag_compact_floating_patch.py
          python3 tools/apply_v113_narrow_floating_patch.py
          python3 tools/apply_v114_preserve_floating_on_manual_key_patch.py
          python3 tools/apply_v115_clear_field_button_patch.py
          python3 tools/apply_v116_copy_button_patch.py
          python3 tools/apply_v117_copy_icon_mic_emoji_patch.py
          python3 tools/apply_v118_caps_lock_patch.py
          python3 tools/apply_v119_persistent_speech_recovery_patch.py
          python3 tools/apply_v1191_recovery_retry_race_patch.py
          python3 tools/apply_v120_long_press_mic_send_patch.py
          python3 tools/apply_v121_raw_enter_send_hotfix_patch.py
          python3 tools/apply_v122_accessibility_send_button_patch.py
          python3 tools/apply_v123_accessibility_diag_geo_send_patch.py

      - name: Verify v1.23 source invariants
        working-directory: android/persian-keyboard-v19
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('app/src/main/java/com/najme/perplexityprobe/PersianKeyboardService.java').read_text()
          helper = Path('app/src/main/java/com/najme/perplexityprobe/SendAccessibilityService.java').read_text()
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          axml = Path('app/src/main/res/xml/send_accessibility_service.xml').read_text()
          gradle = Path('app/build.gradle').read_text()
          required = [
              'Configuration.ORIENTATION_LANDSCAPE',
              'FrameLayout inputShell;',
              'floatingButton = toolbarButton("▱", v -> setCollapsed(!collapsed));',
              'Button copy = toolbarButton("⧉", v -> copyCurrentText());',
              'String label=running?"🎙 "+badge():"🎙";',
              'private boolean capsLock;',
              'Button shiftKey = actionKey(capsLock ? "⇪" : (shift ? "⇧●" : "⇧")',
              'Button clearField = toolbarButton("×", v -> clearCurrentTextField());',
              'private volatile boolean speechRecovering;',
              'private volatile int speechRecoveryEpoch;',
              'private void recoverSpeechTransport(String reason){',
              'code==408 || code>=500',
              '"temp_api_key_session_expired".equals(type)',
              '"max_duration_reached".equals(type)',
              'recoverSpeechTransport("Connection closed "+code)',
              'recoverSpeechTransport("Connection error")',
              'if(!stopRequested){recoverSpeechTransport("Unexpected finished");return;}',
              'private void queuePendingLocked(byte[] chunk){',
              'pendingAudio.peekFirst()',
              'private static final int PREBUFFER_MAX = SAMPLE_RATE * 2 * 60;',
              'main.postDelayed(()->{if(running&&!stopRequested&&!completed)startAudioCapture();},350L);',
              'if(running&&awaitingCredential&&!speechRecovering)',
              'speechRecovering=false;startSoniox(apiKey);',
              'private boolean sendAfterVoiceStop;',
              'mic.setOnLongClickListener(v -> stopVoiceAndSend());',
              'compactMic.setOnLongClickListener(v -> stopVoiceAndSend());',
              'private boolean stopVoiceAndSend(){',
              'sendAfterVoiceStop=true;',
              'private void sendFocusedField(){',
              'SendAccessibilityService.requestSend(targetPackage)',
              'SEND helper OFF — enable Accessibility',
              'SendAccessibilityService.getLastResult()',
              'SEND: scanning button…',
              'if(shouldSend)main.postDelayed(this::sendFocusedField,40L);',
              'class SendAccessibilityService extends AccessibilityService',
              'public static String getLastResult()',
              'private int geometryScore(',
              'String compact()',
              'SEND diag:',
              'stats.nearby++',
              'candidate.kind',
              'getWindows()',
              'AccessibilityNodeInfo.ACTION_CLICK',
              'dispatchGesture(gesture, new GestureResultCallback()',
              'android:name=".SendAccessibilityService"',
              'android.permission.BIND_ACCESSIBILITY_SERVICE',
              '@xml/send_accessibility_service',
              'android:canRetrieveWindowContent="true"',
              'android:canPerformGestures="true"',
              'flagRetrieveInteractiveWindows',
              'enable_endpoint_detection",false',
              'language_hints_strict",true',
              'versionCode 33',
              "versionName '1.23'",
          ]
          text = src + '\n' + helper + '\n' + manifest + '\n' + axml + '\n' + gradle
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'Missing v1.23 invariant: {needle}')
          forbidden = [
              '@Override public void onClosed(WebSocket ws,int code,String reason){if(running&&!completed)finishWithText("Connection closed");}',
              '@Override public void onFailure(WebSocket ws,Throwable t,Response response){if(running&&!completed)finishWithText("Connection error");}',
              'if(!bufferOrSend(chunk))throw new IllegalStateException("Audio send rejected")',
              'if(running)finishWithText("Audio error")',
              'if(o.has("error_code")&&!o.isNull("error_code")){finishWithText("Soniox error");return;}',
              'if(o.optBoolean("finished",false)){completed=true;',
              'MAX_CAPTURE_MS',
              'toolbarButton("G⇄"',
              'Translate: next build',
              'toolbarButton("G", v -> switchToGboard())',
              'private void switchToGboard(){',
              'Button copy = toolbarButton("Copy", v -> copyCurrentText());',
              'String label=running?"🎙 "+badge():"🎤";',
              'if(advertised==EditorInfo.IME_ACTION_SEND){',
              'setStatus((down||up)?"Send key sent":"Send unavailable in this field");',
              'setStatus(queued?"Sending…":"Enable Send helper in Accessibility");',
              'versionCode 32',
              "versionName '1.22'",
          ]
          for needle in forbidden:
              if needle in src or needle in gradle:
                  raise SystemExit(f'Forbidden old behavior remains: {needle}')
          print('v1.23 source invariants OK')
          PY

      - name: Build Android v1.23 debug APK
        run: gradle -p android/persian-keyboard-v19 --no-daemon assembleDebug --stacktrace

      - name: Verify APK, signer continuity, and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='android/persian-keyboard-v19/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          grep -q 'Signer #1 certificate SHA-256 digest: c557bdc60de4100720d6f122789b51c2889661ef0b76886d5b08c1f44cf023cf' apk-signing.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 30 | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > apk-manifest.txt
          grep -q "package: name='com.najme.perplexityprobe' versionCode='33' versionName='1.23'" apk-badging.txt
          grep -q 'PersianKeyboardService' apk-manifest.txt
          grep -q 'android.permission.BIND_INPUT_METHOD' apk-manifest.txt
          grep -q 'android.view.InputMethod' apk-manifest.txt
          grep -q 'SendAccessibilityService' apk-manifest.txt
          grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' apk-manifest.txt
          grep -q 'android.accessibilityservice.AccessibilityService' apk-manifest.txt
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" Persian-keyboard-Android-v1.23.apk

      - name: Upload verified APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: Persian-keyboard-Android-v1.23-stable-signed
          path: |
            Persian-keyboard-Android-v1.23.apk
            apk-signing.txt
            apk-badging.txt
            apk-manifest.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
