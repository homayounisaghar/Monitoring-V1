name: Persian Keyboard Android v1.10 Test APK

on:
  push:
    branches:
      - persian-keyboard-v19-temp-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore persistent signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: persian-keyboard-public-test-signing-v1

      - name: Fail rather than rotate signing identity
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          echo 'Expected persistent v1.9+ signing cache was not restored.' >&2
          exit 1

      - name: Apply v1.8, v1.9, then v1.10 patches
        working-directory: android/persian-keyboard-v19
        run: |
          set -euo pipefail
          python3 tools/apply_v18_keyboard_patch.py
          python3 tools/apply_v19_layout_floating_patch.py
          python3 tools/apply_v110_true_floating_patch.py

      - name: Verify v1.10 source invariants
        working-directory: android/persian-keyboard-v19
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('app/src/main/java/com/najme/perplexityprobe/PersianKeyboardService.java').read_text()
          gradle = Path('app/build.gradle').read_text()
          required = [
              'Configuration.ORIENTATION_LANDSCAPE',
              'FrameLayout inputShell;',
              'Button floating = toolbarButton("▱", v -> setCollapsed(true));',
              'Insets.TOUCHABLE_INSETS_REGION',
              'outInsets.contentTopInsets = Math.max(0, windowHeight);',
              'root.getLocationInWindow(loc);',
              'lp.width = dp(148);',
              'lp.height = dp(50);',
              'lp.bottomMargin = dp(24);',
              'enable_endpoint_detection",false',
              'language_hints_strict",true',
              'versionCode 20',
              "versionName '1.10'",
          ]
          text = src + '\n' + gradle
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'Missing v1.10 invariant: {needle}')
          for needle in ['Floating mode: next build','MAX_CAPTURE_MS',"versionCode 19","versionName '1.9'"]:
              if needle in text:
                  raise SystemExit(f'Forbidden old behavior remains: {needle}')
          print('v1.10 source invariants OK')
          PY

      - name: Build Android v1.10 debug APK
        run: gradle -p android/persian-keyboard-v19 --no-daemon assembleDebug --stacktrace

      - name: Verify APK, signer continuity, and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='android/persian-keyboard-v19/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          grep -q 'Signer #1 certificate SHA-256 digest: c557bdc60de4100720d6f122789b51c2889661ef0b76886d5b08c1f44cf023cf' apk-signing.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 30 | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > apk-manifest.txt
          grep -q "package: name='com.najme.perplexityprobe' versionCode='20' versionName='1.10'" apk-badging.txt
          grep -q 'PersianKeyboardService' apk-manifest.txt
          grep -q 'android.permission.BIND_INPUT_METHOD' apk-manifest.txt
          grep -q 'android.view.InputMethod' apk-manifest.txt
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" Persian-keyboard-Android-v1.10.apk

      - name: Upload verified APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: Persian-keyboard-Android-v1.10-stable-signed
          path: |
            Persian-keyboard-Android-v1.10.apk
            apk-signing.txt
            apk-badging.txt
            apk-manifest.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
