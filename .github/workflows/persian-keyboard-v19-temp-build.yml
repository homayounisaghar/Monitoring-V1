name: Persian Keyboard Android v1.15 Test APK

on:
  push:
    branches:
      - persian-keyboard-v19-temp-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore persistent signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: persian-keyboard-public-test-signing-v1

      - name: Fail rather than rotate signing identity
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          echo 'Expected persistent v1.9+ signing cache was not restored.' >&2
          exit 1

      - name: Apply v1.8 through v1.15 patches
        working-directory: android/persian-keyboard-v19
        run: |
          set -euo pipefail
          python3 tools/apply_v18_keyboard_patch.py
          python3 tools/apply_v19_layout_floating_patch.py
          python3 tools/apply_v110_true_floating_patch.py
          python3 tools/apply_v111_movable_full_keyboard_patch.py
          python3 tools/apply_v112_vertical_drag_compact_floating_patch.py
          python3 tools/apply_v113_narrow_floating_patch.py
          python3 tools/apply_v114_preserve_floating_on_manual_key_patch.py
          python3 tools/apply_v115_clear_field_button_patch.py

      - name: Verify v1.15 source invariants
        working-directory: android/persian-keyboard-v19
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('app/src/main/java/com/najme/perplexityprobe/PersianKeyboardService.java').read_text()
          gradle = Path('app/build.gradle').read_text()
          required = [
              'Configuration.ORIENTATION_LANDSCAPE',
              'FrameLayout inputShell;',
              'floatingButton = toolbarButton("▱", v -> setCollapsed(!collapsed));',
              'floatingButton.setOnTouchListener(this::handleFloatingHandleTouch);',
              'Button clearField = toolbarButton("×", v -> clearCurrentTextField());',
              'clearField.setContentDescription("Clear text field");',
              'private void clearCurrentTextField(){',
              'performContextMenuAction(android.R.id.selectAll)',
              'android.view.inputmethod.ExtractedTextRequest',
              'getTextBeforeCursor(65536,0)',
              'getTextAfterCursor(65536,0)',
              'if (full != null) full.setVisibility(View.VISIBLE);',
              'if (compact != null) compact.setVisibility(View.GONE);',
              'return collapsed || getResources().getConfiguration().orientation == Configuration.ORIENTATION_LANDSCAPE;',
              'rebuildKeyboardSurface();',
              'int v112Desired = Math.round(shortSide * 0.88f);',
              'int desired = Math.round(v112Width * 0.70f);',
              'return Math.max(dp(160), Math.min(desired,',
              'inputShell.setMinimumHeight(floating ? screenHeight : 0);',
              'shellLp.height = floating ? screenHeight : ViewGroup.LayoutParams.WRAP_CONTENT;',
              'attrs.gravity = floating ? (Gravity.TOP | Gravity.START) : Gravity.BOTTOM;',
              'moveFloatingKeyboard(dragStartLeft + dx, dragStartTop + dy);',
              'hasComposingTail=false;\n        updateMicUi(); setStatus(readyText());',
              'Insets.TOUCHABLE_INSETS_REGION',
              'root.getLocationInWindow(loc);',
              'enable_endpoint_detection",false',
              'language_hints_strict",true',
              'versionCode 25',
              "versionName '1.15'",
          ]
          text = src + '\n' + gradle
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'Missing v1.15 invariant: {needle}')
          forbidden = [
              'toolbarButton("G", v -> switchToGboard())',
              'Switch to Gboard',
              'private void switchToGboard(){',
              'GBOARD_PACKAGE',
              'InputMethodInfo',
              'InputMethodManager',
              'setCollapsed(false); updateMicUi(); setStatus(readyText());',
              'int desired = Math.round(shortSide * 0.88f);',
              'float factor = isLandscape() ? 0.78f : 0.88f;',
              'int minWidth = dp(isLandscape() ? 420 : 300);',
              'int maxWidth = dp(isLandscape() ? 620 : 460);',
              'lp.width = dp(148);',
              'lp.height = dp(50);',
              'if (full != null) full.setVisibility(value ? View.GONE : View.VISIBLE);',
              'Floating mode: next build',
              'MAX_CAPTURE_MS',
              'versionCode 24',
              "versionName '1.14'",
          ]
          for needle in forbidden:
              if needle in text:
                  raise SystemExit(f'Forbidden old behavior remains: {needle}')
          print('v1.15 source invariants OK')
          PY

      - name: Build Android v1.15 debug APK
        run: gradle -p android/persian-keyboard-v19 --no-daemon assembleDebug --stacktrace

      - name: Verify APK, signer continuity, and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='android/persian-keyboard-v19/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          grep -q 'Signer #1 certificate SHA-256 digest: c557bdc60de4100720d6f122789b51c2889661ef0b76886d5b08c1f44cf023cf' apk-signing.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 30 | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > apk-manifest.txt
          grep -q "package: name='com.najme.perplexityprobe' versionCode='25' versionName='1.15'" apk-badging.txt
          grep -q 'PersianKeyboardService' apk-manifest.txt
          grep -q 'android.permission.BIND_INPUT_METHOD' apk-manifest.txt
          grep -q 'android.view.InputMethod' apk-manifest.txt
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" Persian-keyboard-Android-v1.15.apk

      - name: Upload verified APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: Persian-keyboard-Android-v1.15-stable-signed
          path: |
            Persian-keyboard-Android-v1.15.apk
            apk-signing.txt
            apk-badging.txt
            apk-manifest.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
