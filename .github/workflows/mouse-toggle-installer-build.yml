name: Mouse Toggle Installer Helper APK

on:
  push:
    branches:
      - mouse-button-toggle-temp-build
    paths:
      - 'android/mouse-toggle-installer/**'
      - '.github/workflows/mouse-toggle-installer-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Embed verified Mouse Button Toggle v1.0.8 payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/mouse-toggle-installer/app/src/main/assets
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9975592544/zip" \
            -o /tmp/mouse-v108-artifact.zip
          mkdir -p /tmp/mouse-v108-artifact
          unzip -q /tmp/mouse-v108-artifact.zip -d /tmp/mouse-v108-artifact
          PAYLOAD="$(find /tmp/mouse-v108-artifact -type f -name 'MouseButtonToggle-v1.0.8.apk' -print -quit)"
          test -n "$PAYLOAD"
          echo "2710c765cf21b7fea794e54a476775025cdb800205def814f905c5a7ec652402  $PAYLOAD" | sha256sum -c -
          cp "$PAYLOAD" android/mouse-toggle-installer/app/src/main/assets/MouseButtonToggle-v1.0.8.apk

      - name: Restore persistent signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mouse-button-toggle-public-test-signing-v1

      - name: Create persistent signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          PASS='andro''id'
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass "$PASS" \
            -alias androiddebugkey \
            -keypass "$PASS" \
            -dname "CN=Mouse Button Toggle Test,O=Mouse Button Toggle,C=DE" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Build signed release APK
        run: gradle -p android/mouse-toggle-installer :app:assembleRelease --stacktrace

      - name: Verify helper APK and embedded payload
        shell: bash
        run: |
          set -euo pipefail
          APK='android/mouse-toggle-installer/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee helper-signing.txt
          grep -q 'CN=Mouse Button Toggle Test' helper-signing.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 25 | tee helper-badging.txt
          grep -q "package: name='com.homayoun.mouseinstaller'" helper-badging.txt
          grep -q "versionCode='1'" helper-badging.txt
          grep -q "versionName='1.0.0'" helper-badging.txt
          if grep -q 'application-debuggable' helper-badging.txt; then
            echo 'Release helper APK must not be debuggable' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > helper-manifest.txt
          grep -q 'ShizukuProvider' helper-manifest.txt
          unzip -p "$APK" assets/MouseButtonToggle-v1.0.8.apk > embedded-v1.0.8.apk
          echo '2710c765cf21b7fea794e54a476775025cdb800205def814f905c5a7ec652402  embedded-v1.0.8.apk' | sha256sum -c -
          sha256sum "$APK" | tee helper-sha256.txt
          cp "$APK" MouseToggleInstallerHelper-v1.0.0.apk

      - name: Upload verified helper APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: MouseToggleInstallerHelper-v1.0.0-release
          path: |
            MouseToggleInstallerHelper-v1.0.0.apk
            helper-signing.txt
            helper-badging.txt
            helper-manifest.txt
            helper-sha256.txt
          if-no-files-found: error
          retention-days: 30
