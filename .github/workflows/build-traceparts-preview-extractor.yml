name: Build TraceParts Preview Extractor APK

on:
  push:
    branches: ['traceparts-preview-extractor-build']
    paths:
      - 'traceparts-preview-extractor/android/**'
      - '.github/workflows/build-traceparts-preview-extractor.yml'
  workflow_dispatch:

concurrency:
  group: traceparts-preview-extractor-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: traceparts-preview-extractor-public-signing-v1

      - name: Create persistent signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          PASS='andro''id'
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass "$PASS" \
            -alias androiddebugkey \
            -keypass "$PASS" \
            -dname "CN=TraceParts Preview Extractor Test,O=Capability Fabric,C=DE" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Build signed release APK
        run: gradle -p traceparts-preview-extractor/android :app:assembleRelease --stacktrace

      - name: Verify APK and capture evidence
        shell: bash
        run: |
          set -euo pipefail
          APK='traceparts-preview-extractor/android/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -p "$APK" classes.dex | strings | grep -Fq 'com/capabilityfabric/tracepartsgrabber/MainActivity'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          grep -q 'CN=TraceParts Preview Extractor Test' apk-signing.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.capabilityfabric.tracepartsgrabber'" apk-badging.txt
          grep -q "versionCode='1'" apk-badging.txt
          grep -q "versionName='1.0.0'" apk-badging.txt
          grep -q "launchable-activity: name='com.capabilityfabric.tracepartsgrabber.MainActivity'" apk-badging.txt
          if grep -q 'application-debuggable' apk-badging.txt; then
            echo 'Release APK must not be debuggable' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > apk-manifest.txt
          grep -q 'android.permission.INTERNET' apk-manifest.txt
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" TracePartsPreviewExtractor-v1.0.0.apk

      - name: Upload verified APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: TracePartsPreviewExtractor-v1.0.0-stable-signed-release
          path: |
            TracePartsPreviewExtractor-v1.0.0.apk
            apk-signing.txt
            apk-badging.txt
            apk-manifest.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
