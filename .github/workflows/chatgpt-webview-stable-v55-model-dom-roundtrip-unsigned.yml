name: ChatGPT WebView Stable v0.53 Model DOM Roundtrip Unsigned

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-stable-v55-model-dom-roundtrip-unsigned.yml'
      - 'ci/generate_chatgpt_webview_v55_model_dom_roundtrip.py'
      - 'ci/v55_model_dom_bridge/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Generate v0.53 source
        run: python3 ci/generate_chatgpt_webview_v55_model_dom_roundtrip.py

      - name: Create fresh telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          CFG=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV55.java
          TOKEN=$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid");assert x;print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"
          READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(); ep,sha,cid=sys.argv[2:]
          s=re.sub(r'WEBHOOK_URL=".*?"',f'WEBHOOK_URL="{ep}"',s)
          s=re.sub(r'SOURCE_REF=".*?"',f'SOURCE_REF="{sha}"',s)
          s=re.sub(r'COLLECTOR_ID=".*?"',f'COLLECTOR_ID="{cid}"',s)
          s=s.replace('CONFIGURED=false','CONFIGURED=true')
          p.write_text(s)
          PY
          mkdir -p ci/v55-model-dom-telemetry
          printf '%s\n' "$TOKEN" > ci/v55-model-dom-telemetry/collector-id.txt
          printf '%s\n' "$READ" > ci/v55-model-dom-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v55-model-dom-telemetry/source-ref.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v55-paid-current-ui-model-dom-roundtrip-v1","scenario_id":"paid-current-ui-model-dom-roundtrip","source_ref":"%s"}\n' "$GITHUB_SHA" | curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @- >/dev/null

      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          PKG=$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe
          ACT=$PKG/OrchestratorPaidCurrentUiModelDomRoundtripV55Activity.java
          MAN=$ROOT/app/src/main/AndroidManifest.xml
          GRADLE=$ROOT/app/build.gradle

          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe.diag'" "$GRADLE"
          grep -Fq 'versionCode 56' "$GRADLE"
          grep -Fq "versionName '0.53-stable-diag-model-dom-roundtrip'" "$GRADLE"
          grep -Fq 'OrchestratorPaidCurrentUiModelDomRoundtripV55Activity' "$MAN"

          # Accessibility authorization continuity must remain on the existing V51 component.
          grep -Fq 'ControlPlaneAccessibilityServiceV51' "$MAN"
          grep -Fq '@xml/cp_accessibility_service_v51' "$MAN"
          ! grep -Fq 'ControlPlaneAccessibilityServiceV52' "$MAN"
          ! grep -Fq 'ControlPlaneAccessibilityServiceV53' "$MAN"
          ! grep -Fq 'ControlPlaneAccessibilityServiceV54' "$MAN"
          ! grep -Fq 'ControlPlaneAccessibilityServiceV55' "$MAN"

          # Model-only contract: Medium is a guard, not a value-write experiment.
          grep -Fq 'RUN AUTONOMOUS MODEL ROUNDTRIP' "$ACT"
          grep -Fq 'PASS_MEDIUM_UNCHANGED_MODEL_GATE_AUTHORIZED' "$ACT"
          grep -Fq 'PASS_AUTONOMOUS_MODEL_ROUNDTRIP_RESTORED_MEDIUM_UNCHANGED' "$ACT"
          grep -Fq 'prepareModelBridge55' "$ACT"
          grep -Fq 'scanDomModelBridgeJs55' "$ACT"
          grep -Fq 'pointerDownDomModelBridgeJs55' "$ACT"
          grep -Fq 'DOM_POINTERDOWN_UNIQUE_MODEL_BRIDGE' "$ACT"
          grep -Fq 'PASS_UNIQUE_DOM_MODEL_BRIDGE_CANDIDATE' "$ACT"
          grep -Fq 'captureModelMenu' "$ACT"
          grep -Fq 'clickModelOption' "$ACT"
          ! grep -Fq 'startDynamicEffortProof50();' "$ACT"

          # Do not reuse the failed v0.52 Accessibility-only bridge in this activity.
          ! grep -Fq 'captureEffortUpperBridgeCandidate' "$ACT"
          ! grep -Fq 'clickEffortUpperBridgeCandidate' "$ACT"
          ! grep -Fq 'captureModelNavigationCandidate' "$ACT"
          ! grep -Fq 'clickModelNavigationCandidate' "$ACT"

          # No geometry/XPath/direct ARIA-value mutation; no Pro write target.
          ! grep -Fq 'elementFromPoint' "$ACT"
          ! grep -Fq 'document.evaluate' "$ACT"
          ! grep -Fq 'setAttribute("aria-value' "$ACT"
          ! grep -Fq 'to_value",4' "$ACT"
          grep -Fq 'TelemetryConfigV55' "$ACT"
          ! grep -Fq 'TelemetryConfigV54' "$ACT"

          test "$(grep -c '<uses-permission' "$MAN")" -eq 3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build and verify aligned unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..
          OUT=ci/v55-model-dom-out
          mkdir -p "$OUT"
          UNSIGNED=runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$OUT/chatgpt-webview-v0.53-model-dom-roundtrip-stable-diag-aligned-unsigned.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$ALIGNED" > "$OUT/badging.txt"
          "$BT/aapt" dump permissions "$ALIGNED" > "$OUT/permissions.txt"
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe.diag' versionCode='56' versionName='0.53-stable-diag-model-dom-roundtrip'" "$OUT/badging.txt"
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorPaidCurrentUiModelDomRoundtripV55Activity'" "$OUT/badging.txt"
          test "$(grep -c '^uses-permission:' "$OUT/permissions.txt")" -eq 3
          sha256sum "$ALIGNED" > "$OUT/ALIGNED_UNSIGNED_SHA256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.53-model-dom-roundtrip-stable-diag-unsigned
          path: ci/v55-model-dom-out
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.53-model-dom-roundtrip-stable-diag-telemetry
          path: ci/v55-model-dom-telemetry
          if-no-files-found: error
          retention-days: 30
