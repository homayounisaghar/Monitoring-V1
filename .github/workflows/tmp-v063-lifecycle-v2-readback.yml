name: Temporary v0.63 Lifecycle v2 Readback

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/tmp-v063-lifecycle-v2-readback.yml'

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read sanitized v0.63 telemetry
        shell: bash
        run: |
          set -euo pipefail
          URL='https://webhook.site/token/fee7b5a6-4758-4554-8e8d-73b698bb7721/requests?sorting=oldest&per_page=100'
          curl -fsS "$URL" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d,ensure_ascii=False,indent=2))'
