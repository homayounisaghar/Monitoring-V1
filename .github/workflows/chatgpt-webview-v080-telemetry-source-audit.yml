name: ChatGPT WebView v0.80 telemetry source audit

on:
  push:
    branches:
      - project/chatgpt-webview-poc-v080-telemetry-audit
    paths:
      - '.github/workflows/chatgpt-webview-v080-telemetry-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact v0.80 source
        run: python3 ci/generate_chatgpt_webview_v82_calibrated_actuator_resource_fix1.py
      - name: Print v0.80 silent-state control paths
        shell: bash
        run: |
          set -euo pipefail
          ACT=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorResourceToolsV82Activity.java
          python3 - "$ACT" <<'PY'
          import pathlib,re,sys
          s=pathlib.Path(sys.argv[1]).read_text()
          lines=s.splitlines()
          print('=== V82 CLASSIFICATION / STATUS / TIMER SITES ===')
          needles=['resourceV82TimeoutSerial','postDelayed(','emit("ACTUATOR_CALIBRATION"','emit("RESOURCE_ACTION"','status.setText(','resourceNavigationPending=true','resourceV82PreEffectPending=true','resourceV82PreEffectPending=false','resourceV82EffectDispatched=true']
          for i,line in enumerate(lines,1):
              if any(n in line for n in needles) and (880 <= i <= 1180 or 1400 <= i <= 1490):
                  print(f'{i}: {line}')
          print('\n=== TARGETED METHOD BODIES ===')
          names=['shouldRemoteEmit','emit','captureCalibrationDomStateV82','runCurrentCalibrationPhaseV82','advanceCalibrationV82','failAllCalibrationV82','startResourceAfterCalibrationV82','beginResourceAfterCalibrationV82','startResourceV82AfterCalibration','driveResourceV82','terminalResourceV82','finishResourceObservedUrlV82','handleResourceObservedUrlV82']
          for name in names:
              pat=re.compile(r'\n    private [^\n]*\b'+re.escape(name)+r'\([^\n]*\)\{')
              m=pat.search(s)
              if not m: continue
              start=m.start()+1; brace=s.find('{',m.start()); depth=0; end=len(s)
              for j in range(brace,len(s)):
                  if s[j]=='{': depth+=1
                  elif s[j]=='}':
                      depth-=1
                      if depth==0:
                          end=j+1; break
              print(f'\n--- {name} ---\n{s[start:end]}')
          PY
