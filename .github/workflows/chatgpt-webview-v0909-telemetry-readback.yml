name: ChatGPT WebView v0.90.9 telemetry readback

on:
  workflow_dispatch:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-v0909-telemetry-readback.yml'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and summarize v0.90.9 telemetry
        shell: bash
        run: |
          set -euo pipefail
          URL='https://webhook.site/token/ef73dafb-840f-44de-9d64-f2ce7a3f432a/requests?sorting=newest&per_page=100'
          curl -fsS -H 'Accept: application/json' "$URL" > /tmp/telemetry.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/telemetry.json'))
          rows=x.get('data',x if isinstance(x,list) else [])
          print('COUNT',len(rows))
          for r in reversed(rows):
              c=r.get('content') or r.get('request',{}).get('content') or ''
              if isinstance(c,dict): obj=c
              else:
                  try: obj=json.loads(c)
                  except Exception: obj={'raw':str(c)[:300]}
              out={k:obj.get(k) for k in ['event','phase','state','result','classification','error','error_name','receipt','semantic_temp_state','temp_state','normal_stable_hits','planner_phase','source_ref','request_id','target_ref','detail'] if k in obj}
              print(r.get('created_at','?'),json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
