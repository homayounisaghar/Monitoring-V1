name: ChatGPT WebView Stable v0.53 DOM Model Bridge Self Update Unsigned

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-stable-v55-dom-model-selfupdate-unsigned.yml'
      - 'ci/generate_chatgpt_webview_v55_dom_model_selfupdate.py'
      - 'ci/v55_dom_selfupdate/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Generate v0.53 source
        run: python3 ci/generate_chatgpt_webview_v55_dom_model_selfupdate.py

      - name: Create fresh telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          CFG=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV55.java
          TOKEN=$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid");assert x;print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"
          READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(); ep,sha,cid=sys.argv[2:]
          s=re.sub(r'WEBHOOK_URL=".*?"',f'WEBHOOK_URL="{ep}"',s)
          s=re.sub(r'SOURCE_REF=".*?"',f'SOURCE_REF="{sha}"',s)
          s=re.sub(r'COLLECTOR_ID=".*?"',f'COLLECTOR_ID="{cid}"',s)
          s=s.replace('CONFIGURED=false','CONFIGURED=true')
          p.write_text(s)
          PY
          mkdir -p ci/v55-dom-model-selfupdate-telemetry
          printf '%s\n' "$TOKEN" > ci/v55-dom-model-selfupdate-telemetry/collector-id.txt
          printf '%s\n' "$READ" > ci/v55-dom-model-selfupdate-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v55-dom-model-selfupdate-telemetry/source-ref.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v55-paid-model-dom-bridge-self-update-v1","scenario_id":"paid-model-dom-bridge-self-update","source_ref":"%s"}\n' "$GITHUB_SHA" | curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @- >/dev/null

      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          PKG=$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe
          ACT=$PKG/OrchestratorPaidModelDomBridgeSelfUpdateV55Activity.java
          RX=$PKG/SelfUpdateStatusReceiverV55.java
          MAN=$ROOT/app/src/main/AndroidManifest.xml
          GRADLE=$ROOT/app/build.gradle

          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe.diag'" "$GRADLE"
          grep -Fq 'versionCode 56' "$GRADLE"
          grep -Fq "versionName '0.53-stable-diag-dom-model-self-update'" "$GRADLE"
          grep -Fq 'OrchestratorPaidModelDomBridgeSelfUpdateV55Activity' "$MAN"

          # Accessibility authorization continuity stays on the already-approved component.
          grep -Fq 'ControlPlaneAccessibilityServiceV51' "$MAN"
          grep -Fq '@xml/cp_accessibility_service_v51' "$MAN"
          ! grep -Fq 'ControlPlaneAccessibilityServiceV55' "$MAN"

          # This gate is model-only: reuse Medium as a precondition, do not rerun the closed effort proof.
          python3 - "$ACT" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text()
          a=s.index('private void resolveBaseline47()')
          b=s.index('private void dispatchPointer47()',a)
          block=s[a:b]
          assert 'PASS_MEDIUM_PRECONDITION_REUSE_CLOSED_EFFORT_PROOF' in block
          assert 'discoverModelTrigger49();' in block
          assert 'dispatchPointer47();' not in block
          PY

          # New model bridge is DOM semantic/relationship based, then reuses exact Accessibility model group receipts.
          grep -Fq 'scanDomModelBridgeCandidateJs55' "$ACT"
          grep -Fq 'dispatchDomModelBridgeJs55' "$ACT"
          grep -Fq 'PASS_UNIQUE_DOM_MODEL_BRIDGE' "$ACT"
          grep -Fq "event_class:'DOM_CLICK'" "$ACT"
          grep -Fq 'clickModelOption' "$ACT"
          grep -Fq 'MODEL_TARGET_CLAIM' "$ACT"
          grep -Fq 'MODEL_RESTORE_CLAIM' "$ACT"
          grep -Fq 'PASS_AUTONOMOUS_MODEL_ROUNDTRIP_RESTORED' "$ACT"

          # Self-update must verify package/version/signer and use PackageInstaller with silent-update request + fallback receiver.
          grep -Fq 'SELF UPDATE FROM APK' "$ACT"
          grep -Fq 'canRequestPackageInstalls' "$ACT"
          grep -Fq 'USER_ACTION_NOT_REQUIRED' "$ACT"
          grep -Fq 'SIGNER_MISMATCH' "$ACT"
          grep -Fq 'PACKAGE_MISMATCH' "$ACT"
          grep -Fq 'VERSION_NOT_NEWER' "$ACT"
          grep -Fq 'STATUS_PENDING_USER_ACTION' "$RX"
          grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' "$MAN"
          grep -Fq 'android.permission.UPDATE_PACKAGES_WITHOUT_USER_ACTION' "$MAN"
          grep -Fq 'SelfUpdateStatusReceiverV55' "$MAN"

          # Existing safety boundaries remain.
          ! grep -Fq 'elementFromPoint' "$ACT"
          ! grep -Fq 'document.evaluate' "$ACT"
          ! grep -Fq 'setAttribute("aria-value' "$ACT"
          grep -Fq 'pro_write_attempted' "$ACT"
          test "$(grep -c '<uses-permission' "$MAN")" -eq 5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build and verify aligned unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..
          OUT=ci/v55-dom-model-selfupdate-out
          mkdir -p "$OUT"
          UNSIGNED=runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$OUT/chatgpt-webview-v0.53-dom-model-self-update-stable-diag-aligned-unsigned.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$ALIGNED" > "$OUT/badging.txt"
          "$BT/aapt" dump permissions "$ALIGNED" > "$OUT/permissions.txt"
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe.diag' versionCode='56' versionName='0.53-stable-diag-dom-model-self-update'" "$OUT/badging.txt"
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorPaidModelDomBridgeSelfUpdateV55Activity'" "$OUT/badging.txt"
          grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' "$OUT/permissions.txt"
          grep -Fq 'android.permission.UPDATE_PACKAGES_WITHOUT_USER_ACTION' "$OUT/permissions.txt"
          sha256sum "$ALIGNED" > "$OUT/ALIGNED_UNSIGNED_SHA256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.53-dom-model-self-update-stable-diag-unsigned
          path: ci/v55-dom-model-selfupdate-out
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.53-dom-model-self-update-stable-diag-telemetry
          path: ci/v55-dom-model-selfupdate-telemetry
          if-no-files-found: error
          retention-days: 30
