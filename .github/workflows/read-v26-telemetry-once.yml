name: Read Stable v0.26 Telemetry Once

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/read-v26-telemetry-once.yml'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and sanitize v0.26 correlated telemetry
        env:
          READ_URL: https://webhook.site/token/d2e5c9a6-5466-4de6-9587-8bcedefa161d/requests?sorting=oldest
        run: |
          python - <<'PY'
          import json, os, urllib.request
          SOURCE='26d43d872de3387dba616c586030652c05dd1901'
          schemas={'cp-v26-ready-start-gate-v1','cp-autonomous-runtime-v2','cp-v24-script-diagnostic-v1'}
          req=urllib.request.Request(os.environ['READ_URL'],headers={'Accept':'application/json','User-Agent':'cp26-correlated-readback'})
          with urllib.request.urlopen(req,timeout=20) as r: root=json.load(r)
          rows=root.get('data',root if isinstance(root,list) else [])
          out=[]
          for row in rows:
            raw=row.get('content','') if isinstance(row,dict) else ''
            try: p=json.loads(raw)
            except: continue
            if p.get('schema_version') not in schemas: continue
            if p.get('source_ref')!=SOURCE: continue
            q={k:p.get(k) for k in ['kind','schema_version','scenario_id','test_id','seq','phase','classification','app_version','source_ref','elapsed_ms','timestamp_epoch_ms'] if k in p}
            s=p.get('state') if isinstance(p.get('state'),dict) else {}
            # Keep only non-textual control/lifecycle/receipt/script diagnostics.
            allow={
              'session_state','mic_lease','composer_len','composer_hash','user_turn_count','assistant_turn_count','snap_ok','dictation_count','voice_count',
              'last_action','last_action_status','adapter_action','adapter_status','adapter_matches','adapter_clicked','adapter_submit','adapter_cancel','adapter_ready','adapter_users',
              'matches','enabled','aria_label','root_found','prompt_visible','root_tag','reason','consecutive_exact_ready','dom_clicked_by_v26','dispatch_basis',
              'click','lifecycle','cancel_classification','stop_classification','transcript_classification','send_classification','no_message_side_effect','draft_unchanged',
              'speak_window_ms','transcript_len','transcript_hash','requires_empty_composer','preflight','final_classification',
              'user_turn_advanced','composer_cleared','v18_receipt_confirmed','v18_status_class','send_replayed','receipt_basis',
              'script_class','language_hint','arabic_persian_letters','latin_letters','persian_markers','arabic_markers','total_letters','text_length','raw_text_returned','raw_text_uploaded',
              'assistant_baseline_count','assistant_baseline_len','assistant_count','assistant_len','baseline_count','baseline_len','assistant_baseline_script_class'
            }
            def scrub(v,depth=0):
              if depth>3: return None
              if isinstance(v,dict):
                return {k:scrub(x,depth+1) for k,x in v.items() if k in allow}
              if isinstance(v,list): return [scrub(x,depth+1) for x in v[:20]]
              return v
            q['state']=scrub(s)
            out.append(q)
          print('MATCHING',len(out))
          for x in out:
            print('ROW',json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(',',':')))
          PY
