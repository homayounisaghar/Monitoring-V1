# Tool export refreshed for v0.72 durable-signer promotion.
name: Export Android apksigner 35

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/export-apksigner-35.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: android-actions/setup-android@v3
      - name: Install build tools and stage apksigner
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;35.0.0"
          mkdir -p out/lib
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" out/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" out/lib/apksigner.jar
          chmod +x out/apksigner
          out/apksigner version > out/version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35
          path: out
          if-no-files-found: error
          retention-days: 7
