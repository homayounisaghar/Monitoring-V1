# Android 35 promotion/verification tool export for durable-signer APKs.
name: Export Android apksigner 35

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/export-apksigner-35.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: android-actions/setup-android@v3
      - name: Install build tools and stage promotion verification tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;35.0.0"
          mkdir -p out/lib
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" out/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" out/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" out/zipalign
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" out/aapt
          chmod +x out/apksigner out/zipalign out/aapt
          out/apksigner version > out/version.txt
          out/zipalign -h > out/zipalign-help.txt 2>&1 || true
          out/aapt version > out/aapt-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35
          path: out
          if-no-files-found: error
          retention-days: 7
