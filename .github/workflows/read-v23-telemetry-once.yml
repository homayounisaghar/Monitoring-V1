name: Read v0.23 Telemetry Once

on:
  push:
    paths:
      - '.github/workflows/read-v23-telemetry-once.yml'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and print sanitized v0.23 phases
        env:
          READ_URL: https://webhook.site/token/75d2b5b0-7c28-4bdf-8b60-5ed62c24ed62/requests?sorting=oldest
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = os.environ['READ_URL']
          req = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'cp23-sanitized-readback'})
          with urllib.request.urlopen(req, timeout=20) as r:
              root = json.load(r)
          rows = root.get('data', root if isinstance(root, list) else [])
          print('SANITIZED_REQUEST_COUNT', len(rows))
          allowed_state = [
              'phase','session_state','mic_lease_mode','snapshot_ok','dictation_count','composer_len',
              'user_turn_count','parent_last_action','parent_last_status','wrapper_last_status',
              'forced_session_end_count','adapter_action','adapter_status','adapter_pending','adapter_matches',
              'adapter_clicked','adapter_submit_count','adapter_cancel_count','adapter_ready_count',
              'adapter_user_turns','cancel_classification','stop_classification','transcript_classification',
              'send_classification','final_classification','webview_present','telemetry_preflight_ok',
              'requires_empty_composer','no_message_side_effect','draft_unchanged','recovered'
          ]
          parsed=[]
          for row in rows:
              raw=row.get('content','') if isinstance(row,dict) else ''
              try: p=json.loads(raw)
              except Exception: continue
              if p.get('schema_version')!='cp-autonomous-runtime-v2' or p.get('scenario_id')!='dictation-one-tap-bounded-e2e':
                  continue
              s=p.get('state') if isinstance(p.get('state'),dict) else {}
              out={k:p.get(k) for k in ['test_id','seq','phase','classification','elapsed_ms','app_version','source_ref'] if k in p}
              out['state']={k:s.get(k) for k in allowed_state if k in s}
              parsed.append(out)
          parsed.sort(key=lambda x:(x.get('test_id',''), int(x.get('seq',0) or 0)))
          print('SANITIZED_MATCHING_COUNT', len(parsed))
          for x in parsed:
              print('PHASE_JSON', json.dumps(x, sort_keys=True, separators=(',',':')))
          PY
