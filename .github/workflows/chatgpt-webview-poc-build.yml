name: ChatGPT WebView POC APK

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/chatgpt-webview-poc-build.yml'
      - 'runtime_probes/chatgpt-webview-poc/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-poc/local.properties

      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-poc
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p ../../ci/out
          cp app/build/outputs/apk/debug/app-debug.apk ../../ci/out/chatgpt-webview-login-poc-v01.apk
          sha256sum ../../ci/out/chatgpt-webview-login-poc-v01.apk > ../../ci/out/SHA256.txt

      - name: Verify APK metadata
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging ci/out/chatgpt-webview-login-poc-v01.apk | tee ci/out/badging.txt
          grep -Fq "package: name='com.openai.controlplane.webviewpoc' versionCode='1' versionName='0.1-webview-login-poc'" ci/out/badging.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-login-poc-v01
          path: |
            ci/out/chatgpt-webview-login-poc-v01.apk
            ci/out/SHA256.txt
            ci/out/badging.txt
          if-no-files-found: error
          retention-days: 30
