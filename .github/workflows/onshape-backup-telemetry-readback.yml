name: Onshape Backup Telemetry Readback

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/onshape-backup-telemetry-readback.yml'
      - '.ci/onshape-backup-telemetry-readback-trigger.txt'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve latest qualified collector
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUNS="https://api.github.com/repos/$REPO/actions/workflows/webhook-site-collector-provision.yml/runs?status=success&per_page=10"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$RUNS" -o "$RUNNER_TEMP/runs.json"
          RUN_ID="$(python3 - "$RUNNER_TEMP/runs.json" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1])).get('workflow_runs',[])
          if not rows: raise SystemExit('no successful collector provision run')
          print(rows[0]['id'])
          PY
          )"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts" -o "$RUNNER_TEMP/artifacts.json"
          ARTIFACT_ID="$(python3 - "$RUNNER_TEMP/artifacts.json" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1])).get('artifacts',[])
          rows=[r for r in rows if r.get('name')=='webhook-site-collector' and not r.get('expired')]
          if not rows: raise SystemExit('collector artifact unavailable')
          print(rows[0]['id'])
          PY
          )"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" -o "$RUNNER_TEMP/collector.zip"
          mkdir -p "$RUNNER_TEMP/collector"
          unzip -q "$RUNNER_TEMP/collector.zip" -d "$RUNNER_TEMP/collector"
          test -s "$RUNNER_TEMP/collector/read-url.txt"

      - name: Fetch and sanitize telemetry
        shell: bash
        run: |
          set -euo pipefail
          READ_URL="$(tr -d '\r\n' < "$RUNNER_TEMP/collector/read-url.txt")"
          test -n "$READ_URL"
          curl -fsS "$READ_URL" -o "$RUNNER_TEMP/raw.json"
          python3 - "$RUNNER_TEMP/raw.json" <<'PY'
          import json,sys
          src=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=src.get('data',[]) if isinstance(src,dict) else []
          out=[]
          for row in rows:
              if not isinstance(row,dict): continue
              raw=row.get('content','')
              try: event=json.loads(raw) if isinstance(raw,str) else raw
              except Exception: continue
              if not isinstance(event,dict): continue
              if not str(event.get('schema','')).startswith('cf.onshape.backup.telemetry.'): continue
              out.append({'receivedAt':row.get('created_at',''),'event':event})
          with open('telemetry-sanitized.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,separators=(',',':'))
          print('sanitized_event_count='+str(len(out)))
          for item in out[-60:]:
              e=item['event']; d=e.get('detail',{}) if isinstance(e.get('detail'),dict) else {}
              fields=[item.get('receivedAt',''),str(e.get('versionCode','')),str(e.get('event','')),str(e.get('runId',''))]
              if d: fields.append(json.dumps(d,separators=(',',':'))[:500])
              print(' | '.join(fields))
          PY

      - name: Upload sanitized telemetry
        uses: actions/upload-artifact@v4
        with:
          name: onshape-backup-telemetry-sanitized
          path: telemetry-sanitized.json
          retention-days: 1
          if-no-files-found: error
