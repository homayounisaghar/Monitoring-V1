name: ChatGPT WebView Stable v0.43 Slider Value Semantics Unsigned

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/chatgpt-webview-stable-v45-slider-readonly-unsigned.yml'
      - 'ci/generate_chatgpt_webview_v45_slider_semantics.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Generate v0.43 slider semantics source
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/generate_chatgpt_webview_v45_slider_semantics.py

      - name: Create fresh telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          CFG=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV45.java
          TOKEN=$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid");assert x;print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"
          READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(); ep,sha,cid=sys.argv[2:]
          s=re.sub(r'WEBHOOK_URL=".*?"',f'WEBHOOK_URL="{ep}"',s)
          s=re.sub(r'SOURCE_REF=".*?"',f'SOURCE_REF="{sha}"',s)
          s=re.sub(r'COLLECTOR_ID=".*?"',f'COLLECTOR_ID="{cid}"',s)
          s=s.replace('CONFIGURED=false','CONFIGURED=true')
          p.write_text(s)
          PY
          mkdir -p ci/v45-slider-telemetry
          printf '%s\n' "$TOKEN" > ci/v45-slider-telemetry/collector-id.txt
          printf '%s\n' "$READ" > ci/v45-slider-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v45-slider-telemetry/source-ref.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v45-paid-model-effort-slider-value-census-v1","scenario_id":"paid-model-effort-slider-value-census","source_ref":"%s"}\n' "$GITHUB_SHA" | curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @- >/dev/null

      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          SRC="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorPaidModelEffortSliderSemanticsV45Activity.java"
          GRADLE="$ROOT/app/build.gradle"
          MAN="$ROOT/app/src/main/AndroidManifest.xml"
          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe.diag'" "$GRADLE"
          grep -Fq "versionCode 46" "$GRADLE"
          grep -Fq "versionName '0.43-stable-diag-paid-model-effort-slider-value-census'" "$GRADLE"
          grep -Fq 'CLAIMED_BEFORE_SEMANTIC_POINTERDOWN' "$SRC"
          grep -Fq "new PointerEvent('pointerdown'" "$SRC"
          grep -Fq 'secondary_ui_dispatches",0' "$SRC"
          grep -Fq "role==='slider'" "$SRC"
          grep -Fq "type==='range'" "$SRC"
          grep -Fq 'aria-valuenow' "$SRC"
          grep -Fq 'aria-valuemin' "$SRC"
          grep -Fq 'aria-valuemax' "$SRC"
          grep -Fq 'aria-valuetext' "$SRC"
          grep -Fq 'PASS_UNIQUE_STABLE_SLIDER_VALUE_SEMANTICS' "$SRC"
          grep -Fq 'NEGATIVE_SLIDER_VALUE_SEMANTICS_ABSENT' "$SRC"
          test "$(grep -c '<uses-permission' "$MAN")" -eq 3
          python3 - "$SRC" <<'PY'
          from pathlib import Path
          import re,sys
          s=Path(sys.argv[1]).read_text()
          body=re.sub(r'/\*.*?\*/','',s,flags=re.S)
          body=re.sub(r'//.*','',body)
          assert '.click()' not in body
          assert 'pointerover' not in body
          assert 'mouseover' not in body
          assert 'elementFromPoint' not in body
          assert 'MODEL_EFFORT_SELECT_LIGHT' not in body
          assert body.count("new PointerEvent('pointerdown'") == 1
          assert 'secondary_ui_dispatches",0' in body
          assert 'model_option_clicks",0' in body
          assert 'setAttribute(\"aria-value' not in body
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build and verify aligned unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..
          OUT=ci/v45-slider-out
          mkdir -p "$OUT"
          UNSIGNED=runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$OUT/chatgpt-webview-v0.43-slider-value-census-stable-diag-aligned-unsigned.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$ALIGNED" > "$OUT/badging.txt"
          "$BT/aapt" dump permissions "$ALIGNED" > "$OUT/permissions.txt"
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe.diag' versionCode='46' versionName='0.43-stable-diag-paid-model-effort-slider-value-census'" "$OUT/badging.txt"
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorPaidModelEffortSliderSemanticsV45Activity'" "$OUT/badging.txt"
          test "$(grep -c '^uses-permission:' "$OUT/permissions.txt")" -eq 3
          sha256sum "$ALIGNED" > "$OUT/ALIGNED_UNSIGNED_SHA256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.43-slider-value-census-stable-diag-unsigned
          path: ci/v45-slider-out
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.43-slider-value-census-stable-diag-telemetry
          path: ci/v45-slider-telemetry
          if-no-files-found: error
          retention-days: 30
