name: MouseBridge Temp Test APK

on:
  push:
    branches:
      - mousebridge-temp-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent test signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mousebridge-public-test-signing-v1

      - name: Create persistent test signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=MouseBridge Test,O=Onshape MouseBridge,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Build debug APK
        run: gradle -p mousebridge-build :app:assembleDebug --stacktrace

      - name: Verify debug APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs mousebridge-build/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OnshapeMouseBridge-v0.3.2-test-stable-signed
          path: mousebridge-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
