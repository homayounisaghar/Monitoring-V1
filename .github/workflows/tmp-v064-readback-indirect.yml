name: Temporary v0.64 Readback Indirect

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/tmp-v064-readback-indirect.yml'

permissions:
  contents: read
  actions: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download build telemetry locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 34023070100 -R homayounisaghar/Monitoring-V1 -n chatgpt-webview-v0.64-semantic-planner-core-34023070100-telemetry -D /tmp/telemetry
      - name: Read sanitized collector
        shell: bash
        run: |
          set -euo pipefail
          URL=$(cat /tmp/telemetry/read-url.txt)
          curl -fsS "$URL" -o /tmp/readback.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/readback.json'))
          for r in d.get('data',[]):
              try: o=json.loads(r.get('content',''))
              except Exception: continue
              if o.get('schema_version')=='cp-v66-planner-core-v1':
                  print(json.dumps(o,ensure_ascii=False,separators=(',',':')))
          PY
