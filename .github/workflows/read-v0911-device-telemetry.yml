name: Read v0.91.1 device telemetry
on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/read-v0911-device-telemetry.yml'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and summarize telemetry
        shell: bash
        run: |
          set -euo pipefail
          URL='https://webhook.site/token/178a0cbd-c55b-4d1d-ac39-51cddc7c95e8/requests?sorting=newest&per_page=100'
          curl -fsS -H 'Accept: application/json' "$URL" > /tmp/telemetry.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/telemetry.json'))
          rows=x.get('data',x if isinstance(x,list) else [])
          print('COUNT',len(rows))
          keep=['event','phase','state','result','classification','error','error_name','receipt','semantic_temp_state','temp_state','normal_stable_hits','planner_phase','source_ref','request_id','target_ref','detail','temp_candidate_count','composer_candidate_count','stop_candidate_count','route_class','temporary_hint','state_fingerprint','voice_state','voice_event','reason','status','manual_stop','generation','scheduled_generation','candidate_count','enabled_candidate_count']
          for r in reversed(rows):
              c=r.get('content') or r.get('request',{}).get('content') or ''
              if isinstance(c,dict): obj=c
              else:
                  try: obj=json.loads(c)
                  except Exception: obj={'raw_unparsed':str(c)[:160]}
              out={k:obj.get(k) for k in keep if k in obj}
              if not out and isinstance(obj,dict):
                  out={'keys':sorted(obj.keys())}
              print(r.get('created_at','?'),json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
