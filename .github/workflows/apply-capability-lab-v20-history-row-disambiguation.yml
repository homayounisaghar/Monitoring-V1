name: Apply Capability Lab v0.20 History Row Disambiguation

on:
  push:
    branches: [build/pebble-chat-bridge-v019]
    paths:
      - '.github/workflows/apply-capability-lab-v20-history-row-disambiguation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/pebble-chat-bridge-v019
          fetch-depth: 0
      - name: Apply v0.20 History row disambiguation patch
        run: |
          set -euo pipefail
          python3 build_tools/apply_capability_lab_v20_history_row_disambiguation.py
      - name: Verify v0.20 contract
        run: |
          set -euo pipefail
          ROOT=runtime_probes/native-capability-lab
          SVC="$ROOT/app/src/main/java/com/openai/controlplane/capabilitylab/LabAccessibilityService.java"
          git diff --check
          grep -Fq 'versionCode 20' "$ROOT/app/build.gradle"
          grep -Fq '0.20-native-capability-lab-stable-history-row-disambiguation' "$ROOT/app/build.gradle"
          grep -Fq 'conversation_history_accessibility_binding_v15_row_disambiguated' "$ROOT/plans/default.json"
          ! grep -Fq 'global_search_binding' "$ROOT/plans/default.json"
          grep -Fq 'excludedLongClickHistoryRows=' "$SVC"
          grep -Fq 'HISTORY_RECENT_NEW_CHAT_NAVIGATION_NOT_UNIQUE' "$SVC"
          grep -Fq 'hasAction(target, AccessibilityNodeInfo.ACTION_LONG_CLICK)' "$SVC"
          grep -Fq 'chatgpt.history.item.' "$SVC"
          grep -Fq 'Stable v0.20' "$ROOT/app/src/main/java/com/openai/controlplane/capabilitylab/MainActivity.java"
          git status --short
      - name: Commit runtime v0.20
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime_probes/native-capability-lab
          git commit -m 'Disambiguate New chat control from History rows v0.20'
          git push origin HEAD:build/pebble-chat-bridge-v019
