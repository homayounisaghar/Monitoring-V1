name: TEMP v0.54 telemetry readback

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-v56-telemetry-readback-temp.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chatgpt-webview-v0.54-model-dom-click-roundtrip-33974356563-telemetry
          path: telemetry
          github-token: ${{ github.token }}
          repository: homayounisaghar/Monitoring-V1
          run-id: 33974356563
      - name: Read collector
        shell: bash
        run: |
          set -euo pipefail
          READ=$(cat telemetry/read-url.txt)
          echo '--- V0.54 COLLECTOR BEGIN ---'
          curl -fsS "$READ"
          echo
          echo '--- V0.54 COLLECTOR END ---'
