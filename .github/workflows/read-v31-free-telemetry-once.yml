name: Read Stable v0.31 Free Telemetry Once

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/read-v31-free-telemetry-once.yml'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read latest v0.31 telemetry
        env:
          READ_URL: https://webhook.site/token/bd863081-6608-44f8-a60f-a043b8463faa/requests?sorting=oldest&per_page=100
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, collections
          SOURCE='db5b9cc71fe74799ccb5a754b6d16416ecd9d942'
          SCHEMA='cp-v31-capability-picker-v1'
          req=urllib.request.Request(os.environ['READ_URL'],headers={'Accept':'application/json','User-Agent':'cp31-readback'})
          with urllib.request.urlopen(req,timeout=20) as r:
              root=json.load(r)
          rows=root.get('data',root if isinstance(root,list) else [])
          parsed=[]
          for row in rows:
              raw=row.get('content','') if isinstance(row,dict) else ''
              try: p=json.loads(raw)
              except Exception: continue
              if p.get('schema_version')==SCHEMA and p.get('source_ref')==SOURCE:
                  parsed.append(p)
          print('API_ROWS',len(rows),'PARSED_MATCH',len(parsed),'TOTAL',root.get('total'))
          tests=collections.defaultdict(list); build=[]
          for p in parsed:
              tid=str(p.get('test_id','-'))
              (tests[tid] if tid.startswith('cp31-') else build).append(p)
          print('BUILD_ROWS',[(p.get('kind'),p.get('phase'),p.get('classification')) for p in build])
          if not tests: raise SystemExit('NO_CP31_TEST_FOUND')
          def rank(ps): return max((p.get('timestamp_epoch_ms') or 0) for p in ps)
          tid,ps=max(tests.items(),key=lambda kv:rank(kv[1]))
          ps=sorted(ps,key=lambda p:((p.get('timestamp_epoch_ms') or 0),(p.get('seq') or 0)))
          print('LATEST_TEST',tid,'ROWS',len(ps),'MAXSEQ',max((p.get('seq') or 0) for p in ps))
          keys=['model_trigger_count','model_option_count','model_enabled_count','model_selected_count','selection_applicable','selection_clicks','add_trigger_count','add_item_count','tools_trigger_count','tools_item_count','tool_surface_item_total','claim_action','claim_status','original_model_hash','target_model_hash','model_set_hash','add_set_hash','tools_set_hash','raw_model_labels_uploaded','raw_tool_labels_uploaded','raw_chat_text_uploaded','raw_html_uploaded','cookies_tokens_accessed']
          for p in ps:
              s=p.get('state') or {}
              keep={k:s.get(k) for k in keys if k in s}
              print('ROW',p.get('seq'),p.get('phase'),p.get('classification'),json.dumps(keep,sort_keys=True,separators=(',',':')))
          finals=[(p.get('classification'),p.get('state')) for p in ps if p.get('phase')=='FINAL']
          print('FINALS',json.dumps(finals,sort_keys=True,separators=(',',':')))
          PY
