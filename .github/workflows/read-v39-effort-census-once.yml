name: Read v0.37 Effort Census Once
on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths: ['.github/workflows/read-v39-effort-census-once.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read and summarize v0.37 effort census telemetry
        shell: bash
        env:
          READ_URL: 'https://webhook.site/token/838aa0ee-71a8-4534-9f08-3dbd4883924c/requests?sorting=oldest&per_page=100'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, collections
          with urllib.request.urlopen(os.environ['READ_URL'], timeout=20) as r:
              o=json.load(r)
          def parse(x):
              for k in ('content','body'):
                  v=x.get(k)
                  if isinstance(v,dict): return v
                  if isinstance(v,str):
                      try:return json.loads(v)
                      except Exception: pass
              return None
          ps=[p for x in o.get('data',[]) if isinstance((p:=parse(x)),dict)]
          print('API_ROWS',len(o.get('data',[])),'TOTAL',o.get('total',o.get('total_count','?')),'PARSED',len(ps))
          tests=collections.defaultdict(list)
          for p in ps:
              tid=p.get('test_id') or p.get('scenario_id') or p.get('kind') or 'NO_ID'
              tests[tid].append(p)
          keys=('snapshot_index','success','complete','composer_found','cluster_found','control_count','effort_control_count','light_count','medium_count','heavy_count','auto_count','selected_count','expanded_count','popup_count','candidate_set_hash','effort_set_hash','snapshots_ok','snapshots_complete','stable_candidate_set_count','stable_effort_set_count','dom_clicks','capability_dispatches')
          for tid,rows in tests.items():
              print('TEST',tid,'ROWS',len(rows))
              for p in sorted(rows,key=lambda q:(q.get('timestamp_epoch_ms',0),q.get('seq',-1))):
                  ph=p.get('phase') or p.get('kind') or '-'
                  cls=p.get('classification') or '-'
                  st=p.get('state') if isinstance(p.get('state'),dict) else {}
                  slim={k:st.get(k) for k in keys if k in st}
                  if 'controls' in st: slim['controls']=st['controls']
                  print(json.dumps({'seq':p.get('seq'),'phase':ph,'classification':cls,'state':slim},sort_keys=True))
          PY
