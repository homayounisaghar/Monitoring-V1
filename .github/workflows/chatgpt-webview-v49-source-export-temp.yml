name: TEMP v0.47 generated source export

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-v49-source-export-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate current v0.47 source
        run: python3 ci/generate_chatgpt_webview_v49_accessibility_model_roundtrip.py
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v49-generated-source-temp
          path: |
            runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorPaidEffortAccessibilityModelRoundtripV49Activity.java
            runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/ControlPlaneAccessibilityServiceV49.java
          if-no-files-found: error
          retention-days: 1
# trigger: dynamic-v0.48
