name: ChatGPT WebView Stable v0.16 Orchestrator Toggle Repair Release Kit

on:
  push:
    branches:
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/chatgpt-webview-stable-v16-build.yml'
      - 'runtime_probes/chatgpt-webview-stable-probe/app/src/main/AndroidManifest.xml'
      - 'runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorFoundationV16Activity.java'
      - 'runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/AudioFixVisibleActivityV14Activity.java'
      - 'runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/AudioEarlyTraceV13Activity.java'
      - 'runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/AudioModelSuiteV11FinalActivity.java'
      - 'runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/AudioModelSuiteV11Activity.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare v0.16 metadata and contract prechecks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          ACT="$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/OrchestratorFoundationV16Activity.java"
          GRADLE="$ROOT/app/build.gradle"
          MAN="$ROOT/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('runtime_probes/chatgpt-webview-stable-probe/app/build.gradle')
          s = p.read_text()
          s = re.sub(r'versionCode\s+\d+', 'versionCode 16', s)
          s = re.sub(r"versionName\s+'[^']+'", "versionName '0.16-stable-orchestrator-toggle-repair'", s)
          p.write_text(s)
          PY

          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe'" "$GRADLE"
          grep -Fq 'versionCode 16' "$GRADLE"
          grep -Fq "versionName '0.16-stable-orchestrator-toggle-repair'" "$GRADLE"
          grep -Fq 'OrchestratorFoundationV16Activity' "$MAN"
          grep -Fq 'android.permission.INTERNET' "$MAN"
          grep -Fq 'android.permission.RECORD_AUDIO' "$MAN"
          grep -Fq 'android.permission.MODIFY_AUDIO_SETTINGS' "$MAN"
          test "$(grep -c '<uses-permission' "$MAN")" -eq 3
          grep -Fq 'case "DICTATION_STOP": return "DICTATION_MIC";' "$ACT"
          grep -Fq 'V16_REPAIR=DICTATION_START_AND_STOP_SHARE_DICTATION_MIC_TOGGLE' "$ACT"
          grep -Fq 'MEDIA_TRACKER_JS' "$ACT"
          grep -Fq 'SEMANTIC_COORDINATES_USED=false' "$ACT"
          ! grep -Fq 'getBoundsInScreen' "$ACT"
          ! grep -Fq 'dispatchGesture' "$ACT"
          ! grep -R -n -E 'api\.openai\.com|Authorization: Bearer|access_token|refresh_token' "$ROOT"
          echo 'stable v0.16 contract prechecks OK'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p ../../ci/out/signing-tools/lib ../../ci/out/signing-tools/lib64
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../../ci/out/chatgpt-webview-stable-v16-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" ../../ci/out/signing-tools/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" ../../ci/out/signing-tools/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" ../../ci/out/signing-tools/zipalign
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" ../../ci/out/signing-tools/aapt
          LIBCPP=$(find "$ANDROID_SDK_ROOT/build-tools/35.0.0" -type f -name 'libc++.so' | head -n 1)
          test -n "$LIBCPP"
          cp "$LIBCPP" ../../ci/out/signing-tools/lib64/libc++.so

      - name: Verify unsigned package metadata
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging ci/out/chatgpt-webview-stable-v16-unsigned.apk | tee ci/out/badging.txt
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe' versionCode='16' versionName='0.16-stable-orchestrator-toggle-repair'" ci/out/badging.txt
          "$AAPT" dump permissions ci/out/chatgpt-webview-stable-v16-unsigned.apk | tee ci/out/permissions.txt
          grep -Fq 'android.permission.INTERNET' ci/out/permissions.txt
          grep -Fq 'android.permission.RECORD_AUDIO' ci/out/permissions.txt
          grep -Fq 'android.permission.MODIFY_AUDIO_SETTINGS' ci/out/permissions.txt
          sha256sum ci/out/chatgpt-webview-stable-v16-unsigned.apk | tee ci/out/UNSIGNED_SHA256.txt
          printf '%s\n' "$GITHUB_SHA" > ci/out/SOURCE_REF.txt

      - name: Upload release signing kit
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-stable-v16-signing-kit
          path: |
            ci/out/chatgpt-webview-stable-v16-unsigned.apk
            ci/out/UNSIGNED_SHA256.txt
            ci/out/badging.txt
            ci/out/permissions.txt
            ci/out/SOURCE_REF.txt
            ci/out/signing-tools/apksigner
            ci/out/signing-tools/lib/apksigner.jar
            ci/out/signing-tools/zipalign
            ci/out/signing-tools/aapt
            ci/out/signing-tools/lib64/libc++.so
          if-no-files-found: error
          retention-days: 30
