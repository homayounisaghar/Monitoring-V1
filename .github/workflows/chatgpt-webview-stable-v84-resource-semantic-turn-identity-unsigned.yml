name: ChatGPT WebView Stable v0.82 Semantic Turn Identity Unsigned

on:
  push:
    branches:
      - project/chatgpt-webview-poc-v082-semantic-turn-finalstaging
      - project/chatgpt-webview-poc
    paths:
      - '.github/workflows/chatgpt-webview-stable-v84-resource-semantic-turn-identity-unsigned.yml'
      - 'ci/generate_chatgpt_webview_v84_resource_semantic_turn_identity.py'
      - 'ci/generate_chatgpt_webview_v83_resource_observable_terminal.py'
      - 'ci/generate_chatgpt_webview_v82_calibrated_actuator_resource_fix1.py'
      - 'ci/generate_chatgpt_webview_v82_calibrated_actuator_resource.py'
      - 'ci/generate_chatgpt_webview_v81_assistant_local_resource_acceptance.py'
      - 'ci/generate_chatgpt_webview_v80_assistant_local_interaction_probe.py'
      - 'ci/generate_chatgpt_webview_v79_resource_topology_probe.py'
      - 'ci/generate_chatgpt_webview_v78_resource_final_bounded_wrapped.py'
      - 'ci/generate_chatgpt_webview_v77_resource_provenance_hardened.py'
      - 'ci/generate_chatgpt_webview_v77_resource_provenance_hardened_fix1.py'
      - 'ci/generate_chatgpt_webview_v76_resource_tools_consolidated.py'
      - 'ci/generate_chatgpt_webview_v76_resource_tools_consolidated_fix1.py'
      - 'ci/generate_chatgpt_webview_v64_conversation_runtime.py'
      - 'ci/v51_model_observer/ControlPlaneAccessibilityServiceV51.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Generate v0.82 semantic turn identity source
        run: python3 ci/generate_chatgpt_webview_v84_resource_semantic_turn_identity.py

      - name: Create fresh telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          CFG=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV84.java
          TOKEN=$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid");assert x;print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"
          READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(); ep,sha,cid=sys.argv[2:]
          s=re.sub(r'WEBHOOK_URL=".*?"',f'WEBHOOK_URL="{ep}"',s)
          s=re.sub(r'SOURCE_REF=".*?"',f'SOURCE_REF="{sha}"',s)
          s=re.sub(r'COLLECTOR_ID=".*?"',f'COLLECTOR_ID="{cid}"',s)
          s=s.replace('CONFIGURED=false','CONFIGURED=true')
          p.write_text(s)
          PY
          mkdir -p ci/v84-resource-semantic-turn-identity-telemetry
          printf '%s\n' "$TOKEN" > ci/v84-resource-semantic-turn-identity-telemetry/collector-id.txt
          printf '%s\n' "$READ" > ci/v84-resource-semantic-turn-identity-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v84-resource-semantic-turn-identity-telemetry/source-ref.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v84-resource-semantic-turn-identity-v1","scenario_id":"resource-semantic-turn-identity-calibrated-actuator","control_sync":"SEMANTIC_TURN_IDENTITY_EVENT_DRIVEN_EFFECT_RECEIPTS","audit":"V64_NORMALIZED_FNV_CONTEXT_REMOUNT_STABLE_IDENTITY_NO_DOM_TURN_KEY_AUTHORITY"}\n' | curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @- >/dev/null

      - name: End-to-end semantic identity static audit
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          PKG=$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe
          ACT=$PKG/OrchestratorResourceToolsV84Activity.java
          SVC=$PKG/ControlPlaneAccessibilityServiceV51.java
          MAN=$ROOT/app/src/main/AndroidManifest.xml
          GRADLE=$ROOT/app/build.gradle
          test -f "$ACT"
          test -f "$SVC"
          test -f "$PKG/TelemetryConfigV84.java"
          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe.diag'" "$GRADLE"
          grep -Fq 'versionCode 85' "$GRADLE"
          grep -Fq "versionName '0.82-stable-diag-resource-semantic-turn-identity'" "$GRADLE"
          grep -Fq 'OrchestratorResourceToolsV84Activity' "$MAN"
          grep -Fq 'ControlPlaneAccessibilityServiceV51' "$MAN"
          grep -Fq '@xml/cp_accessibility_service_v51' "$MAN"
          python3 - "$ACT" "$SVC" <<'PY'
          import pathlib,re,sys
          s=pathlib.Path(sys.argv[1]).read_text(); svc=pathlib.Path(sys.argv[2]).read_text()
          required=[
            'TEST RESOURCE','V64_NORMALIZED_FNV_CONTEXT','assistant_fingerprint','assistant_identity_unique','assistant_identity_match_count','assistant_match_count',
            'resourceV84ClaimTurnFingerprint','resource_v84_turn_fingerprint',
            "H(['assistant',t.content_hash,t.norm_len,u?u.content_hash:'-',u?u.norm_len:0].join('|'))",
            'RESOURCE_ACTION_ABORTED_ASSISTANT_TURN_IDENTITY_AMBIGUOUS_PRE_EFFECT','RESOURCE_ACTION_ABORTED_ASSISTANT_TURN_CHANGED_PRE_EFFECT',
            'RESOURCE_ACTION_ATTEMPTED','ACTUATOR_CALIBRATION_STARTED','PASS_ACTUATOR_CALIBRATION_SELECTED',
            'PASS_ASSISTANT_LOCAL_RESOURCE_UNIQUE_ADMITTED','CLAIMED_BEFORE_RESOURCE_ACTION',
            'RESOURCE_TARGET_TRANSIENTLY_ABSENT_WAITING_EVENT','RESOURCE_ACTION_PRE_EFFECT_TARGET_TIMEOUT_NO_ACTION',
            'PASS_RESOURCE_JS_CERTIFY_AND_CLICK_SAME_TASK_WAITING_RECEIPT',
            'PASS_RESOURCE_ACCESSIBILITY_ACTION_DISPATCHED_WAITING_RECEIPT',
            'PASS_RESOURCE_NATIVE_TOUCH_DISPATCHED_WAITING_RECEIPT',
            'RESOURCE_POST_EFFECT_RECEIPT_DEADLINE_ARMED','FAIL_CLOSED_TERMINATION_ONLY',
            'RESOURCE_ACTION_UNCERTAIN_EFFECT_DISPATCHED_NO_RECEIPT_NO_REPLAY',
            'RESOURCE_ACTION_UNCERTAIN_NEW_WINDOW_BOOTSTRAP_NO_DESTINATION_NO_REPLAY',
            'ACTUATION_TRANSPORT_ONLY','isResourceLifecycleV84','isResourceTerminalV84','TelemetryConfigV84'
          ]
          for x in required: assert x in s,x
          forbidden_identity=["H('assistant|'+turnKey+'|'+last.index)","getAttribute('data-turn-id')||last.el.getAttribute('data-testid')",'resourceV82ClaimAssistantToken','assistant_token']
          for x in forbidden_identity: assert x not in s,x
          for x in ['performV82CalibrationClick','armV82ResourceActuation','performV82ResourceClickAtScreenPoint','V82_RESOURCE_NONCE']:
            assert x in svc,x
          for n in range(1,5): assert f'root.addView(row{n}' not in s,n
          assert s.count('root.addView(row5')==1
          assert s.count('armResourceReceiptDeadlineV84(actuator)')==3,s.count('armResourceReceiptDeadlineV84(actuator)')
          assert s.count('dispatchTouchEvent(')==4,s.count('dispatchTouchEvent(')
          for bad in ['elementFromPoint','document.evaluate','XPathResult','getCookie(','CookieManager','addJavascriptInterface','Thread.sleep','ScheduledExecutorService','TimerTask']:
            assert bad not in s,bad
          assert 'getBoundingClientRect' in s
          assert 'geometry_role' in s and 'ACTUATION_TRANSPORT_ONLY' in s
          assert 'raw_url_remote",false' in s and 'raw_text_remote",false' in s and 'raw_html_remote",false' in s
          # Model the reused v64 canonicalization/FNV identity: harmless whitespace/case
          # realization changes are invariant; semantic Assistant/User changes are not.
          def N(x): return ' '.join((x or '').split()).strip().lower()
          def H(x):
              h=2166136261
              for ch in x:
                  h ^= ord(ch); h=(h*16777619)&0xffffffff
              return f'{h:08x}'
          def fp(a,u):
              an=N(a); un=N(u)
              return H('|'.join(['assistant',H(an) if an else '-',str(len(an)),H(un) if un else '-',str(len(un))]))
          assert fp('Hello   World','Question ONE')==fp('  hello world  ','question one')
          assert fp('Hello World!','Question ONE')!=fp('Hello World','Question ONE')
          assert fp('Hello World','Question TWO')!=fp('Hello World','Question ONE')
          print('PASS v0.82 semantic-turn-identity static audit')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build and prove exact artifact identity
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..
          OUT=ci/v84-resource-semantic-turn-identity-out
          mkdir -p "$OUT"
          UNSIGNED=runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$OUT/chatgpt-webview-v0.82-resource-semantic-turn-identity-exact-source-aligned-unsigned.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$ALIGNED" > "$OUT/badging.txt"
          "$BT/aapt" dump permissions "$ALIGNED" > "$OUT/permissions.txt"
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe.diag' versionCode='85' versionName='0.82-stable-diag-resource-semantic-turn-identity'" "$OUT/badging.txt"
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorResourceToolsV84Activity'" "$OUT/badging.txt"
          test "$(grep -c '^uses-permission:' "$OUT/permissions.txt")" -eq 3
          grep -Fq 'android.permission.INTERNET' "$OUT/permissions.txt"
          grep -Fq 'android.permission.RECORD_AUDIO' "$OUT/permissions.txt"
          grep -Fq 'android.permission.MODIFY_AUDIO_SETTINGS' "$OUT/permissions.txt"
          cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
          java -jar "$OUT/apksigner.jar" --version > "$OUT/APKSIGNER_VERSION.txt"
          sha256sum "$OUT/apksigner.jar" > "$OUT/APKSIGNER_JAR_SHA256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"
          printf '%s\n' 'RESOURCE_SEMANTIC_TURN_IDENTITY_CALIBRATED_ACTUATOR' > "$OUT/FRONTIER_MODE.txt"
          printf '%s\n' 'V64_NORMALIZED_FNV_CONTEXT_EXACT_UNIQUE_MATCH' > "$OUT/TURN_IDENTITY_POLICY.txt"
          printf '%s\n' 'EVENT_DRIVEN_EFFECT_RECEIPTS_TIMEOUT_FAIL_CLOSED_ONLY' > "$OUT/CONTROL_SYNC.txt"
          printf '%s\n' 'GEOMETRY_ACTUATION_TRANSPORT_ONLY_AFTER_EXACT_SEMANTIC_CERTIFICATION' > "$OUT/GEOMETRY_POLICY.txt"
          printf '%s\n' 'b7aea08158252dcad79345608ce2e76e970e4cf613414db299579f46d9924c48' > "$OUT/EXPECTED_SIGNER_CERT_SHA256.txt"
          sha256sum "$ALIGNED" > "$OUT/ALIGNED_UNSIGNED_SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.82-resource-semantic-turn-identity-${{ github.run_id }}-unsigned
          path: ci/v84-resource-semantic-turn-identity-out
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.82-resource-semantic-turn-identity-${{ github.run_id }}-telemetry
          path: ci/v84-resource-semantic-turn-identity-telemetry
          if-no-files-found: error
          retention-days: 30
