name: ChatGPT WebView Stable v0.50 Effort Popup Human Model Bridge Unsigned

on:
  push:
    branches: [project/chatgpt-webview-poc]
    paths:
      - '.github/workflows/chatgpt-webview-stable-v52-effort-popup-human-model-bridge-unsigned.yml'
      - 'ci/generate_chatgpt_webview_v52_effort_popup_human_model_bridge.py'
      - 'ci/v52_model_bridge/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate v0.50 source
        run: python3 ci/generate_chatgpt_webview_v52_effort_popup_human_model_bridge.py

      - name: Create fresh telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          CFG=runtime_probes/chatgpt-webview-stable-probe/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe/TelemetryConfigV52.java
          TOKEN=$(curl -fsS -X POST https://webhook.site/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' | python3 -c 'import json,sys;x=json.load(sys.stdin).get("uuid");assert x;print(x)')
          ENDPOINT="https://webhook.site/$TOKEN"
          READ="https://webhook.site/token/$TOKEN/requests?sorting=oldest&per_page=100"
          python3 - "$CFG" "$ENDPOINT" "$GITHUB_SHA" "$TOKEN" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(); ep,sha,cid=sys.argv[2:]
          s=re.sub(r'WEBHOOK_URL=".*?"',f'WEBHOOK_URL="{ep}"',s)
          s=re.sub(r'SOURCE_REF=".*?"',f'SOURCE_REF="{sha}"',s)
          s=re.sub(r'COLLECTOR_ID=".*?"',f'COLLECTOR_ID="{cid}"',s)
          s=s.replace('CONFIGURED=false','CONFIGURED=true')
          p.write_text(s)
          PY
          mkdir -p ci/v52-bridge-telemetry
          printf '%s\n' "$TOKEN" > ci/v52-bridge-telemetry/collector-id.txt
          printf '%s\n' "$READ" > ci/v52-bridge-telemetry/read-url.txt
          printf '%s\n' "$GITHUB_SHA" > ci/v52-bridge-telemetry/source-ref.txt
          printf '{"kind":"BUILD_SMOKE","schema_version":"cp-v52-paid-effort-popup-human-model-bridge-v1","scenario_id":"paid-effort-popup-human-model-bridge","source_ref":"%s"}\n' "$GITHUB_SHA" | curl -fsS -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data-binary @- >/dev/null

      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=runtime_probes/chatgpt-webview-stable-probe
          PKG=$ROOT/app/src/main/java/com/homayounisaghar/chatgptwebviewprobe
          ACT=$PKG/OrchestratorPaidEffortPopupHumanModelBridgeV52Activity.java
          MAN=$ROOT/app/src/main/AndroidManifest.xml
          GRADLE=$ROOT/app/build.gradle
          grep -Fq "applicationId 'com.homayounisaghar.chatgptwebviewprobe.diag'" "$GRADLE"
          grep -Fq 'versionCode 53' "$GRADLE"
          grep -Fq "versionName '0.50-stable-diag-effort-popup-human-model-bridge'" "$GRADLE"
          grep -Fq 'OrchestratorPaidEffortPopupHumanModelBridgeV52Activity' "$MAN"
          # Accessibility permission continuity: component identity must NOT change from v0.49.
          grep -Fq 'ControlPlaneAccessibilityServiceV51' "$MAN"
          grep -Fq '@xml/cp_accessibility_service_v51' "$MAN"
          ! grep -Fq 'ControlPlaneAccessibilityServiceV52' "$MAN"
          grep -Fq 'ARM EFFORT POPUP -> HUMAN MODEL BRIDGE' "$ACT"
          grep -Fq 'captureEffortReceipt(1f)' "$ACT"
          grep -Fq 'PASS_MEDIUM_POPUP_OPEN_FOR_HUMAN_BRIDGE' "$ACT"
          grep -Fq 'armManualModelClickObservation()' "$ACT"
          grep -Fq 'PASS_HUMAN_EFFORT_POPUP_BRIDGE_TO_EXACT_MODEL_MENU_ZERO_MODEL_WRITE' "$ACT"
          grep -Fq 'EFFORT_POPUP_OPEN_FOR_HUMAN_MODEL_BRIDGE' "$ACT"
          grep -Fq 'effort_value_writes_by_app",0' "$ACT"
          grep -Fq 'model_option_clicks_by_app",0' "$ACT"
          grep -Fq 'pro_write_attempted",false' "$ACT"
          ! grep -Fq 'ArrowLeft' "$ACT"
          ! grep -Fq 'ArrowRight' "$ACT"
          ! grep -Fq 'clickModelOption(' "$ACT"
          ! grep -Fq 'performAction(' "$ACT"
          ! grep -Fq 'setAttribute("aria-value' "$ACT"
          test "$(grep -c '<uses-permission' "$MAN")" -eq 3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build and verify aligned unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > runtime_probes/chatgpt-webview-stable-probe/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd runtime_probes/chatgpt-webview-stable-probe
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleRelease --stacktrace
          cd ../..
          OUT=ci/v52-bridge-out
          mkdir -p "$OUT"
          UNSIGNED=runtime_probes/chatgpt-webview-stable-probe/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$OUT/chatgpt-webview-v0.50-effort-popup-human-model-bridge-stable-diag-aligned-unsigned.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED" > "$OUT/zipalign-verify.txt"
          "$BT/aapt" dump badging "$ALIGNED" > "$OUT/badging.txt"
          "$BT/aapt" dump permissions "$ALIGNED" > "$OUT/permissions.txt"
          grep -Fq "package: name='com.homayounisaghar.chatgptwebviewprobe.diag' versionCode='53' versionName='0.50-stable-diag-effort-popup-human-model-bridge'" "$OUT/badging.txt"
          grep -Fq "launchable-activity: name='com.homayounisaghar.chatgptwebviewprobe.OrchestratorPaidEffortPopupHumanModelBridgeV52Activity'" "$OUT/badging.txt"
          test "$(grep -c '^uses-permission:' "$OUT/permissions.txt")" -eq 3
          sha256sum "$ALIGNED" > "$OUT/ALIGNED_UNSIGNED_SHA256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_REF.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.50-effort-popup-human-model-bridge-stable-diag-unsigned
          path: ci/v52-bridge-out
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-webview-v0.50-effort-popup-human-model-bridge-stable-diag-telemetry
          path: ci/v52-bridge-telemetry
          if-no-files-found: error
          retention-days: 30
