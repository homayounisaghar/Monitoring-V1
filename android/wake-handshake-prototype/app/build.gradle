plugins {
    id 'com.android.application'
}

android {
    namespace 'com.homayounisaghar.wakehandshakeprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.homayounisaghar.wakehandshakeprobe'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
