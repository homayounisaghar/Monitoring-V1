workflows:
  pebble-bridge-v019:
    name: Pebble Chat Bridge v0.19 — Thread Recovery
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
      android_signing:
        - pebble_bridge
      groups:
        - codemagic_api
      vars:
        GRADLE_VERSION: "8.10.2"
        ANDROID_PLATFORM: "35"
        ANDROID_BUILD_TOOLS: "35.0.0"
        EXPECTED_CERT_SHA256: "9aaac9cb3ff091aa5c362f0255129a97b8e3c34b8a73f520cbb6ba89ed31e5d3"
        APK_BASENAME: "PebbleChatBridgePoC-v0.19-thread-recovery-signed.apk"
        CI_REPORT_TOPIC: "pebble-v019-a9f2c7e61b4d8c30e5f7a921"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "build/pebble-chat-bridge-v019"
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Reassemble and verify v0.19 source
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p ci/src ci/out
          cat v019_parts/part00.txt v019_parts/part01.txt v019_parts/part02.txt v019_parts/part03.txt > ci/PebbleChatBridge-v019-src.tgz.b64
          actual_b64_sha="$(shasum -a 256 ci/PebbleChatBridge-v019-src.tgz.b64 | awk '{print $1}')"
          test "$actual_b64_sha" = "76dfce144dd4e8126fdfb356e6fb3a6627f5bd629cf741798703847ec38d623a"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          src = Path("ci/PebbleChatBridge-v019-src.tgz.b64")
          dst = Path("ci/PebbleChatBridge-v019-src.tgz")
          dst.write_bytes(base64.b64decode(src.read_bytes()))
          PY
          actual_tgz_sha="$(shasum -a 256 ci/PebbleChatBridge-v019-src.tgz | awk '{print $1}')"
          test "$actual_tgz_sha" = "c7485116b17dfe4f2aa9f61469ab01e1596efccdf0d43f3d7b560d3c474e6196"
          tar -xzf ci/PebbleChatBridge-v019-src.tgz -C ci/src
          grep -Fq "versionCode 19" ci/src/app/build.gradle
          grep -Fq "0.19-thread-recovery" ci/src/app/build.gradle
          grep -Fq "SESSION_RECOVERY_FAILED" ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java
          grep -Fq "processSessionRecovery" ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java
          grep -Fq "markSessionRecovered" ci/src/app/src/main/java/com/pebblebridge/poc/ProbeState.java
          printf 'source_sha256=%s\nsource_b64_sha256=%s\n' \
            "c7485116b17dfe4f2aa9f61469ab01e1596efccdf0d43f3d7b560d3c474e6196" \
            "76dfce144dd4e8126fdfb356e6fb3a6627f5bd629cf741798703847ec38d623a" \
            > ci/source-verification.txt

      - name: Build unsigned Android release with full diagnostics
        script: |
          #!/usr/bin/env bash
          set -uo pipefail
          mkdir -p ci/out
          : > ci/full-build.log
          : > ci/diagnostic.txt
          {
            set -x
            echo "sdk.dir=$ANDROID_SDK_ROOT" > ci/src/local.properties
            yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
            curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
            rm -rf "/tmp/gradle-${GRADLE_VERSION}"
            unzip -q -o /tmp/gradle.zip -d /tmp
            cd ci/src
            "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon :app:assembleRelease --stacktrace
          } 2>&1 | tee ci/full-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "Pebble v0.19 build failed (exit=$rc). Extracted diagnostic follows."
              grep -E -i -C 4 "(^| )error:|FAILURE:|Execution failed for task|What went wrong:|Caused by:|Exception|Could not resolve|Android resource linking failed" ci/full-build.log | tail -n 240 || true
              echo "--- final 120 log lines ---"
              tail -n 120 ci/full-build.log
            } | tee ci/diagnostic.txt
            exit "$rc"
          fi
          unsigned="ci/src/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          cp "$unsigned" ci/out/PebbleChatBridgePoC-v0.19-unsigned.apk
          echo "BUILD_OK" > ci/diagnostic.txt

      - name: Validate injected Pebble keystore and signing tool
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          test -s "${CM_KEYSTORE_PATH:-}"
          test -n "${CM_KEYSTORE_PASSWORD:-}"
          test -n "${CM_KEY_ALIAS:-}"
          test -n "${CM_KEY_PASSWORD:-}"
          apksigner_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort | tail -n 1)"
          test -n "$apksigner_path"
          test -s "$apksigner_path"
          printf 'apksigner=%s\n' "$apksigner_path" > ci/signing-tool.txt
          keytool -list -v \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -alias "$CM_KEY_ALIAS" \
            > ci/keystore-inspect.txt

      - name: Sign Pebble release APK
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          unsigned="ci/out/PebbleChatBridgePoC-v0.19-unsigned.apk"
          signed="ci/out/${APK_BASENAME}"
          apksigner_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort | tail -n 1)"
          bash "$apksigner_path" sign \
            --ks "$CM_KEYSTORE_PATH" \
            --ks-pass "env:CM_KEYSTORE_PASSWORD" \
            --ks-key-alias "$CM_KEY_ALIAS" \
            --key-pass "env:CM_KEY_PASSWORD" \
            --out "$signed" \
            "$unsigned"
          test -s "$signed"

      - name: Verify Pebble signing certificate
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          signed="ci/out/${APK_BASENAME}"
          apksigner_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort | tail -n 1)"
          bash "$apksigner_path" verify --verbose --print-certs "$signed" | tee ci/apksigner-verify.txt
          actual_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' ci/apksigner-verify.txt | tr 'A-F' 'a-f' | head -n 1)"
          printf 'certificate_sha256=%s\n' "$actual_cert" > ci/certificate.txt
          test "$actual_cert" = "$EXPECTED_CERT_SHA256"
          shasum -a 256 "$signed" | tee ci/APK_SHA256.txt

    artifacts:
      - ci/out/*.apk
      - ci/full-build.log
      - ci/diagnostic.txt
      - ci/source-verification.txt
      - ci/signing-tool.txt
      - ci/keystore-inspect.txt
      - ci/apksigner-verify.txt
      - ci/APK_SHA256.txt
      - ci/certificate.txt

    publishing:
      scripts:
        - name: Publish Pebble APK delivery metadata and GitHub mirror
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            APK="$CM_BUILD_DIR/ci/out/${APK_BASENAME}"
            test -s "$APK"
            test -n "${CM_API_TOKEN:-}"
            test -n "${GITHUB_TOKEN:-}"

            EXPIRES_AT=$(python3 -c 'import time; print(int(time.time()) + 86400)')
            APK_AUTH=$(printf '%s' "${CM_ARTIFACT_LINKS:-[]}" | jq -r --arg n "$APK_BASENAME" '.[] | select(.name == $n) | .url' | head -1)
            APK_PUBLIC=""
            if [ -n "$APK_AUTH" ] && [ "$APK_AUTH" != "null" ]; then
              RESPONSE=$(curl -fsS \
                -H 'Content-Type: application/json' \
                -H "x-auth-token: $CM_API_TOKEN" \
                -d "{\"expiresAt\":$EXPIRES_AT}" \
                "${APK_AUTH}/public-url" 2>/dev/null || true)
              APK_PUBLIC=$(printf '%s' "$RESPONSE" | jq -r '.url // empty' 2>/dev/null || true)
            fi

            OWNER="homayounisaghar"
            REPO="Monitoring-V1"
            DELIVERY_BRANCH="ci/pebble-apk-delivery"
            SHORT_COMMIT=$(printf '%s' "${CM_COMMIT:-unknown}" | cut -c1-12)
            TAG="pebble-v0.19-$SHORT_COMMIT"
            RELEASE_NAME="Pebble Chat Bridge v0.19 $SHORT_COMMIT"
            API="https://api.github.com/repos/$OWNER/$REPO"
            AUTH_HEADER="Authorization: Bearer $GITHUB_TOKEN"
            ACCEPT_HEADER="Accept: application/vnd.github+json"

            RELEASE_JSON=$(curl -fsS \
              -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
              "$API/releases/tags/$TAG" 2>/dev/null || true)
            RELEASE_ID=$(printf '%s' "$RELEASE_JSON" | jq -r '.id // empty' 2>/dev/null || true)

            if [ -z "$RELEASE_ID" ]; then
              RELEASE_BODY=$(jq -n \
                --arg tag "$TAG" \
                --arg target "${CM_COMMIT:-}" \
                --arg name "$RELEASE_NAME" \
                --arg build "${CM_BUILD_ID:-}" \
                --arg public "$APK_PUBLIC" \
                '{tag_name:$tag,target_commitish:$target,name:$name,body:("Codemagic build: "+$build+"\nTemporary Codemagic APK URL: "+$public),draft:false,prerelease:true}')
              RELEASE_JSON=$(curl -fsS -X POST \
                -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
                -H 'Content-Type: application/json' \
                --data-binary "$RELEASE_BODY" \
                "$API/releases")
              RELEASE_ID=$(printf '%s' "$RELEASE_JSON" | jq -r '.id')
            fi

            RELEASE_URL=$(printf '%s' "$RELEASE_JSON" | jq -r '.html_url // empty')
            APK_NAME="pebble-chat-bridge-v019-$SHORT_COMMIT-${CM_BUILD_ID:-build}.apk"

            EXISTING_ASSETS=$(curl -fsS \
              -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
              "$API/releases/$RELEASE_ID/assets")
            EXISTING_ASSET_ID=$(printf '%s' "$EXISTING_ASSETS" | jq -r --arg n "$APK_NAME" '.[] | select(.name == $n) | .id' | head -1)
            if [ -n "$EXISTING_ASSET_ID" ]; then
              curl -fsS -X DELETE \
                -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
                "$API/releases/assets/$EXISTING_ASSET_ID" >/dev/null
            fi

            ASSET_JSON=$(curl -fsS -X POST \
              -H "$AUTH_HEADER" \
              -H 'Content-Type: application/vnd.android.package-archive' \
              --data-binary "@$APK" \
              "https://uploads.github.com/repos/$OWNER/$REPO/releases/$RELEASE_ID/assets?name=$APK_NAME")
            RELEASE_ASSET_URL=$(printf '%s' "$ASSET_JSON" | jq -r '.browser_download_url // empty')

            APK_SHA=$(awk '{print $1}' "$CM_BUILD_DIR/ci/APK_SHA256.txt" 2>/dev/null || true)
            SIGNING_FINGERPRINT=$(sed -n 's/^certificate_sha256=//p' "$CM_BUILD_DIR/ci/certificate.txt" | head -1)
            POINTER=$(jq -n \
              --arg event "pebble_apk_delivery" \
              --arg status "SUCCESS" \
              --arg buildId "${CM_BUILD_ID:-}" \
              --arg commit "${CM_COMMIT:-}" \
              --arg apkPublicUrl "$APK_PUBLIC" \
              --arg releaseUrl "$RELEASE_URL" \
              --arg releaseAssetUrl "$RELEASE_ASSET_URL" \
              --arg sha256 "$APK_SHA" \
              --arg signingFingerprint "$SIGNING_FINGERPRINT" \
              '{event:$event,status:$status,buildId:$buildId,commit:$commit,apkPublicUrl:$apkPublicUrl,releaseUrl:$releaseUrl,releaseAssetUrl:$releaseAssetUrl,sha256:$sha256,signingFingerprint:$signingFingerprint}')

            META_URL="$API/contents/.ci/latest-pebble-build.json?ref=ci%2Fpebble-apk-delivery"
            META_JSON=$(curl -fsS -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" "$META_URL" 2>/dev/null || true)
            META_SHA=$(printf '%s' "$META_JSON" | jq -r '.sha // empty' 2>/dev/null || true)
            POINTER_B64=$(printf '%s\n' "$POINTER" | base64 | tr -d '\n')
            if [ -n "$META_SHA" ]; then
              PUT_BODY=$(jq -n --arg message "ci: update latest Pebble APK delivery" --arg content "$POINTER_B64" --arg branch "$DELIVERY_BRANCH" --arg sha "$META_SHA" '{message:$message,content:$content,branch:$branch,sha:$sha}')
            else
              PUT_BODY=$(jq -n --arg message "ci: publish latest Pebble APK delivery" --arg content "$POINTER_B64" --arg branch "$DELIVERY_BRANCH" '{message:$message,content:$content,branch:$branch}')
            fi
            curl -fsS -X PUT \
              -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
              -H 'Content-Type: application/json' \
              --data-binary "$PUT_BODY" \
              "$API/contents/.ci/latest-pebble-build.json" >/dev/null

            APK_MIRROR_URL="$API/contents/.ci/latest-pebble.apk?ref=ci%2Fpebble-apk-delivery"
            APK_MIRROR_JSON=$(curl -fsS -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" "$APK_MIRROR_URL" 2>/dev/null || true)
            APK_MIRROR_SHA=$(printf '%s' "$APK_MIRROR_JSON" | jq -r '.sha // empty' 2>/dev/null || true)
            APK_B64=$(base64 < "$APK" | tr -d '\n')
            if [ -n "$APK_MIRROR_SHA" ]; then
              APK_PUT_BODY=$(jq -n --arg message "ci: update latest Pebble APK binary" --arg content "$APK_B64" --arg branch "$DELIVERY_BRANCH" --arg sha "$APK_MIRROR_SHA" '{message:$message,content:$content,branch:$branch,sha:$sha}')
            else
              APK_PUT_BODY=$(jq -n --arg message "ci: publish latest Pebble APK binary" --arg content "$APK_B64" --arg branch "$DELIVERY_BRANCH" '{message:$message,content:$content,branch:$branch}')
            fi
            curl -fsS -X PUT \
              -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
              -H 'Content-Type: application/json' \
              --data-binary "$APK_PUT_BODY" \
              "$API/contents/.ci/latest-pebble.apk" >/dev/null

            printf '%s\n' "$POINTER" > "$CM_BUILD_DIR/ci/latest-pebble-build.json"
            printf '%s\n' "$RELEASE_URL" > "$CM_BUILD_DIR/ci/release-url.txt"
            printf '%s\n' "$RELEASE_ASSET_URL" > "$CM_BUILD_DIR/ci/release-asset-url.txt"

            curl -fsS \
              -H "Title: Pebble Chat Bridge v0.19 delivery" \
              -H "Tags: package" \
              --data-binary "$POINTER" \
              "https://ntfy.sh/$CI_REPORT_TOPIC" >/dev/null || true

            echo "GitHub prerelease delivery published: $RELEASE_URL"
