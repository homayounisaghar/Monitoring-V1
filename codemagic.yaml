workflows:
  pebble-bridge-v024:
    name: Pebble Chat Bridge v0.24 — Recovery Search + Return
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
      android_signing:
        - pebble_bridge
      groups:
        - codemagic_api
      vars:
        GRADLE_VERSION: "8.10.2"
        ANDROID_PLATFORM: "35"
        ANDROID_BUILD_TOOLS: "35.0.0"
        EXPECTED_CERT_SHA256: "9aaac9cb3ff091aa5c362f0255129a97b8e3c34b8a73f520cbb6ba89ed31e5d3"
        APK_BASENAME: "PebbleChatBridgePoC-v0.24-recovery-search-return.apk"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "build/pebble-chat-bridge-v019"
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Reassemble v0.19 baseline source
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p ci/src ci/out ci/delivery
          cat v019_parts/part00.txt v019_parts/part01.txt v019_parts/part02.txt v019_parts/part03.txt > ci/source.tgz.b64
          test "$(shasum -a 256 ci/source.tgz.b64 | awk '{print $1}')" = "76dfce144dd4e8126fdfb356e6fb3a6627f5bd629cf741798703847ec38d623a"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path("ci/source.tgz").write_bytes(base64.b64decode(Path("ci/source.tgz.b64").read_bytes()))
          PY
          test "$(shasum -a 256 ci/source.tgz | awk '{print $1}')" = "c7485116b17dfe4f2aa9f61469ab01e1596efccdf0d43f3d7b560d3c474e6196"
          tar -xzf ci/source.tgz -C ci/src
          grep -Fq "processSessionRecovery" ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java
          grep -Fq "versionCode 19" ci/src/app/build.gradle

      - name: Apply v0.24 recovery and return fixes
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          java_path = Path("ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java")
          text = java_path.read_text()

          nav_start = "    private NodeRecord findRecoveryNavOpener(List<NodeRecord> nodes) {"
          search_start = "    private NodeRecord findRecoverySearchLauncher(List<NodeRecord> nodes) {"
          ns = text.find(nav_start)
          ss = text.find(search_start, ns + 1)
          if ns < 0 or ss < 0:
              raise SystemExit("recovery method boundaries not found")
          nav_block = text[ns:ss]
          if "return bestScore >= 120 ? best : null;" not in nav_block:
              raise SystemExit("v0.19 nav threshold not found")
          nav_block = nav_block.replace(
              "return bestScore >= 120 ? best : null;",
              "// PEBBLE_V020_UNLABELED_TOP_LEFT_NAV_FALLBACK\n        return bestScore >= 90 ? best : null;",
              1,
          )
          text = text[:ns] + nav_block + text[ss:]

          fs_anchor = '        if ("FIND_SEARCH".equals(state)) {'
          fs_at = text.find(fs_anchor)
          if fs_at < 0:
              raise SystemExit("FIND_SEARCH state not found")
          old = '''            NodeRecord search = findRecoverySearchLauncher(nodes);\n            if (search != null) {\n                boolean clicked = search.node.performAction(AccessibilityNodeInfo.ACTION_CLICK);\n                ProbeState.log(this, "RECOVERY: ChatGPT Search control selected: " + search.describe() + "; click=" + clicked + ".");\n                if (clicked) ProbeState.setSessionRecoveryState(this, "ENTER_QUERY");\n                return false;\n            }'''
          new = '''            NodeRecord search = findRecoverySearchLauncher(nodes);\n            if (search == null) search = findRecoveryDrawerSearchLauncher(nodes);\n            if (search != null) {\n                boolean clicked = search.node.performAction(AccessibilityNodeInfo.ACTION_CLICK);\n                ProbeState.log(this, "RECOVERY: ChatGPT Search control selected: " + search.describe() + "; click=" + clicked + ".");\n                if (clicked) ProbeState.setSessionRecoveryState(this, "ENTER_QUERY");\n                return false;\n            }'''
          at = text.find(old, fs_at)
          if at < 0:
              raise SystemExit("FIND_SEARCH block not found")
          text = text[:at] + new + text[at + len(old):]

          marker = "    private NodeRecord findRecoverySearchField(List<NodeRecord> nodes) {"
          at = text.find(marker)
          if at < 0:
              raise SystemExit("search field method not found")
          helper = '''    // PEBBLE_V024_DRAWER_SEARCH_GEOMETRY_FALLBACK\n    private NodeRecord findRecoveryDrawerSearchLauncher(List<NodeRecord> nodes) {\n        int screenRight = 0;\n        int screenBottom = 0;\n        for (NodeRecord n : nodes) {\n            if (n.bounds.isEmpty()) continue;\n            screenRight = Math.max(screenRight, n.bounds.right);\n            screenBottom = Math.max(screenBottom, n.bounds.bottom);\n        }\n        if (screenRight <= 0 || screenBottom <= 0) return null;\n        NodeRecord best = null;\n        int bestScore = Integer.MIN_VALUE;\n        for (NodeRecord n : nodes) {\n            if (!n.clickable || !n.visible || n.bounds.isEmpty()) continue;\n            String label = n.labelLower();\n            if (label.contains("phone") || label.contains("call") || label.contains("voice") ||\n                    label.contains("new chat") || label.contains("profile") || label.contains("settings")) continue;\n            int cx = n.bounds.centerX();\n            int cy = n.bounds.centerY();\n            boolean topBand = cy < (screenBottom * 18 / 100);\n            boolean drawerSearchBand = cx > (screenRight * 45 / 100) && cx < (screenRight * 82 / 100);\n            if (!topBand || !drawerSearchBand) continue;\n            int score = 100;\n            if (label.trim().isEmpty()) score += 45;\n            if (label.contains("search")) score += 180;\n            String cls = n.className.toString().toLowerCase(Locale.US);\n            if (cls.contains("button") || cls.contains("image") || cls.contains("view")) score += 20;\n            if (n.bounds.width() < screenRight * 35 / 100) score += 15;\n            if (score > bestScore) { bestScore = score; best = n; }\n        }\n        return bestScore >= 100 ? best : null;\n    }\n\n'''
          text = text[:at] + helper + text[at:]

          text = re.sub(
              r'handler\.postDelayed\(this::bringUiForward,\s*(\d+)\);',
              r'scheduleReturnToBridge(\1L);',
              text,
          )
          marker = "    private void bringUiForward() {"
          at = text.find(marker)
          if at < 0:
              raise SystemExit("bringUiForward method not found")
          helper = '''    // PEBBLE_V024_DETERMINISTIC_RETURN\n    private void scheduleReturnToBridge(long delayMs) {\n        handler.postDelayed(() -> {\n            bringUiForward();\n            handler.postDelayed(() -> ensureReturnFromChatGpt(0), 350L);\n        }, delayMs);\n    }\n\n    private void ensureReturnFromChatGpt(int attempt) {\n        AccessibilityNodeInfo active = getRootInActiveWindow();\n        if (!ProbeState.TARGET.equals(packageOf(active))) return;\n        if (attempt >= 3) {\n            bringUiForward();\n            return;\n        }\n        boolean back = performGlobalAction(GLOBAL_ACTION_BACK);\n        ProbeState.log(this, "RETURN FALLBACK: ChatGPT still active after bring-to-front; GLOBAL_BACK attempt=" + (attempt + 1) + "; result=" + back + ".");\n        handler.postDelayed(() -> {\n            bringUiForward();\n            handler.postDelayed(() -> ensureReturnFromChatGpt(attempt + 1), 300L);\n        }, 300L);\n    }\n\n'''
          text = text[:at] + helper + text[at:]
          java_path.write_text(text)

          gradle_path = Path("ci/src/app/build.gradle")
          gradle = gradle_path.read_text()
          gradle, n = re.subn(r"versionCode\s+19\b", "versionCode 24", gradle, count=1)
          if n != 1:
              raise SystemExit("versionCode replacement failed")
          if "0.19-thread-recovery" not in gradle:
              raise SystemExit("baseline versionName not found")
          gradle = gradle.replace("0.19-thread-recovery", "0.24-recovery-search-return", 1)
          gradle_path.write_text(gradle)
          PY
          grep -Fq "PEBBLE_V020_UNLABELED_TOP_LEFT_NAV_FALLBACK" ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java
          grep -Fq "PEBBLE_V024_DRAWER_SEARCH_GEOMETRY_FALLBACK" ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java
          grep -Fq "PEBBLE_V024_DETERMINISTIC_RETURN" ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java
          grep -Fq "versionCode 24" ci/src/app/build.gradle

      - name: Build unsigned Android release
        script: |
          #!/usr/bin/env bash
          set -uo pipefail
          : > ci/full-build.log
          {
            set -x
            echo "sdk.dir=$ANDROID_SDK_ROOT" > ci/src/local.properties
            yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
            curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
            rm -rf "/tmp/gradle-${GRADLE_VERSION}"
            unzip -q -o /tmp/gradle.zip -d /tmp
            cd ci/src
            "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon :app:assembleRelease --stacktrace
          } 2>&1 | tee ci/full-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then tail -n 180 ci/full-build.log; exit "$rc"; fi
          cp ci/src/app/build/outputs/apk/release/app-release-unsigned.apk ci/out/PebbleChatBridgePoC-v0.24-unsigned.apk

      - name: Sign verify and prepare deterministic handoff
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          unsigned="ci/out/PebbleChatBridgePoC-v0.24-unsigned.apk"
          signed="ci/out/${APK_BASENAME}"
          apksigner_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort | tail -n 1)"
          test -n "$apksigner_path"
          bash "$apksigner_path" sign \
            --ks "$CM_KEYSTORE_PATH" \
            --ks-pass "env:CM_KEYSTORE_PASSWORD" \
            --ks-key-alias "$CM_KEY_ALIAS" \
            --key-pass "env:CM_KEY_PASSWORD" \
            --out "$signed" "$unsigned"
          bash "$apksigner_path" verify --verbose --print-certs "$signed" | tee ci/apksigner-verify.txt
          actual_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' ci/apksigner-verify.txt | tr 'A-F' 'a-f' | head -n 1)"
          test "$actual_cert" = "$EXPECTED_CERT_SHA256"
          printf 'certificate_sha256=%s\n' "$actual_cert" > ci/certificate.txt
          shasum -a 256 "$signed" | tee ci/APK_SHA256.txt
          cp ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java ci/delivery/NativeProbeAccessibilityService.java.txt
          python3 - <<'PY'
          import base64
          from pathlib import Path
          apk = Path("ci/out/PebbleChatBridgePoC-v0.24-recovery-search-return.apk")
          b64 = base64.b64encode(apk.read_bytes()).decode("ascii")
          out = Path("ci/delivery")
          size = 8000
          parts = [b64[i:i+size] for i in range(0, len(b64), size)]
          for i, part in enumerate(parts):
              (out / f"part{i:02d}.txt").write_text(part)
          (out / "parts-count.txt").write_text(str(len(parts)))
          PY

    artifacts:
      - ci/out/${APK_BASENAME}
      - ci/APK_SHA256.txt
      - ci/certificate.txt
      - ci/apksigner-verify.txt
      - ci/delivery/*.txt

    publishing:
      scripts:
        - name: Publish direct APK handoff and deterministic mirror
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            APK="$CM_BUILD_DIR/ci/out/${APK_BASENAME}"
            EXPIRES_AT=$(python3 -c 'import time; print(int(time.time()) + 86400)')
            make_public_url() {
              AUTH_URL="$1"
              if [ -z "$AUTH_URL" ] || [ "$AUTH_URL" = "null" ]; then printf ''; return 0; fi
              RESPONSE=$(curl -fsS -H 'Content-Type: application/json' -H "x-auth-token: $CM_API_TOKEN" -d "{\"expiresAt\":$EXPIRES_AT}" "${AUTH_URL}/public-url" 2>/dev/null || true)
              printf '%s' "$RESPONSE" | jq -r '.url // empty' 2>/dev/null || true
            }
            APK_AUTH=$(printf '%s' "${CM_ARTIFACT_LINKS:-[]}" | jq -r '.[] | select(.name | endswith(".apk")) | .url' | head -1)
            APK_PUBLIC=$(make_public_url "$APK_AUTH")

            OWNER="homayounisaghar"
            REPO="Monitoring-V1"
            DELIVERY_BRANCH="ci/pebble-apk-delivery"
            API="https://api.github.com/repos/$OWNER/$REPO"
            AUTH="Authorization: Bearer $GITHUB_TOKEN"
            ACCEPT="Accept: application/vnd.github+json"
            SHORT_COMMIT="$(printf '%s' "${CM_COMMIT:-unknown}" | cut -c1-12)"
            TAG="pebble-v0.24-$SHORT_COMMIT"
            APK_NAME="pebble-chat-bridge-v024-$SHORT_COMMIT.apk"
            release_json=$(curl -fsS -H "$AUTH" -H "$ACCEPT" "$API/releases/tags/$TAG" 2>/dev/null || true)
            release_id=$(printf '%s' "$release_json" | jq -r '.id // empty')
            if [ -z "$release_id" ]; then
              body=$(jq -n --arg tag "$TAG" --arg target "${CM_COMMIT:-}" --arg name "Pebble Chat Bridge v0.24 $SHORT_COMMIT" --arg public "$APK_PUBLIC" '{tag_name:$tag,target_commitish:$target,name:$name,body:("v0.24 recovery-search and return fix. Temporary Codemagic APK URL: "+$public),draft:false,prerelease:true}')
              release_json=$(curl -fsS -X POST -H "$AUTH" -H "$ACCEPT" -H 'Content-Type: application/json' --data-binary "$body" "$API/releases")
              release_id=$(printf '%s' "$release_json" | jq -r '.id')
            fi
            asset_json=$(curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/vnd.android.package-archive' --data-binary "@$APK" "https://uploads.github.com/repos/$OWNER/$REPO/releases/$release_id/assets?name=$APK_NAME")
            release_url=$(printf '%s' "$release_json" | jq -r '.html_url // empty')
            asset_url=$(printf '%s' "$asset_json" | jq -r '.browser_download_url // empty')
            apk_sha=$(awk '{print $1}' "$CM_BUILD_DIR/ci/APK_SHA256.txt")
            cert=$(sed -n 's/^certificate_sha256=//p' "$CM_BUILD_DIR/ci/certificate.txt" | head -1)
            pointer=$(jq -n --arg event pebble_apk_delivery --arg version 0.24 --arg status SUCCESS --arg buildId "${CM_BUILD_ID:-}" --arg commit "${CM_COMMIT:-}" --arg apkPublicUrl "$APK_PUBLIC" --arg releaseUrl "$release_url" --arg releaseAssetUrl "$asset_url" --arg sha256 "$apk_sha" --arg signingFingerprint "$cert" '{event:$event,version:$version,status:$status,buildId:$buildId,commit:$commit,apkPublicUrl:$apkPublicUrl,releaseUrl:$releaseUrl,releaseAssetUrl:$releaseAssetUrl,sha256:$sha256,signingFingerprint:$signingFingerprint}')
            printf '%s\n' "$pointer" > ci/latest-pebble-build.json

            put_content() {
              path="$1"; local_file="$2"
              current=$(curl -fsS -H "$AUTH" -H "$ACCEPT" "$API/contents/$path?ref=ci%2Fpebble-apk-delivery" 2>/dev/null || true)
              sha=$(printf '%s' "$current" | jq -r '.sha // empty')
              content=$(base64 < "$local_file" | tr -d '\n')
              if [ -n "$sha" ]; then payload=$(jq -n --arg message "ci: update $path for v0.24" --arg content "$content" --arg branch "$DELIVERY_BRANCH" --arg sha "$sha" '{message:$message,content:$content,branch:$branch,sha:$sha}');
              else payload=$(jq -n --arg message "ci: create $path for v0.24" --arg content "$content" --arg branch "$DELIVERY_BRANCH" '{message:$message,content:$content,branch:$branch}'); fi
              curl -fsS -X PUT -H "$AUTH" -H "$ACCEPT" -H 'Content-Type: application/json' --data-binary "$payload" "$API/contents/$path" >/dev/null
            }
            put_content ".ci/latest-pebble-build.json" "ci/latest-pebble-build.json"
            put_content ".ci/latest-pebble.apk" "$APK"
            put_content ".ci/latest-pebble.parts-count.txt" "ci/delivery/parts-count.txt"
            put_content ".ci/latest-pebble.NativeProbeAccessibilityService.java.txt" "ci/delivery/NativeProbeAccessibilityService.java.txt"
            for p in ci/delivery/part*.txt; do put_content ".ci/latest-pebble.$(basename "$p")" "$p"; done
            echo "APK_PUBLIC=$APK_PUBLIC"
