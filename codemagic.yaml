workflows:
  android-rotation-tile-v100:
    name: Android Rotation Tile v1.0.0
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
      android_signing:
        - pebble_bridge
      groups:
        - codemagic_api
      vars:
        GRADLE_VERSION: "8.10.2"
        ANDROID_PLATFORM: "35"
        ANDROID_BUILD_TOOLS: "35.0.0"
        EXPECTED_CERT_SHA256: "9aaac9cb3ff091aa5c362f0255129a97b8e3c34b8a73f520cbb6ba89ed31e5d3"
        APK_BASENAME: "RotationTile-v1.0.0.apk"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "build/pebble-chat-bridge-v019"
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Install Android toolchain and Gradle
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          rm -rf "/tmp/gradle-${GRADLE_VERSION}"
          unzip -q -o /tmp/gradle.zip -d /tmp
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android-rotation-tile/local.properties

      - name: Build unsigned release APK
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p ci/out
          cd android-rotation-tile
          "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../ci/out/RotationTile-v1.0.0-unsigned.apk

      - name: Align sign and verify release
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p ci/out ci/verify
          BT="$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          UNSIGNED="ci/out/RotationTile-v1.0.0-unsigned.apk"
          ALIGNED="ci/out/RotationTile-v1.0.0-aligned.apk"
          SIGNED="ci/out/${APK_BASENAME}"
          "$BT/zipalign" -f 4 "$UNSIGNED" "$ALIGNED"
          "$BT/apksigner" sign \
            --ks "$CM_KEYSTORE_PATH" \
            --ks-pass "env:CM_KEYSTORE_PASSWORD" \
            --ks-key-alias "$CM_KEY_ALIAS" \
            --key-pass "env:CM_KEY_PASSWORD" \
            --out "$SIGNED" "$ALIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$SIGNED" | tee ci/verify/apksigner.txt
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' ci/verify/apksigner.txt | head -n1 | tr 'A-F' 'a-f')"
          test "$CERT" = "$EXPECTED_CERT_SHA256"
          "$BT/zipalign" -c -v 4 "$SIGNED" > ci/verify/zipalign.txt
          "$BT/aapt" dump badging "$SIGNED" > ci/verify/badging.txt
          "$BT/aapt" dump permissions "$SIGNED" > ci/verify/permissions.txt
          "$BT/aapt" dump xmltree "$SIGNED" AndroidManifest.xml > ci/verify/manifest.txt
          grep -Fq "package: name='com.homayoun.rotationtile' versionCode='1' versionName='1.0.0'" ci/verify/badging.txt
          ! grep -Fq "application-debuggable" ci/verify/badging.txt
          grep -Fq "android.permission.SYSTEM_ALERT_WINDOW" ci/verify/permissions.txt
          grep -Fq "android.permission.WRITE_SETTINGS" ci/verify/permissions.txt
          grep -Fq "android.permission.BIND_QUICK_SETTINGS_TILE" ci/verify/manifest.txt
          grep -Fq "com.homayoun.rotationtile.RotationTileService" ci/verify/manifest.txt
          unzip -t "$SIGNED" > ci/verify/zip-integrity.txt
          shasum -a 256 "$SIGNED" | tee ci/verify/APK_SHA256.txt
          printf 'certificate_sha256=%s\n' "$CERT" | tee ci/verify/certificate.txt
          rm -f "$UNSIGNED" "$ALIGNED"

    artifacts:
      - ci/out/RotationTile-v1.0.0.apk
      - ci/verify/**

    publishing:
      scripts:
        - name: Publish verified APK release and delivery pointer
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            OWNER="homayounisaghar"
            REPO="Monitoring-V1"
            DELIVERY_BRANCH="ci/pebble-apk-delivery"
            API="https://api.github.com/repos/$OWNER/$REPO"
            AUTH="Authorization: Bearer $GITHUB_TOKEN"
            ACCEPT="Accept: application/vnd.github+json"
            SHORT="$(printf '%s' "${CM_COMMIT:-unknown}" | cut -c1-12)"
            TAG="rotation-tile-v1.0.0-$SHORT"
            APK_NAME="RotationTile-v1.0.0-$SHORT.apk"
            APK="$CM_BUILD_DIR/ci/out/${APK_BASENAME}"
            SHA="$(awk '{print $1}' "$CM_BUILD_DIR/ci/verify/APK_SHA256.txt")"
            CERT="$(sed -n 's/^certificate_sha256=//p' "$CM_BUILD_DIR/ci/verify/certificate.txt" | head -1)"
            BODY=$(jq -n --arg tag "$TAG" --arg target "${CM_COMMIT:-}" --arg name "Rotation Tile v1.0.0 $SHORT" --arg sha "$SHA" --arg cert "$CERT" '{tag_name:$tag,target_commitish:$target,name:$name,body:("Verified Rotation Tile v1.0.0. APK SHA-256: "+$sha+". Signer SHA-256: "+$cert+"."),draft:false,prerelease:true}')
            RELEASE=$(curl -fsS -X POST -H "$AUTH" -H "$ACCEPT" -H 'Content-Type: application/json' --data-binary "$BODY" "$API/releases")
            RID=$(printf '%s' "$RELEASE" | jq -r '.id')
            ASSET=$(curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/vnd.android.package-archive' --data-binary "@$APK" "https://uploads.github.com/repos/$OWNER/$REPO/releases/$RID/assets?name=$APK_NAME")
            ASSET_URL=$(printf '%s' "$ASSET" | jq -r '.browser_download_url // empty')
            test -n "$ASSET_URL"
            POINTER=$(jq -n --arg event rotation_tile_apk_delivery --arg status SUCCESS --arg buildId "${CM_BUILD_ID:-}" --arg commit "${CM_COMMIT:-}" --arg tag "$TAG" --arg assetUrl "$ASSET_URL" --arg sha256 "$SHA" --arg signingFingerprint "$CERT" '{event:$event,status:$status,buildId:$buildId,commit:$commit,tag:$tag,assetUrl:$assetUrl,sha256:$sha256,signingFingerprint:$signingFingerprint}')
            printf '%s\n' "$POINTER" > /tmp/latest-rotation-tile-build.json
            current=$(curl -fsS -H "$AUTH" -H "$ACCEPT" "$API/contents/.ci/latest-rotation-tile-build.json?ref=ci%2Fpebble-apk-delivery" 2>/dev/null || true)
            current_sha=$(printf '%s' "$current" | jq -r '.sha // empty')
            content=$(base64 < /tmp/latest-rotation-tile-build.json | tr -d '\n')
            if [ -n "$current_sha" ]; then
              payload=$(jq -n --arg message "ci: update rotation tile delivery pointer" --arg content "$content" --arg branch "$DELIVERY_BRANCH" --arg sha "$current_sha" '{message:$message,content:$content,branch:$branch,sha:$sha}')
            else
              payload=$(jq -n --arg message "ci: create rotation tile delivery pointer" --arg content "$content" --arg branch "$DELIVERY_BRANCH" '{message:$message,content:$content,branch:$branch}')
            fi
            curl -fsS -X PUT -H "$AUTH" -H "$ACCEPT" -H 'Content-Type: application/json' --data-binary "$payload" "$API/contents/.ci/latest-rotation-tile-build.json" >/dev/null
