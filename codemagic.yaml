workflows:
  pebble-bridge-v020:
    name: Pebble Chat Bridge v0.20 — Recovery Nav Fallback
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
      android_signing:
        - pebble_bridge
      groups:
        - codemagic_api
      vars:
        GRADLE_VERSION: "8.10.2"
        ANDROID_PLATFORM: "35"
        ANDROID_BUILD_TOOLS: "35.0.0"
        EXPECTED_CERT_SHA256: "9aaac9cb3ff091aa5c362f0255129a97b8e3c34b8a73f520cbb6ba89ed31e5d3"
        APK_BASENAME: "PebbleChatBridgePoC-v0.20-recovery-nav-fallback-signed.apk"
        CI_REPORT_TOPIC: "pebble-v019-a9f2c7e61b4d8c30e5f7a921"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "build/pebble-chat-bridge-v019"
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Reassemble and verify v0.19 baseline source
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p ci/src ci/out
          cat v019_parts/part00.txt v019_parts/part01.txt v019_parts/part02.txt v019_parts/part03.txt > ci/PebbleChatBridge-v019-src.tgz.b64
          actual_b64_sha="$(shasum -a 256 ci/PebbleChatBridge-v019-src.tgz.b64 | awk '{print $1}')"
          test "$actual_b64_sha" = "76dfce144dd4e8126fdfb356e6fb3a6627f5bd629cf741798703847ec38d623a"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          src = Path("ci/PebbleChatBridge-v019-src.tgz.b64")
          dst = Path("ci/PebbleChatBridge-v019-src.tgz")
          dst.write_bytes(base64.b64decode(src.read_bytes()))
          PY
          actual_tgz_sha="$(shasum -a 256 ci/PebbleChatBridge-v019-src.tgz | awk '{print $1}')"
          test "$actual_tgz_sha" = "c7485116b17dfe4f2aa9f61469ab01e1596efccdf0d43f3d7b560d3c474e6196"
          tar -xzf ci/PebbleChatBridge-v019-src.tgz -C ci/src
          grep -Fq "versionCode 19" ci/src/app/build.gradle
          grep -Fq "0.19-thread-recovery" ci/src/app/build.gradle
          grep -Fq "SESSION_RECOVERY_FAILED" ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java
          grep -Fq "processSessionRecovery" ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java
          grep -Fq "markSessionRecovered" ci/src/app/src/main/java/com/pebblebridge/poc/ProbeState.java
          printf 'baseline_source_sha256=%s\nbaseline_source_b64_sha256=%s\n' \
            "c7485116b17dfe4f2aa9f61469ab01e1596efccdf0d43f3d7b560d3c474e6196" \
            "76dfce144dd4e8126fdfb356e6fb3a6627f5bd629cf741798703847ec38d623a" \
            > ci/source-verification.txt

      - name: Export recovery method source for autonomous diagnostics
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          SRC="ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java"
          python3 - <<'PY'
          from pathlib import Path
          src = Path("ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java").read_text()
          needle = "findRecoveryNavOpener"
          p = src.find(needle)
          if p < 0:
              excerpt = "findRecoveryNavOpener NOT FOUND\n"
          else:
              start = max(0, src.rfind("\n", 0, max(0, p - 2500)))
              end = min(len(src), p + 9000)
              excerpt = src[start:end]
          Path("ci/recovery-nav-source.txt").write_text(excerpt)
          PY
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            OWNER="homayounisaghar"
            REPO="Monitoring-V1"
            API="https://api.github.com/repos/$OWNER/$REPO"
            AUTH_HEADER="Authorization: Bearer $GITHUB_TOKEN"
            ACCEPT_HEADER="Accept: application/vnd.github+json"
            REMOTE="$API/contents/.ci/recovery-nav-source.txt?ref=ci%2Fpebble-apk-delivery"
            EXISTING=$(curl -fsS -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" "$REMOTE" 2>/dev/null || true)
            EXISTING_SHA=$(printf '%s' "$EXISTING" | jq -r '.sha // empty' 2>/dev/null || true)
            PAYLOAD_B64=$(base64 < ci/recovery-nav-source.txt | tr -d '\n')
            if [ -n "$EXISTING_SHA" ]; then
              BODY=$(jq -n --arg message "ci: update Pebble recovery source diagnostic" --arg content "$PAYLOAD_B64" --arg branch "ci/pebble-apk-delivery" --arg sha "$EXISTING_SHA" '{message:$message,content:$content,branch:$branch,sha:$sha}')
            else
              BODY=$(jq -n --arg message "ci: publish Pebble recovery source diagnostic" --arg content "$PAYLOAD_B64" --arg branch "ci/pebble-apk-delivery" '{message:$message,content:$content,branch:$branch}')
            fi
            curl -fsS -X PUT -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H 'Content-Type: application/json' --data-binary "$BODY" "$API/contents/.ci/recovery-nav-source.txt" >/dev/null
          fi

      - name: Apply v0.20 unlabeled-toolbar recovery patch
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import traceback

          java_path = Path("ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java")
          diagnostic_path = Path("ci/v020-patch.txt")
          try:
              text = java_path.read_text()
              marker = "PEBBLE_V020_UNLABELED_TOP_LEFT_NAV_FALLBACK"
              if marker in text:
                  raise RuntimeError("v0.20 patch unexpectedly already present in baseline")

              method_name = "findRecoveryNavOpener"
              name_pos = text.find(method_name)
              if name_pos < 0:
                  raise RuntimeError("findRecoveryNavOpener not found")
              paren_open = text.find("(", name_pos + len(method_name))
              if paren_open < 0:
                  raise RuntimeError("findRecoveryNavOpener opening parenthesis not found")

              depth = 0
              paren_close = -1
              i = paren_open
              while i < len(text):
                  if text[i] == "(":
                      depth += 1
                  elif text[i] == ")":
                      depth -= 1
                      if depth == 0:
                          paren_close = i
                          break
                  i += 1
              if paren_close < 0:
                  raise RuntimeError("findRecoveryNavOpener parameter list not closed")

              params = text[paren_open + 1:paren_close]
              identifiers = re.findall(r"[A-Za-z_$][A-Za-z0-9_$]*", params)
              if not identifiers:
                  raise RuntimeError("could not infer findRecoveryNavOpener parameter name from: " + params)
              records_name = identifiers[-1]

              open_brace = text.find("{", paren_close)
              if open_brace < 0:
                  raise RuntimeError("findRecoveryNavOpener body not found")

              def matching_brace(src, start):
                  depth = 0
                  state = "normal"
                  i = start
                  while i < len(src):
                      c = src[i]
                      n = src[i + 1] if i + 1 < len(src) else ""
                      if state == "normal":
                          if c == '"':
                              state = "string"
                          elif c == "'":
                              state = "char"
                          elif c == "/" and n == "/":
                              state = "line"
                              i += 1
                          elif c == "/" and n == "*":
                              state = "block"
                              i += 1
                          elif c == "{":
                              depth += 1
                          elif c == "}":
                              depth -= 1
                              if depth == 0:
                                  return i
                      elif state == "string":
                          if c == "\\":
                              i += 1
                          elif c == '"':
                              state = "normal"
                      elif state == "char":
                          if c == "\\":
                              i += 1
                          elif c == "'":
                              state = "normal"
                      elif state == "line":
                          if c == "\n":
                              state = "normal"
                      elif state == "block":
                          if c == "*" and n == "/":
                              state = "normal"
                              i += 1
                      i += 1
                  raise RuntimeError("matching method brace not found")

              close_brace = matching_brace(text, open_brace)
              body = text[open_brace + 1:close_brace]
              return_matches = list(re.finditer(r"\breturn\s+null\s*;", body))
              if not return_matches:
                  raise RuntimeError("return null not found in findRecoveryNavOpener")
              return_pos = return_matches[-1].start()

              fallback = f'''
                  // {marker}
                  // ChatGPT 2026-08 can expose the toolbar buttons as unlabeled
                  // clickable android.view.View nodes. Preserve all semantic selectors
                  // above, then use a tightly constrained top-left spatial fallback.
                  int recoveryScreenRight = 0;
                  int recoveryScreenBottom = 0;
                  for (NodeRecord recoveryRecord : {records_name}) {{
                      if (recoveryRecord == null || recoveryRecord.bounds == null) continue;
                      recoveryScreenRight = Math.max(recoveryScreenRight, recoveryRecord.bounds.right);
                      recoveryScreenBottom = Math.max(recoveryScreenBottom, recoveryRecord.bounds.bottom);
                  }}

                  NodeRecord recoverySpatialFallback = null;
                  int recoveryBestLeft = Integer.MAX_VALUE;
                  int recoveryBestTop = Integer.MAX_VALUE;
                  if (recoveryScreenRight > 0 && recoveryScreenBottom > 0) {{
                      for (NodeRecord recoveryRecord : {records_name}) {{
                          if (recoveryRecord == null || recoveryRecord.bounds == null) continue;
                          if (!recoveryRecord.visible || !recoveryRecord.clickable) continue;
                          if (recoveryRecord.editable || recoveryRecord.canSetText) continue;

                          android.graphics.Rect recoveryBounds = recoveryRecord.bounds;
                          int recoveryWidth = recoveryBounds.width();
                          int recoveryHeight = recoveryBounds.height();
                          if (recoveryWidth <= 0 || recoveryHeight <= 0) continue;

                          boolean recoveryInTopBand = recoveryBounds.top >= 0
                                  && recoveryBounds.top <= (recoveryScreenBottom * 20 / 100);
                          boolean recoveryInLeftBand = recoveryBounds.left >= 0
                                  && recoveryBounds.left <= (recoveryScreenRight * 18 / 100);
                          boolean recoveryCompact = recoveryWidth <= (recoveryScreenRight * 20 / 100)
                                  && recoveryHeight <= (recoveryScreenBottom * 12 / 100);
                          boolean recoveryNotTiny = recoveryWidth >= Math.max(24, recoveryScreenRight / 80)
                                  && recoveryHeight >= Math.max(24, recoveryScreenBottom / 80);

                          if (recoveryInTopBand && recoveryInLeftBand && recoveryCompact && recoveryNotTiny) {{
                              if (recoveryBounds.left < recoveryBestLeft
                                      || (recoveryBounds.left == recoveryBestLeft && recoveryBounds.top < recoveryBestTop)) {{
                                  recoverySpatialFallback = recoveryRecord;
                                  recoveryBestLeft = recoveryBounds.left;
                                  recoveryBestTop = recoveryBounds.top;
                              }}
                          }}
                      }}
                  }}
                  if (recoverySpatialFallback != null) {{
                      return recoverySpatialFallback;
                  }}
          '''

              body = body[:return_pos] + fallback + body[return_pos:]
              text = text[:open_brace + 1] + body + text[close_brace:]
              java_path.write_text(text)

              gradle_path = Path("ci/src/app/build.gradle")
              gradle = gradle_path.read_text()
              gradle, count_code = re.subn(r"\bversionCode\s+19\b", "versionCode 20", gradle, count=1)
              gradle, count_name = re.subn(r"\bversionName\s+[\"']0\.19-thread-recovery[\"']", 'versionName "0.20-recovery-nav-fallback"', gradle, count=1)
              if count_code != 1 or count_name != 1:
                  raise RuntimeError(f"version patch failed: code={count_code} name={count_name}")
              gradle_path.write_text(gradle)

              main_path = Path("ci/src/app/src/main/java/com/pebblebridge/poc/MainActivity.java")
              if main_path.exists():
                  main = main_path.read_text()
                  main = main.replace(
                      "v0.19 adds automatic thread recovery to the proven session semantics.",
                      "v0.20 adds a constrained spatial fallback for unlabeled ChatGPT navigation controls while preserving the receipt safety gate.",
                  )
                  main_path.write_text(main)

              if marker not in java_path.read_text():
                  raise RuntimeError("v0.20 marker missing after patch")
              diagnostic_path.write_text(
                  "version=0.20\n"
                  "patch=unlabeled-top-left-toolbar-nav-fallback\n"
                  f"method_parameter={records_name}\n"
                  f"method_params_raw={params.strip()}\n"
                  "status=PATCHED\n"
              )
          except Exception as exc:
              diagnostic_path.write_text(
                  "version=0.20\n"
                  "status=PATCH_FAILED\n"
                  f"error={type(exc).__name__}: {exc}\n"
                  + traceback.format_exc()
              )
              raise
          PY
          cat ci/v020-patch.txt
          grep -Fq "PEBBLE_V020_UNLABELED_TOP_LEFT_NAV_FALLBACK" ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java
          grep -Fq "versionCode 20" ci/src/app/build.gradle
          grep -Fq "0.20-recovery-nav-fallback" ci/src/app/build.gradle

      - name: Build unsigned Android release with full diagnostics
        script: |
          #!/usr/bin/env bash
          set -uo pipefail
          mkdir -p ci/out
          : > ci/full-build.log
          : > ci/diagnostic.txt
          {
            set -x
            echo "sdk.dir=$ANDROID_SDK_ROOT" > ci/src/local.properties
            yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
            curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
            rm -rf "/tmp/gradle-${GRADLE_VERSION}"
            unzip -q -o /tmp/gradle.zip -d /tmp
            cd ci/src
            "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon :app:assembleRelease --stacktrace
          } 2>&1 | tee ci/full-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "Pebble v0.20 build failed (exit=$rc). Extracted diagnostic follows."
              grep -E -i -C 4 "(^| )error:|FAILURE:|Execution failed for task|What went wrong:|Caused by:|Exception|Could not resolve|Android resource linking failed" ci/full-build.log | tail -n 240 || true
              echo "--- final 120 log lines ---"
              tail -n 120 ci/full-build.log
            } | tee ci/diagnostic.txt
            exit "$rc"
          fi
          unsigned="ci/src/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          cp "$unsigned" ci/out/PebbleChatBridgePoC-v0.20-unsigned.apk
          echo "BUILD_OK" > ci/diagnostic.txt

      - name: Validate injected Pebble keystore and signing tool
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          test -s "${CM_KEYSTORE_PATH:-}"
          test -n "${CM_KEYSTORE_PASSWORD:-}"
          test -n "${CM_KEY_ALIAS:-}"
          test -n "${CM_KEY_PASSWORD:-}"
          apksigner_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort | tail -n 1)"
          test -n "$apksigner_path"
          test -s "$apksigner_path"
          printf 'apksigner=%s\n' "$apksigner_path" > ci/signing-tool.txt
          keytool -list -v \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -alias "$CM_KEY_ALIAS" \
            > ci/keystore-inspect.txt

      - name: Sign Pebble release APK
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          unsigned="ci/out/PebbleChatBridgePoC-v0.20-unsigned.apk"
          signed="ci/out/${APK_BASENAME}"
          apksigner_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort | tail -n 1)"
          bash "$apksigner_path" sign \
            --ks "$CM_KEYSTORE_PATH" \
            --ks-pass "env:CM_KEYSTORE_PASSWORD" \
            --ks-key-alias "$CM_KEY_ALIAS" \
            --key-pass "env:CM_KEY_PASSWORD" \
            --out "$signed" \
            "$unsigned"
          test -s "$signed"

      - name: Verify Pebble signing certificate
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          signed="ci/out/${APK_BASENAME}"
          apksigner_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort | tail -n 1)"
          bash "$apksigner_path" verify --verbose --print-certs "$signed" | tee ci/apksigner-verify.txt
          actual_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' ci/apksigner-verify.txt | tr 'A-F' 'a-f' | head -n 1)"
          printf 'certificate_sha256=%s\n' "$actual_cert" > ci/certificate.txt
          test "$actual_cert" = "$EXPECTED_CERT_SHA256"
          shasum -a 256 "$signed" | tee ci/APK_SHA256.txt

    artifacts:
      - ci/out/*.apk
      - ci/full-build.log
      - ci/diagnostic.txt
      - ci/source-verification.txt
      - ci/recovery-nav-source.txt
      - ci/v020-patch.txt
      - ci/signing-tool.txt
      - ci/keystore-inspect.txt
      - ci/apksigner-verify.txt
      - ci/APK_SHA256.txt
      - ci/certificate.txt

    publishing:
      scripts:
        - name: Publish Pebble v0.20 delivery to GitHub
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            APK="$CM_BUILD_DIR/ci/out/${APK_BASENAME}"
            test -s "$APK"
            test -n "${GITHUB_TOKEN:-}"

            APK_PUBLIC=""
            if [ -n "${CM_API_TOKEN:-}" ]; then
              EXPIRES_AT=$(python3 -c 'import time; print(int(time.time()) + 86400)')
              APK_AUTH=$(printf '%s' "${CM_ARTIFACT_LINKS:-[]}" | jq -r --arg n "$APK_BASENAME" '.[] | select(.name == $n) | .url' | head -1)
              if [ -n "$APK_AUTH" ] && [ "$APK_AUTH" != "null" ]; then
                RESPONSE=$(curl -fsS -H 'Content-Type: application/json' -H "x-auth-token: $CM_API_TOKEN" -d "{\"expiresAt\":$EXPIRES_AT}" "${APK_AUTH}/public-url" 2>/dev/null || true)
                APK_PUBLIC=$(printf '%s' "$RESPONSE" | jq -r '.url // empty' 2>/dev/null || true)
              fi
            fi

            OWNER="homayounisaghar"
            REPO="Monitoring-V1"
            DELIVERY_BRANCH="ci/pebble-apk-delivery"
            SHORT_COMMIT=$(printf '%s' "${CM_COMMIT:-unknown}" | cut -c1-12)
            TAG="pebble-v0.20-$SHORT_COMMIT"
            RELEASE_NAME="Pebble Chat Bridge v0.20 $SHORT_COMMIT"
            API="https://api.github.com/repos/$OWNER/$REPO"
            AUTH_HEADER="Authorization: Bearer $GITHUB_TOKEN"
            ACCEPT_HEADER="Accept: application/vnd.github+json"

            RELEASE_JSON=$(curl -fsS -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" "$API/releases/tags/$TAG" 2>/dev/null || true)
            RELEASE_ID=$(printf '%s' "$RELEASE_JSON" | jq -r '.id // empty' 2>/dev/null || true)
            if [ -z "$RELEASE_ID" ]; then
              RELEASE_BODY=$(jq -n --arg tag "$TAG" --arg target "${CM_COMMIT:-}" --arg name "$RELEASE_NAME" --arg build "${CM_BUILD_ID:-}" --arg public "$APK_PUBLIC" '{tag_name:$tag,target_commitish:$target,name:$name,body:("v0.20 recovery navigation fallback. Codemagic build: "+$build+"\nTemporary Codemagic APK URL: "+$public),draft:false,prerelease:true}')
              RELEASE_JSON=$(curl -fsS -X POST -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H 'Content-Type: application/json' --data-binary "$RELEASE_BODY" "$API/releases")
              RELEASE_ID=$(printf '%s' "$RELEASE_JSON" | jq -r '.id')
            fi
            RELEASE_URL=$(printf '%s' "$RELEASE_JSON" | jq -r '.html_url // empty')
            APK_NAME="pebble-chat-bridge-v020-$SHORT_COMMIT-${CM_BUILD_ID:-build}.apk"
            EXISTING_ASSETS=$(curl -fsS -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" "$API/releases/$RELEASE_ID/assets")
            EXISTING_ASSET_ID=$(printf '%s' "$EXISTING_ASSETS" | jq -r --arg n "$APK_NAME" '.[] | select(.name == $n) | .id' | head -1)
            if [ -n "$EXISTING_ASSET_ID" ]; then
              curl -fsS -X DELETE -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" "$API/releases/assets/$EXISTING_ASSET_ID" >/dev/null
            fi
            ASSET_JSON=$(curl -fsS -X POST -H "$AUTH_HEADER" -H 'Content-Type: application/vnd.android.package-archive' --data-binary "@$APK" "https://uploads.github.com/repos/$OWNER/$REPO/releases/$RELEASE_ID/assets?name=$APK_NAME")
            RELEASE_ASSET_URL=$(printf '%s' "$ASSET_JSON" | jq -r '.browser_download_url // empty')

            APK_SHA=$(awk '{print $1}' "$CM_BUILD_DIR/ci/APK_SHA256.txt")
            SIGNING_FINGERPRINT=$(sed -n 's/^certificate_sha256=//p' "$CM_BUILD_DIR/ci/certificate.txt" | head -1)
            POINTER=$(jq -n --arg event "pebble_apk_delivery" --arg version "0.20" --arg patch "unlabeled-top-left-toolbar-nav-fallback" --arg status "SUCCESS" --arg buildId "${CM_BUILD_ID:-}" --arg commit "${CM_COMMIT:-}" --arg apkPublicUrl "$APK_PUBLIC" --arg releaseUrl "$RELEASE_URL" --arg releaseAssetUrl "$RELEASE_ASSET_URL" --arg sha256 "$APK_SHA" --arg signingFingerprint "$SIGNING_FINGERPRINT" '{event:$event,version:$version,patch:$patch,status:$status,buildId:$buildId,commit:$commit,apkPublicUrl:$apkPublicUrl,releaseUrl:$releaseUrl,releaseAssetUrl:$releaseAssetUrl,sha256:$sha256,signingFingerprint:$signingFingerprint}')

            META_URL="$API/contents/.ci/latest-pebble-build.json?ref=ci%2Fpebble-apk-delivery"
            META_JSON=$(curl -fsS -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" "$META_URL" 2>/dev/null || true)
            META_SHA=$(printf '%s' "$META_JSON" | jq -r '.sha // empty' 2>/dev/null || true)
            POINTER_B64=$(printf '%s\n' "$POINTER" | base64 | tr -d '\n')
            if [ -n "$META_SHA" ]; then
              PUT_BODY=$(jq -n --arg message "ci: update latest Pebble v0.20 delivery" --arg content "$POINTER_B64" --arg branch "$DELIVERY_BRANCH" --arg sha "$META_SHA" '{message:$message,content:$content,branch:$branch,sha:$sha}')
            else
              PUT_BODY=$(jq -n --arg message "ci: publish latest Pebble v0.20 delivery" --arg content "$POINTER_B64" --arg branch "$DELIVERY_BRANCH" '{message:$message,content:$content,branch:$branch}')
            fi
            curl -fsS -X PUT -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H 'Content-Type: application/json' --data-binary "$PUT_BODY" "$API/contents/.ci/latest-pebble-build.json" >/dev/null

            APK_MIRROR_URL="$API/contents/.ci/latest-pebble.apk?ref=ci%2Fpebble-apk-delivery"
            APK_MIRROR_JSON=$(curl -fsS -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" "$APK_MIRROR_URL" 2>/dev/null || true)
            APK_MIRROR_SHA=$(printf '%s' "$APK_MIRROR_JSON" | jq -r '.sha // empty' 2>/dev/null || true)
            APK_B64=$(base64 < "$APK" | tr -d '\n')
            if [ -n "$APK_MIRROR_SHA" ]; then
              APK_PUT_BODY=$(jq -n --arg message "ci: update latest Pebble v0.20 APK binary" --arg content "$APK_B64" --arg branch "$DELIVERY_BRANCH" --arg sha "$APK_MIRROR_SHA" '{message:$message,content:$content,branch:$branch,sha:$sha}')
            else
              APK_PUT_BODY=$(jq -n --arg message "ci: publish latest Pebble v0.20 APK binary" --arg content "$APK_B64" --arg branch "$DELIVERY_BRANCH" '{message:$message,content:$content,branch:$branch}')
            fi
            curl -fsS -X PUT -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H 'Content-Type: application/json' --data-binary "$APK_PUT_BODY" "$API/contents/.ci/latest-pebble.apk" >/dev/null

            printf '%s\n' "$POINTER" > "$CM_BUILD_DIR/ci/latest-pebble-build.json"
            printf '%s\n' "$RELEASE_URL" > "$CM_BUILD_DIR/ci/release-url.txt"
            printf '%s\n' "$RELEASE_ASSET_URL" > "$CM_BUILD_DIR/ci/release-asset-url.txt"
            curl -fsS -H "Title: Pebble Chat Bridge v0.20 delivery" -H "Tags: package" --data-binary "$POINTER" "https://ntfy.sh/$CI_REPORT_TOPIC" >/dev/null || true
            echo "GitHub prerelease delivery published: $RELEASE_URL"