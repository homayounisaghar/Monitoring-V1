workflows:
  pebble-bridge-v026:
    name: Pebble Chat Bridge v0.26 — Structural Drawer Search
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
      android_signing:
        - pebble_bridge
      groups:
        - codemagic_api
      vars:
        GRADLE_VERSION: "8.10.2"
        ANDROID_PLATFORM: "35"
        ANDROID_BUILD_TOOLS: "35.0.0"
        EXPECTED_CERT_SHA256: "9aaac9cb3ff091aa5c362f0255129a97b8e3c34b8a73f520cbb6ba89ed31e5d3"
        APK_BASENAME: "PebbleChatBridgePoC-v0.26-structural-drawer-search.apk"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "build/pebble-chat-bridge-v019"
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Reassemble v0.19 baseline source
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p ci/src ci/out ci/delivery
          cat v019_parts/part00.txt v019_parts/part01.txt v019_parts/part02.txt v019_parts/part03.txt > ci/source.tgz.b64
          test "$(shasum -a 256 ci/source.tgz.b64 | awk '{print $1}')" = "76dfce144dd4e8126fdfb356e6fb3a6627f5bd629cf741798703847ec38d623a"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path("ci/source.tgz").write_bytes(base64.b64decode(Path("ci/source.tgz.b64").read_bytes()))
          PY
          test "$(shasum -a 256 ci/source.tgz | awk '{print $1}')" = "c7485116b17dfe4f2aa9f61469ab01e1596efccdf0d43f3d7b560d3c474e6196"
          tar -xzf ci/source.tgz -C ci/src
          grep -Fq "processSessionRecovery" ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java
          grep -Fq "versionCode 19" ci/src/app/build.gradle

      - name: Apply v0.26 recovery fixes and structural drawer selector
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          java_path = Path("ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java")
          text = java_path.read_text()

          nav_start = "    private NodeRecord findRecoveryNavOpener(List<NodeRecord> nodes) {"
          search_start = "    private NodeRecord findRecoverySearchLauncher(List<NodeRecord> nodes) {"
          ns = text.find(nav_start)
          ss = text.find(search_start, ns + 1)
          if ns < 0 or ss < 0:
              raise SystemExit("recovery method boundaries not found")
          nav_block = text[ns:ss]
          if "return bestScore >= 120 ? best : null;" not in nav_block:
              raise SystemExit("v0.19 nav threshold not found")
          nav_block = nav_block.replace(
              "return bestScore >= 120 ? best : null;",
              "// PEBBLE_V020_UNLABELED_TOP_LEFT_NAV_FALLBACK\n        return bestScore >= 90 ? best : null;",
              1,
          )
          text = text[:ns] + nav_block + text[ss:]

          process_anchor = "        AccessibilityNodeInfo root = findTargetRoot();"
          process_at = text.find(process_anchor)
          if process_at < 0:
              raise SystemExit("processTargetWindow root anchor not found")
          process_guard = '''        // PEBBLE_V026_REJECT_EXTERNAL_SEARCH_LAUNCH\n        if (ProbeState.isContinueChatRun(this) && "VERIFY_SEARCH_LAUNCH".equals(ProbeState.sessionRecoveryState(this))) {\n            String activePkg = packageOf(getRootInActiveWindow());\n            if (!activePkg.isEmpty() && !ProbeState.TARGET.equals(activePkg)) {\n                String fingerprint = ProbeState.getString(this, "recoverySearchCandidateFingerprint");\n                if (!fingerprint.isEmpty()) ProbeState.setString(this, "rejectedRecoverySearchFingerprint", fingerprint);\n                boolean back = performGlobalAction(GLOBAL_ACTION_BACK);\n                ProbeState.log(this, "RECOVERY SEARCH REJECTED: candidate left ChatGPT and opened package=" + activePkg + "; GLOBAL_BACK=" + back + ". Candidate is blacklisted for this run.");\n                ProbeState.setSessionRecoveryState(this, "OPEN_NAV");\n                return;\n            }\n        }\n\n'''
          text = text[:process_at] + process_guard + text[process_at:]

          fs_anchor = '        if ("FIND_SEARCH".equals(state)) {'
          fs_at = text.find(fs_anchor)
          if fs_at < 0:
              raise SystemExit("FIND_SEARCH state not found")
          old = '''            NodeRecord search = findRecoverySearchLauncher(nodes);\n            if (search != null) {\n                boolean clicked = search.node.performAction(AccessibilityNodeInfo.ACTION_CLICK);\n                ProbeState.log(this, "RECOVERY: ChatGPT Search control selected: " + search.describe() + "; click=" + clicked + ".");\n                if (clicked) ProbeState.setSessionRecoveryState(this, "ENTER_QUERY");\n                return false;\n            }'''
          new = '''            NodeRecord search = findRecoverySearchLauncher(nodes);\n            if (search == null) search = findRecoveryDrawerSearchLauncher(nodes);\n            if (search != null) {\n                String fingerprint = recoverySearchFingerprint(search);\n                boolean clicked = search.node.performAction(AccessibilityNodeInfo.ACTION_CLICK);\n                ProbeState.log(this, "RECOVERY: tentative ChatGPT Search control selected: " + search.describe() + "; fingerprint=" + fingerprint + "; click=" + clicked + ". Search field verification is mandatory before query entry.");\n                if (clicked) {\n                    ProbeState.setString(this, "recoverySearchCandidateFingerprint", fingerprint);\n                    ProbeState.setSessionRecoveryState(this, "VERIFY_SEARCH_LAUNCH");\n                }\n                return false;\n            }'''
          at = text.find(old, fs_at)
          if at < 0:
              raise SystemExit("FIND_SEARCH block not found")
          text = text[:at] + new + text[at + len(old):]

          enter_anchor = '        if ("ENTER_QUERY".equals(state)) {'
          enter_at = text.find(enter_anchor, fs_at)
          if enter_at < 0:
              raise SystemExit("ENTER_QUERY state not found")
          verify_block = '''        if ("VERIFY_SEARCH_LAUNCH".equals(state)) {\n            NodeRecord field = findRecoverySearchField(nodes);\n            if (field != null) {\n                ProbeState.setString(this, "recoverySearchCandidateFingerprint", "");\n                ProbeState.setSessionRecoveryState(this, "ENTER_QUERY");\n                ProbeState.log(this, "RECOVERY SEARCH VERIFIED: editable ChatGPT search field appeared after candidate click.");\n                return false;\n            }\n            if (now - stateAt > 1800L) {\n                String fingerprint = ProbeState.getString(this, "recoverySearchCandidateFingerprint");\n                if (!fingerprint.isEmpty()) ProbeState.setString(this, "rejectedRecoverySearchFingerprint", fingerprint);\n                boolean back = performGlobalAction(GLOBAL_ACTION_BACK);\n                ProbeState.log(this, "RECOVERY SEARCH REJECTED: clicked candidate did not produce a verified ChatGPT search field; GLOBAL_BACK=" + back + ". Candidate is blacklisted for this run.");\n                ProbeState.setSessionRecoveryState(this, "OPEN_NAV");\n            }\n            return false;\n        }\n\n'''
          text = text[:enter_at] + verify_block + text[enter_at:]

          marker = "    private NodeRecord findRecoverySearchField(List<NodeRecord> nodes) {"
          at = text.find(marker)
          if at < 0:
              raise SystemExit("search field method not found")
          helper = '''    // PEBBLE_V026_STRUCTURAL_DRAWER_SEARCH\n    private NodeRecord findRecoveryDrawerSearchLauncher(List<NodeRecord> nodes) {\n        NodeRecord title = null;\n        NodeRecord firstItem = null;\n        boolean images = false, library = false, projects = false, remote = false;\n        boolean scheduled = false, temporary = false, plugins = false, recents = false;\n\n        for (NodeRecord n : nodes) {\n            if (!n.visible || n.bounds.isEmpty()) continue;\n            String label = n.labelLower();\n            if (label.equals("chatgpt") || label.startsWith("chatgpt ")) {\n                if (title == null || n.bounds.top < title.bounds.top) title = n;\n            }\n            boolean primary = false;\n            if (label.equals("images")) { images = true; primary = true; }\n            else if (label.equals("library")) { library = true; primary = true; }\n            else if (label.equals("projects")) { projects = true; primary = true; }\n            else if (label.equals("remote")) { remote = true; primary = true; }\n            else if (label.equals("scheduled")) { scheduled = true; primary = true; }\n            else if (label.equals("temporary")) { temporary = true; primary = true; }\n            else if (label.equals("plugins")) { plugins = true; primary = true; }\n            else if (label.equals("recents")) { recents = true; }\n            if (primary && (firstItem == null || n.bounds.top < firstItem.bounds.top)) firstItem = n;\n        }\n\n        int anchorHits = (images ? 1 : 0) + (library ? 1 : 0) + (projects ? 1 : 0) +\n                (remote ? 1 : 0) + (scheduled ? 1 : 0) + (temporary ? 1 : 0) +\n                (plugins ? 1 : 0) + (recents ? 1 : 0);\n        if (anchorHits < 3 || title == null || firstItem == null) return null;\n\n        if (!ProbeState.getBoolean(this, "drawerProfileLogged")) {\n            ProbeState.setBoolean(this, "drawerProfileLogged", true);\n            ProbeState.log(this, "DRAWER PROFILE VERIFIED: anchors=" + anchorHits + "; title=" + title.describe() +\n                    "; firstItem=" + firstItem.describe() + "; headerCandidates=" +\n                    recoveryHeaderCandidateSummary(nodes, title, firstItem, 12));\n        }\n\n        String rejected = ProbeState.getString(this, "rejectedRecoverySearchFingerprint");\n        NodeRecord best = null;\n        int bestScore = Integer.MIN_VALUE;\n        int headerHeight = Math.max(Math.max(title.bounds.height(), firstItem.bounds.height()), 1);\n\n        for (NodeRecord n : nodes) {\n            if (!n.clickable || !n.visible || n.bounds.isEmpty()) continue;\n            String fingerprint = recoverySearchFingerprint(n);\n            if (!rejected.isEmpty() && rejected.equals(fingerprint)) continue;\n            String label = n.labelLower();\n            if (label.contains("attach") || label.contains("upload") || label.contains("file") ||\n                    label.contains("camera") || label.contains("photo") || label.contains("voice") ||\n                    label.contains("profile") || label.contains("settings") || label.contains("more")) continue;\n            if (!label.trim().isEmpty() && !label.contains("search")) continue;\n            if (n.bounds.centerY() >= firstItem.bounds.top) continue;\n            if (n.bounds.centerX() <= title.bounds.right) continue;\n            if (Math.abs(n.bounds.centerY() - title.bounds.centerY()) > headerHeight * 2) continue;\n            if (n.bounds.width() > headerHeight * 3 || n.bounds.height() > headerHeight * 3) continue;\n            if (!sharesNearAncestor(n.node, title.node, 5)) continue;\n\n            int score = 160;\n            if (label.contains("search")) score += 260;\n            if (label.trim().isEmpty()) score += 45;\n            score += Math.max(0, 70 - Math.abs(n.bounds.centerY() - title.bounds.centerY()));\n            String cls = n.className.toString().toLowerCase(Locale.US);\n            if (cls.contains("button") || cls.contains("image") || cls.contains("view")) score += 25;\n            if (score > bestScore) { bestScore = score; best = n; }\n        }\n        if (best != null) ProbeState.log(this, "DRAWER SEARCH STRUCTURAL CANDIDATE: score=" + bestScore + "; " + best.describe());\n        return bestScore >= 180 ? best : null;\n    }\n\n    private boolean sharesNearAncestor(AccessibilityNodeInfo a, AccessibilityNodeInfo b, int maxUp) {\n        if (a == null || b == null) return false;\n        AccessibilityNodeInfo pa = a;\n        for (int i = 0; pa != null && i <= maxUp; i++) {\n            AccessibilityNodeInfo pb = b;\n            for (int j = 0; pb != null && j <= maxUp; j++) {\n                if (pa.equals(pb)) return true;\n                pb = pb.getParent();\n            }\n            pa = pa.getParent();\n        }\n        return false;\n    }\n\n    private String recoveryHeaderCandidateSummary(List<NodeRecord> nodes, NodeRecord title, NodeRecord firstItem, int max) {\n        StringBuilder b = new StringBuilder();\n        int count = 0;\n        for (NodeRecord n : nodes) {\n            if (!(n.clickable || n.focusable) || !n.visible || n.bounds.isEmpty()) continue;\n            if (n.bounds.centerY() >= firstItem.bounds.top) continue;\n            if (count++ > 0) b.append(" | ");\n            b.append("depth=").append(n.depth).append(" ").append(n.describe());\n            if (count >= max) break;\n        }\n        return b.length() == 0 ? "<none>" : b.toString();\n    }\n\n    private String recoverySearchFingerprint(NodeRecord n) {\n        if (n == null) return "";\n        return n.className + "|" + n.viewId + "|" + n.bounds.toShortString();\n    }\n\n'''
          text = text[:at] + helper + text[at:]

          text = re.sub(
              r'handler\.postDelayed\(this::bringUiForward,\s*(\d+)\);',
              r'scheduleReturnToBridge(\1L);',
              text,
          )
          marker = "    private void bringUiForward() {"
          at = text.find(marker)
          if at < 0:
              raise SystemExit("bringUiForward method not found")
          helper = '''    // PEBBLE_V024_DETERMINISTIC_RETURN\n    private void scheduleReturnToBridge(long delayMs) {\n        handler.postDelayed(() -> {\n            bringUiForward();\n            handler.postDelayed(() -> ensureReturnFromChatGpt(0), 350L);\n        }, delayMs);\n    }\n\n    private void ensureReturnFromChatGpt(int attempt) {\n        AccessibilityNodeInfo active = getRootInActiveWindow();\n        if (!ProbeState.TARGET.equals(packageOf(active))) return;\n        if (attempt >= 3) {\n            bringUiForward();\n            return;\n        }\n        boolean back = performGlobalAction(GLOBAL_ACTION_BACK);\n        ProbeState.log(this, "RETURN FALLBACK: ChatGPT still active after bring-to-front; GLOBAL_BACK attempt=" + (attempt + 1) + "; result=" + back + ".");\n        handler.postDelayed(() -> {\n            bringUiForward();\n            handler.postDelayed(() -> ensureReturnFromChatGpt(attempt + 1), 300L);\n        }, 300L);\n    }\n\n'''
          text = text[:at] + helper + text[at:]
          java_path.write_text(text)

          gradle_path = Path("ci/src/app/build.gradle")
          gradle = gradle_path.read_text()
          gradle, n = re.subn(r"versionCode\s+19\b", "versionCode 26", gradle, count=1)
          if n != 1:
              raise SystemExit("versionCode replacement failed")
          if "0.19-thread-recovery" not in gradle:
              raise SystemExit("baseline versionName not found")
          gradle = gradle.replace("0.19-thread-recovery", "0.26-structural-drawer-search", 1)
          gradle_path.write_text(gradle)
          PY
          grep -Fq "PEBBLE_V020_UNLABELED_TOP_LEFT_NAV_FALLBACK" ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java
          grep -Fq "PEBBLE_V026_STRUCTURAL_DRAWER_SEARCH" ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java
          grep -Fq "PEBBLE_V026_REJECT_EXTERNAL_SEARCH_LAUNCH" ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java
          grep -Fq "PEBBLE_V024_DETERMINISTIC_RETURN" ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java
          grep -Fq "versionCode 26" ci/src/app/build.gradle

      - name: Build unsigned Android release
        script: |
          #!/usr/bin/env bash
          set -uo pipefail
          : > ci/full-build.log
          {
            set -x
            echo "sdk.dir=$ANDROID_SDK_ROOT" > ci/src/local.properties
            yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
            curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
            rm -rf "/tmp/gradle-${GRADLE_VERSION}"
            unzip -q -o /tmp/gradle.zip -d /tmp
            cd ci/src
            "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon :app:assembleRelease --stacktrace
          } 2>&1 | tee ci/full-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then tail -n 180 ci/full-build.log; exit "$rc"; fi
          cp ci/src/app/build/outputs/apk/release/app-release-unsigned.apk ci/out/PebbleChatBridgePoC-v0.26-unsigned.apk

      - name: Sign verify and prepare handoff
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          unsigned="ci/out/PebbleChatBridgePoC-v0.26-unsigned.apk"
          signed="ci/out/${APK_BASENAME}"
          apksigner_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort | tail -n 1)"
          test -n "$apksigner_path"
          bash "$apksigner_path" sign \
            --ks "$CM_KEYSTORE_PATH" \
            --ks-pass "env:CM_KEYSTORE_PASSWORD" \
            --ks-key-alias "$CM_KEY_ALIAS" \
            --key-pass "env:CM_KEY_PASSWORD" \
            --out "$signed" "$unsigned"
          bash "$apksigner_path" verify --verbose --print-certs "$signed" | tee ci/apksigner-verify.txt
          actual_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' ci/apksigner-verify.txt | tr 'A-F' 'a-f' | head -n 1)"
          test "$actual_cert" = "$EXPECTED_CERT_SHA256"
          printf 'certificate_sha256=%s\n' "$actual_cert" > ci/certificate.txt
          shasum -a 256 "$signed" | tee ci/APK_SHA256.txt
          cp ci/src/app/src/main/java/com/pebblebridge/poc/NativeProbeAccessibilityService.java ci/delivery/NativeProbeAccessibilityService.java.txt

    artifacts:
      - ci/out/${APK_BASENAME}
      - ci/APK_SHA256.txt
      - ci/certificate.txt
      - ci/apksigner-verify.txt
      - ci/delivery/NativeProbeAccessibilityService.java.txt

    publishing:
      scripts:
        - name: Publish v0.26 release and latest pointer
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            APK="$CM_BUILD_DIR/ci/out/${APK_BASENAME}"
            OWNER="homayounisaghar"
            REPO="Monitoring-V1"
            DELIVERY_BRANCH="ci/pebble-apk-delivery"
            API="https://api.github.com/repos/$OWNER/$REPO"
            AUTH="Authorization: Bearer $GITHUB_TOKEN"
            ACCEPT="Accept: application/vnd.github+json"
            SHORT_COMMIT="$(printf '%s' "${CM_COMMIT:-unknown}" | cut -c1-12)"
            TAG="pebble-v0.26-$SHORT_COMMIT"
            APK_NAME="pebble-chat-bridge-v026-$SHORT_COMMIT.apk"
            release_json=$(curl -fsS -H "$AUTH" -H "$ACCEPT" "$API/releases/tags/$TAG" 2>/dev/null || true)
            release_id=$(printf '%s' "$release_json" | jq -r '.id // empty')
            if [ -z "$release_id" ]; then
              body=$(jq -n --arg tag "$TAG" --arg target "${CM_COMMIT:-}" --arg name "Pebble Chat Bridge v0.26 $SHORT_COMMIT" '{tag_name:$tag,target_commitish:$target,name:$name,body:"v0.26 structure-first ChatGPT drawer Search selector with post-click verification and drawer diagnostics.",draft:false,prerelease:true}')
              release_json=$(curl -fsS -X POST -H "$AUTH" -H "$ACCEPT" -H 'Content-Type: application/json' --data-binary "$body" "$API/releases")
              release_id=$(printf '%s' "$release_json" | jq -r '.id')
            fi
            asset_json=$(curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/vnd.android.package-archive' --data-binary "@$APK" "https://uploads.github.com/repos/$OWNER/$REPO/releases/$release_id/assets?name=$APK_NAME")
            release_url=$(printf '%s' "$release_json" | jq -r '.html_url // empty')
            asset_url=$(printf '%s' "$asset_json" | jq -r '.browser_download_url // empty')
            apk_sha=$(awk '{print $1}' "$CM_BUILD_DIR/ci/APK_SHA256.txt")
            cert=$(sed -n 's/^certificate_sha256=//p' "$CM_BUILD_DIR/ci/certificate.txt" | head -1)
            pointer=$(jq -n --arg event pebble_apk_delivery --arg version 0.26 --arg status SUCCESS --arg buildId "${CM_BUILD_ID:-}" --arg commit "${CM_COMMIT:-}" --arg releaseUrl "$release_url" --arg releaseAssetUrl "$asset_url" --arg sha256 "$apk_sha" --arg signingFingerprint "$cert" '{event:$event,version:$version,status:$status,buildId:$buildId,commit:$commit,releaseUrl:$releaseUrl,releaseAssetUrl:$releaseAssetUrl,sha256:$sha256,signingFingerprint:$signingFingerprint}')
            printf '%s\n' "$pointer" > ci/latest-pebble-build.json

            put_content() {
              path="$1"; local_file="$2"
              current=$(curl -fsS -H "$AUTH" -H "$ACCEPT" "$API/contents/$path?ref=ci%2Fpebble-apk-delivery" 2>/dev/null || true)
              sha=$(printf '%s' "$current" | jq -r '.sha // empty')
              content=$(base64 < "$local_file" | tr -d '\n')
              if [ -n "$sha" ]; then
                payload=$(jq -n --arg message "ci: update $path for v0.26" --arg content "$content" --arg branch "$DELIVERY_BRANCH" --arg sha "$sha" '{message:$message,content:$content,branch:$branch,sha:$sha}')
              else
                payload=$(jq -n --arg message "ci: create $path for v0.26" --arg content "$content" --arg branch "$DELIVERY_BRANCH" '{message:$message,content:$content,branch:$branch}')
              fi
              curl -fsS -X PUT -H "$AUTH" -H "$ACCEPT" -H 'Content-Type: application/json' --data-binary "$payload" "$API/contents/$path" >/dev/null
            }
            put_content ".ci/latest-pebble-build.json" "ci/latest-pebble-build.json"
            put_content ".ci/latest-pebble.NativeProbeAccessibilityService.java.txt" "ci/delivery/NativeProbeAccessibilityService.java.txt"
